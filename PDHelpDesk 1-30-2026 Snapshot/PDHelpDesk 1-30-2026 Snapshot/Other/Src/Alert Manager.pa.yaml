                                                Height: =Parent.Height
                                                LayoutMaxHeight: =
                                                LayoutMaxWidth: =
                                                OnSelect: |+
                                                  =false
                                                Size: =Alert_TitleText_Label.Size
                                                Text: =ThisItem.dateExpired
                                                Width: =Parent.Width/4
