                                  Properties:
                                    BorderColor: =ColorFade(Self.Fill, -15%)
                                    Color: =RGBA(0, 0, 0, 0)
                                    DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                    Fill: =RGBA(0, 0, 0, 0)
                                    Font: =Font.'Open Sans'
                                    Height: =Parent.TemplateHeight
                                    HoverBorderColor: =
                                    HoverColor: =RGBA(255, 255, 255, 1)
                                    HoverFill: |+
                                      =RGBA(126,149,180,.35) 
                                    OnSelect: |+
                                      =EditForm(CreateAlertForm);
                                      Navigate(CreateAlertForm, ScreenTransition.None, {recordVar: ThisItem});
                                      Set(Editing, true)
                                    PressedBorderColor: =Self.Fill
                                    PressedColor: =Self.Fill
                                    PressedFill: =ColorFade(ColorScheme.secondaryPressedColor, -30%)
                                    Text: ="Edit Alert"
                                    Tooltip: ="Edit Alert"
                                    Width: =Parent.TemplateWidth/2
                                    X: |-
                                      =//(Parent.TemplateWidth - Self.Width) -20
                                      0
                              - ResolveAlertOverlapButton:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ColorFade(Self.Fill, -15%)
                                    Color: =RGBA(0, 0, 0, 0)
                                    DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                    Fill: =RGBA(0, 0, 0, 0)
                                    Font: =Font.'Open Sans'
                                    Height: =Parent.TemplateHeight
                                    HoverBorderColor: =
                                    HoverColor: =RGBA(255, 255, 255, 1)
                                    HoverFill: =RGBA(99, 139, 44, .35)
                                    OnSelect: |-
                                      =UpdateContext({varShowResPopup:true});
                                      Set(selectedAlert, ThisItem);
