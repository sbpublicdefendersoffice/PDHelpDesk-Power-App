                              Font: =Font.'Open Sans'
                              Size: =17
                              Text: ="Title"
                              Width: =AlertsTableHeaderRectangle.Width/2
                              X: =AlertsTableHeaderRectangle.X
                              Y: =AlertsTableHeaderRectangle.Y
                  - AlertsGalleryMobileContainer:
                      Control: GroupContainer@1.4.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =Parent.Height
