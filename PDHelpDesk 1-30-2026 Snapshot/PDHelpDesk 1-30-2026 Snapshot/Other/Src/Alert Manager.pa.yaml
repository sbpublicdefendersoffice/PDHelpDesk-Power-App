                                                BorderThickness: =1
                                                Fill: =RGBA(0, 127, 187, .09)
                                                Font: =Font.'Open Sans'
                                                Height: =Parent.Height
                                                LayoutMaxHeight: =
                                                LayoutMaxWidth: =
