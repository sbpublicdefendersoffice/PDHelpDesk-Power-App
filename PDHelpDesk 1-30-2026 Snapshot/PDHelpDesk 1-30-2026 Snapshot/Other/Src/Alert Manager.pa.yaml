Screens:
  Alert Manager:
    Properties:
      BackgroundImage: =PUBDEF_IT__LOGO_Vector
      Fill: =ColorScheme.screenBackground
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Refresh(Alerts);
        UpdateContext({varShowResPopUp:false});
        Set(selectedAlert, Defaults(Alerts));
    Children:
      - AlertManagerTextsizeFormatter:
          Control: CanvasComponent
          ComponentName: compPageTextSizeFormatter
          Properties:
            Height: =0
            PageSizeVariable: ='Alert Manager'.Size
            TextSize1: =14
            TextSize2: =12
            TextSize3: =15
            TextSize4: =17
            Width: =0
