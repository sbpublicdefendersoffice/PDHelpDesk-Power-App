                                    PressedColor: =Self.Fill
                                    PressedFill: =ColorFade(ColorScheme.secondaryPressedColor, -30%)
                                    Text: ="Resolve Alert"
                                    Tooltip: ="Edit Alert"
                                    Width: =Parent.TemplateWidth/2
                                    X: |-
                                      =//(Parent.TemplateWidth - Self.Width) -20
                                      EditAlertOverlapButton.X+EditAlertOverlapButton.Width
                        - AlertsTableHeaderRectangle:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Fill: =RGBA(56, 96, 178, 1)
                              Height: =40
                              Width: =AlertsGallery.Width+2
                              X: =AlertsGallery.X-1
                              Y: =AlertsGallery.Y-Self.Height
                        - Gallery_Expires_label:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =ColorScheme.primary
                              Font: =Font.'Open Sans'
                              Size: =17
                              Text: ="Expires"
                              Width: =AlertsTableHeaderRectangle.Width/4
                              X: =AlertsTableHeaderRectangle.X+Gallery_Title_label.Width+Gallery_Created_label.Width
                              Y: =AlertsTableHeaderRectangle.Y
                        - Gallery_Created_label:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =ColorScheme.primary
                              Font: =Font.'Open Sans'
                              Size: =17
                              Text: ="Created"
                              Width: =AlertsTableHeaderRectangle.Width/4
                              X: =AlertsTableHeaderRectangle.X+Gallery_Title_label.Width
