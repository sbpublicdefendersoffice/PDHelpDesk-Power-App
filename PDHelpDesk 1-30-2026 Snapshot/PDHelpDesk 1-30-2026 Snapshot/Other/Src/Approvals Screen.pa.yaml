                                      =Patch(Tickets,approveRecord,{status:"open",dateCreated:Now(),lastUpdated:Now(),description:approveRecord.description&Char(13)&"Approved By: "&userData.fullName,addAssignees:approveRecord.addAssignees&userData.fullName&","});
                                      Patch(Approvals,LookUp(Approvals,Gallery12.Selected.ID = ID),{Approved:true,Resolved:true});
