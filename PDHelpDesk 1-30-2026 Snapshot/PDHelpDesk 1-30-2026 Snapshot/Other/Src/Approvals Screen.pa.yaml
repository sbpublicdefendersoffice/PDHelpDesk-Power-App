                              - Icon11:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =RGBA(184, 0, 0, 1)
                                    Icon: =Icon.CancelBadge
                                    OnSelect: |-
                                      =UpdateContext({approveRecord:LookUp(Tickets,ID= ThisItem.TID)});
                                      Patch(Tickets,approveRecord,{status:"null",lastUpdated:Now(),description:approveRecord.description&Char(13)&"Ticket has been denied, please close this ticket."&Char(13)&"Approver: "&userData.fullName});
                                      Patch(Approvals,LookUp(Approvals,ThisItem.ID = ID),{Approved:false,Resolved:true});
                                      UpdateContext({approveRecord:Blank(),approveTimeOut:true});
                                    X: =Icon12.X-Self.Width*1.5
                                    Y: =18
                              - Icon12:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =RGBA(127, 178, 57, 1)
                                    Icon: =Icon.CheckBadge
                                    OnSelect: |-
                                      =
                                      UpdateContext({approveRecord:LookUp(Tickets,ID= ThisItem.TID)});
                                      Patch(Tickets,approveRecord,{status:"open",lastUpdated:Now(),description:approveRecord.description&Char(13)&"Approved By: "&userData.fullName});
