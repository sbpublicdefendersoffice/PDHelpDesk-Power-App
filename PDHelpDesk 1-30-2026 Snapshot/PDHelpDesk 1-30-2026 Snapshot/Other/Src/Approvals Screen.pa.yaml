                                      =Patch(Tickets,approveRecord,{status:"null",lastUpdated:Now(),description:approveRecord.description&Char(13)&"Approval for this ticket has been denied, please close this ticket."&Char(13)&"Approver: "&userData.fullName});
                                      Patch(Approvals,LookUp(Approvals,Gallery12.Selected.ID = ID),{Approved:false,Resolved:true});
                                      UpdateContext({approveRecord:Blank(),approveTimeOut:true});
                                    PressedBorderColor: =Self.Fill
                                    PressedColor: =Self.Fill
                                    PressedFill: =Self.Color
