                  Width: =Parent.Width
                Children:
                  - AssetsWebMobileMenu:
                      Control: CanvasComponent
                      ComponentName: compMobileMenu
                      Properties:
                        BackgroundMenuColor: =RGBA(227, 234, 243, 1)
                        ForegroundColor: |-
                          =//RGBA(70, 130, 180, 1)
                          ColorScheme.primary
                        Height: =Parent.Height
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        NavigationItems: |-
                          =// IF adimn or tech show this table, if not show Staff table
                          gblNavItems
                        SelectedItemBackground: =Color.LightGray
                        Width: =Parent.Width
      - AssetsWebMenu:
          Control: CanvasComponent
          ComponentName: compWebMenu
          Properties:
            ExpandMenu: =showMenu
            Fill: =Color.Transparent
            HamburgerColor: =Color.White
            Height: =If(showMenu, Parent.Height, 80)
            MenuItems: =gblNavItems
            Visible: =Assets.Size > 1
            Width: =If(showMenu, Parent.Width, 80)
      - AssetsBackButton:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Color.White
            Height: =AssetsLabel.Height/1.05
            Icon: =Icon.BackArrow
            OnSelect: =Navigate('Asset Manager Menu',ScreenTransition.Fade)
            Width: =49
            X: '=Self.Width/5 '
            Y: =(AssetsHeaderContainer.Height-AssetsLabel.Height)/1.05
      - FeedbackBugReportAssets:
          Control: CanvasComponent
          ComponentName: FeedbackBugReport
          Properties:
            CloseReport: =Set(varFeedback,false)
            DisablePickMedia: =Set(PickMedia,false)
            EnablePickMedia: =Set(PickMedia,true)
            FBSize: =App.ActiveScreen.Size
            FeedbackCameraOff: =Set(FeedbackCamera,false);
            FeedbackCameraOn: =Set(FeedbackCamera,true);
            Height: =App.Height
            PhotoModeDisable: =Set(FeedbackPhoto,false)
            PhotoModeEnable: =Set(FeedbackPhoto,true)
            Visible: =varFeedback
            Width: =App.Width
