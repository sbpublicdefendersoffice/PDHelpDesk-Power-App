Screens:
  Automation Rules:
    Properties:
      BackgroundImage: =PUBDEF_IT__LOGO_Vector
      Fill: =ColorScheme.screenBackground
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnHidden: =UpdateContext({RuleNumber:1,ARName:"Angie",ARUserID:1,ARCategoryID:1,ARLocationID:1,NewRule:true})
      OnVisible: |-
        =UpdateContext({tableMod:false});
        UpdateContext({reAssignRule:Blank()});
        LookUp('Ticket Automation Rules',categoryId = SelectCategoryTADropdown.Selected.ID And locationId = TAModLocationSelect.Selected.ID)
    Children:
      - AutomationRulesContainer:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - AutomationRulesHeaderContainer:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =ColorScheme.primary
                  FillPortions: =0
                  Height: =130
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - Container24:
                      Control: GroupContainer@1.4.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - HomeBackgroundGradient_69:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              DisabledBorderColor: =RGBA(56, 56, 56, 1)
                              Font: =Font.'Open Sans'
                              Height: =130
                              HtmlText: =Home_Background_Gradient.HtmlText
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Width: =Parent.Width
                        - AutomationRulesLabel:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =Color.White
                              Fill: =Color.Transparent
                              Font: =Font.'Open Sans'
                              Height: =Parent.Height-TemplateWebHeader_1.Height
                              Size: =If('Automation Rules'.Size=1, titleText.mobileSize, titleText.desktopSize)
                              Text: ="Automation Rules"
                              Width: =Parent.Width
                              Y: =TemplateWebHeader_1.Height
                        - AutomationRulesWebHeader:
                            Control: CanvasComponent
                            ComponentName: compWebHeader
                            Properties:
                              BackgroundColor: =Color.Transparent
                              CompScreenSize: ='Automation Rules'.Size
                              EnableFeedback: =Set(varFeedback,true)
                              FeedbackBool: =varFeedback
                              Height: =82
                              Width: =App.Width
            - AutomationRulesMainSectionContainer:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =ColorScheme.screenBackgroundSeeThroughMid
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - ContentContainer:
                      Control: GroupContainer@1.4.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =Parent.Height
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - SelectedAutomationTable:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              BorderThickness: =2
                              Fill: =RGBA(241, 244, 249, 1)
                              Height: =300
                              Items: =Filter('Ticket Automation Rules',categoryId = SelectCategoryTADropdown.Selected.ID)
                              TemplatePadding: =0
                              TemplateSize: =50
                              Width: =Parent.Width/1.1
                              X: =TATableHeader.X
                              Y: =TATableHeader.Y+TATableHeader.Height
                            Children:
                              - Container15:
                                  Control: GroupContainer@1.4.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Height: =Parent.TemplateHeight
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - Label1:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          BorderThickness: =2
                                          FillPortions: =1
                                          Font: =Font.'Open Sans'
                                          Height: =Parent.Height
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Text: =ThisItem.Name
                                    - Label1_1:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          BorderThickness: =2
                                          FillPortions: =1
                                          Font: =Font.'Open Sans'
                                          Height: =Parent.Height
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Text: =LookUp(Category,ID = ThisItem.categoryId).Name
                                          X: =40
                                          Y: =40
                                    - Label1_3:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          BorderThickness: =2
                                          FillPortions: =1
                                          Font: =Font.'Open Sans'
                                          Height: =Parent.Height
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Text: =LookUp(Locations,ID = ThisItem.locationId).Name
                                          X: =60
                                          Y: =60
                        - TATableHeader:
                            Control: GroupContainer@1.4.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(9, 33, 98, 1)
                              BorderThickness: =2
                              DropShadow: =DropShadow.None
                              Height: =34
                              LayoutDirection: =LayoutDirection.Horizontal
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width/1.1
                              X: =SelectCategoryTADropdown.X
                              Y: =SelectCategoryTADropdown.Y+SelectCategoryTADropdown.Height+20
                            Children:
                              - TATablePerson:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    BorderThickness: =2
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =ColorScheme.primary
                                    FillPortions: =1
                                    Font: =Font.'Open Sans'
                                    Height: =34
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Text: ="Technician"
                                    Width: =200
                                    X: =60
                                    Y: =60
                              - CategorySelectTA_2:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    BorderThickness: =2
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =ColorScheme.primary
                                    FillPortions: =1
                                    Font: =Font.'Open Sans'
                                    Height: =34
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Text: ="Category"
                                    Width: =200
                                    X: =60
                                    Y: =60
                              - CategorySelectTA_3:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    BorderThickness: =2
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =ColorScheme.primary
                                    FillPortions: =1
                                    Font: =Font.'Open Sans'
                                    Height: =34
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Text: ="Location"
                                    Width: =200
                                    X: =60
                                    Y: =60
                        - SelectCategoryTADropdown:
                            Control: Classic/DropDown@2.3.1
                            Properties:
                              AllowEmptySelection: =true
                              BorderColor: =RGBA(0, 18, 107, 1)
                              ChevronBackground: =ColorScheme.primary
                              ChevronFill: =RGBA(255, 255, 255, 1)
                              ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                              ChevronHoverFill: =RGBA(255, 255, 255, 1)
                              Default: =
                              Font: =Font.'Open Sans'
                              HoverFill: =RGBA(186, 202, 226, 1)
                              Items: =Sort(Filter(Category,parentId=Blank()),Name)
                              Items.Value: ={Name}
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(0, 18, 107, 1)
                              SelectionColor: =RGBA(255, 255, 255, 1)
                              SelectionFill: =RGBA(56, 96, 178, 1)
                              X: =CategorySelectTA.X
                              Y: =CategorySelectTA.Y+CategorySelectTA.Height
                        - CategorySelectTA:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              BorderThickness: =2
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =ColorScheme.primary
                              Font: =Font.'Open Sans'
                              Height: =34
                              Text: ="Select a Category"
                              Width: =200
                              X: =40
                              Y: =20
                        - Button4:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorFade(Self.Fill, -15%)
                              Color: =RGBA(255, 255, 255, 1)
                              DisabledBorderColor: =RGBA(166, 166, 166, 1)
                              Fill: =ColorScheme.primary
                              Font: =Font.'Open Sans'
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                              OnSelect: =UpdateContext({tableMod:true});
                              PressedBorderColor: =Self.Fill
                              PressedColor: =Self.Fill
                              PressedFill: =Self.Color
                              Text: ="Modify Table"
                              X: =(Parent.Width-Self.Width)/2
                              Y: =SelectedAutomationTable.Y+SelectedAutomationTable.Height+25
                        - Container37:
                            Control: GroupContainer@1.4.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =Parent.Height
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =tableMod
                              Width: =Parent.Width
                            Children:
                              - TableModTint:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Fill: =RGBA(56, 96, 178, .25)
                                    Height: =Parent.Height
                                    Visible: =tableMod
                                    Width: =Parent.Width
                              - TableModBackground:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    BorderThickness: =1
                                    Fill: =RGBA(241, 244, 249, 1)
                                    Height: =Parent.Height/1.1
                                    Visible: =tableMod
                                    Width: =Parent.Width/1.1
                                    X: =(Parent.Width-Self.Width)/2
                                    Y: =(Parent.Height-Self.Height)/2
                              - TableModHeader:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    BorderThickness: =2
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =ColorScheme.primary
                                    Font: =Font.'Open Sans'
                                    Height: =50
                                    Size: =16
                                    Text: ="Modifying "&LookUp(Category,ID=SelectCategoryTADropdown.Selected.ID,Name)&" Table"
                                    Visible: =tableMod
                                    Width: =TableModBackground.Width
                                    X: =TableModBackground.X
                                    Y: =TableModBackground.Y
                              - TAModRuleSubmit:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ColorFade(Self.Fill, -15%)
                                    Color: =RGBA(255, 255, 255, 1)
                                    DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                    DisplayMode: =If(!IsBlank(LookUp('Ticket Automation Rules',categoryId = SelectCategoryTADropdown.Selected.ID And locationId = TAModLocationSelect.Selected.ID)),If(TAModChangeRuleCheck.Visible And TAModChangeRuleCheck.Value,DisplayMode.Edit,DisplayMode.Disabled ),DisplayMode.Edit)
                                    Fill: =ColorScheme.primary
                                    Font: =Font.'Open Sans'
                                    HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                                    HoverColor: =RGBA(255, 255, 255, 1)
                                    HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                    OnSelect: |
                                      =If(TAModChangeRuleCheck.Visible And TAModChangeRuleCheck.Value
                                      ,UpdateContext({reAssignRule:LookUp('Ticket Automation Rules',categoryId = SelectCategoryTADropdown.Selected.ID And locationId = TAModLocationSelect.Selected.ID).ID});
                                      Patch('Ticket Automation Rules',LookUp('Ticket Automation Rules',ID = reAssignRule),
                                      {
                                          Title: TAModPersonSelect.Selected.fullName,
                                          userID: TAModPersonSelect.Selected.ID,
                                          categoryId: SelectCategoryTADropdown.Selected.ID,
                                          locationId: TAModLocationSelect.Selected.ID

                                      }),

                                      Patch('Ticket Automation Rules',Defaults('Ticket Automation Rules'),
                                      {
                                          Title: TAModPersonSelect.Selected.fullName,
                                          userID: TAModPersonSelect.Selected.ID,
                                          categoryId: SelectCategoryTADropdown.Selected.ID,
                                          locationId: TAModLocationSelect.Selected.ID

                                      }));
                                      Refresh('Ticket Automation Rules');
                                    PressedBorderColor: =Self.Fill
                                    PressedColor: =Self.Fill
                                    PressedFill: =Self.Color
                                    Text: =If(TAModChangeRuleCheck.Visible And TAModChangeRuleCheck.Value, "Modify Rule", "New Rule")
                                    Visible: =tableMod
                                    X: =(TableModBackground.Width-Self.Width)/2 +TableModBackground.X
                                    Y: =If(TAModChangeRuleCheck.Visible,TAModChangeRuleCheck.Height)+TAModChangeRuleCheck.Y+15
                              - TAModChangeRuleCheck:
                                  Control: Classic/CheckBox@2.1.0
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    CheckboxBorderColor: =RGBA(0, 18, 107, 1)
                                    CheckboxSize: =50
                                    CheckmarkFill: =RGBA(0, 0, 0, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =60
                                    HoverColor: =RGBA(0, 18, 107, 1)
                                    Size: =16
                                    Text: =If(IsBlank(LookUp('Ticket Automation Rules',locationId = TAModLocationSelect.Selected.ID And categoryId = SelectCategoryTADropdown.Selected.ID)),"","Reassign Rule?")
                                    Visible: =!IsBlank(LookUp('Ticket Automation Rules',locationId = TAModLocationSelect.Selected.ID And categoryId = SelectCategoryTADropdown.Selected.ID)) && tableMod
                                    Width: =250
                                    X: =(TableModBackground.Width-Self.Width)/2 +TableModBackground.X
                                    Y: =TAModLocationSelect.Y+TAModLocationSelect.Height+25
                              - TAModLocationSelect:
                                  Control: Classic/DropDown@2.3.1
                                  Properties:
                                    AllowEmptySelection: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    ChevronBackground: =ColorScheme.primary
                                    ChevronFill: =RGBA(255, 255, 255, 1)
                                    ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                    ChevronHoverFill: =RGBA(255, 255, 255, 1)
                                    Default: =
                                    Font: =Font.'Open Sans'
                                    HoverFill: =RGBA(186, 202, 226, 1)
                                    Items: =Locations
                                    Items.Value: ={Name}
                                    PressedColor: =RGBA(255, 255, 255, 1)
                                    PressedFill: =RGBA(0, 18, 107, 1)
                                    SelectionColor: =RGBA(255, 255, 255, 1)
                                    SelectionFill: =RGBA(56, 96, 178, 1)
                                    Visible: =tableMod
                                    Width: =TableModBackground.Width/1.1
                                    X: =TAModLocationLabel.X
                                    Y: =TAModLocationLabel.Y+TAModLocationLabel.Height
                              - TAModLocationLabel:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    BorderThickness: =2
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =ColorScheme.primary
                                    Font: =Font.'Open Sans'
                                    Height: =34
                                    Size: =16
                                    Text: ="Location"
                                    Visible: =tableMod
                                    X: =TAModTechLabel.X
                                    Y: =TAModPersonSelect.Y+TAModPersonSelect.Height+25
                              - TAModPersonSelect:
                                  Control: Classic/DropDown@2.3.1
                                  Properties:
                                    AllowEmptySelection: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    ChevronBackground: =ColorScheme.primary
                                    ChevronFill: =RGBA(255, 255, 255, 1)
                                    ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                    ChevronHoverFill: =RGBA(255, 255, 255, 1)
                                    Default: =
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Lighter
                                    HoverFill: =RGBA(186, 202, 226, 1)
                                    Items: =Filter(Users,userRole = "tech" || userRole="admin")
                                    Items.Value: =fullName
                                    PressedColor: =RGBA(255, 255, 255, 1)
                                    PressedFill: =RGBA(0, 18, 107, 1)
                                    SelectionColor: =RGBA(255, 255, 255, 1)
                                    SelectionFill: =RGBA(56, 96, 178, 1)
                                    Visible: =tableMod
                                    Width: =TableModBackground.Width/1.1
                                    X: =TAModTechLabel.X
                                    Y: =TAModTechLabel.Y+TAModTechLabel.Height
                              - TAModTechLabel:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    BorderThickness: =2
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =ColorScheme.primary
                                    Font: =Font.'Open Sans'
                                    Height: =34
                                    Size: =16
                                    Text: ="Technician"
                                    Visible: =tableMod
                                    X: =TableModBackground.X+40
                                    Y: =TableModBackground.Y+TableModHeader.Height+25
                              - Icon24:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    BorderThickness: =2
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =RGBA(203, 102, 102, 1)
                                    Height: =48
                                    Icon: =Icon.Cancel
                                    OnSelect: |-
                                      =UpdateContext({tableMod:false});
                                      UpdateContext({reAssignRule:Blank()})
                                    Visible: =tableMod
                                    Width: =48
                                    X: =TableModHeader.Width-Self.Width+TableModHeader.X
                                    Y: =TableModHeader.Y
            - AutomationRulesFooter:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255,255,255, 1)
                  FillPortions: =0
                  Height: =60
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: |+
                    ='Automation Rules'.Size =1
                  Width: =Parent.Width
                Children:
                  - AutomationRulesMobileMenu:
                      Control: CanvasComponent
                      ComponentName: compMobileMenu
                      Properties:
                        BackgroundMenuColor: =RGBA(227, 234, 243, 1)
                        ForegroundColor: |-
                          =//RGBA(70, 130, 180, 1)
                          ColorScheme.primary
                        Height: =Parent.Height
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        NavigationItems: |-
                          =// IF adimn or tech show this table, if not show Staff table
                          gblNavItems
                        SelectedItemBackground: =Color.LightGray
                        Width: =Parent.Width
      - AutomationRulesBackButton:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Color.White
            Height: =AutomationRulesLabel.Height/1.05
            Icon: =Icon.BackArrow
            OnSelect: =Back(ScreenTransition.Fade)
            Width: =49
            X: '=Self.Width/5 '
            Y: =(AutomationRulesHeaderContainer.Height-AutomationRulesLabel.Height)/1.05
      - AutomationRulesWebMenu:
          Control: CanvasComponent
          ComponentName: compWebMenu
          Properties:
            ExpandMenu: =showMenu
            Fill: =Color.Transparent
            HamburgerColor: =Color.White
            Height: =If(showMenu, Parent.Height, 80)
            MenuItems: =gblNavItems
            Visible: ='Automation Rules'.Size > 1
            Width: =If(showMenu, Parent.Width, 80)
      - FeedbackBugReportAutoR:
          Control: CanvasComponent
          ComponentName: FeedbackBugReport
          Properties:
            CloseReport: =Set(varFeedback,false)
            DisablePickMedia: =Set(PickMedia,false)
            EnablePickMedia: =Set(PickMedia,true)
            FBSize: =App.ActiveScreen.Size
            FeedbackCameraOff: =Set(FeedbackCamera,false);
            FeedbackCameraOn: =Set(FeedbackCamera,true);
            Height: =App.Height
            PhotoModeDisable: =Set(FeedbackPhoto,false)
            PhotoModeEnable: =Set(FeedbackPhoto,true)
            Visible: =varFeedback
            Width: =App.Width
