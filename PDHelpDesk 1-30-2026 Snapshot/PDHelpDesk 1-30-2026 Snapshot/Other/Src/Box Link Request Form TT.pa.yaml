                                    HoverColor: =RGBA(255, 255, 255, 1)
                                    HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                    OnSelect: "=//Check if the title or Description are empty, if they are the form will not be submitted\nSet(CatObj,LookUp(Category,Name = \"Box Link Request\"));\nIf(\n    !IsBlank(Dropdown12.Selected.Name) And Len(Trim(TextInput15.Text))>0,\n    UpdateContext({DataCardKey1_1: \"Title\"});\n    UpdateContext({DataCardKey5: \"Description\"});\n    //Set(DataCardKey5: \"Description\");\nSet(\n        //Temporary record\n        rec,\n        //DB operation, from Ticket table, new record, change these columns\n        Patch(\n            Tickets,\n            Defaults(Tickets),\n            {\n                Title: 'eDefenderAdding/CodingTitleInput'.Text,\n                description: \"Case Number(s): \"&TextInput15.Text&Char(13)&\"Client Name: \"&TextInput17.Text&Char(13)&\"Collaborator Type: \"&Dropdown11.Selected.cType&Char(13)&If(Dropdown11.Selected.cType<>\"Client\" And Dropdown11.Selected.cType<>\"Conflict Counsel\",\"Collaborator Name: \"&TextInput17_1.Text,If(Dropdown11.Selected.cType=\"Conflict Counsel\",\"Conflict Counsel Type: \"&Dropdown11_1.Selected.ccType&Char(13)&If(Dropdown11_1.Selected.ccType=\"Other\",\"Other: \"&TextInput17_2.Text),\"\")),\n                creatorId: userData.id,\n                //is major cat?\n                mainCategory: CatObj.ID,\n                //subcat?\n                category: Blank(),\n                //specific issue?\n                subCategory: Blank(),\n                locationId: Dropdown12.Selected.ID,\n                status: \"open\",\n                metricDate: Concatenate(\n                    Month(Today()),\n                    \"/\",\n                    Year(Today())\n                ),\n                hasAttachment: If(\n                    IsEmpty(JointAttachments),\n                    0,\n                    1\n                ),\n                //Automation rules table is used to assign tickets\n                assignedTo: If(\n                    IsEmpty(\n                        Filter(\n                            'Ticket Automation Rules',\n                            categoryId = CatObj.ID && locationId = Dropdown12.Selected.ID\n                        )\n                    ),\n                    0,\n                    LookUp(\n                        'Ticket Automation Rules',\n                        categoryId = CatObj.ID && locationId = Dropdown12.Selected.ID,\n                        userID\n                    )\n                )\n            }\n        )\n    );\n\nPatch(\n    Tickets, \n    LookUp(Tickets,ID = rec.ID),\n    {\n        Title: \"# \"&rec.ID&\" Box Link Request\"\n    });\n// for the attachments, run power automate flow for each attached file\nForAll(\n    attItems As Attachment,\n            AttachFiles.Run(\n            rec.ID,\n            {\n                file:{\n                    contentBytes: Attachment.Value,\n                    name: Attachment.Name\n                }\n            }\n        ) \n);\nForAll(\n    RTEImages As RTEI,\n    With({varHTMLTable: Split(RTEI.base64Image , \"<img\")}, If(CountRows(varHTMLTable)>1, With({varB64Start:Find(\"<img\",RTEI.base64Image)+32},With({varB64End:Find(\"\"\"\",Mid(RTEI.base64Image,varB64Start))-1},CopyPasteTest.Run(Mid(RTEI.base64Image,varB64Start,varB64End),RTEI.copyName & Text(Now(),DateTimeFormat.UTC) &\".png\", rec.ID)\n))))\n        );\n    \n    /*SMTP.SendEmailV3(\n        {\n            From: \"sbpdhelpdesk@outlook.com\",\n            To: userData.email,\n            Subject: \"Help Desk Ticket Received\",\n            Body: \"<div>Hello, this is an automated response. An IT Help Desk ticket # \" & rec.ID & \" was created on your behalf. A technician will contact you soon to begin troubleshooting.</div><br> <div> To view the status of the ticket or add comments, please visit <a href=\"https://apps.powerapps.com/play/e/default-ce8a2002-448f-4f58-82b1-d86f73e3afdd/a/a370d8a4-8906-4ac3-bff0-0a588e959ea7?tenantId=ce8a2002-448f-4f58