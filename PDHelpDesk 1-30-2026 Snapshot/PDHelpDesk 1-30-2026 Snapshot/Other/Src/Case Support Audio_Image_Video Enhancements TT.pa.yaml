Screens:
  Case Support Audio/Image/Video Enhancements TT:
    Properties:
      BackgroundImage: =PUBDEF_IT__LOGO_Vector
      Fill: =ColorScheme.screenBackground
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnHidden: |+
        =UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
      OnVisible: |-
        =ResetForm(CSAIVEForm);
        UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
        ClearCollect(enhanceOptions,
        {
            option:"Video"
        },
        {
            option:"Audio"
        }
        ,
        {
            option:"Both"
        }
        );

         ClearCollect(times, 
         {
                    startTime:"00:01:56",
                    endTime:"00:22:00"
                });
        ClearCollect(NestedCol, 
        {
         fileName:"SpongebobEp1.mp4",
         filePath:"V:PubDef/TV/SpongebobSquarePantsSeason1",
         enhanceType:"Video",
         videoTrue:false,
         videoTimes: times,
         notes:""

        });

        Clear(NestedCol);

        UpdateContext({videoRecord:Blank()});
        UpdateContext({notesPopUp:false});
