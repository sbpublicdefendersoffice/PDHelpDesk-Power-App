                                    - CSEvidenceSupportDateTimeLabel_3:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          BorderThickness: =2
                                          Color: =RGBA(255, 255, 255, 1)
