                                          Height: =If('Case Support Evidence Support TT'.Size=1,150,66)
                                          HoverColor: =RGBA(0, 18, 107, 1)
                                          Items: |-
                                            =Table(
                                            {
                                                Value:"Business"
                                            },
                                            {
                                                Value:"Residence"
                                            }
                                            ,
                                            {
                                                Value:"Cell Phone"
                                            }
                                            )
                                          Items.Value: =Value
                                          Layout: |+
                                            =If('Case Support Evidence Support TT'.Size=1,Layout.Vertical,Layout.Horizontal)
                                          RadioBorderColor: =RGBA(0, 18, 107, 1)
                                          RadioSelectionFill: =RGBA(0, 0, 0, 1)
