ComponentDefinitions:
  FeedbackBugReport:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      CloseReport:
        PropertyKind: Event
        DisplayName: CloseReport
        Description: A custom property
        ReturnType: Boolean
        Default: =Set(varFeedback,false)
      DisablePickMedia:
        PropertyKind: Event
        DisplayName: DisablePickMedia
        Description: A custom property
        ReturnType: Boolean
        Default: =Set(PickMedia,false)
      EnablePickMedia:
        PropertyKind: Event
        DisplayName: EnablePickMedia
        Description: A custom property
        ReturnType: Boolean
        Default: =Set(PickMedia,true)
      FBSize:
        PropertyKind: Input
        DisplayName: FBSize
        Description: A custom property
        DataType: Number
        Default: =App.ActiveScreen.Size
      FeedbackCameraOff:
        PropertyKind: Event
        DisplayName: FeedbackCameraOff
        Description: A custom property
        ReturnType: Boolean
        Default: =Set(FeedbackCamera,false);
      FeedbackCameraOn:
        PropertyKind: Event
        DisplayName: FeedbackCameraOn
        Description: A custom property
        ReturnType: Boolean
        Default: =Set(FeedbackCamera,true);
      PhotoModeDisable:
        PropertyKind: Event
        DisplayName: PhotoModeDisable
        Description: A custom property
        ReturnType: Boolean
        Default: =Set(FeedbackPhoto,false)
      PhotoModeEnable:
        PropertyKind: Event
        DisplayName: PhotoModeEnable
        Description: A custom property
        ReturnType: Boolean
        Default: =Set(FeedbackPhoto,true)
    Properties:
      Height: =App.Height
      Width: =App.Width
    Children:
      - Rectangle33:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(56, 96, 178, 0.5)
            Height: =App.Height
            Width: =App.Width
      - Rectangle34:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =App.Height/1.2
            Width: =App.Width/1.1
            X: =(Parent.Width-Self.Width)/2
            Y: =(Parent.Height-Self.Height)/2
      - Rectangle35:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Width: =Rectangle34.Width
            X: =Rectangle34.X
            Y: =Rectangle34.Y
      - Label66:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =Rectangle35.Height
            Size: =21
            Text: ="Feedback/Bug Report"
            Width: =Rectangle35.Width
            X: =Rectangle35.X
            Y: =Rectangle35.Y
      - TextInput16:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =
            Font: =Font.'Open Sans'
            Height: =Rectangle34.Height/2
            HintText: ="Enter your comments here"
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            Mode: =TextMode.MultiLine
            Width: =Rectangle34.Width/1.1
            X: =Rectangle34.Width-Self.Width
            Y: =Rectangle35.Y+Rectangle35.Height+15
      - Button27:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |+
              =If(Len(TextInput16.Text)>0,
              //Create a new record, assign info to a temp variable
              Set(tempRec,Patch('Feedback/Bugs',Defaults('Feedback/Bugs'),
              {
                  Screen:App.ActiveScreen.Name,
                  FeedbackType: If(Checkbox6.Value,{Value:"Bug"},{Value:"Feedback"}),
                  Comments:TextInput16.Text&If(TicketCategoryID = 1 And TicketSubCategoryID =9 And TicketSpecificIssue =1, Blank(),Char(10)&Char(10)&"Ticket Selection"&Char(10)&LookUp(Category,ID = TicketCategoryID).Name&">"&LookUp(Category,ID = TicketSubCategoryID).Name&">"&LookUp(Category,ID = TicketSpecificIssue).Name),
                  FeedbackChecked:false
              }));
              //Process media
              ForAll(
                  attItems As Attachment,
                          FeedbackAttachFiles.Run(
                          tempRec.ID,
                          {
                              file:{
                                  contentBytes: Attachment.Value,
                                  name: Attachment.Name
                              }
                          }
                      ) 
              );
              ForAll(
                  FeedbackImages As FBI,
                  With({varHTMLTable: Split(FBI.base64Image , "<img")}, If(CountRows(varHTMLTable)>1, With({varB64Start:Find("<img",FBI.base64Image)+32},With({varB64End:Find("""",Mid(FBI.base64Image,varB64Start))-1},CopyPasteFeedback.Run(Mid(FBI.base64Image,varB64Start,varB64End),FBI.copyName&".png",tempRec.ID)
              ))))
                      );
              Clear(FeedbackImages);
              Clear(JointAttachments);
              Clear(attItems);
              Reset(TextInput16);
              Reset(Checkbox6);
              FeedbackBugReport.CloseReport()

              ,Notify("Feedback cannot be blank",NotificationType.Error));
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="Submit"
            Width: =TextInput16.Width/2.5
            X: =Rectangle35.Width/8
            Y: =Rectangle34.Height
      - Button27_1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(151, 0, 0, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(203, 102, 102, 1)
            OnSelect: |-
              =Reset(TextInput16);
              Reset(Checkbox6);
              FeedbackBugReport.CloseReport();
              Clear(FeedbackImages);
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =RGBA(118, 0, 0, 1)
            Text: ="Close"
            Width: =TextInput16.Width/2.5
            X: =Rectangle35.Width-Self.Width
            Y: =Rectangle34.Height
      - Checkbox6:
          Control: Classic/CheckBox@2.1.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            CheckboxBorderColor: =RGBA(0, 18, 107, 1)
            CheckmarkFill: =RGBA(0, 0, 0, 1)
            Font: =Font.'Open Sans'
            HoverColor: =RGBA(0, 18, 107, 1)
            Text: ="This is a bug report"
            Width: =300
            X: =TextInput16.X
            Y: =TextInput16.Height+TextInput16.Y
      - AlternativeAddImageContainer_45:
          Control: GroupContainer@1.4.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =FeedbackPhoto
            Width: =Parent.Width
          Children:
            - AlternativeAddImageBackgroundTint_45:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(56, 96, 178, .35)
                  Height: =Parent.Height
                  Width: =Parent.Width
            - AlternativeAddImageBackground_45:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  BorderThickness: =2
                  Fill: =RGBA(227, 234, 243, 1)
                  Height: =Parent.Height/1.10
                  Width: =Parent.Width/1.10
                  X: =(Parent.Width-Self.Width)/2
                  Y: =(Parent.Height-Self.Height)/2
            - AlternativeAddImageHeader_45:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  BorderThickness: =2
                  Fill: =RGBA(56, 96, 178, 1)
                  Height: =80
                  Width: =AlternativeAddImageBackground_45.Width
                  X: =AlternativeAddImageBackground_45.X
                  Y: =AlternativeAddImageBackground_45.Y
            - AlternativeAddImageHeaderLabel_45:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Open Sans'
                  Height: =AlternativeAddImageHeader_45.Height
                  Size: =18
                  Text: ="Using "&If(FeedbackCamera, "Camera","Copy Paste")
                  Width: =AlternativeAddImageHeader_45.Width
                  X: =AlternativeAddImageHeader_45.X
                  Y: =AlternativeAddImageHeader_45.Y
            - CopyPasteRTE_45:
                Control: RichTextEditor@2.7.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Default: =
                  Height: =AlternativeAddImageBackground_45.Height/1.5
                  Visible: =!FeedbackCamera
                  Width: =AlternativeAddImageBackground_45.Width
                  X: =AlternativeAddImageBackground_45.X
                  Y: =AlternativeAddImageBackground_45.Y+AlternativeAddImageHeader_45.Height
            - Camera_44:
                Control: Camera@2.4.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Camera: |-
                    =//Checks if there are anyback cameras, if there are none then default the camera to the first one otherwise use the first back camera
                    If(IsBlank(LookUp(Camera_44.AvailableDevices, "back" in Name|| "Back" in Name).Id),0,LookUp(Camera_44.AvailableDevices, "back" in Name || "Back" in Name).Id)
                  DisplayMode: =If(FeedbackPhoto,DisplayMode.Edit,DisplayMode.Disabled)
                  Height: =AlternativeAddImageBackground_45.Height/1.5
                  OnSelect: |-
                    =Collect(FeedbackImages,{copyName:App.ActiveScreen.Name&" Photo "&Text(Now(),DateTimeFormat.UTC),base64Image: "<img src="&JSON(Camera_44.Photo,JSONFormat.IncludeBinaryData)&" />"});
                    Collect(JointAttachments,{Name:App.ActiveScreen.Name&" Photo "&Text(Now(),DateTimeFormat.UTC),Value: "<img src="&JSON(Camera_44.Photo,JSONFormat.IncludeBinaryData)&" />"});
                  Visible: =FeedbackCamera
                  Width: =AlternativeAddImageBackground_45.Width
                  X: =AlternativeAddImageBackground_45.X
                  Y: =AlternativeAddImageBackground_45.Y+AlternativeAddImageHeader_45.Height
            - AddScreenshotButton_44:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(56, 96, 178, 1)
                  Font: =Font.'Open Sans'
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnSelect: |+
                    =If( "<img" in CopyPasteRTE_45.HtmlText, Collect(FeedbackImages,{copyName:App.ActiveScreen.Name&"ScreenShot "&Text( Now(), "mm/dd/yyyy hh:mm:ss" ), base64Image:CopyPasteRTE_45.HtmlText});Collect(JointAttachments,{Name:App.ActiveScreen.Name&" ScreenShot "&Text(Now(),DateTimeFormat.UTC), Value:CopyPasteRTE_45.HtmlText});
                    Reset(CopyPasteRTE_45);, Notify("No Valid Image"));
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Text: =If(FeedbackCamera,"Take Picture","Add ScreenShot")
                  Visible: =!FeedbackCamera
                  Width: =250
                  X: =(AlternativeAddImageBackground_45.Width-Self.Width)/2 +AlternativeAddImageBackground_45.X
                  Y: =AlternativeAddImageBackground_45.Height-Self.Height-7
            - ClosePanelButton_44:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  BorderThickness: =2
                  Color: =RGBA(255, 255, 255, 1)
                  Fill: =RGBA(203, 102, 102, 1)
                  Height: =40
                  Icon: =Icon.Cancel
                  OnSelect: |-
                    =FeedbackBugReport.PhotoModeDisable();
                    Reset(CopyPasteRTE_45);
                  Width: =40
                  X: =AlternativeAddImageHeader_45.Width+AlternativeAddImageHeader_45.X-Self.Width
                  Y: =AlternativeAddImageHeader_45.Y
            - CameraInfoLabel_44:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  Height: =50
                  Size: =10
                  Text: |-
                    =//"Tap or Click the camera to take a picture"
                    Concat(Camera_44.AvailableDevices, Name&" "&Id)
                  Visible: =FeedbackCamera
                  Width: =Camera_44.Width
                  X: =(AlternativeAddImageBackground_45.Width-Self.Width)/2 +AlternativeAddImageBackground_45.X
                  Y: =AlternativeAddImageBackground_45.Height-Self.Height-7
            - Rectangle36:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(241, 244, 249, 1)
                  Height: =AlternativeAddImageBackground_45.Height
                  Visible: =PickMedia
                  Width: =AlternativeAddImageBackground_45.Width
                  X: =AlternativeAddImageBackground_45.X
                  Y: =AlternativeAddImageBackground_45.Y
            - Button25_174:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =ColorScheme.primary
                  Font: =Font.'Open Sans'
                  Height: =Self.Width
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Text: =
