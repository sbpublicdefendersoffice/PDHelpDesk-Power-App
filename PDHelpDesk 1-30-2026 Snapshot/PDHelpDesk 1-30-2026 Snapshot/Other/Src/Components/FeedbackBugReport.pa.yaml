                Variant: VariableHeight
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  BorderThickness: =2
                  Height: =Rectangle36.Height-AlternativeAddImageHeaderLabel_46.Height-128
                  Items: =JointAttachments
                  TemplatePadding: =
                  TemplateSize: =64
                  Visible: =PickMedia
                  Width: =Rectangle36.Width/1.1
                  X: =(Rectangle36.Width-Self.Width)/2 +Rectangle36.X
                  Y: =AlternativeAddImageHeaderLabel_46.Y+AlternativeAddImageHeaderLabel_46.Height
                Children:
                  - Label69_2:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Font: =Font.'Open Sans'
                        Height: =Parent.TemplateHeight
                        OnSelect: =Select(Parent)
                        Text: =ThisItem.Name
                        Width: =Parent.TemplateWidth*.8
                        X: =Icon26_1.Width+Icon26_1.X
                  - Icon26_1:
                      Control: Classic/Icon@2.5.0
