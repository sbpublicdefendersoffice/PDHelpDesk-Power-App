                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =RGBA(0, 18, 107, 1)
                        Height: =Self.Width
                        Icon: =Icon.Document
                        OnSelect: =Select(Parent)
                        Width: =If(FeedbackBugReport.FBSize = 1, 32,48)
                        Y: =5
                  - Icon27_1:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(39, 113, 194, 1)
                        Height: =Self.Width
                        Icon: =Icon.Cancel
                        OnSelect: |-
                          =Set(workerVar,{copyName:ThisItem.Name,base64Image:ThisItem.Value});
                          If(workerVar in RTEImages,Remove(RTEImages,LookUp(RTEImages, ThisItem.Value = base64Image)));
                          Remove(attItems,LookUp(attItems,ThisItem.Value = Value));
                          Remove(JointAttachments,ThisItem)
                        Width: =If(FeedbackBugReport.FBSize = 1, 32,48)
                        X: =Parent.TemplateWidth-Self.Width
                        Y: =5
                  - HtmlText9:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        Font: =Font.'Open Sans'
                        HtmlText: =ThisItem.Value
                        OnSelect: =Select(Parent)
                        Visible: =false
                        X: =892
                        Y: =24
                  - Label69:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Font: =Font.'Open Sans'
                        Height: =64
                        OnSelect: =Select(Parent)
                        Overflow: =Overflow.Scroll
                        Text: =ThisItem.Value
                        Visible: =false
                        Width: =423
                        X: =395
      - FeedbackDebug:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =185
            Items: =FeedbackImages
            TemplateSize: =180
            Visible: =false
