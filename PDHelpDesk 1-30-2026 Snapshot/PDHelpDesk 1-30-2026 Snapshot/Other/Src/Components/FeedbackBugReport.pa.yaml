                  Y: =25
      - Label68:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Height: =50
            Text: =If(CountRows(FeedbackImages)>0,CountRows(FeedbackImages)&" Screenshot(s) or Photos Added","No Media Attached")
