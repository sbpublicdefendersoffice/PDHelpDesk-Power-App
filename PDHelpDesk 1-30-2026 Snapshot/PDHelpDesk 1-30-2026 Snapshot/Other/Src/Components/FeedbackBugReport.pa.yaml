                  Y: =Rectangle36.Y
            - AddMediaAttachmentControl_1:
                Control: Attachments@2.3.0
                Properties:
                  BorderColor: =Color.Transparent
                  Font: =Font.'Open Sans'
                  Height: =66
                  HoverFill: =RGBA(0,0,0,.11)
                  ItemColor: =RGBA(255, 255, 255, 1)
                  ItemFill: =RGBA(56, 96, 178, 1)
                  ItemHoverFill: =RGBA(186, 202, 226, 1)
                  Items.Name: =Name
                  Items.Value: =Value
                  MaxAttachments: =10
                  MaxAttachmentsText: =
                  NoAttachmentsText: =
                  OnAddFile: |+
                    =ForAll
                    (
                        Self.Attachments As Attachment,
                        If(Not(Attachment in JointAttachments),Collect(JointAttachments,{Name:Attachment.Name,Value:Attachment.Value}))
                    );
                    ClearCollect(attItems,Self.Attachments);
                    Reset(AddMediaAttachmentControl_1);

                  OnRemoveFile: =
                  PressedColor: =RGBA(255, 255, 255, 1)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Size: =10
                  Visible: =PickMedia
                  Width: =If(FeedbackBugReport.FBSize>1,Rectangle36.Width/1.2,Rectangle36.Width/1.6)
                  X: =(Rectangle36.X+Rectangle36.Width-Self.Width)/2 +Rectangle36.X/2
                  Y: =AttachmentGalleryView_1.Y+AttachmentGalleryView_1.Height+10
            - AttachmentGalleryView_1:
