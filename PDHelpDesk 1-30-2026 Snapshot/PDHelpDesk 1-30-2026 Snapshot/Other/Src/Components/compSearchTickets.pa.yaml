            DisplayMode: =DisplayMode.View
            Height: =36
            Icon: =Icon.Search
            Rotation: =90
            Visible: =App.Width > 600 || compSearchTickets.SearchVisible
            Width: =38
            X: =searchBox_1.X + 5
            Y: =(Parent.Height - Self.Height) / 2
