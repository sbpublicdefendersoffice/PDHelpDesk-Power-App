ComponentDefinitions:
  compWebMenu:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      ExpandMenu:
        PropertyKind: Input
        DisplayName: Expand Menu
        Description: A custom property
        RaiseOnReset: true
        DataType: Boolean
        Default: =showMenu
      HamburgerColor:
        PropertyKind: Input
        DisplayName: Hamburger Color
        Description: A custom property
        DataType: Color
        Default: =Color.White
      MenuItems:
        PropertyKind: Input
        DisplayName: MenuItems
        Description: A custom property
        DataType: Table
        Default: =gblNavItems
    Properties:
      Fill: =Color.Transparent
      Height: =If(showMenu, App.Height, 80)
      OnReset: |-
        =Set(showMenu, compWebMenu.ExpandMenu);
        //Set(showHamIcon, compWebMenu.showHamburgerIcon);
        Set(showHamIcon, !compWebMenu.ExpandMenu)
      Width: =If(showMenu, App.Width, 80)
    Children:
      - Background:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(56, 96, 178, 0.5)
            Height: =App.Height
            OnSelect: =Set(showMenu, false);
            Visible: =showMenu
            Width: =App.Width
      - White nav background:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =Color.White
            Height: =App.Height
            OnSelect: =//Select(Parent)
            Visible: =showMenu
            Width: =200
      - HtmlText1:
          Control: HtmlViewer@2.1.0
          Properties:
            DisabledBorderColor: =RGBA(56, 56, 56, 1)
            Font: =Font.'Open Sans'
            Height: =80
            HtmlText: |-
              ="<div style=
              '
              height:55px;
              width:55px;
              -webkit-border-radius: 50px;
              border-radius: 15px;

              margin:10px;
              '></div>"
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =11
            Width: =80
      - icoHamburgerMenu:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =compWebMenu.HamburgerColor
            Fill: =Color.Transparent
            Height: =48
            Icon: =Icon.Hamburger
            OnSelect: |+
              =Set(showMenu, !showMenu);
            TabIndex: =1
            Visible: =!showMenu
            Width: =62
            X: =(Parent.Width-Self.Width)/2
            Y: =(Parent.Height-Self.Height)/2
      - xIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Fill: =Color.Transparent
            Height: =48
            Icon: =Icon.Cancel
            OnSelect: =Set(showMenu, !showMenu);
            PaddingTop: =2
            TabIndex: =2
            Visible: =showMenu
            Width: =62
            X: =6
            Y: =12
      - MenuOpened:
          Control: Gallery@2.15.0
          Variant: VariableHeight
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =App.DesignHeight
            Items: =compWebMenu.MenuItems
            ShowScrollbar: =false
            TemplateSize: =47
            Visible: =showMenu
            Width: =185
            Y: |-
              =//icoHamburgerMenu.Height
              82
          Children:
            - Rectangle2_1:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(56, 96, 178, 1)
                  Height: |-
                    =//48
                    Parent.TemplateHeight
                  OnSelect: =
                  Visible: =ThisItem.ScreenToGoTo.Name = App.ActiveScreen.Name
                  Width: =6
            - Icon3_1:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(0, 18, 107, 1)
                  Height: =48
                  Icon: =ThisItem.MenuIcon
                  OnSelect: =Select(Parent)
                  PaddingBottom: =10
                  PaddingRight: =10
                  PaddingTop: =5
                  Width: =62
                  X: =3
            - Label2_1:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Lighter
                  Height: =47
                  OnSelect: =Select(Parent)
                  Size: =14
                  Text: =ThisItem.MenuText
                  Width: =175
                  X: =Icon3_1.Width
                  Y: =(Parent.TemplateHeight-Self.Height)/2
            - Button2_1:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =Color.Transparent
                  FocusedBorderColor: =Color.Black
                  Font: =Font.'Open Sans'
                  Height: |+
                    =Label2_1.Height + Label2_1.Y
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =Color.Transparent
                  OnSelect: |-
                    =Set(showMenu, false);
                    Navigate(ThisItem.ScreenToGoTo);
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Color.Transparent
                  TabIndex: =3
                  Text: =""
                  Width: =175
      - MenuClosed:
          Control: Gallery@2.15.0
          Variant: VariableHeight
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =558
            Items: =compWebMenu.MenuItems
            ShowScrollbar: =false
            Visible: |-
              =false
              //!showMenu
            Width: =185
            Y: |-
              =//icoHamburgerMenu.Height
              82
          Children:
            - Rectangle2_2:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(56, 96, 178, 1)
                  Height: =48
                  OnSelect: =
                  Visible: =ThisItem.ScreenToGoTo.Name = App.ActiveScreen.Name
                  Width: =6
            - Icon3_5:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(0, 18, 107, 1)
                  Height: =48
                  Icon: =ThisItem.MenuIcon
                  OnSelect: =Select(Parent)
                  PaddingBottom: =10
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =10
                  Width: =58
            - Label2_2:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Lighter
                  Height: =48
                  OnSelect: =Select(Parent)
                  Size: =14
                  Text: =ThisItem.MenuText
                  Visible: |+
                    =false
                  Width: =58
            - Button2_2:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =Color.Transparent
                  Font: =Font.'Open Sans'
                  Height: =Label2_1.Height + Label2_1.Y
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =Color.Transparent
                  OnSelect: |-
                    =Set(showMenu, false);
                    Navigate(ThisItem.ScreenToGoTo);
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Color.Transparent
                  Text: =""
                  Width: =58
