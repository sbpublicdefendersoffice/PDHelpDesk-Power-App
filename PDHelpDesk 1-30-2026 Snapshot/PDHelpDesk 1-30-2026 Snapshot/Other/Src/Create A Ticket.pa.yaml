                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Default: =""
                                          Font: =Font.'Open Sans'
                                          Height: =35
                                          HintText: ="Please Enter A Title"
                                          HoverBorderColor: =RGBA(0, 18, 107, 1)
                                          HoverFill: =RGBA(186, 202, 226, 1)
                                          Width: =If('Create A Ticket'.Size = 1, Parent.Width/1.2,Parent.Width/1.1)
                                          X: =30
                                          Y: =44
                              - Create_A_Ticket_Main_Category_DataCard:
