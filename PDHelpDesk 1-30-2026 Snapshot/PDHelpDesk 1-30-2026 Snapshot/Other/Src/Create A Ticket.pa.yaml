                                          AutoHeight: =true
                                          BorderColor: =RGBA(0, 0, 0, 1)
                                          Color: =RGBA(168, 0, 0, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =10
                                          Live: =Live.Assertive
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =14
                                          Text: =Parent.Error
                                          Visible: =Parent.DisplayMode=DisplayMode.Edit
                                          Width: =Parent.Width - 60
                                          X: =30
                                          Y: =Create_A_Ticket_Title_Input.Y + Create_A_Ticket_Title_Input.Height
                                    - Create_A_Ticket_Title_Star_Visible:
                                        Control: Label@2.5.1
                                        MetadataKey: FieldRequired
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 0, 0, 1)
                                          Color: =Create_A_Ticket_Title_Label.Color
                                          Font: =Font.'Open Sans'
                                          Height: =Create_A_Ticket_Title_Label.Height
                                          Text: ="*"
                                          Width: =30
                                          Wrap: =false
                                          Y: =Create_A_Ticket_Title_Label.Y
                                    - Create_A_Ticket_Title_Input:
                                        Control: Classic/TextInput@2.3.2
