                                    Text: ="*"
                                    Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                                    Width: =30
                                    Wrap: =false
                                    Y: =CreateAlertTitleLabel.Y
                        - Html_DataCard:
                            Control: TypedDataCard@1.0.7
                            Variant: BlankCard
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Height: =500
                              Visible: =templateMode
                              Width: =1366
                              WidthFit: =true
                              X: =0
