                                    FontWeight: =FontWeight.Semibold
                                    Height: =10
                                    Live: =Live.Assertive
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: =Parent.Error
                                    Visible: =Parent.DisplayMode=DisplayMode.Edit
                                    Width: =Parent.Width - 60
                                    X: =30
                                    Y: =CreateAlertDescriptionTextAreaInput.Y + CreateAlertDescriptionTextAreaInput.Height
                        - ExpirationDateDataCard:
                            Control: TypedDataCard@1.0.7
                            Variant: ClassicDateTimeEdit
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              DataField: ="field_7"
                              Default: =ThisItem.dateExpired
                              DisplayMode: =If(!templateMode && !newTemplate, DisplayMode.Edit, DisplayMode.View)
                              DisplayName: =//DataSourceInfo([@Alerts],DataSourceInfo.DisplayName,"field_7")
                              Fill: =Color.Transparent
                              Height: =Parent.Height/6
                              Required: =false
                              Update: =DateValue14_1.SelectedDate + Time(Value(HourValue14_1.Selected.Value), Value(MinuteValue14_1.Selected.Value), 0)
                              Width: =Parent.Width
                              X: =0
                              Y: =5
                            Children:
                              - ExpirationDateLabel:
                                  Control: Label@2.5.1
                                  MetadataKey: FieldName
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    BorderThickness: =2
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =ColorScheme.primary
                                    Font: =Font.'Open Sans'
                                    Height: =34
                                    Text: ="Expiration Date"
                                    Width: =160
                                    Wrap: =false
                                    X: =30
                                    Y: =10
                              - DateValue14_1:
                                  Control: Classic/DatePicker@2.6.0
                                  MetadataKey: DateFieldValue
                                  Properties:
                                    BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                                    DefaultDate: |-
                                      =// check if we are trying to update a record, if so then the default date would be the date it would expire.
                                      // if not then there should be no date

                                      If(Editing, ThisItem.dateExpired, Today())
                                    DisplayMode: =Parent.DisplayMode
                                    EndYear: =Year(Today())+100
                                    Font: =Font.'Open Sans'
                                    IconBackground: =ColorScheme.primary
                                    IconFill: =RGBA(255, 255, 255, 1)
                                    InputTextPlaceholder: =If(IsBlank(Self.SelectedDate), Text(Date(Year(Now()),01,01), Self.Format, Self.Language))
                                    IsEditable: =true
                                    PaddingBottom: =0
                                    PaddingLeft: =5
                                    PaddingRight: =0
                                    StartYear: =2022
                                    Tooltip: =Parent.DisplayName
                                    Width: =(TextInput1.Width) / 2
                                    X: =30
                                    Y: '=ExpirationDateLabel.Y + ExpirationDateLabel.Height '
                              - HourValue14_1:
                                  Control: Classic/DropDown@2.3.1
                                  MetadataKey: HourFieldValue
                                  Properties:
                                    BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                                    ChevronBackground: =ColorScheme.primary
                                    ChevronFill: =RGBA(255, 255, 255, 1)
                                    ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                    ChevronHoverFill: =RGBA(255, 255, 255, 1)
                                    Default: =If(Editing, Text(Hour(Parent.Default),"00"), Blank())
                                    DisplayMode: =Parent.DisplayMode
                                    Font: =Font.'Open Sans'
                                    Height: =DateValue14_1.Height
                                    HoverFill: =RGBA(186, 202, 226, 1)
                                    Items: =ForAll(Sequence(26), If(Value > 13, Text(Value-14,"[$-en-US]00"), Text(Value-1,"[$-en-US]00")))
                                    Items.Value: =Value
                                    PaddingBottom: =0
                                    PaddingLeft: =5
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    PressedColor: =RGBA(255, 255, 255, 1)
                                    PressedFill: =RGBA(0, 18, 107, 1)
                                    SelectionColor: =RGBA(255, 255, 255, 1)
                                    SelectionFill: =RGBA(56, 96, 178, 1)
                                    Tooltip: =Parent.DisplayName
                                    Width: =DateValue14_1.Width / 2 - 10
                                    X: =DateValue14_1.X + DateValue14_1.Width + 10
                                    Y: =DateValue14_1.Y
                              - Separator15_1:
