                                          Width: =Parent.TemplateWidth
                              - CreateAlertTitleLabel_2:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    BorderThickness: =2
                                    Color: |-
                                      =//If(CreateAlertTitleLabel_2.Text = "Title Required",Color.Red,RGBA(0, 18, 107, 1))
