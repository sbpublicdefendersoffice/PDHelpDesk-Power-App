                            Children:
                              - RichTextEditor1:
                                  Control: RichTextEditor@2.7.0
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Default: |-
                                      =If(templateMode && !IsBlank(Gallery5.Selected.alertHTMLText),Gallery5.Selected.alertHTMLText,
                                      "<div>Please be advised, Service " & CreateAlertTitleValue.Text & " is down. IT is responding and will notify all users when full functionality is restored. Thank you for your patience.</div> <br> <div> Do NOT email or respond to this automated message. This is an automated message created by our notification system. </div>")
                                    DisplayMode: =If(templateMode && !newTemplate,DisplayMode.View, DisplayMode.Edit)
                                    Height: =400
                                    Width: =Parent.Width-80
                                    X: =30
                                    Y: =CreateAlertTitleLabel_3.Y+CreateAlertTitleLabel_3.Height
                              - CreateAlertTitleLabel_3:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    BorderThickness: =2
                                    Color: |-
                                      =//If(CreateAlertTitleLabel_3.Text = "Title Required",Color.Red,RGBA(0, 18, 107, 1))
                                      Color.White
                                    Fill: =ColorScheme.primary
                                    Font: =Font.'Open Sans'
                                    Height: =34
                                    Text: |-
                                      ="Preview
                                      "
                                    Width: =80
                                    Wrap: =false
                                    X: =30
                                    Y: =TextInput1.Y-Self.Height
                        - DescriptionDataCard:
                            Control: TypedDataCard@1.0.7
                            Variant: ClassicTextualEdit
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              DataField: ="Description"
                              Default: =ThisItem.messageText
                              DisplayName: =DataSourceInfo([@Alerts],DataSourceInfo.DisplayName,Create_A_Ticket_Title_Label)
                              Height: =Parent.Height/3
                              MaxLength: =//DataSourceInfo([@Alerts], DataSourceInfo.MaxLength, "messageText")
                              Required: =false
                              Update: =CreateAlertDescriptionTextAreaInput.Text
                              Visible: =!templateMode
                              Width: =Parent.Width
                              X: =0
                              Y: =4
                            Children:
                              - CreateAlertDescriptionLabel:
                                  Control: Label@2.5.1
                                  MetadataKey: FieldName
