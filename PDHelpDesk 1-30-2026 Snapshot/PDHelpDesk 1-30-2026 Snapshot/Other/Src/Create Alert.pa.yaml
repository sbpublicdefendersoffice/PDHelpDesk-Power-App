                              Align: =Align.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =Color.White
                              Fill: =Color.Transparent
                              Font: =Font.'Open Sans'
                              Height: =Parent.Height-CreateAlertWebHeader.Height
