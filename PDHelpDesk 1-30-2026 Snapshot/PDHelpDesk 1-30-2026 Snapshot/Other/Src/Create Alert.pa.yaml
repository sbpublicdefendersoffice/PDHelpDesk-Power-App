Screens:
  Create Alert:
    Properties:
      BackgroundImage: =PUBDEF_IT__LOGO_Vector
      Fill: =ColorScheme.screenBackground
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnHidden: =UpdateContext({TitleReq:"Title"});
      OnVisible: |+
        =Set(allEmails, Concat(Users, "'" & email & "'",","));
        UpdateContext({TitleReq:"Title"});
        UpdateContext({templateMode:false});
        ClearCollect(tempTemplates,
        {
            alertName:"",
            alertSubject:"",
            alertHTMLText: "<div></div>"
        });
        Clear(tempTemplates);
        ForAll(ATemplates As t,

            Patch(tempTemplates,Defaults(tempTemplates),
            {
                alertName:t.Title,
                alertSubject:t.alertSubject,
                alertHTMLText:t.alertHTMLText
            });

        );
        UpdateContext({newTemplate:false});
    Children:
      - CreateAlertContainer:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorScheme.screenBackgroundSeeThroughMid
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - CreateAlertHeader:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: |-
                    =130
                    //Parent.Height/5.7
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - CreateAlertHeaderElements:
                      Control: GroupContainer@1.4.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
