                                    HoverColor: =RGBA(255, 255, 255, 1)
                                    HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                    OnSelect: "=//Check if the title or Description are empty, if they are the form will not be submitted\nIf(\n    !IsBlank('S/ADynamicFormLocationIDDropdown'.Selected.Name) And Len(Trim('S/ADynamicFormDescription'.Text))>0 And Switch('S/ADynamicFormSubCategoryDropdown'.Selected.ID,60,If(!IsBlank('S/ADynamicFormMSRadio'.Selected),true,false),62,If(Len('S/ADynamicFormPDInput'.Text)>0,true,false),87,If(!IsBlank('S/ADynamicFormPowerAppDropdown'.Selected.App),true,false),true),\n    UpdateContext({DataCardKey1_1: \"Title\"});\n    UpdateContext({DataCardKey5: \"Description\"});\n    //Set(DataCardKey5: \"Description\");\nSet(\n        //Temporary record\n        rec,\n        //DB operation, from Ticket table, new record, change these columns\n        Patch(\n            Tickets,\n            Defaults(Tickets),\n            {\n                Title: 'S/ADynamicFormPDInput'.Text,\n                description: Switch('S/ADynamicFormSubCategoryDropdown'.Selected.ID,60,\"MSProduct: \"&'S/ADynamicFormMSRadio'.Selected.Option&Char(13)&Char(13),62,\"PDNumber: \"&'S/ADynamicFormPDInput'.Text&Char(13)&Char(13),87,\"Power App: \"&'S/ADynamicFormPowerAppDropdown'.Selected.App&Char(13)&Char(13),\"\")&\"Details: \"&Trim('S/ADynamicFormDescription'.Text),\n                creatorId: userData.id,\n                mainCategory: 'S/AVLCMainCategoryDropdown_1'.Selected.ID,\n                category: 'S/ADynamicFormSubCategoryDropdown'.Selected.ID,\n                subCategory: 'S/ADynamicFormSpecificIssueDropdown'.Selected.ID,\n                locationId: 'S/ADynamicFormLocationIDDropdown'.Selected.ID,\n                status: \"open\",\n                metricDate: Concatenate(\n                    Month(Today()),\n                    \"/\",\n                    Year(Today())\n                ),\n                hasAttachment: If(\n                    IsEmpty('S/ADynamicFormAttachmentControl'.Attachments),\n                    0,\n                    1\n                ),\n                //Automation rules table is used to assign tickets\n                assignedTo: If(\n                    IsEmpty(\n                        Filter(\n                            'Ticket Automation Rules',\n                            categoryId = 'S/AVLCMainCategoryDropdown_1'.Selected.ID && locationId = 'S/ADynamicFormLocationIDDropdown'.Selected.ID\n                        )\n                    ),\n                    0,\n                    LookUp(\n                        'Ticket Automation Rules',\n                        categoryId = 'S/AVLCMainCategoryDropdown_1'.Selected.ID && locationId = 'S/ADynamicFormLocationIDDropdown'.Selected.ID,\n                        userID\n                    )\n                )\n            }\n        )\n    );\n\nPatch(\n    Tickets, \n    LookUp(Tickets,ID = rec.ID),\n    {\n        Title: \"#\"&rec.ID&\" \"&'S/ADynamicFormSubCategoryDropdown'.Selected.Name&\" Support Request\"\n    });\nSet(rec,Patch(rec,{Title: \"#\"&rec.ID&\" \"&'S/ADynamicFormSubCategoryDropdown'.Selected.Name&\" Support Request\"}));\n// for the attachments, run power automate flow for each attached file\n    ForAll(\n        'S/ADynamicFormAttachmentControl'.Attachments As Attachment,\n               /*AttachFiles.Run(\n            rec.ID,\n            {\n                file: {\n                    contentBytes: Value,\n                    name: Name\n                }\n            }\n        )*/\n        If(Left(Attachment.Value,6) = \"appres\", \n        AttachFiles.Run(\n            rec.ID,\n            {\n                file:{\n                    contentBytes: Attachment.Value,\n                    name: Attachment.Name\n                }\n            }\n        ) ;,\n\n\nWith({varHTMLTable: Split(Attachment.Name , \"<img\")}, If(CountRows(varHTMLTable)>1, With({varB64Start:Find(\"<img\",Attachment.Name)+32},With({varB64End:Find(\"\"\"\",Mid(Attachment.Name,varB64Start))-1},CopyPasteTest.Run(Mid(Attachment.Name,varB64Start,varB64End),Attachment.Value & Text(Now(),DateTimeFormat.UTC) &\".png\", rec.ID)\n))))\n        ) \n    );\n    \n    /*SMTP.SendEmailV3(\n        {\n            From: \"sbpdhelpdesk@outlook.com\",\n            To: userData.email,\n            Subject: \"Help Desk Ticket Received\",\n            Body: \"<div>Hello, this is an automated response. An IT Help Desk ticket # \" & rec.ID & \" was created on your behalf. A technician will contact you soon to begin troubleshooting.</div><br> <div> To view the status of the ticket or add comments, please visit <a href=\"https://apps.powerapps.com/play/e/default-ce8a2002-448f-4f58-82b1-d86f73e3afdd/a/a370d8a4-8906-4ac3-bff0-0a588e959ea7?tenantId=ce8a2002-448f-4f58-82b1-d86f73e3afdd&TickID=\" & rec.ID & \"'>here</a>.</div>\"\n        }\n    );*/\n    /*If(\n        rec.assignedTo > 0,\n        SMTP.SendEmailV3(\n            {\n                From: \"sbpdhelpdesk@outlook.com\",\n                To: LookUp(\n                    Users,\n                    ID = rec.assignedTo,\n                    email\n                ),\n                Subject: \"Help Desk Ticket Assigned\",\n                Body: \"<div>Hello, this is an automated response. An IT Help Desk ticket # \" & rec.ID & \" was assigned to you. Please click <a href='https://apps.powerapps.com/play/e/default-ce8a2002-448f-4f58-82b1-d86f73e3afdd/a/a370d8a4-8906-4ac3-bff0-0a588e959ea7?tenantId=ce8a2002-448f-4f58-82b1-d86f73e3afdd&TickID=\" & rec.ID & \"'>here</a> to view more details for the ticket.</div>\"\n            }\n        );\n    );*/\n//Power automate flow, sends email to ticket creator \nSendEmail.Run(\n        Concatenate(\n            \"'\",\n            userData.email,\n            \"'\"\n        ),\n        \"Help Desk Ticket Recieved\",\n        //Email Message body\n        TicketCreatorMessageRTE_53.HtmlText,\n        Text(Blank())\n    );\n    // If the ticket it assigned to someone, send them an email\n    If(\n        rec.assignedTo > 0,\n        SendEmail.Run(\n            Concatenate(\n                \"'\",\n                LookUp(\n                    Users,\n                    ID = rec.assignedTo,\n                    email\n                ),\n                \"'\"\n            ),\n            \"Help Desk Ticket Assigned\",\n            //Email message body\n            TechAssignMessageRTE_53.HtmlText,\n            Text(Blank())\n        );\nTicketCreatedBoth.Run(userData.email,LookUp(Users,rec.assignedTo=ID,email),rec.ID,\"Ticket #\"&rec.ID&\" has been created. Touch this notification for more information.\"),    TicketCreatedUser.Run(userData.email,rec.ID,\"Ticket #\"&rec.ID&\" has been created on your behalf. Touch this notification for more information.\")\n    );\n    //Reset the form upon completion\n    ResetForm('Software/ApplicationsDynamicForm');\n    Navigate(Success);\n\n);\n// variables that control color elements\n    UpdateContext({CreateTicketTitle: \"Title is Required\"});\n    UpdateContext({CreateTicketDescription: \"Description is Required\"});\n    UpdateContext({SAVLCPopup:true});\n"
                                    PressedBorderColor: =Self.Fill
