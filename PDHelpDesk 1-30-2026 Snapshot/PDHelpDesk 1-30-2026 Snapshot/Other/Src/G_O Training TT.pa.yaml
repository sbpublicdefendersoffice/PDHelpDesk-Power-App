                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =Color.Transparent
                                    Font: =Font.'Open Sans'
                                    Height: =Parent.Height-'G/OTrainingWebHeader'.Height
                                    Size: =If('G/O Training TT'.Size=1, titleText.mobileSize, titleText.desktopSize)
                                    Text: ="General/Other Training Form"
                                    Width: =Parent.Width
                                    Y: ='G/OTrainingWebHeader'.Height
                              - G/OTrainingWebHeader:
                                  Control: CanvasComponent
                                  ComponentName: compWebHeader
                                  Properties:
                                    BackgroundColor: =Color.Transparent
                                    CompScreenSize: ='G/O Training TT'.Size
                                    EnableFeedback: =Set(varFeedback,true)
                                    FeedbackBool: =varFeedback
                                    Height: |-
                                      =82
                                      //Parent.Height
                                    Width: =App.Width
                  - G/OTrainingMainContentContainer:
                      Control: GroupContainer@1.4.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        Fill: =ColorScheme.screenBackgroundSeeThroughMid
                        Height: =Parent.Height/1.21
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: |-
                          =true
                          //Main Content container this houses certian elements such as the searchbar, and 2 button galleries, one for desktop, and another for mobile
                        Width: =Parent.Width
                      Children:
                        - G/OTrainingForm:
                            Control: Form@2.4.4
                            Variant: Classic
                            Layout: Vertical
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              BorderColor: =RGBA(0, 18, 107, 1)
                              DataSource: =Tickets
                              DefaultMode: =FormMode.New
                              Height: =Parent.Height/1.21
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              NumberOfColumns: =1
                              Width: =Parent.Width
                              Y: =Parent.Height/5.7
