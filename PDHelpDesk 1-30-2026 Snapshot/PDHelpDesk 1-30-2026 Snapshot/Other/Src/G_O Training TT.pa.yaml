                                  Control: TypedDataCard@1.0.7
                                  Variant: ClassicTextualEdit
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    DataField: ="title"
                                    Default: =ThisItem.Title
                                    DisplayName: =//DataSourceInfo([@Tickets],DataSourceInfo.DisplayName, "field_2")
                                    Height: =80
                                    MaxLength: =//DataSourceInfo([@Tickets], DataSourceInfo.MaxLength, "field_2")
                                    Required: =false
                                    Width: =1366
                                    WidthFit: =true
                                    X: =0
                                    Y: =0
                                  Children:
                                    - G/OTrainingTitleLabel:
                                        Control: Label@2.5.1
                                        MetadataKey: FieldName
                                        Properties:
                                          AutoHeight: =true
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          BorderThickness: =2
                                          Color: =RGBA(255, 255, 255, 1)
                                          Fill: =ColorScheme.primary
                                          Font: =Font.'Open Sans'
                                          Height: =34
                                          Text: ="Name of Training"
                                          Width: =160
                                          Wrap: =false
                                          X: =30
                                          Y: ='eDefenderAdding/CodingDisclaimerLabel_8'.Height+25
                                    - G/OTrainingTitleError:
                                        Control: Label@2.5.1
                                        MetadataKey: ErrorMessage
                                        Properties:
                                          AutoHeight: =true
                                          BorderColor: =RGBA(0, 0, 0, 1)
                                          Color: =RGBA(168, 0, 0, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =10
                                          Live: =Live.Assertive
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =14
                                          Text: =Parent.Error
                                          Visible: =Parent.DisplayMode=DisplayMode.Edit
                                          Width: =Parent.Width - 60
                                          X: =30
                                          Y: ='G/OTrainingTitleInput'.Y + 'G/OTrainingTitleInput'.Height
                                    - G/OTrainingTitleStarVisible:
                                        Control: Label@2.5.1
                                        MetadataKey: FieldRequired
