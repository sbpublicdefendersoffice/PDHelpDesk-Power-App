                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 0, 0, 1)
                                          Color: ='G/OTrainingTitleLabel'.Color
                                          Font: =Font.'Open Sans'
                                          Height: ='G/OTrainingTitleLabel'.Height
                                          Text: ="*"
