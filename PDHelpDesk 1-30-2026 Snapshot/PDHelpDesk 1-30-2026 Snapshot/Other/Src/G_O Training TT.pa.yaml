                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Default: =""
                                          EnableSpellCheck: =true
                                          Font: =Font.'Open Sans'
                                          Height: =35
                                          HintText: ="What is the training for? PowerApps? Kofax? etc."
