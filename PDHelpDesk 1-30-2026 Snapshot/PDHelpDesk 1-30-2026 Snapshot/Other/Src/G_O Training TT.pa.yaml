                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    DataField: ="mainCategory"
                                    Default: =ThisItem.mainCategory
                                    DisplayName: =DataSourceInfo([@Tickets],DataSourceInfo.DisplayName, Name)
                                    Height: =If( 'G/O Training TT'.Size = 1, Parent.Height/7, Parent.Height/5)
                                    Required: =true
                                    Visible: =false
                                    Width: =1366
                                    WidthFit: =true
                                    X: =0
                                    Y: =1
                                  Children:
                                    - G/OTrainingMainCategoryLabel:
                                        Control: Label@2.5.1
                                        MetadataKey: FieldName
