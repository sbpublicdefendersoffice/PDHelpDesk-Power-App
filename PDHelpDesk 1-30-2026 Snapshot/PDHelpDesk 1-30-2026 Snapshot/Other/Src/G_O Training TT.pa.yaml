                                          BorderThickness: =2
                                          Color: =RGBA(221, 79, 14, 1)
                                          Fill: =RGBA(255, 255, 255, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =If('G/O Training TT'.Size=1,100,50)
                                          Size: =If('eDefender Adding/Coding Items TT'.Size =1,13,16)
                                          Text: ="When Submitting media, DO NOT SUBMIT DOCUMENTS CONTAINING SENSITIVE/RESTRICTED DATA. All case-related files should be uploaded to the Box File."
                                          Width: =Parent.Width
                              - G/OTrainingMainCategory_DataCard:
                                  Control: TypedDataCard@1.0.7
                                  Variant: ClassicNumberEdit
