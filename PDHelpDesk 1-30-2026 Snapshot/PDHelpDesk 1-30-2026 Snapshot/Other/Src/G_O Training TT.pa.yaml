                                          HoverFill: =RGBA(186, 202, 226, 1)
                                          Width: =If('G/O Training TT'.Size=1,Parent.Width/1.2,Parent.Width/1.1)
                                          X: =30
                                          Y: ='G/OTrainingTitleLabel'.Y+'G/OTrainingTitleLabel'.Height
                                    - eDefenderAdding/CodingDisclaimerLabel_8:
                                        Control: Label@2.5.1
