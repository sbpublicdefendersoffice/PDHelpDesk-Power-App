                                          OnSelect: "=\nIf(!HREOffDescriptionTextInputArea.Visible,\nUpdateContext({TicketDescText:Concatenate(\"Onboarding Ticket Information\",Char(13)&Char(13),\"Employee Name: \"&HREOffFirstNameInput.Text&\" \"&HREOffLastNameInput.Text&Char(13)&Char(13),\"Email: \"&HREOffEmailAddressInput.Text&Char(13)&Char(13),\"Staff Group: \"&HREOffStaffGroupDropdown.Selected.Role&Char(13)&Char(13),\"Operation Location: \"&HREOffOperationLocationDropdown.Selected.Location&Char(13)&Char(13),\"End Date: \"&DateValue(HREOffEndDatePicker.SelectedDate))}), Notify(\"Description is Blank\"));\n\n//Check if the title or Description are empty, if they are the form will not be submitted\nIf(\n    Len(Trim(HREOffFirstNameInput.Text))>0 And Len(Trim(HREOffLastNameInput.Text))>0 And Len(Trim(HREOffEmailAddressInput.Text)) And        !IsBlank(HREOffStaffGroupDropdown.Selected.Role) And !IsBlank(HREOffOperationLocationDropdown.Selected.Location) And \n    !IsBlank(HREOffEndDatePicker) And !IsBlank(HREOffLocationIDDropdown.Selected.Name),\n    UpdateContext({DataCardKey1_1: \"Title\"});\n    UpdateContext({DataCardKey5: \"Description\"});\n    //Set(DataCardKey5: \"Description\");\nSet(\n        //Temporary record\n        offboardinfo,\n            {\n                Title: \"# \"&rec.ID&\" Offboarding Request\",\n                description: Trim(HREOffDescriptionTextInputArea.Text),\n                creatorId: userData.id,\n                mainCategory: HREOffMainCategoryDropdown.Selected.ID,\n                category: HREOffSubCategoryDropdown.Selected.ID,\n                subCategory: HREOffSpecificIssueDropdown.Selected.ID,\n                locationId: HREOffLocationIDDropdown.Selected.ID,\n                status: \"open\",\n                metricDate: Concatenate(\n                    Month(Today()),\n                    \"/\",\n                    Year(Today())\n                ),\n                hasAttachment: If(\n                    IsEmpty(JointAt