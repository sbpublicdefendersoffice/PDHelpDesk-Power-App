                                          HoverColor: =RGBA(255, 255, 255, 1)
                                          HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                          OnSelect: "=\nIf(!HREOnDescriptionTextInputArea.Visible,\nUpdateContext({TicketDescText:Concatenate(\"Onboarding Information\",Char(13)&Char(13)&\"First Name: \"&HREFirstNameInput.Text,Char(13)&\"Last Name: \"&HRELastNameInput.Text,Char(13)&\"Staff Group: \"&Dropdown8.Selected.type,Char(13)&\"Operation Location: \"&Dropdown8_1.Selected.type,Char(13)&\"Start Date:\"&DateValue(DatePicker1.SelectedDate),Char(13)&\"Email: \")}), Notify(\"Description is Blank\"));\n\n//Check if the title or Description are empty, if they are the form will not be submitted\nIf(\n    !IsBlank(HREOnLocationIDDropdown.Selected.Name) And Len(Trim(HREFirstNameInput.Text))>0 And Len(Trim(HRELastNameInput.Text))>0 And\n    !IsBlank(Dropdown8.Selected.type) And !IsBlank(Dropdown8_1.Selected.type) And !IsBlank(DatePicker1.SelectedDate)\n,\n    UpdateContext({DataCardKey1_1: \"Title\"});\n    UpdateContext({DataCardKey5: \"Description\"});\n    //Set(DataCardKey5: \"Description\");\nSet(\n        //Temporary record\n        onboardInfo,\n            {\n                eFirstName:HREFirstNameInput.Text,\n                eLastName:HRELastNameInput.Text,\n                staffType:Dropdown8.Selected.type,\n                operationLocation:Dropdown8_1.Selected.type,\n                startDate:DatePicker1.SelectedDate,\n                title: \"Onboarding Request\",\n                description:Trim(HREOnDescriptionTextInputArea.Text),\n                creatorId: userData.id,\n                mainCategory: HREOnMainCategoryDropdown.Selected.ID,\n                category: HREOnSubCategoryDropdown.Selected.ID,\n                subCategory: HREOnSpecificIssueDropdown.Selected.ID,\n                locationId: HREOnLocationIDDropdown.Selected.ID,\n                status: \"open\",\n                metricDate: Concatenate(\n                    Month(Today()),\n                    \"/\",\n                    Year(Today())\n                ),\n                hasAttachment: If(\n                    IsEmpty(JointAttachments),\n                    0,\n                    1\n                ),\n                //Automation rules table is used to assign tickets\n                assignedTo: If(\n                    IsEmpty(\n                        Filter(\n                            'Ticket Automation Rules',\n                            categoryId = HREOnMainCategoryDropdown.Selected.ID && locationId = HREOnLocationIDDropdown.Selected.ID\n                        )\n                    ),\n                    0,\n                    LookUp(\n                        'Ticket Automation Rules',\n                        categoryId = HREOnMainCategoryDropdown.Selected.ID && locationId = HREOnLocationIDDropdown.Selected.ID,\n                        userID\n                    )\n                )\n            }\n        \n    );\n\n// for the attachments, run power automate flow for each attached file\nForAll(\n    attItems As Attachment,\n            AttachFiles.Run(\n            rec.ID,\n            {\n                file:{\n                    contentBytes: Attachment.Value,\n                    name: Attachment.Name\n                }\n            }\n        ) \n);\nForAll(\n    RTEImages As RTEI,\n    With({varHTMLTable: Split(RTEI.base64Image , \"<img\")}, If(CountRows(varHTMLTable)>1, With({varB64Start:Find(\"<img\",RTEI.base64Image)+32},With({varB64End:Find(\"\"\"\",Mid(RTEI.base64Image,varB64Start))-1},CopyPasteTest.Run(Mid(RTEI.base64Image,varB64Start,varB64End),RTEI.copyName & Text(Now(),DateTimeFormat.UTC) &\".png\", rec.ID)\n))))\n        );\n    \n    /*SMTP.SendEmailV3(\n        {\n            From: \"sbpdhelpdesk@outlook.com\",\n            To: userData.email,\n            Subject: \"Help Desk Ticket Received\",\n            Body: \"<div>Hello, this is an automated response. An IT Help Desk ticket # \" & rec.ID & \" was created on your behalf. A technician will contact you soon to begin troubleshooting.</div><br> <div> To view the status of the ticket or add comments, please visit <a href=\"https://apps.powerapps.com/play/e/default-ce8a2002-448f-4f58-82b1-d86f73e3afdd/a/a370d8a4-8906-4ac3-bff0-0a588e959ea7?tenantId=ce8a2002-448f-4f58-82b1-d86f73e3afdd&TickID=\" & rec.ID & \"'>here</a>.</div>\"\n        }\n    );*/\n    /*If(\n        rec.assignedTo > 0,\n        SMTP.SendEmailV3(\n            {\n                From: \"sbpdhelpdesk@outlook.com\",\n                To: LookUp(\n                    Users,\n                    ID = rec.assignedTo,\n                    email\n                ),\n                Subject: \"Help Desk Ticket Assigned\",\n                Body: \"<div>Hello, this is an automated response. An IT Help Desk ticket # \" & rec.ID & \" was assigned to you. Please click <a href='https://apps.powerapps.com/play/e/default-ce8a2002-448f-4f58-82b1-d86f73e3afdd/a/a370d8a4-8906-4ac3-bff0-0a588e959ea7?tenantId=ce8a2002-448f-4f58-82b1-d86f73e3afdd&TickID=\" & rec.ID & \"'>here</a> to view more details for the ticket.</div>\"\n            }\n        );\n    );*/\nSet(rec,Patch(rec,{description:Substitute(rec.description,Char(13),\"<br>\")}));\n//Power automate flow, sends email to ticket creator \n//This is a trigger, send generic information to who submitted request\nSendEmail.Run(\n            userData.email,\n        \"Onboard Request generated\",\n        //Email Message body\n        OnboardingRichText.HtmlText,\n        Text(Blank())\n    );\n//Create 5 tickets starting with AD Account Creation\n//Ticket 1 AD Account\nSet(rec,\n    Patch(Tickets,Defaults(Tickets),\n    {\n        Title: \"\",\n        description:Trim(HREOnDescriptionTextInputArea.Text),\n        creatorId: userData.id,\n        mainCategory: HREOnMainCategoryDropdown.Selected.ID,\n        category: HREOnSubCategoryDropdown.Selected.ID,\n        subCategory: HREOnSpecificIssueDropdown.Selected.ID,\n        locationId: HREOnLocationIDDropdown.Selected.ID,\n        status: \"open\",\n        metricDate: Concatenate(\n                    Month(Today()),\n                    \"/\",\n                    Year(Today())\n                    ),\n        hasAttachment: If(IsEmpty(JointAttachments),0,1),\n                //Automation rules table is used to assign tickets\n                assignedTo: 6,\n                addAssignees:LookUp(Users,ID=userData.id,fullName)    \n                \n    }\n\n    ));\n//Fix title\nPatch(Tickets,LookUp(Tickets,rec.ID=ID),\n{\n    Title: \"# \"&rec.ID&\" AD Account Creation\"\n}\n);\nSet(rec,Patch(rec,{description:Substitute(rec.description,Char(13),\"<br>\")}));\n    // Send to assigned for AD Ticket\n    If(\n        rec.assignedTo > 0,\n        SendEmail.Run(\n                LookUp(\n                    Users,\n                    ID = rec.assignedTo,\n                    email\n                ),\n            \"Help Desk Ticket Assigned\",\n            //Email message body\n            TechAssignMessageRTE_1.HtmlText,\n            Text(Blank())\n        )\n    );\n\n//Ticket 2 eDefender Account\nSet(rec,\n    Patch(Tickets,Defaults(Tickets),\n    {\n        Title: \"\",\n        description:Trim(HREOnDescriptionTextInputArea.Text),\n        creatorId: userData.id,\n        mainCategory: HREOnMainCategoryDropdown.Selected.ID,\n        category: HREOnSubCategoryDropdown.Selected.ID,\n        subCategory: HREOnSpecificIssueDropdown.Selected.ID,\n        locationId: HREOnLocationIDDropdown.Selected.ID,\n        status: \"open\",\n        metricDate: Concatenate(\n                    Month(Today()),\n                    \"/\",\n                    Year(Today())\n                    ),\n        hasAttachment: If(IsEmpty(JointAttachments),0,1),\n                //Automation rules table is used to assign tickets\n                //Should be hardcoded for Angie(not implemented)\n                assignedTo: 5,\n                addAssignees:LookUp(Users,ID=userData.id,fullName)\n    }\n\n    ));\n//Fix title\nPatch(Tickets,LookUp(Tickets,rec.ID=ID),\n{\n    Title: \"# \"&rec.ID&\" eDefender Account Creation\"\n}\n);\nSet(rec,Patch(rec,{description:Substitute(rec.description,Char(13),\"<br>\")}));\n//Email is sent as a record that the ticket is made, should not be acted upon until AD is completed\n    If(\n        rec.assignedTo > 0,\n        SendEmail.Run(\n                LookUp(\n                    Users,\n                    ID = rec.assignedTo,\n                    email\n                ),\n            \"Help Desk Ticket Assigned\",\n            //Email message body\n            TechAssignMessageRTE_1.HtmlText,\n            Text(Blank())\n        )\n    );\n//Ticket 3 Odyseey + CEB\nSet(rec,\n    Patch(Tickets,Defaults(Tickets),\n    {\n        Title: \"\",\n        description:Trim(HREOnDescriptionTextInputArea.Text),\n        creatorId: userData.id,\n        mainCategory: HREOnMainCategoryDropdown.Selected.ID,\n        category: HREOnSubCategoryDropdown.Selected.ID,\n        subCategory: HREOnSpecificIssueDropdown.Selected.ID,\n        locationId: HREOnLocationIDDropdown.Selected.ID,\n        status: \"open\",\n        metricDate: Concatenate(\n                    Month(Today()),\n                    \"/\",\n                    Year(Today())\n                    ),\n        hasAttachment: If(IsEmpty(JointAttachments),0,1),\n                //Automation rules table is used to assign tickets\n                //Should be hardcoded for Angie(not implemented)\n                assignedTo: 4,\n                addAssignees:LookUp(Users,ID=userData.id,fullName)\n    }\n\n    ));\n//Fix title\nPatch(Tickets,LookUp(Tickets,rec.ID=ID),\n{\n    Title: \"# \"&rec.ID&\" Odyssey+CEB Account Creation\"\n}\n);\nSet(rec,Patch(rec,{description:Substitute(rec.description,Char(13),\"<br>\")}));\n//Email as a indicator that Ticket was created.\n    If(\n        rec.assignedTo > 0,\n        SendEmail.Run(\n                LookUp(\n                    Users,\n                    ID = rec.assignedTo,\n                    email\n                ),\n            \"Help Desk Ticket Assigned\",\n            //Email message body\n            TechAssignMessageRTE_1.HtmlText,\n            Text(Blank())\n        )\n    );\n//Ticket 4 Equipment Request\nSet(rec,\n    Patch(Tickets,Defaults(Tickets),\n    {\n        Title: \"\",\n        description:Trim(HREOnDescriptionTextInputArea.Text),\n        creatorId: userData.id,\n        mainCategory: HREOnMainCategoryDropdown.Selected.ID,\n        category: HREOnSubCategoryDropdown.Selected.ID,\n        subCategory: HREOnSpecificIssueDropdown.Selected.ID,\n        locationId: HREOnLocationIDDropdown.Selected.ID,\n        status: \"open\",\n        metricDate: Concatenate(\n                    Month(Today()),\n                    \"/\",\n                    Year(Today())\n                    ),\n        hasAttachment: If(IsEmpty(JointAttachments),0,1),\n                //Automation rules table is used to assign tickets\n                //Should be hardcoded for Angie(not implemented)\n                assignedTo: 7,\n                addAssignees:LookUp(Users,ID=userData.id,fullName)\n    }\n\n    ));\n//Fix title\nPatch(Tickets,LookUp(Tickets,rec.ID=ID),\n{\n    Title: \"# \"&rec.ID&\" Onboarding Equipment Request\"\n}\n);\nSet(rec,Patch(rec,{description:Substitute(rec.description,Char(13),\"<br>\")}));\n//Send notification to equipment handler only\nIf(\n        rec.assignedTo > 0,\n        SendEmail.Run(\n                LookUp(\n                    Users,\n                    ID = rec.assignedTo,\n                    email\n                ),\n            \"Help Desk Ticket Assigned\",\n            //Email message body\n            TechAssignMessageRTE_1.HtmlText,\n            Text(Blank())\n        )\n    );\n//Ticket 5 PDGo\nSet(rec,\n    Patch(Tickets,Defaults(Tickets),\n    {\n        Title: \"\",\n        description:Trim(HREOnDescriptionTextInputArea.Text),\n        creatorId: userData.id,\n        mainCategory: HREOnMainCategoryDropdown.Selected.ID,\n        category: HREOnSubCategoryDropdown.Selected.ID,\n        subCategory: HREOnSpecificIssueDropdown.Selected.ID,\n        locationId: HREOnLocationIDDropdown.Selected.ID,\n        status: \"open\",\n        metricDate: Concatenate(\n                    Month(Today()),\n                    \"/\",\n                    Year(Today())\n                    ),\n        hasAttachment: If(IsEmpty(JointAttachments),0,1),\n                //Automation rules table is used to assign tickets\n                //Should be hardcoded for Angie(not implemented)\n                assignedTo: 13,\n                addAssignees:LookUp(Users,ID=userData.id,fullName)\n    }\n\n    ));\n//Fix title\nPatch(Tickets,LookUp(Tickets,rec.ID=ID),\n{\n    Title: \"# \"&rec.ID&\" PDGo Profile Creation\"\n}\n);\nSet(rec,Patch(rec,{description:Substitute(rec.description,Char(13),\"<br>\")}));\n//Send notification to PDGo profile maker\nIf(\n        rec.assignedTo > 0,\n        SendEmail.Run(\n                LookUp(\n                    Users,\n                    ID = rec.assignedTo,\n                    email\n                ),\n            \"Help Desk Ticket Assigned\",\n            //Email message body\n            TechAssignMessageRTE_1.HtmlText,\n            Text(Blank())\n        );\n    );\n\n\n\n    //Reset the form upon completion\n    ResetForm(HREOnForm);\n    Navigate(Success);\n\n);\n// variables that control color elements\n    UpdateContext({CreateTicketTitle: \"Title is Required\"});\n    UpdateContext({CreateTicketDescription: \"Description is Required\"});\n    UpdateContext({OnboardingPopup:true});\n"
                                          PressedBorderColor: =Self.Fill
