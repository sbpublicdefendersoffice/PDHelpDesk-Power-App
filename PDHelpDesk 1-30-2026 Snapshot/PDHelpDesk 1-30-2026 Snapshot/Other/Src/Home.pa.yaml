Screens:
  Home:
    Properties:
      BackgroundImage: =SantaBarabaraBuilding
      Fill: =ColorScheme.screenBackground
      ImagePosition: =ImagePosition.Fill
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: "=\r\n//Outdated variables for contextual menu\r\nUpdateContext({NDrop:false,MGallery:false,HambIconChange:false,CloseAlertRibbon:false, buttonText:\"\"});\r\nSet(galleryVisible, true);\r\nForAll(userNav,\r\n      Collect(tempC,\r\n              Last(\r\n                FirstN(\r\n                    AddColumns(\r\n                        DropColumns(userNav,row),row,CountRows(tempC)+1\r\n                              ),CountRows(tempC)+1\r\n                      )\r\n                  )\r\n             )\r\n      );\r\n      \r\nClearCollect(userNav,tempC);\r\nClear(tempC);\r\n//FeedbackBug Reporting Clear Collections\r\nClear(RTEImages);\r\nClear(JointAttachments);\r\nClear(attItems);\r\n"
    Children:
      - Home_Main_Container:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Home.Height
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: |-
              =true
              //This is the Main container
            Width: =Home.Width
          Children:
            - Home_Verical_Layout_Container:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  FillPortions: =9
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: |-
                    =true
                    // This is the main Vertical container of the screen
                  Width: =Parent.Width
                Children:
                  - Home_Header_Container:
                      Control: GroupContainer@1.4.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255,255,255, 1)
                        FillPortions: =0
                        Height: |-
                          =130
                          //Parent.Height/11
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: |-
                          =//Home.Size<>1
                          //This is the top most header container that houses the navbar links
                          true
                        Width: =Parent.Width
                      Children:
                        - Home_Header_Elements:
                            Control: GroupContainer@1.4.0
                            Variant: ManualLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.None
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - Home_Background_Gradient:
                                  Control: HtmlViewer@2.1.0
                                  Properties:
                                    DisabledBorderColor: =RGBA(56, 56, 56, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =Parent.Height
                                    HtmlText: |-
                                      ="<div style='
                                      height:"&Self.Height-1&"px;
                                      width:100%;
                                      bbackground: rgb(53,89,137);
                                      background: linear-gradient(90deg, rgb("&gradientLeft.red&","&gradientLeft.blue&","&gradientLeft.green&") 0%, rgb("&gradientRight.red&","&gradientRight.blue&","&gradientRight.green&") 100%);' ></div>"
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    Width: =Parent.Width
                              - Home_Header_Label:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =Color.Transparent
                                    Font: =Font.'Open Sans'
                                    Height: =Parent.Height-Home_Web_Header.Height
                                    Size: =If(Home.Size= 1, titleText.mobileSize, titleText.desktopSize)
                                    Text: ="Home"
                                    Width: =Parent.Width
                                    X: =(Parent.Width - Self.Width)/2
                                    Y: =82
                              - Home_Web_Header:
                                  Control: CanvasComponent
                                  ComponentName: compWebHeader
                                  Properties:
                                    BackgroundColor: =Color.Transparent
                                    CompScreenSize: =Home.Size
                                    EnableFeedback: =Set(varFeedback,true)
                                    FeedbackBool: =varFeedback
                                    Height: |-
                                      =82
                                      //Parent.Height
                                    Width: =App.Width
                  - Home_Main_Content_Container:
                      Control: GroupContainer@1.4.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        Fill: =ColorScheme.screenBackgroundSeeThroughLight
                        FillPortions: =10
                        Height: =Parent.Height
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: |-
                          =true
                          //Main Content container this houses certian elements such as the searchbar, and 2 button galleries, one for desktop, and another for mobile
                        Width: =Parent.Width
                      Children:
                        - Home_Buttons_Container:
                            Control: GroupContainer@1.4.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              DropShadow: =DropShadow.None
                              FillPortions: =8
                              Height: =Parent.Height
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - Home_Content_Area:
                                  Control: GroupContainer@1.4.0
                                  Variant: ManualLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    DropShadow: =DropShadow.None
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.Width
                                  Children:
                                    - Home_Navigation_ Buttons_Gallery:
                                        Control: Gallery@2.15.0
                                        Variant: Vertical
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          DelayItemLoading: =false
                                          Height: =If(Home.Size=1,Parent.Height, 400)
                                          Items: =userNav
                                          LoadingSpinner: =LoadingSpinner.None
                                          OnSelect: =Switch(ThisItem.NavName, "Create Ticket", Navigate('Category Select'), "My Tickets", Navigate(MyTickets), "Ticket Log", Navigate('All Tickets'), "Ticket Metrics", Navigate('Ticket Metrics - Admin Tech'), "Assign Role", Navigate('Assign Role - Admin'))
                                          ShowScrollbar: =false
                                          TemplateSize: =200
                                          Width: =Parent.Width
                                          WrapCount: =Switch(Home.Size, ScreenSize.Small, 2, ScreenSize.Medium, 2, ScreenSize.Large, 3, If(userData.role ="staff", 4, 4))
                                          Y: =42
                                        Children:
                                          - Home_Gallery_Background_Button:
                                              Control: Classic/Button@2.2.0
                                              Properties:
                                                BorderColor: =ColorFade(Self.Fill, -15%)
                                                Color: =ColorScheme.primary
                                                DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                                Fill: =Color.Transparent
                                                Font: =Font.'Open Sans'
                                                Height: |-
                                                  =//If ( Home.Size =1 , Parent.TemplateHeight/1.5,Parent.TemplateHeight/1.1)
                                                  Parent.TemplateHeight-50
                                                HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                                                HoverColor: =RGBA(255, 255, 255, 1)
                                                HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                                OnSelect: =Select(Parent)
                                                PressedBorderColor: =Self.Fill
                                                PressedColor: =Self.Fill
                                                PressedFill: =Self.Color
                                                Text: =""
                                                Width: =If(Home.Size = 1, Parent.Width/2.5, Parent.Width/5)
                                                X: =(Parent.TemplateWidth-Self.Width)/2
                                                Y: =(Parent.TemplateHeight-Self.Height)/2
                                          - Home_Gallery_Button_Color_Gradient:
                                              Control: HtmlViewer@2.1.0
                                              Properties:
                                                DisabledBorderColor: =RGBA(56, 56, 56, 1)
                                                Font: =Font.'Open Sans'
                                                Height: =Home_Gallery_Background_Button.Height
                                                HtmlText: |-
                                                  ="<div style='
                                                  height:"&Self.Height-1&"px;
                                                  width:100%;
                                                  bbackground: rgb(53,89,137);
                                                  background: "&If(ThisItem.NavName="Emergency","linear-gradient(90deg, rgb("&200&","&0&","&0&") 0% , rgb("&100&","&0&","&0&") "&100&"%)","linear-gradient(90deg, rgb("&gradientLeft.red&","&gradientLeft.blue&","&gradientLeft.green&") 0% , rgb("&gradientRight.red&","&gradientRight.blue&","&gradientRight.green&") "&100&"%)")&"; -webkit-border-radius: 10px;
                                                  -moz-border-radius: 10px;
                                                  border-radius: 10px;' ></div>"

                                                  //rgba(180,194,203,1) 0% , rgba(126,149,180,1) 25%, rgba(53,89,137,1)
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Width: =Home_Gallery_Background_Button.Width
                                                X: =Home_Gallery_Background_Button.X
                                                Y: =    Home_Gallery_Background_Button.Y
                                          - Home_Gallery_Nav_Label:
                                              Control: Label@2.5.1
                                              Properties:
                                                Align: =Align.Center
                                                BorderColor: =RGBA(0, 18, 107, 1)
                                                Color: =Color.White
                                                Font: =Font.'Open Sans'
                                                FontWeight: =FontWeight.Semibold
                                                Height: |-
                                                  =//If(Home.Size >1,ButtonGalleryBackgroundButton_1.Height/4.5,15)
                                                  40
                                                OnSelect: =Select(Parent)
                                                Size: |+
                                                  =If(Home.Size =1,11,15)
                                                Text: =ThisItem.NavName
                                                Width: =Home_Gallery_Background_Button.Width
                                                X: =(Parent.TemplateWidth-Self.Width)/2
                                                Y: =Home_Gallery_Nav_Icon.Y+Home_Gallery_Nav_Icon.Height
                                          - Home_Gallery_Nav_Icon:
                                              Control: Classic/Icon@2.5.0
                                              Properties:
                                                AccessibleLabel: =ThisItem.NavName&" Icon"
                                                BorderColor: =RGBA(0, 18, 107, 1)
                                                Color: =Color.White
                                                Height: |-
                                                  =

                                                  //If(Home.Size >1, Parent.TemplateHeight/2.5,Parent.TemplateHeight/3)
                                                  Parent.TemplateHeight-150
                                                Icon: =ThisItem.NavIcon
                                                OnSelect: =Select(Parent)
                                                Width: =Parent.TemplateWidth/2
                                                X: '=(Parent.TemplateWidth-Self.Width)/2 '
                                                Y: |-
                                                  =//If( Home.Size = 1, (ButtonGalleryBackgroundButton_1.Height-Self.Height)/1.2,(ButtonGalleryBackgroundButton_1.Height-Self.Height)/2)
                                                  (Home_Gallery_Background_Button.Height-Self.Height)/2
                                          - Home_Gallery_Html_Element:
                                              Control: HtmlViewer@2.1.0
                                              Properties:
                                                DisabledBorderColor: =RGBA(56, 56, 56, 1)
                                                DisplayMode: =DisplayMode.View
                                                Font: =Font.'Open Sans'
                                                Height: =175
                                                HtmlText: |-
                                                  =// you can use inline Css to create effects that can be found in modern webapps
                                                  //you cannot link style sheets
                                                  //some elements of html are not supported
                                                  //you can include variables in the html string by adding "&PowerAppsVar&" 
                                                  "<div style='box-shadow: 23px 21px 33px 8px rgba(0,0,0,.025);
                                                  -webkit-box-shadow: 23px 21px 33px 8px rgba(0,0,0,.025);
                                                  -moz-box-shadow: 23px 21px 33px 8px rgba(0,0,0,.025); height:"&Home_Gallery_Background_Button.Height-11&"px; width:"&Home_Gallery_Background_Button.Width-11&"px; border-style:none; border-radius:10px'></div>"
                                                OnSelect: =Select(Parent)
                                                Size: =11
                                                Width: =Parent.TemplateWidth
                                                X: =Home_Gallery_Background_Button.X
                                                Y: =25
                                          - Home_Overlap_Button:
                                              Control: Classic/Button@2.2.0
                                              Properties:
                                                BorderColor: =ColorFade(Self.Fill, -15%)
                                                Color: =RGBA(255, 255, 255, 1)
                                                DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                                Fill: =RGBA(255, 255, 255, 0)
                                                Font: =Font.'Open Sans'
                                                Height: =Home_Gallery_Background_Button.Height
                                                HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                                                HoverColor: =RGBA(255, 255, 255, 1)
                                                HoverFill: |+
                                                  =ColorFade(RGBA(105,105,105,.15),50%)
                                                OnSelect: =Navigate(ThisItem.ScreenToGoTo, ScreenTransition.Cover)
                                                PressedBorderColor: =Self.Fill
                                                PressedColor: =Self.Fill
                                                PressedFill: =ColorFade(RGBA(105,105,105,.35),-10%)
                                                Text: =""
                                                Width: =Home_Gallery_Background_Button.Width
                                                X: =Home_Gallery_Background_Button.X
                                                Y: |+
                                                  =Home_Gallery_Background_Button.Y
                                    - Home_Alerts_Container:
                                        Control: GroupContainer@1.4.0
                                        Variant: ManualLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Height: =Home_Alert_Gallery.Height
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Visible: =galleryVisible
                                          Width: =Parent.Width
                                        Children:
                                          - Home_Alert_Gallery:
                                              Control: Gallery@2.15.0
                                              Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver4.0
                                              Properties:
                                                BorderColor: =RGBA(0, 18, 107, 1)
                                                BorderThickness: =1
                                                DelayItemLoading: =false
                                                Fill: =RGBA(255, 255, 128, 1)
                                                Height: =If(CountRows(Home_Alert_Gallery.AllItems) *Home_Alert_Gallery.TemplateHeight > 400, 400,(CountRows(Home_Alert_Gallery.AllItems) *Home_Alert_Gallery.TemplateHeight))
                                                Items: |-
                                                  =//Filter takes a data source, then a logical expression to filter out the results
                                                  // like a query
                                                  Filter(Alerts, dateExpired >= Now() || dateExpired = Blank())
                                                LoadingSpinner: =LoadingSpinner.None
                                                TemplateSize: =35
                                                Visible: |-
                                                  =galleryVisible
                                                  //If(CountRows(Alerts_1) > 0, true, false)
                                                Width: =Parent.Width
                                                WrapCount: =0
                                              Children:
                                                - Home_Alert_Title:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Align: =Align.Center
                                                      BorderColor: =RGBA(0, 0, 0, 1)
                                                      Font: =Font.'Open Sans'
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =Parent.TemplateHeight
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =//Parent.TemplateHeight / 4
                                                      Size: =If(Home.Size =1,11,15)
                                                      Text: |-
                                                        =//ThisItem refers to an item in the list of items in the gallery
                                                        //each item has properties in this case we want the Title property to display
                                                        ThisItem.Title
                                                      Width: =Parent.Width
                                                - Home_Alert_Separator:
                                                    Control: Rectangle@2.3.0
                                                    Properties:
                                                      BorderColor: =RGBA(0, 18, 107, 1)
                                                      Fill: =RGBA(0, 18, 107, 1)
                                                      Height: =1
                                                      OnSelect: =Select(Parent)
                                                      Width: =Parent.TemplateWidth
                                                      Y: =Home_Alert_Title.Height+3
                                          - Home_Dismiss_Alert_Icon:
                                              Control: Classic/Icon@2.5.0
                                              Properties:
                                                AccessibleLabel: ="Close Alerts"
                                                BorderColor: =RGBA(0, 18, 107, 1)
                                                Color: =RGBA(0, 0, 0, 1)
                                                Height: =Home_Alert_Gallery.TemplateHeight
                                                Icon: =Icon.Cancel
                                                OnSelect: =Set(galleryVisible, false)
                                                PaddingBottom: =5
                                                PaddingLeft: =5
                                                PaddingRight: =5
                                                PaddingTop: =5
                                                Visible: =galleryVisible
                                                Width: =30
                                                X: =Parent.Width-Self.Width
                  - Home_Footer:
                      Control: GroupContainer@1.4.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255,255,255, 1)
                        FillPortions: =0
                        Height: |-
                          =//Parent.Height/8
                          60
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: |+
                          =//logical test, check if the screen size is the smallest, this means mobile
                          // if it is the footer becomes visible, it is invisible otherwise

                          Home.Size=1
                        Width: =Parent.Width
                      Children:
                        - Home_Mobile_Menu:
                            Control: CanvasComponent
                            ComponentName: compMobileMenu
                            Properties:
                              BackgroundMenuColor: =RGBA(227, 234, 243, 1)
                              ForegroundColor: |-
                                =//RGBA(70, 130, 180, 1)
                                ColorScheme.primary
                              Height: =Parent.Height
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              NavigationItems: |-
                                =// IF adimn or tech show this table, if not show Staff table
                                gblNavItems
                              SelectedItemBackground: =Color.LightGray
                              Width: =Parent.Width
      - Home_Web_Menu:
          Control: CanvasComponent
          ComponentName: compWebMenu
          Properties:
            ExpandMenu: =showMenu
            Fill: =Color.Transparent
            HamburgerColor: =Color.White
            Height: =If(showMenu, App.Height, 80)
            MenuItems: =gblNavItems
            Visible: =MyTickets.Size > 1
            Width: =If(showMenu, App.Width, 80)
      - Home_Feedback_Bug_Report:
          Control: CanvasComponent
          ComponentName: FeedbackBugReport
          Properties:
            CloseReport: =Set(varFeedback,false)
            DisablePickMedia: =Set(PickMedia,false)
            EnablePickMedia: =Set(PickMedia,true)
            FBSize: =Home.Size
            FeedbackCameraOff: =Set(FeedbackCamera,false);
            FeedbackCameraOn: =Set(FeedbackCamera,true);
            Height: =App.Height
            PhotoModeDisable: =Set(FeedbackPhoto,false)
            PhotoModeEnable: =Set(FeedbackPhoto,true)
            Visible: =varFeedback
            Width: =App.Width
