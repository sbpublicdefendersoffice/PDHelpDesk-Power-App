      - MyTicketsFilterMenu:
          Control: CanvasComponent
          ComponentName: compFilterTicketsMenu
          Properties:
            BackgroundColor: =ColorScheme.backgroundDark
            CheckAdmin: =!(App.ActiveScreen.Name = "MyTickets") || (App.ActiveScreen.Name = "MyTickets" && (userData.role = "admin" || userData.role = "tech"))
            CloseFilter: =Set(varFilterVisible, false)
            ColorOrange: =ColorScheme.orange
            FilterIconSize: |+
              =If(App.Width > 600, 50, 40)
            FilterVisible: =varFilterVisible
            FontSize: =If(App.Height - MyTicketsFilterMenu.HeightOffset > 340, 16, 13)
            Height: =If(MyTicketsFilterMenu.FilterVisible, MyTicketsFilterMenu.NewHeight, MyTicketsFilterMenu.FilterIconSize)
            HeightOffset: =MyTicketsHeaderContainer.Height + ((SearchFilterContainer.Height - MyTicketsFilterMenu.FilterIconSize) / 2)
            IconSize: =If(App.Height - MyTicketsFilterMenu.HeightOffset > 560, 40, 30)
            NewHeight: |-
              =If(
                  MyTicketsFilterMenu.CheckAdmin && App.ActiveScreen.Name = "MyTickets",
                  If(
                      App.Height - MyTicketsFilterMenu.HeightOffset > 560,
                      400,
                      320
                  ),
                  !MyTicketsFilterMenu.CheckAdmin && App.ActiveScreen.Name = "MyTickets",
                  150,
                  If(
                      App.Height - MyTicketsFilterMenu.HeightOffset > 560,
                      420,
                      320
                  )
              )
            OffColor: =ColorScheme.offColor
            OpenFilter: =Set(varFilterVisible, true)
            PrimaryColor: =ColorScheme.primary
            SecondaryColor: =ColorScheme.secondary
            SelectMonths: =1
            Visible: =App.Width > 600 || (App.Width <= 600 && !MyTicketsSearch.SearchVisible)
            Width: =If(MyTicketsFilterMenu.FilterVisible, If(App.Width > 600 && App.Height - MyTicketsFilterMenu.HeightOffset > 400, 220, 185), MyTicketsFilterMenu.FilterIconSize)
            X: =Parent.Width - Self.Width - If(App.Width > 500, 30, 10)
            Y: =MyTicketsHeaderContainer.Height + ((SearchFilterContainer.Height - MyTicketsFilterMenu.FilterIconSize) / 2)
