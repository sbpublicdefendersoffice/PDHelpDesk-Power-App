Screens:
  MyTickets:
    Properties:
      BackgroundImage: =PUBDEF_IT__LOGO_Vector
      Fill: =ColorScheme.screenBackground
      LoadingSpinner: |-
        =//LoadingSpinner.None
        LoadingSpinner.Controls
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Reset(MyTicketsGallery);
        Reset(MyTicketsFilterMenu);
        Reset(MyTicketsSearch);
    Children:
      - MyTicketsMainContainer:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - MyTicketsLayoutContainer:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - MyTicketsHeaderContainer:
                      Control: GroupContainer@1.4.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255,255,255,1)
                        FillPortions: =0
                        Height: =130
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: |-
                          =//MyTickets.Height / 8
                          82
                        LayoutMinWidth: =Parent.Width
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: |-
                          =//MyTickets.Size <> 1
                          true
                      Children:
                        - MyTicketsHeaderElements:
                            Control: GroupContainer@1.4.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - HomeBackgroundGradient_58:
                                  Control: HtmlViewer@2.1.0
                                  Properties:
                                    DisabledBorderColor: =RGBA(56, 56, 56, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =130
                                    HtmlText: =Home_Background_Gradient.HtmlText
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    Width: =Parent.Width
                              - HeaderLabel:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =Color.Transparent
                                    Font: =Font.'Open Sans'
                                    Height: =Parent.Height - MyTicketsWebHeader.Height
                                    Size: =If(MyTickets.Size = 1, titleText.mobileSize, titleText.desktopSize)
                                    Text: =MyTicketsFilterMenu.TicketsChoice
                                    Width: =Parent.Width
                                    Y: =MyTicketsWebHeader.Height
                              - MyTicketsWebHeader:
                                  Control: CanvasComponent
                                  ComponentName: compWebHeader
                                  Properties:
                                    BackgroundColor: =Color.Transparent
                                    CompScreenSize: =MyTickets.Size
                                    EnableFeedback: =Set(varFeedback,true)
                                    FeedbackBool: =varFeedback
                                    Height: =82
                                    Width: =App.Width
                  - MyTicketsMainContentContainer:
                      Control: GroupContainer@1.4.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =ColorScheme.screenBackgroundSeeThroughMid
                        FillPortions: =10
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =Parent.Height / 8 * 4
                        LayoutMinWidth: =Parent.Width
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - SearchFilterContainer:
                            Control: GroupContainer@1.4.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =ColorScheme.secondaryPressedColor
                              FillPortions: =0
                              Height: =60
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              LayoutMinHeight: =60
                              LayoutMinWidth: =Parent.Width
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - MyTicketsSearch:
                                  Control: CanvasComponent
                                  ComponentName: compSearchTickets
                                  Properties:
                                    BackgroundColor: =ColorScheme.backgroundDark
                                    CloseSearch: =Set(varSearchVisible, false)
                                    Height: =40
                                    IconSearchOpenNewX: =
                                    NewHintText: =
                                    OffColor: =ColorScheme.offColor
                                    OpenSearch: =Set(varSearchVisible, true)
                                    PrimaryColor: =ColorScheme.primary
                                    SearchVisible: =varSearchVisible
                                    SecondaryColor: =ColorScheme.secondary
                                    Width: =If(App.Width > 1200, 800, App.Width > 900, 600, App.Width > 600, App.Width * 0.65, App.Width - 40)
                                    X: =(Parent.Width - Self.Width) / 2
                                    Y: =(Parent.Height - Self.Height) / 2
                        - MyTicketsTicketsContainer:
                            Control: GroupContainer@1.4.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =8
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              LayoutMinHeight: =//Parent.Height / 5 * 4
                              LayoutMinWidth: =Parent.Width
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - MyTicketsGallery:
                                  Control: Gallery@2.15.0
                                  Variant: Vertical
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    DelayItemLoading: |-
                                      =//false
                                      true
                                    Height: =544
                                    Items: |-
                                      =// Filter for Sharepoint List
                                      // Uses SearchFilterTicketsSPListV2
                                      colTickets
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    LayoutMinHeight: =Parent.Height
                                    LoadingSpinner: =LoadingSpinner.Controls
                                    TemplatePadding: =10
                                    TemplateSize: =If(MyTickets.Size > 1, 250, 240)
                                    Transition: =Transition.Push
                                    Visible: =!IsEmpty(MyTicketsGallery.AllItems)
                                    Width: =1366
                                    WrapCount: =RoundDown((Parent.Width / Self.LayoutMinWidth), 0)
                                    Y: =224
                                  Children:
                                    - RectangleUnderneathCard:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderThickness: =25
                                          Fill: =RGBA(255, 255, 255, 1)
                                          Height: =ShadowBackground.Height
                                          OnSelect: =Select(Parent)
                                          Width: =ShadowBackground.Width
                                    - ShadowBackground:
                                        Control: Image@2.2.3
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Height: |-
                                            =//250
                                            Parent.TemplateHeight
                                          Image: "=\"data:image/svg+xml,\" & EncodeUrl(\r\n    \"<?xml version='1.0' encoding='UTF-8' standalone='no'?>\r\n<!DOCTYPE svg PUBLIC '-//W3C//DTD SVG 1.1//EN' 'http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd'>\r\n<svg version='1.1'\r\n    xmlns='http://www.w3.org/2000/svg'\r\n    xmlns:xlink='http://www.w3.org/1999/xlink' preserveAspectRatio='xMidYMid meet' viewBox='0 0 \" & Self.Width & \" \" & Self.Height & \"' width='\" & Self.Width & \"' height='\" & Self.Height & \"'>\r\n    <defs>\" &\r\n    // ----- Box for fill\r\n \"<path d='\" &\r\n // Upper left\r\n \"M\" & Max(5 * 3 - 0, 0) & \" \" & Max(5 * 3 - 0,0) &\r\n    // Upper right\r\n \"L\" & Self.Width - Max(5 * 3 + 0, 0) & \" \" & Max(5 * 3 - 0, 0) &\r\n    // Lower right\r\n \"L\" & Self.Width - Max(5 * 3 + 0, 0) & \" \" & Self.Height - Max(5 * 3 + 0, 0) &\r\n    // Lower left\r\n \"L\" & Max(5 * 3 - 0, 0) & \" \" & Self.Height - Max(5 * 3 + 0, 0) & \r\n \"Z' id='box' stroke='\" & \"#ff0000\" & \"' stroke-width='\" & 0 & \"'></path>\r\n    </defs>\r\n    <g>\r\n        <g>\r\n            <filter id='shadow' x='-20%' y='-20%' width='200%' height='200%' filterUnits='userSpaceOnUse' primitiveUnits='userSpaceOnUse'>\r\n                <feFlood></feFlood>\r\n                <feComposite in2='SourceAlpha' operator='in'></feComposite>\r\n                <feGaussianBlur stdDeviation='\" & 5 & \"'></feGaussianBlur>\r\n                <feOffset dx='\" & 0 & \"' dy='\" & 0 & \"' result='afterOffset'></feOffset>\r\n                <feFlood flood-color='\" & \"#000000\" & \"' flood-opacity='\" & Substitute(Text(0.5), \",\", \".\") & \"'></feFlood>\r\n                <feComposite in2='afterOffset' operator='in'></feComposite>\r\n                <feMorphology operator='dilate' radius='1'></feMorphology>\r\n                <feComposite in2='SourceAlpha' operator='out'></feComposite>\r\n            </filter>\" &\r\n            // ----- Box for shadow\r\n \"<path d='\" &\r\n // Upper left\r\n \"M\" & Max(5 * 3 - 0, 0) & \" \" & Max(5 * 3 - 0, 0) &\r\n    // Upper right\r\n \"L\" & Self.Width - Max(5 * 3 + 0, 0) & \" \" & Max(5 * 3 - 0, 0) &\r\n    // Lower right\r\n \"L\" & Self.Width - Max(5 * 3 + 0, 0) & \" \" & Self.Height - Max(5 * 3 + 0, 0) &\r\n    // Lower left\r\n \"L\" & Max(5 * 3 - 0, 0) & \" \" & Self.Height - Max(5 * 3 + 0, 0) & \r\n \"Z' id='Component1' filter='url(#shadow)'></path>\r\n        </g>\r\n        <use xlink:href='#box' opacity='1' fill='\" & \"#ffffff\" & \"' fill-opacity='\" & Substitute(Text(0), \",\", \".\") & \"'></use>\r\n    </g>\r\n    <g>\r\n        \" &\r\n        // ----- Edge\r\n If(\r\n        true,\r\n        Switch(\r\n            \"left\",\r\n            \"left\",// -- Position: left\r\n            \"<path d='\" &\r\n        // Upper left\r\n \"M\" & Max(5 * 3 - 0, 0) + 0 & \" \" & Max(5 * 3 - 0, 0) + 0 &\r\n        // Upper right\r\n \"L\" & Max(5 * 3 - 0, 0) + 0 + 8 & \" \" & Max(5 * 3 - 0, 0) + 0 &\r\n        // Lower right\r\n \"L\" & Max(5 * 3 - 0, 0) + 0 + 8 & \" \" & Self.Height - Max(5 * 3 + 0, 0) - 0 &\r\n        // Lower left\r\n \"L\" & Max(5 * 3 - 0, 0) + 0 & \" \" & Self.Height - Max(5 * 3 + 0, 0) - 0 & \r\n \"Z' id='box' stroke-width='0' fill='\" & \"#ffffff\" & \"'></path>\",\r\n             \"right\",// -- Position: right\r\n            \"<path d='\" &\r\n        // Upper left\r\n \"M\" & Self.Width - Max(5 * 3 + 0, 0) - 0 - 8 & \" \" & Max(5 * 3 - 0, 0) + 0 &\r\n        // Upper right\r\n \"L\" & Self.Width - Max(5 * 3 + 0, 0) - 0 & \" \" & Max(5 * 3 - 0, 0) + 0 &\r\n        // Lower right\r\n \"L\" & Self.Width - Max(5 * 3 + 0, 0) - 0 & \" \" & Self.Height - Max(5 * 3 + 0, 0) - 0 &\r\n        // Lower left\r\n \"L\" & Self.Width - Max(5 * 3 + 0, 0) - 0 - 8 & \" \" & Self.Height - Max(5 * 3 + 0, 0) - 0 & \r\n \"Z' id='box' stroke-width='0' fill='\" & \"#ffffff\" & \"'></path>\"\r\n           \r\n        )\r\n    ) & \"\r\n    </g>\r\n</svg>\"\r\n)"
                                          OnSelect: =Select(Parent)
                                          Width: |-
                                            =//329
                                            Parent.TemplateWidth
                                    - btnBkg:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =ColorFade(Self.Fill, -15%)
                                          Color: =RGBA(255, 255, 255, 1)
                                          DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                          Fill: =RGBA(255, 255, 255, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =Parent.TemplateHeight
                                          HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                                          HoverColor: =RGBA(255, 255, 255, 1)
                                          HoverFill: =Self.Fill
                                          OnSelect: =Select(Parent)
                                          PressedBorderColor: =Self.Fill
                                          PressedColor: =Self.Fill
                                          PressedFill: =Self.Fill
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Text: =""
                                          Visible: =false
                                          Width: =Parent.TemplateWidth
                                    - TitleLabel:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =54
                                          OnSelect: =Select(Parent)
                                          Size: =12
                                          Text: |-
                                            =//ThisItem.Title
                                            If(Len(ThisItem.Title)>60, Concatenate(Left(ThisItem.Title,60),"..."),ThisItem.Title)
                                          Width: =Parent.TemplateWidth - IdLabel.Width - 47
                                          X: =24
                                          Y: =27
                                    - DescriptionLabel:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =37
                                          OnSelect: =Select(Parent)
                                          Overflow: =Overflow.Scroll
                                          Size: =10
                                          Text: |-
                                            =//ThisItem.Description
                                            If(Len(ThisItem.Description)>40, Concatenate(Left(PlainText(ThisItem.Description),40),"..."),PlainText(ThisItem.Description))
                                          Width: =Parent.TemplateWidth - 48
                                          Wrap: =false
                                          X: =24
                                          Y: =TitleLabel.Y + TitleLabel.Height
                                    - IdLabel:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =Color.Black
                                          Fill: =Color.Transparent
                                          Font: =Font.'Open Sans'
                                          Height: =34
                                          OnSelect: =Select(Parent)
                                          Text: =ThisItem.ID
                                          Width: =74
                                          X: =Parent.TemplateWidth - Self.Width - 23
                                          Y: =27
                                    - DateCreatedLabel:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =34
                                          OnSelect: =Select(Parent)
                                          PaddingLeft: =If(Len(DateCreatedLabel.Text) <= 9, 5,0)
                                          PaddingRight: =If(Len(DateCreatedLabel.Text) <= 9, 5,0)
                                          Size: =10
                                          Text: =DateValue(ThisItem.DateCreated)
                                          Width: =75
                                          X: =Parent.TemplateWidth - Self.Width - 23
                                          Y: =((Parent.TemplateHeight - Self.Height) / 2) + 30
                                    - PersonImage:
                                        Control: Image@2.2.3
                                        Group: Assignee Group
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Height: =40
                                          Image: |-
                                            =// Get assignee's profile pic if they have one
                                            // Sharepoint
                                            If(!IsBlank(LookUp(Users, ID = ThisItem.AssignedTo, email)) && Office365Users.UserPhotoMetadata(LookUp(Users, ID = ThisItem.AssignedTo, email)).HasPhoto, Office365Users.UserPhotoV2(LookUp(Users, ID = ThisItem.AssignedTo, email)), 'blank-profile-pic')
                                          ImagePosition: =ImagePosition.Fill
                                          RadiusBottomLeft: =256
                                          RadiusBottomRight: =256
                                          RadiusTopLeft: =256
                                          RadiusTopRight: =256
                                          Visible: =userData.role = "admin" || userData.role = "tech" || (userData.role = "staff" && !(IsBlank(ThisItem.AssignedTo) || ThisItem.AssignedTo = 0))
                                          Width: =40
                                          X: =24
                                          Y: =Parent.TemplateHeight - Self.Height - 27
                                    - AssigneeLabel:
                                        Control: Label@2.5.1
                                        Group: Assignee Group
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =41
                                          OnSelect: =Select(Parent)
                                          Text: |-
                                            =// Sharepoint
                                            If(IsBlank(ThisItem.AssignedTo) || ThisItem.AssignedTo = 0, "Unassigned", LookUp(Users, ID = ThisItem.AssignedTo, fullName))
                                          Visible: =userData.role = "admin" || userData.role = "tech" || (userData.role = "staff" && !(IsBlank(ThisItem.AssignedTo) || ThisItem.AssignedTo = 0))
                                          Width: =Parent.TemplateWidth - PersonImage.Width - StatusLabel.Width - StatusColor.Width - 47
                                          X: =PersonImage.X + PersonImage.Width
                                          Y: =Parent.TemplateHeight - Self.Height - 27
                                    - StatusColor:
                                        Control: Rectangle@2.3.0
                                        Group: Status Group
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          DisplayMode: =DisplayMode.View
                                          Fill: |-
                                            =Switch(
                                                ThisItem.Status,
                                                "open", RGBA(0, 127, 187, 1),
                                                "closed", RGBA(221, 79, 14, 1)
                                            )
                                          Height: =41
                                          OnSelect: =Select(Parent)
                                          Width: =9
                                          X: =StatusLabel.X - Self.Width
                                          Y: =Parent.TemplateHeight - Self.Height - 27
                                    - StatusLabel:
                                        Control: Label@2.5.1
                                        Group: Status Group
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: |-
                                            =Switch(
                                                ThisItem.Status,
                                                "open", RGBA(0, 127, 187, 1),
                                                "closed", RGBA(221, 79, 14, 1)
                                            )
                                          DisplayMode: =DisplayMode.View
                                          Fill: =RGBA(241, 244, 249, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =41
                                          OnSelect: =Select(Parent)
                                          Text: |-
                                            =// Sharepoint
                                            ThisItem.Status
                                          Width: =65
                                          X: =Parent.TemplateWidth - Self.Width - 23
                                          Y: =Parent.TemplateHeight - Self.Height - 27
                                    - CategoryLabelText:
                                        Control: Label@2.5.1
                                        Group: Category Group
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =34
                                          OnSelect: =Select(Parent)
                                          Size: =10
                                          Text: ="Category"
                                          Width: =67
                                          X: =24
                                          Y: |+
                                            =((Parent.TemplateHeight - Self.Height) / 2) + 30
                                    - CategoryLabelText_1:
                                        Control: Label@2.5.1
                                        Group: Category Group
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =34
                                          OnSelect: =Select(Parent)
                                          Size: =10
                                          Text: |-
                                            =// Sharepoint
                                            LookUp(Category, ID = ThisItem.MainCategory, Name)
                                          Width: =Parent.TemplateWidth - CategoryLabelText.Width - DateCreatedLabel.Width - 47
                                          Wrap: =false
                                          X: =CategoryLabelText.X + CategoryLabelText.Width
                                          Y: |+
                                            =((Parent.TemplateHeight - Self.Height) / 2) + 30
                                    - btnTemplate:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =ColorFade(Self.Fill, -15%)
                                          BorderThickness: =0
                                          Color: =RGBA(255, 255, 255, 1)
                                          DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                          Fill: =Color.Transparent
                                          Font: =Font.'Open Sans'
                                          Height: =Parent.TemplateHeight
                                          HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                                          HoverColor: =RGBA(255, 255, 255, 1)
                                          HoverFill: =Self.Fill
                                          OnSelect: |-
                                            =// Sharepoint List
                                            // go to single ticket info, pass in ticket record as a variable
                                            Navigate('Single Ticket Info', ScreenTransition.Fade, {ticketInfo: ThisItem})
                                          PressedBorderColor: =Self.Fill
                                          PressedColor: =Self.Fill
                                          PressedFill: =Self.Fill
                                          Text: =""
                                          Width: =Parent.TemplateWidth
                                          X: =(Parent.TemplateWidth - Self.Width) / 2
                                          Y: =(Parent.TemplateHeight - Self.Height) / 2
                                    - Rectangle29:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Fill: =If(ThisItem.Status="open",Switch(DateDiff(ThisItem.DateCreated,Now()),0,RGBA(151, 0, 0, 0),1,RGBA(232,244,140,1),2,RGBA(255,203,164,1),3,RGBA(255,105,97,1),RGBA(139,0,0,1)),Color.Transparent)
                                          Height: =IdLabel.Y
                                          OnSelect: =Select(Parent)
                                          Width: =15
                                          X: =IdLabel.X
                                          Y: =31
                              - EmptyState:
                                  Control: GroupContainer@1.4.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =544
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =10
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    LayoutMinHeight: =Parent.Height
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Visible: =IsEmpty(MyTicketsGallery.AllItems)
                                    Width: =1366
                                    Y: =224
                                  Children:
                                    - NoTicketsLabel:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          AlignInContainer: =AlignInContainer.Stretch
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Font: =Font.'Open Sans'
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          Size: |+
                                            =If(MyTickets.Size > 2, 32, 28)
                                          Text: ="No Tickets Found"
                                    - Button4_1:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =ColorFade(Self.Fill, -15%)
                                          Color: =RGBA(255, 255, 255, 1)
                                          DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                          Fill: |-
                                            =//RGBA(118, 173, 149, 1)
                                            ColorScheme.secondary
                                          Font: =Font.'Open Sans'
                                          HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                                          HoverColor: =RGBA(0, 0, 0, 1)
                                          HoverFill: |-
                                            =//ColorFade(RGBA(56, 96, 178, 1), -20%)
                                            ColorScheme.secondaryPressedColor
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          OnSelect: =Navigate('Category Select', ScreenTransition.Fade);
                                          PressedBorderColor: =Self.Fill
                                          PressedColor: =Self.Fill
                                          PressedFill: =Self.Color
                                          Text: ="New Ticket"
                                          Visible: |-
                                            =//Button should only appears when user is not viewing their assigned tickets
                                            IsEmpty(MyTicketsGallery.AllItems) && MyTicketsFilterMenu.TicketsChoice = "My Tickets" && StatusChoice = "open" && MyTickets.Size > 1
                                          X: =1150
                                          Y: =99
                                    - NewTicketIcon_1:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: |-
                                            =//RGBA(232, 244, 217, 1)
                                            ColorScheme.secondary
                                          Height: =50
                                          HoverColor: |-
                                            =//ColorFade(Self.Color, 20%)
                                            ColorScheme.secondaryPressedColor
                                          Icon: =Icon.Add
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          OnSelect: =Navigate('Category Select', ScreenTransition.Fade);
                                          Visible: =IsEmpty(MyTicketsGallery.AllItems) && MyTicketsFilterMenu.TicketsChoice = "My Tickets" && StatusChoice = "open" && MyTickets.Size = 1
                                          Width: =50
