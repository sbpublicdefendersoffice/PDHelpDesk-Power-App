      - RIHtmlText:
          Control: HtmlViewer@2.1.0
          Properties:
            Font: =Font.'Open Sans'
            Height: =433
            HtmlText: "=\"<table style='border-style: double ; width:100% '>\n    <tr>\n    <td>\n        <Table style='width:100%'>\n        <tr>\n        <th style='border-bottom-style: solid;'>\n	<div style='font-size: 24px; font-family:Helvetica; font-weight: bold ; text-align: center'>\n	This Email Has Been Sent From The Automated HelpDesk System. DO NOT RESPOND TO THIS EMAIL!\n	</div>\n	<br>\n	<div style='text-align:center;'>\n	The Purchase Request has now been viewed, below you will find the current progress of the request.\n	</div>\n        </th>\n        </tr>\n        <tr>\n        <td style='font-family: Arial; font-size: 24px; font-weight: bold; text-align: center; border-bottom-style: dashed; '>\n	<div>\n	Purchase Request\n        </tr>\n        </td>\n        <tr>\n        <td style='font-family: monospace; font-size: 20px '>\n        <div style='border:1px solid #ccc; border-radius:8px; padding:20px; max-width:100%; background:#fff;'>\n\n    <!---- Step labels -->\n    <div style='display:flex; justify-content:space-between; font-size:14px; margin-bottom:10px;'>\n      <span style='flex:1; text-align:center;'>New Request</span>\n      <span style='flex:1; text-align:center;'>Request Viewed</span>\n      <span style='flex:1; text-align:center;'>Reviewing Items</span>\n      <span style='flex:1; text-align:center;'>Waiting For Receipts</span>\n      <span style='flex:1; text-align:center;'>Complete</span>\n    </div>\n\n    <!---- Track bar -->\n    <div style='position:relative; height:8px; background:#e0e0e0; border-radius:4px;'>\n      <!---- FILLED WIDTH: edit the % to match overall progress ---->\n      <div style='width:50%; height:100%; background:#355989; border-radius:4px; transition:width .3s;'></div>\n\n      <!---- STEP DOTS: change background / border colors to mark completed (+) current step ---->\n      <span style='position:absolute; top:50%; left:0%;   transform:translate(-50%,-50%); width:16px; height:16px; border-radius:50%; background:#355989; border:2px solid #fff;'></span>\n      <span style='position:absolute; top:50%; left:25%;  transform:translate(-50%,-50%); width:16px; height:16px; border-radius:50%; background:#355989; border:2px solid #fff;'></span>\n      <span style='position:absolute; top:50%; left:50%;  transform:translate(-50%,-50%); width:16px; height:16px; border-radius:50%; background:#fff;    border:2px solid #355989;'></span> <!-- current -->\n      <span style='position:absolute; top:50%; left:75%;  transform:translate(-50%,-50%); width:16px; height:16px; border-radius:50%; background:#fff;    border:2px solid #e0e0e0;'></span>\n      <span style='position:absolute; top:50%; left:100%; transform:translate(-50%,-50%); width:16px; height:16px; border-radius:50%; background:#fff;    border:2px solid #e0e0e0;'></span>\n    </div>\n\n    <!---- Percentage read-out -->\n    <p style='text-align:right; margin-top:10px; font-size:14px;'>\n      <strong>50%</strong> complete\n    </p>\n  </div>\n        </tr>\n        </td>\n\n        <br>\n\n        <tr>\n        <td>\n        Request Items are being Reviewed, as the process continues the tracker will reflect the stage the request is in along with providing email updates.\n        </tr>\n        </td>\n    \n	</div>\n        </td>\n        </tr>\n    </td>\n    </tr>\n    </Table>\n</table>\""
            Visible: =false
            Width: =1043
            X: =69
            Y: =210
