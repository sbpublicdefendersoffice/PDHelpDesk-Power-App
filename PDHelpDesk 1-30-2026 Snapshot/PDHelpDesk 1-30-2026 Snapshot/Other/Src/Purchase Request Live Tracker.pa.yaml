Screens:
  Purchase Request Live Tracker:
    Properties:
      BackgroundImage: =PUBDEF_IT__LOGO_Vector
      Fill: =ColorScheme.screenBackground
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |+
        =//Clear the collections
        Clear(RTEImages);
        Clear(JointAttachments);
        Clear(attItems);
        Set(CurrentState,Blank());
        Set(PurchaseID,PRID);
        UpdateContext({ActivePR:LookUp('Purchase Requests',ID=PurchaseID)});
        Set(CurrentPR,LookUp('Purchase Requests',ID = PurchaseID));
        //Tracker states
        ClearCollect(LiveTrackerStates,
        {
            StateNo:1,
            StateText:"Purchase Request Created"
        },
        {
            StateNo:2,
            StateText:"Purchase Request Viewed"
        },
        {
            StateNo:3,
            StateText:"Reviewing Items"
        },
        {
            StateNo:4,
            StateText:"Waiting For Receipts"
        },
        {
            StateNo:5,
            StateText:"Purchase Request Complete"
        });
        //Check tracker state
        If(ActivePR.Status.Value="Not Started", Set(CurrentState,LookUp(LiveTrackerStates,StateNo=1)));
        If(ActivePR.Status.Value="Viewed", Set(CurrentState,LookUp(LiveTrackerStates,StateNo=2)));
        If(ActivePR.Status.Value="Reviewing Items", Set(CurrentState,LookUp(LiveTrackerStates,StateNo=3)));
        If(ActivePR.Status.Value="Waiting For Receipts", Set(CurrentState,LookUp(LiveTrackerStates,StateNo=4)));
        If(ActivePR.Status.Value="Complete", Set(CurrentState,LookUp(LiveTrackerStates,StateNo=5)));
