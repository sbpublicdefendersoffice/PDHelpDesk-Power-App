            OnSelect: "=Refresh('Purchase Requests');\r\nRefresh('Purchase Request Items');\r\nUpdateContext({ActivePR:LookUp('Purchase Requests',ID=PurchaseID)});\r\n\r\n//Check tracker state\r\nIf(ActivePR.Viewed = false And CountRows(Filter('Purchase Request Items',PRId = ActivePR.ID And Viewed = false))>0 , Set(CurrentState,LookUp(LiveTrackerStates,StateNo=1)));\r\nIf(ActivePR.Viewed = true And CountRows(Filter('Purchase Request Items',PRId = ActivePR.ID And Viewed = false))>0 , Set(CurrentState,LookUp(LiveTrackerStates,StateNo=2)));\r\nIf(ActivePR.Viewed = true And CountRows(Filter('Purchase Request Items',PRId = ActivePR.ID And Viewed = true))>0 , Set(CurrentState,LookUp(LiveTrackerStates,StateNo=3)));\r\nIf(ActivePR.Viewed = true And IsEmpty(Filter('Purchase Request Items',PRId = ActivePR.ID And Viewed = false)) And IsEmpty(ActivePR.Attachments) , Set(CurrentState,LookUp(LiveTrackerStates,StateNo=4)));\r\nIf(ActivePR.Viewed = true And IsEmpty(Filter('Purchase Request Items',PRId = ActivePR.ID And Viewed = false)) And !IsEmpty(ActivePR.Attachments) , Set(CurrentState,LookUp(LiveTrackerStates,StateNo=5))); "
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="Refresh"
