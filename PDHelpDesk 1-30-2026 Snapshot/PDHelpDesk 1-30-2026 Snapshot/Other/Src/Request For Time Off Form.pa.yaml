Screens:
  Request For Time Off Form:
    Properties:
      Fill: =ColorScheme.screenBackground
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnHidden: |-
        =
        UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
      OnVisible: |-
        =
        UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
        Set(TicketCategoryID,2);
        Set(TicketSubCategoryID,3);
        ResetForm(RFTOForm);
        ClearCollect(leaveCodes,
        {
            Code:"ADM"    
        }
        ,
        {
            Code:"ALN"
        }
        ,
        {
            Code:"VAC"
        }
        ,
        {
            Code:"COMP"
        }
        ,
        {
            Code:"TRNG"
        }
        );
        ClearCollect(RTFOSupervisors,
        {
            RevFullName: "Budwani, Deepak"
        }
        ,
        {
            RevFullName: "Kyle-Griffiths, La Mer"
        }
        );
    Children:
      - RFTOContainer:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - RFTOHeaderContainer:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =ColorScheme.primary
                  FillPortions: =0
                  Height: =130
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - RFTOWebHeader:
                      Control: CanvasComponent
                      ComponentName: compWebHeader
                      Properties:
                        BackgroundColor: =ColorScheme.primary
                        CompScreenSize: ='Request For Time Off Form'.Size
                        EnableFeedback: =Set(varFeedback,true)
                        FeedbackBool: =varFeedback
                        Height: =82
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        Width: =App.Width
                  - RFTOLabel:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =Color.White
                        Fill: =ColorScheme.primary
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        Height: =48
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        Size: =If('Request For Time Off Form'.Size=1, titleText.mobileSize, titleText.desktopSize)
                        Text: ="Request For Time Off Form"
                        Width: =Parent.Width
            - RFTOMainSection:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - RFTOForm:
                      Control: Form@2.4.4
                      Variant: Classic
                      Layout: Vertical
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =RGBA(0, 18, 107, 1)
                        DataSource: =Tickets
                        DefaultMode: =FormMode.New
                        Height: =Parent.Height/1.21
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        NumberOfColumns: =1
                        Width: =Parent.Width
                        Y: =Parent.Height/5.7
                      Children:
                        - RFTO_Title_DataCard:
                            Control: TypedDataCard@1.0.7
                            Variant: ClassicTextualEdit
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              DataField: ="title"
                              Default: =ThisItem.Title
                              DisplayName: =//DataSourceInfo([@Tickets],DataSourceInfo.DisplayName, "field_2")
                              Height: =100
                              MaxLength: =//DataSourceInfo([@Tickets], DataSourceInfo.MaxLength, "field_2")
                              Required: =false
                              Width: =1366
                              WidthFit: =true
                              X: =0
                              Y: =0
                            Children:
                              - RFTOTitleError:
                                  Control: Label@2.5.1
                                  MetadataKey: ErrorMessage
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =RGBA(168, 0, 0, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =10
                                    Live: =Live.Assertive
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: =Parent.Error
                                    Visible: =Parent.DisplayMode=DisplayMode.Edit
                                    Width: =Parent.Width - 60
                                    X: =30
                                    Y: =RFTOTitleInput.Y + RFTOTitleInput.Height
                              - RFTOStarVisible:
                                  Control: Label@2.5.1
                                  MetadataKey: FieldRequired
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =RFTOTitle.Color
                                    Font: =Font.'Open Sans'
                                    Height: =RFTOTitle.Height
                                    Text: ="*"
                                    Width: =30
                                    Wrap: =false
                                    Y: =RFTOTitle.Y
                              - RFTOTitleInput:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Default: =Concatenate("Request For Time Off ",Upper(userData.fullName))
                                    Font: =Font.'Open Sans'
                                    Height: =Parent.Height/3.5
                                    HoverBorderColor: =RGBA(0, 18, 107, 1)
                                    HoverFill: =RGBA(186, 202, 226, 1)
                                    Width: =Parent.Width/1.15
                                    X: =30
                                    Y: =44
                              - RFTOTitle:
                                  Control: Label@2.5.1
                                  MetadataKey: FieldName
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =If( CreateTicketTitle= "Title" || !IsBlank(RFTOTitleInput.Text), RGBA(0, 18, 107, 1), Color.Red)
                                    Font: =Font.'Open Sans'
                                    Height: =34
                                    Text: =CreateTicketTitle
                                    Width: =Parent.Width - 60
                                    Wrap: =false
                                    X: =30
                                    Y: =10
                        - RFTO_MainCategory_DataCard:
                            Control: TypedDataCard@1.0.7
                            Variant: ClassicNumberEdit
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              DataField: ="mainCategory"
                              Default: =ThisItem.mainCategory
                              DisplayName: =DataSourceInfo([@Tickets],DataSourceInfo.DisplayName, Name)
                              Height: =If( 'eDefender Adding/Coding Items TT'.Size = 1, Parent.Height/7, Parent.Height/5)
                              Required: =true
                              Visible: =false
                              Width: =1366
                              WidthFit: =true
                              X: =0
                              Y: =1
                            Children:
                              - RFTOMainCategoryError:
                                  Control: Label@2.5.1
                                  MetadataKey: ErrorMessage
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =RGBA(168, 0, 0, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =10
                                    Live: =Live.Assertive
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: =Parent.Error
                                    Visible: =Parent.DisplayMode=DisplayMode.Edit
                                    Width: =Parent.Width - 60
                                    X: =30
                                    Y: =RFTOMainCategoryDropdown.Y + RFTOMainCategoryDropdown.Height
                              - RFTOMainCategoryStarVisible:
                                  Control: Label@2.5.1
                                  MetadataKey: FieldRequired
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =RFTOMainCategoryLabel.Height
                                    Text: ="*"
                                    Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                                    Width: =30
                                    Wrap: =false
                                    Y: =RFTOMainCategoryLabel.Y
                              - RFTOMainCategoryDropdown:
                                  Control: Classic/DropDown@2.3.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    ChevronBackground: =RGBA(56, 96, 178, 1)
                                    ChevronFill: =RGBA(255, 255, 255, 1)
                                    ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                    ChevronHoverFill: =RGBA(255, 255, 255, 1)
                                    Default: =LookUp(Category, ID = TicketCategoryID, Name)
                                    Font: =Font.'Open Sans'
                                    Height: =Parent.Height/3.5
                                    HoverFill: =RGBA(186, 202, 226, 1)
                                    Items: =(If(is_admin, Filter(Category, parentId = Blank()), Filter(Category, parentId = Blank(),technicianOnly=0)))
                                    Items.Value: =Title
                                    PressedColor: =RGBA(255, 255, 255, 1)
                                    PressedFill: =RGBA(0, 18, 107, 1)
                                    SelectionColor: =RGBA(255, 255, 255, 1)
                                    SelectionFill: =RGBA(56, 96, 178, 1)
                                    Width: =Parent.Width/1.05
                                    X: =30
                                    Y: =44
                              - RFTOMainCategoryLabel:
                                  Control: Label@2.5.1
                                  MetadataKey: FieldName
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =34
                                    Text: ="Category"
                                    Width: =Parent.Width - 60
                                    Wrap: =false
                                    X: =30
                                    Y: =10
                        - RFTO_SubCategory_DataCard:
                            Control: TypedDataCard@1.0.7
                            Variant: ClassicNumberEdit
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              DataField: ="category"
                              Default: =ThisItem.category
                              DisplayName: =DataSourceInfo([@Tickets],DataSourceInfo.DisplayName,Name)
                              Height: =If( 'eDefender Adding/Coding Items TT'.Size = 1, Parent.Height/7, Parent.Height/5)
                              Required: =true
                              Visible: =false
                              Width: =1366
                              WidthFit: =true
                              X: =0
                              Y: =2
                            Children:
                              - RFTOSubCategoryError:
                                  Control: Label@2.5.1
                                  MetadataKey: ErrorMessage
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =RGBA(168, 0, 0, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =10
                                    Live: =Live.Assertive
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: =Parent.Error
                                    Visible: =Parent.DisplayMode=DisplayMode.Edit
                                    Width: =Parent.Width - 60
                                    X: =30
                                    Y: =RFTOSubCategoryDropdown.Y + RFTOSubCategoryDropdown.Height
                              - RFTOSubCategoryVisible:
                                  Control: Label@2.5.1
                                  MetadataKey: FieldRequired
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =RFTOSubCategoryLabel.Height
                                    Text: ="*"
                                    Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                                    Width: =30
                                    Wrap: =false
                                    Y: =RFTOSubCategoryLabel.Y
                              - RFTOSubCategoryDropdown:
                                  Control: Classic/DropDown@2.3.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    ChevronBackground: =RGBA(56, 96, 178, 1)
                                    ChevronFill: =RGBA(255, 255, 255, 1)
                                    ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                    ChevronHoverFill: =RGBA(255, 255, 255, 1)
                                    Default: |+
                                      =LookUp(Category, ID = TicketSubCategoryID, Name)
                                    Font: =Font.'Open Sans'
                                    Height: =Parent.Height/3.5
                                    HoverFill: =RGBA(186, 202, 226, 1)
                                    Items: |+
                                      =Filter(Category, parentId = RFTOMainCategoryDropdown.Selected.ID)
                                    Items.Value: =Title
                                    PressedColor: =RGBA(255, 255, 255, 1)
                                    PressedFill: =RGBA(0, 18, 107, 1)
                                    SelectionColor: =RGBA(255, 255, 255, 1)
                                    SelectionFill: =RGBA(56, 96, 178, 1)
                                    Width: =Parent.Width/1.05
                                    X: =30
                                    Y: =44
                              - RFTOSubCategoryLabel:
                                  Control: Label@2.5.1
                                  MetadataKey: FieldName
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =34
                                    Text: ="Sub Category"
                                    Width: =Parent.Width - 60
                                    Wrap: =false
                                    X: =30
                                    Y: =10
                        - RFTOLocationID_DataCard:
                            Control: TypedDataCard@1.0.7
                            Variant: ClassicNumberEdit
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              DataField: ="locationId"
                              Default: =ThisItem.locationId
                              DisplayName: =DataSourceInfo([@Tickets],DataSourceInfo.DisplayName,Name)
                              Height: =100
                              Required: =false
                              Update: =//Value(DataCardValue6.Text)
                              Width: =1366
                              WidthFit: =true
                              X: =0
                              Y: =3
                            Children:
                              - RFTOSubCategoryErrorMessage:
                                  Control: Label@2.5.1
                                  MetadataKey: ErrorMessage
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =RGBA(168, 0, 0, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =10
                                    Live: =Live.Assertive
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: =Parent.Error
                                    Visible: =Parent.DisplayMode=DisplayMode.Edit
                                    Width: =Parent.Width - 60
                                    X: =30
                                    Y: =RFTOLocationIDDropdown.Y + RFTOLocationIDDropdown.Height
                              - RFTOLocationIDStarVisible:
                                  Control: Label@2.5.1
                                  MetadataKey: FieldRequired
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =RFTOLocationIDLabel.Height
                                    Text: ="*"
                                    Width: =30
                                    Wrap: =false
                                    Y: =RFTOLocationIDLabel.Y
                              - RFTOLocationIDDropdown:
                                  Control: Classic/DropDown@2.3.1
                                  Properties:
                                    AllowEmptySelection: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    ChevronBackground: =RGBA(56, 96, 178, 1)
                                    ChevronFill: =RGBA(255, 255, 255, 1)
                                    ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                    ChevronHoverFill: =RGBA(255, 255, 255, 1)
                                    Default: =Blank()
                                    Font: =Font.'Open Sans'
                                    Height: =Parent.Height/3.5
                                    HoverFill: =RGBA(186, 202, 226, 1)
                                    Items: =Locations
                                    Items.Value: =Title
                                    PressedColor: =RGBA(255, 255, 255, 1)
                                    PressedFill: =RGBA(0, 18, 107, 1)
                                    SelectionColor: =RGBA(255, 255, 255, 1)
                                    SelectionFill: =RGBA(56, 96, 178, 1)
                                    Width: =RFTOTitleInput.Width
                                    X: =30
                                    Y: =44
                              - RFTOLocationIDLabel:
                                  Control: Label@2.5.1
                                  MetadataKey: FieldName
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =34
                                    Text: ="Location"
                                    Width: =Parent.Width - 60
                                    Wrap: =false
                                    X: =30
                                    Y: =10
                        - RFTOExclusiveFields_ DataCard:
                            Control: TypedDataCard@1.0.7
                            Variant: BlankCard
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Height: =368
                              Width: =1366
                              WidthFit: =true
                              X: =0
                              Y: =4
                            Children:
                              - RFTOSupervisorDropdown:
                                  Control: Classic/DropDown@2.3.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    ChevronBackground: =RGBA(56, 96, 178, 1)
                                    ChevronFill: =RGBA(255, 255, 255, 1)
                                    ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                    ChevronHoverFill: =RGBA(255, 255, 255, 1)
                                    Default: =1
                                    Font: =Font.'Open Sans'
                                    Height: =28
                                    HoverFill: =RGBA(186, 202, 226, 1)
                                    Items: =RTFOSupervisors
                                    Items.Value: =RevFullName
                                    PressedColor: =RGBA(255, 255, 255, 1)
                                    PressedFill: =RGBA(0, 18, 107, 1)
                                    SelectionColor: =RGBA(255, 255, 255, 1)
                                    SelectionFill: =RGBA(56, 96, 178, 1)
                                    Width: =268
                                    X: =(Parent.Width-Self.Width)/2
                                    Y: =RFTOApprovedCheckBox.Y+RFTOApprovedCheckBox.Height+20
                              - RFTODeniedCheckBox:
                                  Control: Classic/CheckBox@2.1.0
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    CheckboxBorderColor: =RGBA(0, 18, 107, 1)
                                    CheckmarkFill: =RGBA(0, 0, 0, 1)
                                    Font: =Font.'Open Sans'
                                    HoverColor: =RGBA(0, 18, 107, 1)
                                    Text: ="Denied"
                                    X: =178
                                    Y: =RFTOApprovedCheckBox.Y
                              - RFTOApprovedCheckBox:
                                  Control: Classic/CheckBox@2.1.0
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    CheckboxBorderColor: =RGBA(0, 18, 107, 1)
                                    CheckmarkFill: =RGBA(0, 0, 0, 1)
                                    Font: =Font.'Open Sans'
                                    HoverColor: =RGBA(0, 18, 107, 1)
                                    Text: ="Approved"
                                    X: =28
                                    Y: =RFTOAdditionalCommentsInput.Y+RFTOAdditionalCommentsInput.Height
                              - RFTOLeaveCodeDropdown:
                                  Control: Classic/DropDown@2.3.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    ChevronBackground: =RGBA(56, 96, 178, 1)
                                    ChevronFill: =RGBA(255, 255, 255, 1)
                                    ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                    ChevronHoverFill: =RGBA(255, 255, 255, 1)
                                    Default: =1
                                    Font: =Font.'Open Sans'
                                    Height: =RFTOTitle.Height
                                    HoverFill: =RGBA(186, 202, 226, 1)
                                    Items: =leaveCodes
                                    Items.Value: =Code
                                    PressedColor: =RGBA(255, 255, 255, 1)
                                    PressedFill: =RGBA(0, 18, 107, 1)
                                    SelectionColor: =RGBA(255, 255, 255, 1)
                                    SelectionFill: =RGBA(56, 96, 178, 1)
                                    Width: =If('Request For Time Off Form'.Size=1,Parent.Width/1.15,Parent.Width/5)
                                    X: =If('Request For Time Off Form'.Size=1, RFTONumberOfDaysInput.X,RFTONumberOfHoursInput.X+RFTONumberOfHoursInput.Width)
                                    Y: =If('Request For Time Off Form'.Size=1, RFTONumberOfHoursInput.Y+RFTONumberOfHoursInput.Height+30 ,44)
                              - RFTOLeaveCodeLabel:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =30
                                    Text: ="Leave Code"
                                    X: =RFTOLeaveCodeDropdown.X
                                    Y: =RFTOLeaveCodeDropdown.Y-Self.Height
                              - RFTOAdditionalCommentsInput:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Default: =
                                    Font: =Font.'Open Sans'
                                    Height: =100
                                    HintText: ="Add your comments"
                                    HoverBorderColor: =RGBA(0, 18, 107, 1)
                                    HoverFill: =RGBA(186, 202, 226, 1)
                                    Mode: =TextMode.MultiLine
                                    Width: =RFTOTitleInput.Width
                                    X: =28
                                    Y: =RFTOLeaveCodeDropdown.Y+RFTOLeaveCodeDropdown.Height+30
                              - RFTOAdditonalCommentsLabel:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =30
                                    Text: ="Additonal Comments"
                                    Width: =185
                                    X: =RFTOAdditionalCommentsInput.X
                                    Y: =RFTOAdditionalCommentsInput.Y-Self.Height
                              - RFTONumberOfHoursInput:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Default: =
                                    Font: =Font.'Open Sans'
                                    Format: =TextFormat.Number
                                    Height: =RFTOTitle.Height
                                    HintText: ="Enter Hours"
                                    HoverBorderColor: =RGBA(0, 18, 107, 1)
                                    HoverFill: =RGBA(186, 202, 226, 1)
                                    Width: =If('Request For Time Off Form'.Size=1,Parent.Width/1.15,Parent.Width/7.5)
                                    X: =If('Request For Time Off Form'.Size=1,RFTONumberOfDaysInput.X,RFTOEndingDayPicker.X+RFTOEndingDayPicker.Width)
                                    Y: =If('Request For Time Off Form'.Size=1, RFTOEndingDayPicker.Y+RFTOEndingDayPicker.Height+30 ,44)
                              - RFTONumberOfHoursLabel:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =30
                                    Text: ="# of hours"
                                    X: =RFTONumberOfHoursInput.X
                                    Y: =RFTONumberOfHoursInput.Y-Self.Height
                              - RFTOEndingDayPicker:
                                  Control: Classic/DatePicker@2.6.0
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    DefaultDate: =
                                    Font: =Font.'Open Sans'
                                    Height: =RFTOTitle.Height
                                    IconBackground: =RGBA(56, 96, 178, 1)
                                    IconFill: =RGBA(255, 255, 255, 1)
                                    InputTextPlaceholder: =If(IsBlank(Self.SelectedDate), Text(DateValue("1/1/2023"), Self.Format, Self.Language))
                                    Width: =If('Request For Time Off Form'.Size=1,Parent.Width/1.15,Parent.Width/5)
                                    X: =If('Request For Time Off Form'.Size=1, RFTONumberOfDaysInput.X,RFTOStartingDatePicker.Width+RFTOStartingDatePicker.X)
                                    Y: =If('Request For Time Off Form'.Size=1, RFTOStartingDatePicker.Y+RFTOStartingDatePicker.Height+30 ,44)
                              - RFTOEndingDayLabel:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Open Sans'
