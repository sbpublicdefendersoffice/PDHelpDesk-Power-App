                                    HoverColor: =RGBA(255, 255, 255, 1)
                                    HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                    OnSelect: "=\nIf(!RFTODescriptionInput.Visible,\nUpdateContext({TicketDescText:Concatenate(\"Date submitted: \",Today(),\"\n\n# of days requested: \",RFTONumberOfDaysInput.Text,\"     From: \",RFTOStartingDatePicker.SelectedDate,\"     To: \",RFTOEndingDayPicker.SelectedDate,\"     \n\n# of Hours: \",RFTONumberOfHoursInput.Text,\"     Leave Code: \",RFTOLeaveCodeDropdown.Selected.Code,\"\n\nAdditional Comments/Explanation:\n\",RFTOAdditionalCommentsInput.Text,\"\n\n\",If(RFTOApprovedCheckBox.Value,\"Approved [X] Denied []\",\"Approved [] Denied [X]\"),\n\"\n\nSupervisor: \",RFTOSupervisorDropdown.Selected.RevFullName,\"      Date: \",Today())}), Notify(\"Description is Blank\"));\n\n//Check if the title or Description are empty, if they are the form will not be submitted\nIf(\n    Len(RFTOTitleInput.Text) > 0 And Len(RFTODescriptionInput.Text)> 0,\n    UpdateContext({DataCardKey1_1: \"Title\"});\n    UpdateContext({DataCardKey5: \"Description\"});\n    //Set(DataCardKey5: \"Description\");\nSet(\n        //Temporary record\n        rec,\n        //DB operation, from Ticket table, new record, change these columns\n        Patch(\n            Tickets,\n            Defaults(Tickets),\n            {\n                Title: RFTOTitleInput.Text,\n                description: Trim(RFTODescriptionInput.Text),\n                creatorId: userData.id,\n                mainCategory: RFTOMainCategoryDropdown.Selected.ID,\n                category: RFTOSubCategoryDropdown.Selected.ID,\n                subCategory: RFTOSpecificIssueDropdown.Selected.ID,\n                locationId: RFTOLocationIDDropdown.Selected.ID,\n                status: \"open\",\n                metricDate: Concatenate(\n                    Month(Today()),\n                    \"/\",\n                    Year(Today())\n                ),\n                hasAttachment: If(\n                    IsEmpty(RFTOAttachmentControl.Attachments),\n                    0,\n                    1\n                ),\n                //Automation rules table is used to assign tickets\n                assignedTo: If(\n                    IsEmpty(\n                        Filter(\n                            'Ticket Automation Rules',\n                            categoryId = RFTOMainCategoryDropdown.Selected.ID && locationId = RFTOLocationIDDropdown.Selected.ID\n                        )\n                    ),\n                    0,\n                    LookUp(\n                        'Ticket Automation Rules',\n                        categoryId = RFTOMainCategoryDropdown.Selected.ID && locationId = RFTOLocationIDDropdown.Selected.ID,\n                        userID\n                    )\n                )\n            }\n        )\n    );\nPatch(\n    Tickets, \n    LookUp(Tickets,ID = rec.ID),\n    {\n        Title: \"#\"&rec.ID&\" \"&RFTOTitleInput.Text\n    });\n// for the attachments, run power automate flow for each attached file\n    ForAll(\n        RFTOAttachmentControl.Attachments,\n               /*AttachFiles.Run(\n            rec.ID,\n            {\n                file: {\n                    contentBytes: Value,\n                    name: Name\n                }\n            }\n        )*/\n        AttachFiles.Run(\n            rec.ID,\n            {\n                file:{\n                    contentBytes: Value,\n                    name: Name\n                }\n            }\n        ) \n    );\n    \n    /*SMTP.SendEmailV3(\n        {\n            From: \"sbpdhelpdesk@outlook.com\",\n            To: userData.email,\n            Subject: \"Help Desk Ticket Received\",\n            Body: \"<div>Hello, this is an automated response. An IT Help Desk ticket # \" & rec.ID & \" was created on your behalf. A technician will contact you soon to begin troubleshooting.</div><br> <div> To view the status of the ticket or add comments, please visit <a href=\"https://apps.powerapps.com/play/e/default-ce8a2002-448f-4f58-82b1-d86f73e3afdd/a/a370d8a4-8906-4ac3-bff0-0a588e959ea7?tenantId=ce8a2002-448f-4f58-82b1-d86f73e3afdd&TickID=\" & rec.ID & \"'>here</a>.</div>\"\n        }\n    );*/\n    /*If(\n        rec.assignedTo > 0,\n        SMTP.SendEmailV3(\n            {\n                From: \"sbpdhelpdesk@outlook.com\",\n                To: LookUp(\n                    Users,\n                    ID = rec.assignedTo,\n                    email\n                ),\n                Subject: \"Help Desk Ticket Assigned\",\n                Body: \"<div>Hello, this is an automated response. An IT Help Desk ticket # \" & rec.ID & \" was assigned to you. Please click <a href='https://apps.powerapps.com/play/e/default-ce8a2002-448f-4f58-82b1-d86f73e3afdd/a/a370d8a4-8906-4ac3-bff0-0a588e959ea7?tenantId=ce8a2002-448f-4f58-82b1-d86f73e3afdd&TickID=\" & rec.ID & \"'>here</a> to view more details for the ticket.</div>\"\n            }\n        );\n    );*/\n//Power automate flow, sends email to ticket creator \nSendEmail.Run(\n        Concatenate(\n            \"'\",\n            userData.email,\n            \"'\"\n        ),\n        \"Help Desk Ticket Recieved\",\n        //Email Message body\n        TicketCreatorMessageRTE_2.HtmlText,\n        Text(Blank())\n    );\n    // If the ticket it assigned to someone, send them an email\n    If(\n        rec.assignedTo > 0,\n        SendEmail.Run(\n            Concatenate(\n                \"'\",\n                LookUp(\n                    Users,\n                    ID = rec.assignedTo,\n                    email\n                ),\n                \"'\"\n            ),\n            \"Help Desk Ticket Assigned\",\n            //Email message body\n            TechAssignMessageRTE_2.HtmlText,\n            Text(Blank())\n        )\n    );\n    //Reset the form upon completion\n    AddTimeOffToCalendar.Run(userData.fullName,DateTimeValue(RFTOStartingDatePicker.SelectedDate & \" \" & \"17\"& \":\" & \"00\"), Text(RFTOEndingDayPicker.SelectedDate & \" \" & \"17\"& \":\" & \"00\"));\n    ResetForm(RFTOForm);\n    Navigate(Success);\n\n    \n\n);\n// variables that control color elements\n    UpdateContext({CreateTicketTitle: \"Title is Required\"});\n    UpdateContext({CreateTicketDescription: \"Description is Required\"});\n"
                                    PressedBorderColor: =Self.Fill
                                    PressedColor: =Self.Fill
                                    PressedFill: =Self.Color
                                    Text: ="Submit"
                                    Width: =RFTOCancelButton.Width
                                    X: =RFTOCancelButton.X + (Self.Width*1.3)
                                    Y: =RFTOCancelButton.Y
