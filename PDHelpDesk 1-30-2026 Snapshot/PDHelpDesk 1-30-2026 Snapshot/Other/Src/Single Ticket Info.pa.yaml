                                                OnSelect: "=If( //if level 1 test if the ticket is open\r\n    Status_Value_Label_1.Text = \"open\",\r\n    If(// if level 2 check if the comment input is empty\r\n        IsBlank(Trim(Add_Comment_Text_Input_1.Text)),\r\n        Notify(\"Cannot add a blank comment!\"),\r\n    If(// if level 3 check if there are children tickets attached\r\n    IsEmpty(ChildTickets),        \r\n         //There are no children tickets   \r\n            Patch(\r\n            Comments,\r\n            Defaults(Comments),\r\n            {\r\n                ticketId: ticketInfo.ID,\r\n                message: Add_Comment_Text_Input_1.Text,\r\n                creatorId: userData.id\r\n            }\r\n        );\r\n        Patch(\r\n            Tickets,\r\n            LookUp(\r\n                Tickets,\r\n                ID = ticketInfo.ID\r\n            ),\r\n            {lastUpdated: Now(),\r\n             updatedBy: userData.id}\r\n        );\r\n        If(\r\n            (userData.role = \"admin\" || userData.role = \"tech\") && User().FullName <> LookUp(\r\n                Users,\r\n                ID = ticketInfo.CreatorId,\r\n                fullName\r\n            ),\r\n            SendEmail.Run(\r\n                    LookUp(\r\n                        Users,\r\n                        ID = ticketInfo.CreatorId,\r\n                        email),\r\n                ticketInfo.Title & \" - Ticket #\" & ticketInfo.ID,\r\n                ReporterCommentNotificationRTE.HtmlText,\r\n                Text(Blank())\r\n            );\r\n            /*SMTP.SendEmailV3(\r\n                {\r\n                    From: \"sbpdhelpdesk@outlook.com\",\r\n                    To: LookUp(\r\n                        Users,\r\n                        ID = ticketInfo.CreatorId,\r\n                        email\r\n                    ),\r\n                    Subject: ticketInfo.Title & \" - Ticket #\" & ticketInfo.ID,\r\n                    Body: \"<h