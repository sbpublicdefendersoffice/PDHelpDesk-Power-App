Screens:
  Single Ticket Info:
    Properties:
      BackgroundImage: =PUBDEF_IT__LOGO_Vector
      Fill: =ColorScheme.screenBackground
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnHidden: |+
        =UpdateContext({resText:"To close this ticket, provide a resolution below."});
        UpdateContext({SaveText:"Save",emailSubmit:false});
        Clear(ChildTickets);
        Reset(SelectChildrenComboBox);
        Reset(SelectChildrenComboBox_1);
        Reset(Add_Comment_Text_Input);
        Reset(Add_Comment_Text_Input_1);
        Reset(Text_Input_Resolution);
      OnVisible: |+
        =//Initialize screen variables
        //We expect a variable to be passeed in
        UpdateContext({showComboBox: If(ticketInfo.status = "open" || ticketInfo.status = "pending", true, false)});
        UpdateContext({primAssignee: Blank()});
        Set(tempID,ticketInfo.ID);
        //Refresh, refreshes a datasource
        Refresh(Comments);
        Refresh(Tickets);

        //if the ticket we are going to view is open then certian options will be available
        If(
            ticketInfo.status = "open" || ticketInfo.status = "pending",
            Set(
                closeTicketButtonVis,
                true
            ),
            Set(
                closeTicketButtonVis,
                false
            )
        );
        //Used for showing a default selected item in a combobox
        Set(
            primAssignee,
            If(
                IsBlank(ticketInfo.assignedTo),
                Blank(),
                Filter(
                    Users,
                    ID = ticketInfo.assignedTo
                )
            )
        );
        UpdateContext({resText:"To close this ticket, provide a resolution below."});
        UpdateContext({SaveText:"Save",showSolutionPopup:false,hideSolutionButton:is_admin});
        UpdateContext({emailPopUp:false,emailSubmit:false,closeDetails:false});

        //Check if the ticket we are viewing has children tickets, if not the collection is blank, other wise populate it
        If(IsEmpty(Filter(Tickets, parentId = ticketInfo.ID)), ClearCollect(ChildTickets,Blank()), ClearCollect(ChildTickets,Filter(Tickets, parentId = ticketInfo.ID)));
        Reset(SelectChildrenComboBox);
        Reset(SelectChildrenComboBox_1);
        UpdateContext({ticketInfo:LookUp(Tickets,tempID=ID,ThisRecord)});
        UpdateContext({emailDelay:false});
