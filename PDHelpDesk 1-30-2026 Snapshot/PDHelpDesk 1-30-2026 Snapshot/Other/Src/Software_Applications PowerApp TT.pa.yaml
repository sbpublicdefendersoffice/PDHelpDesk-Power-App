                  Color: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Open Sans'
                  Height: =AlternativeAddImageHeader_42.Height
                  Size: =18
                  Text: ="Using "&If(usingCamera, "Camera","Copy Paste")
                  Width: =AlternativeAddImageHeader_42.Width
                  X: =AlternativeAddImageHeader_42.X
                  Y: =AlternativeAddImageHeader_42.Y
            - CopyPasteRTE_42:
                Control: RichTextEditor@2.7.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Default: ="Erase this text and then you can paste your Screenshot here, then hit add at the bottom, you have to do this for every screenshot you add."
                  Height: =AlternativeAddImageBackground_42.Height/1.5
                  Visible: =!usingCamera
                  Width: =AlternativeAddImageBackground_42.Width
                  X: =AlternativeAddImageBackground_42.X
                  Y: =AlternativeAddImageBackground_42.Y+AlternativeAddImageHeader_42.Height
            - Camera_41:
                Control: Camera@2.4.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Camera: |-
                    =//Checks if there are anyback cameras, if there are none then default the camera to the first one otherwise use the first back camera
                    If(IsBlank(LookUp(Camera_41.AvailableDevices, "Back" in Name).Id),0,LookUp(Camera_41.AvailableDevices, "Back" in Name).Id)
                  Height: =AlternativeAddImageBackground_42.Height/1.5
                  OnSelect: |-
                    =UpdateContext({photoCounter:photoCounter+1});
                    Collect(RTEImages,{copyName:"Photo"&photoCounter,base64Image: "<img src="&JSON(Camera_41.Photo,JSONFormat.IncludeBinaryData)&" />"});
                    Collect(JointAttachments,{Name:"Photo"&photoCounter,Value: "<img src="&JSON(Camera_41.Photo,JSONFormat.IncludeBinaryData)&" />"});
                    UpdateContext({altImagePopUp:false});
                  Visible: =usingCamera
                  Width: =AlternativeAddImageBackground_42.Width
                  X: =AlternativeAddImageBackground_42.X
                  Y: =AlternativeAddImageBackground_42.Y+AlternativeAddImageHeader_42.Height
            - AddScreenshotButton_41:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(56, 96, 178, 1)
                  Font: =Font.'Open Sans'
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnSelect: |-
                    =If( "<img" in CopyPasteRTE_42.HtmlText, Collect(RTEImages,{copyName:TextInput3.Text, base64Image:CopyPasteRTE_42.HtmlText}); Collect(JointAttachments,{Name:TextInput3.Text, Value:CopyPasteRTE_42.HtmlText});
                    Reset(CopyPasteRTE_42);
                    Reset(TextInput3), Notify("No Valid Image"));
                    UpdateContext({altImagePopUp:false})
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Text: =If(usingCamera,"Take Picture","Add ScreenShot")
                  Visible: =!usingCamera
                  Width: =250
                  X: =(AlternativeAddImageBackground_42.Width-Self.Width)/2 +AlternativeAddImageBackground_42.X
                  Y: =AlternativeAddImageBackground_42.Height-Self.Height-7
            - ClosePanelButton_41:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  BorderThickness: =1
                  Color: =RGBA(255, 255, 255, 1)
                  Fill: =RGBA(203, 102, 102, 1)
                  Height: =40
                  Icon: =Icon.Cancel
                  OnSelect: |-
                    =UpdateContext({altImagePopUp:false});
                    Reset(CopyPasteRTE_42);
                  Width: =40
                  X: =AlternativeAddImageHeader_42.Width+AlternativeAddImageHeader_42.X-Self.Width
                  Y: =AlternativeAddImageHeader_42.Y
            - CameraInfoLabel_41:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  Height: =50
                  Size: =18
                  Text: ="Tap or Click the camera to take a picture"
                  Visible: =usingCamera
                  Width: =Camera_41.Width
                  X: =(AlternativeAddImageBackground_42.Width-Self.Width)/2 +AlternativeAddImageBackground_42.X
                  Y: =AlternativeAddImageBackground_42.Height-Self.Height-7
