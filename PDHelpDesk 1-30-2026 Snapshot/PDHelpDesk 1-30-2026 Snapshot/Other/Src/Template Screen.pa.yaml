Screens:
  Template Screen:
    Properties:
      BackgroundImage: =PUBDEF_IT__LOGO_Vector
      Fill: =ColorScheme.screenBackground
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |+
        =//Clear the collections
        Clear(RTEImages);
        Clear(JointAttachments);
        Clear(attItems);
        UpdateContext({TemplateErrorPopup:false});

    Children:
      - TemplateContainer:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - TemplateHeaderContainer:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =ColorScheme.primary
                  FillPortions: =0
                  Height: =130
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - TemplateHeaderGroup:
                      Control: GroupContainer@1.4.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - HeaderBackgroundGradient:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              DisabledBorderColor: =RGBA(56, 56, 56, 1)
                              Font: =Font.'Open Sans'
                              Height: =130
                              HtmlText: |-
                                ="<div style='
                                height:"&Self.Height-1&"px;
                                width:100%;
                                background: rgb(53,89,137);
                                background: linear-gradient(90deg, rgba(53,89,137,1) 0%, rgba(0,18,107,1) 100%);' ></div>"
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Width: =Parent.Width
                        - TemplateLabel:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =Color.White
                              Fill: =Color.Transparent
                              Font: =Font.'Open Sans'
                              Height: =48
                              Size: =If('Template Screen'.Size=1, titleText.mobileSize, titleText.desktopSize)
                              Text: ="Template"
                              Width: =Parent.Width
                              Y: =TemplateWebHeader.Height
                        - TemplateWebHeader:
                            Control: CanvasComponent
                            ComponentName: compWebHeader
                            Properties:
                              BackgroundColor: =Color.Transparent
                              CompScreenSize: ='Template Screen'.Size
                              EnableFeedback: =Set(varFeedback,true)
                              FeedbackBool: =varFeedback
                              Fill: =Color.Transparent
                              Height: =82
                              Width: =App.Width
            - MainSectionTemplateContainer:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =ColorScheme.screenBackgroundSeeThroughMid
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
            - TemplateFooter:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255,255,255, 1)
                  FillPortions: =0
                  Height: =60
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: |+
                    ='Template Screen'.Size=1
                  Width: =Parent.Width
                Children:
                  - TemplateWebMobileMenu:
                      Control: CanvasComponent
                      ComponentName: compMobileMenu
                      Properties:
                        BackgroundMenuColor: =RGBA(227, 234, 243, 1)
                        ForegroundColor: |-
                          =//RGBA(70, 130, 180, 1)
                          ColorScheme.primary
                        Height: =Parent.Height
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        NavigationItems: |-
                          =// IF adimn or tech show this table, if not show Staff table
                          gblNavItems
                        SelectedItemBackground: =Color.LightGray
                        Width: =Parent.Width
      - TemplateBackButton:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Color.White
            Height: =TemplateLabel.Height/1.05
            Icon: =Icon.BackArrow
            OnSelect: =Back(ScreenTransition.Fade)
            Width: =49
            X: '=Self.Width/5 '
            Y: =(TemplateHeaderContainer.Height-TemplateLabel.Height)/1.05
      - TemplateWebMenu:
          Control: CanvasComponent
          ComponentName: compWebMenu
          Properties:
            ExpandMenu: =showMenu
            Fill: =Color.Transparent
            HamburgerColor: =Color.White
            Height: =If(showMenu, Parent.Height, 80)
            MenuItems: =gblNavItems
            Visible: ='Template Screen'.Size > 1
            Width: =If(showMenu, Parent.Width, 80)
      - FeedbackBugReportTemp:
          Control: CanvasComponent
          ComponentName: FeedbackBugReport
          Properties:
            CloseReport: =Set(varFeedback,false)
            DisablePickMedia: =Set(PickMedia,false)
            EnablePickMedia: =Set(PickMedia,true)
            FBSize: =App.ActiveScreen.Size
            FeedbackCameraOff: =Set(FeedbackCamera,false);
            FeedbackCameraOn: =Set(FeedbackCamera,true);
            Height: =App.Height
            PhotoModeDisable: =Set(FeedbackPhoto,false)
            PhotoModeEnable: =Set(FeedbackPhoto,true)
            Visible: =varFeedback
            Width: =App.Width
      - TemplateErrorPopup:
          Control: GroupContainer@1.4.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =TemplateErrorPopup
            Width: =Parent.Width
          Children:
            - TemplateErrorBackground:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(56, 96, 178, .25)
                  Height: =Parent.Height
                  Width: =Parent.Width
            - TemplateErrorWindow:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  BorderThickness: =2
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =Parent.Height/1.125
                  Width: =Parent.Width/1.125
                  X: =(Parent.Width-Self.Width)/2
                  Y: =(Parent.Height-Self.Height)/2
            - TemplateErrorHeaderRectangle:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  BorderThickness: =2
                  Fill: =RGBA(56, 96, 178, 1)
                  Width: =TemplateErrorWindow.Width
                  X: =TemplateErrorWindow.X
                  Y: =TemplateErrorWindow.Y
            - TemplateErrorHeader:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =100
                  Size: =30
                  Text: ="Form Error"
                  Width: =TemplateErrorHeaderRectangle.Width
                  X: =TemplateErrorHeaderRectangle.X
                  Y: =TemplateErrorHeaderRectangle.Y
            - CloseTemplateErrorButton:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(56, 96, 178, 1)
                  Font: =Font.'Open Sans'
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnSelect: =UpdateContext({TemplateErrorPopup:false});
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Text: ="Close"
                  X: =(TemplateErrorWindow.Width-Self.Width)/2 +TemplateErrorWindow.X
                  Y: =TemplateErrorWindow.Height-Self.Height
            - TemplateField1Label:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =If(IsBlank('S/APowerAppLocationIDDropdown'.Selected.Name),Color.Red, Color.Green)
                  Font: =Font.'Open Sans'
                  Size: =20
                  Text: =If(IsBlank('S/APowerAppLocationIDDropdown'.Selected.Name),"Location Missing", "Location OK")
                  Width: =TemplateErrorWindow.Width
                  X: =PopupRectangle_5.X
                  Y: =TemplateErrorHeaderRectangle.Y+TemplateErrorHeaderRectangle.Height+15
      - EnableTemplateFormError:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: =UpdateContext({TemplateErrorPopup:true})
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: =
            X: =80
            Y: =123
