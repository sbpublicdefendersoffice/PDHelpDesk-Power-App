                        - Container20:
                            Control: GroupContainer@1.4.0
                            Variant: ManualLayout
                            Properties:
                              BorderThickness: =4
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =50
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =editMonth
                              Width: =Parent.Width
                            Children:
                              - Dropdown9:
                                  Control: Classic/DropDown@2.3.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    ChevronBackground: =RGBA(56, 96, 178, 1)
                                    ChevronFill: =RGBA(255, 255, 255, 1)
                                    ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                    ChevronHoverFill: =RGBA(255, 255, 255, 1)
                                    Default: =Month(Today())
                                    Font: =Font.'Open Sans'
                                    HoverFill: =RGBA(186, 202, 226, 1)
                                    Items: =ForAll(Sequence(12),Text(Value&"/"&Year(Today())))
                                    Items.Value: =Value
                                    OnChange: |+
                                      =UpdateContext({ticketMonth:Self.Selected.Value});
                                      UpdateContext({monthlyCat1:CountRows(Filter(Tickets,metricDate=ticketMonth && mainCategory=1))});
                                      UpdateContext({monthlyCat2:CountRows(Filter(Tickets,metricDate=ticketMonth && mainCategory=2))});
                                      UpdateContext({monthlyCat3:CountRows(Filter(Tickets,metricDate=ticketMonth && mainCategory=3))});
                                      UpdateContext({monthlyCat4:CountRows(Filter(Tickets,metricDate=ticketMonth && mainCategory=4))});
                                      UpdateContext({monthlyCat5:CountRows(Filter(Tickets,metricDate=ticketMonth && mainCategory=5))});
                                      UpdateContext({monthlyCat6:CountRows(Filter(Tickets,metricDate=ticketMonth && mainCategory=6))});
                                      UpdateContext({monthlyCat7:CountRows(Filter(Tickets,metricDate=ticketMonth && mainCategory=7))});
                                      UpdateContext({monthlyCat8:CountRows(Filter(Tickets,metricDate=ticketMonth && mainCategory=8))});

                                      Patch(metricCol,LookUp(metricCol,recID=1), {TicketLate:0, TicketComplete:0, Tickets:0});

                                      ForAll(Filter(Tickets,assignedTo=userData.id && metricDate=Self.Selected.Value) As TicketData,
                                      If(DateDiff(TicketData.dateCreated,TicketData.dateClosed,TimeUnit.Days)>=2,Patch(metricCol,LookUp(metricCol,recID=1),{TicketLate:LookUp(metricCol,recID=1).TicketLate+1}),Patch(metricCol,LookUp(metricCol,recID=1),{TicketComplete:LookUp(metricCol,recID=1).TicketComplete+1})));
                                      Patch(metricCol,LookUp(metricCol,recID=1),{Tickets:CountRows(Filter(Tickets,assignedTo=userData.id && metricDate = Self.Selected.Value))});
                                      Clear(ticketMetrics);
                                      Collect(ticketMetrics,    

                                          {
                                              ID:1,
                                              metricTitle: "Monthly Tickets Recieved",
                                              metricNumber: CountRows(Filter(Tickets, metricDate = ticketMonth))
                                          },
                                          {
                                              ID:2,
                                              metricTitle: "Monthly Tickets Resolved",
                                              metricNumber: CountRows(Filter(Tickets, metricDate = ticketMonth && status = "closed"))
                                          },
                                          {
                                              ID:3,
                                              metricTitle: "Monthly Tickets Open",
                                              metricNumber: CountRows(Filter(Tickets, metricDate = ticketMonth && status = "open"))
                                          },
                                          {
                                              ID:4,
                                              metricTitle: "Tickets Assigned to Me",
                                              metricNumber: CountRows(Filter(Tickets, assignedTo = userData.id && metricDate= ticketMonth))
                                          }
                                      );

                                    PressedColor: =RGBA(255, 255, 255, 1)
                                    PressedFill: =RGBA(0, 18, 107, 1)
                                    SelectionColor: =RGBA(255, 255, 255, 1)
                                    SelectionFill: =RGBA(56, 96, 178, 1)
