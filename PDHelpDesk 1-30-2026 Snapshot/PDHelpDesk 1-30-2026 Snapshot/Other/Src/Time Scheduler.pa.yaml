Screens:
  Time Scheduler:
    Properties:
      Fill: =ColorScheme.screenBackground
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: "=ClearCollect(\r\n    scheduleTimes,\r\n    {\r\n        Name:\"Mark Perez\",\r\n        Monday:\"09:00 AM - 05:00 PM\",\r\n        Tuesday:\"08:15 AM - 05:00 PM\",\r\n        Wednesday:\"09:00 AM - 05:00 PM\",\r\n        Thursday:\"09:00 AM - 05:00 PM\",\r\n        Friday:\"09:00 AM - 05:00 PM\",\r\n        Saturday:\"09:00 AM - 05:00 PM\",\r\n        Sunday:\"09:00 AM - 05:00 PM\"\r\n        \r\n    }\r\n);\r\nUpdateContext({showTimeTable:true});\r\n"
    Children:
      - TimeSchedulerContainer:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - TimeSchedulerHeaderContainer:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =ColorScheme.primary
                  FillPortions: =0
                  Height: =130
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - TimeSchedulerWebHeader:
                      Control: CanvasComponent
                      ComponentName: compWebHeader
                      Properties:
                        BackgroundColor: =ColorScheme.primary
                        CompScreenSize: ='Time Scheduler'.Size
                        EnableFeedback: =Set(varFeedback,true)
                        FeedbackBool: =varFeedback
                        Height: =82
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        Width: =App.Width
                  - TimeSchedulerLabel:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =Color.White
                        Fill: =ColorScheme.primary
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        Height: =48
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        Size: =If('Time Scheduler'.Size=1, titleText.mobileSize, titleText.desktopSize)
                        Text: ="Time Scheduler"
                        Width: =Parent.Width
