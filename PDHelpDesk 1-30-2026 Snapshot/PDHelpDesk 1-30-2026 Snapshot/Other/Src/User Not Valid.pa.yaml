Screens:
  User Not Valid:
    Properties:
      BackgroundImage: =SantaBarabaraBuilding
      Fill: =ColorScheme.screenBackground
      ImagePosition: =ImagePosition.Fill
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - Rectangle28:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =    ColorScheme.screenBackgroundSeeThroughMid
            Height: =Parent.Height-Container10_5.Y-Container10_5.Height
            Width: =Parent.Width
            Y: =130
      - NoAccessLabel1:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =60
            Size: =If('User Not Valid'.Size > 1, 30, 15)
            Text: |-
              ="You don't have access to use this app
              "
            Width: =Parent.Width
            Y: =Parent.Height/2
      - NoAccessLabel2:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Size: =If('User Not Valid'.Size > 1, 13, 10)
            Text: ="Please contact system adminstrators to see if this is a mistake"
            Width: =Parent.Width
            Y: =Parent.Height / 2 + 50
      - HomeBackgroundGradient_67:
          Control: HtmlViewer@2.1.0
          Properties:
            DisabledBorderColor: =RGBA(56, 56, 56, 1)
            Font: =Font.'Open Sans'
            Height: =130
            HtmlText: =Home_Background_Gradient.HtmlText
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =11
            Width: =Parent.Width
      - Container10_5:
          Control: GroupContainer@1.4.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: |-
              =48
              //Parent.Height/12
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =UserNotValidWebHeader.Height
      - UserNotValidWebHeader:
          Control: CanvasComponent
          ComponentName: compWebHeader
          Properties:
            BackgroundColor: =Color.Transparent
            CompScreenSize: ='User Not Valid'.Size
            EnableFeedback: =Set(varFeedback,true)
            FeedbackBool: =varFeedback
            Height: =82
            Width: =App.Width
      - FeedbackBugReportUNV:
          Control: CanvasComponent
          ComponentName: FeedbackBugReport
          Properties:
            CloseReport: =Set(varFeedback,false)
            DisablePickMedia: =Set(PickMedia,false)
            EnablePickMedia: =Set(PickMedia,true)
            FBSize: =App.ActiveScreen.Size
            FeedbackCameraOff: =Set(FeedbackCamera,false);
            FeedbackCameraOn: =Set(FeedbackCamera,true);
            Height: =App.Height
            PhotoModeDisable: =Set(FeedbackPhoto,false)
            PhotoModeEnable: =Set(FeedbackPhoto,true)
            Visible: =varFeedback
            Width: =App.Width
