Screens:
  WelcomeUserScreen:
    Properties:
      Fill: =ColorScheme.screenBackground
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - WelcomeUserContainer:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - WelcomeUserMainContainer:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - WelcomeUserElements:
                      Control: GroupContainer@1.4.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - HomeBackgroundGradient_25:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              DisabledBorderColor: =RGBA(56, 56, 56, 1)
                              Font: =Font.'Open Sans'
                              Height: =Parent.Height
                              HtmlText: =Splash_Gradient_Background.HtmlText
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Width: =Parent.Width
                        - Label62:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =RGBA(0, 0, 0, (Timer2.Value/Timer2.Duration))
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =Parent.Height/4
                              Size: =20
                              Text: ="Welcome "&User().FullName
                              Width: =Parent.Width/2
                              X: =(Parent.Width-Self.Width)/2
                              Y: =(Parent.Height-Self.Height)/2 + PersonImage_1.Y
                        - PersonImage_1:
                            Control: Image@2.2.3
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Height: =Self.Width
                              Image: |-
                                =// Get assignee's profile pic if they have one
                                // Sharepoint
                                If(!IsBlank(LookUp(Users, ID = userData.id, email)) && Office365Users.UserPhotoMetadata(LookUp(Users, ID = userData.id, email)).HasPhoto, Office365Users.UserPhotoV2(LookUp(Users, ID = userData.id, email)), 'blank-profile-pic')
                              ImagePosition: =ImagePosition.Fill
                              RadiusBottomLeft: =256
                              RadiusBottomRight: =256
                              RadiusTopLeft: =256
                              RadiusTopRight: =256
                              Transparency: =1-(Timer2.Value/Timer2.Duration)
                              Width: =If(WelcomeUserScreen.Size=1,Parent.Width/2,Parent.Width/8)
                              X: =(Parent.Width-Self.Width)/2
                              Y: =(Parent.Height-Self.Height)/4
      - Timer2:
          Control: Timer@2.1.0
          Properties:
            AutoPause: =false
            AutoStart: =true
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
            DisabledColor: =ColorFade(Self.Fill, 90%)
            DisabledFill: =ColorFade(Self.Fill, 70%)
            Duration: =3500
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: =Self.Start
            OnTimerEnd: =Navigate(Home,ScreenTransition.Fade);
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Visible: =false
            X: =40
            Y: =40
