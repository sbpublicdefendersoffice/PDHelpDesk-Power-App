Screens:
  eDefender Access/Security Request TT:
    Properties:
      BackgroundImage: =PUBDEF_IT__LOGO_Vector
      Fill: =ColorScheme.screenBackground
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnHidden: |+
        =UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
      OnVisible: |-
        =ResetForm('eDefender_A/S_Form');
        UpdateContext({CreateTicketTitle: "Nature of Request", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:"",ASPopup:false});
        UpdateContext({usingCamera:false,altImagePopUp:false});
        Clear(RTEImages);
        Clear(JointAttachments);
        Clear(attItems);
        App.ActiveScreen.Size
