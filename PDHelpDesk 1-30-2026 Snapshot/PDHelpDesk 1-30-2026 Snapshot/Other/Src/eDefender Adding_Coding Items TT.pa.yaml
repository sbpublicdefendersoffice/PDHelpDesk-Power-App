Screens:
  eDefender Adding/Coding Items TT:
    Properties:
      BackgroundImage: =PUBDEF_IT__LOGO_Vector
      Fill: =ColorScheme.screenBackground
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnHidden: |+
        =UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
      OnVisible: |-
        =ResetForm('eDefenderAdding/CodingItemsForm');
        UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
        ClearCollect(items,
        {
            itemName:"",
            toBeRemoved:false
        }

        );

        ClearCollect(listItemsCol,{

        listDropdownName:"",
        listDropdownAdditions:items

        });

        Clear(RTEImages);
        Clear(JointAttachments);
        Clear(attItems);
        Clear(items);
        Clear(listItemsCol);
        UpdateContext({usingCamera:false,altImagePopUp:false});
        UpdateContext({ACPopup:false});
    Children:
      - eDefenderAdding/CodingMainContainer:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: ='eDefender Adding/Coding Items TT'.Height
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: ='eDefender Adding/Coding Items TT'.Width
          Children:
            - eDefenderAdding/CodingVerticalLayoutContainer:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - eDefenderAdding/CodingHeaderContainer:
                      Control: GroupContainer@1.4.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        Fill: =ColorScheme.primary
                        FillPortions: =0
                        Height: |-
                          =130
                          //Parent.Height/11
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: |-
                          =//Home.Size<>1
                          //This is the top most header container that houses the navbar links
                          true
                        Width: =Parent.Width
                      Children:
                        - AddingCodingItemsHeaderElements:
                            Control: GroupContainer@1.4.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - HomeBackgroundGradient_6:
                                  Control: HtmlViewer@2.1.0
                                  Properties:
                                    DisabledBorderColor: =RGBA(56, 56, 56, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =Parent.Height
                                    HtmlText: =Home_Background_Gradient.HtmlText
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    Width: =Parent.Width
                              - eDefenderAdding/CodingItemsLabel:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =Color.Transparent
                                    Font: =Font.'Open Sans'
                                    Height: =Parent.Height-'eDefenderAdding/CodingWebHeader'.Height
                                    Size: =If('eDefender Adding/Coding Items TT'.Size=1, titleText.mobileSize, titleText.desktopSize)
                                    Text: ="Adding/Coding Items Form"
                                    Width: =Parent.Width
                                    Y: ='eDefenderAdding/CodingWebHeader'.Height
                              - eDefenderAdding/CodingWebHeader:
                                  Control: CanvasComponent
                                  ComponentName: compWebHeader
                                  Properties:
                                    BackgroundColor: =Color.Transparent
                                    CompScreenSize: ='eDefender Adding/Coding Items TT'.Size
                                    EnableFeedback: =Set(varFeedback,true)
                                    FeedbackBool: =varFeedback
                                    Height: |-
                                      =82
                                      //Parent.Height
                                    Width: =App.Width
                  - eDefenderAdding/CodingMainContentContainer:
                      Control: GroupContainer@1.4.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        Fill: =ColorScheme.screenBackgroundSeeThroughMid
                        Height: =Parent.Height/1.21
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: |-
                          =true
                          //Main Content container this houses certian elements such as the searchbar, and 2 button galleries, one for desktop, and another for mobile
                        Width: =Parent.Width
                      Children:
                        - eDefenderAdding/CodingItemsForm:
                            Control: Form@2.4.4
                            Variant: Classic
                            Layout: Vertical
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              BorderColor: =RGBA(0, 18, 107, 1)
                              DataSource: =Tickets
                              DefaultMode: =FormMode.New
                              Height: =Parent.Height/1.21
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              NumberOfColumns: =1
                              Width: =Parent.Width
                              Y: =Parent.Height/5.7
                            Children:
                              - eDefenderAdding/CodingTitle_DataCard:
                                  Control: TypedDataCard@1.0.7
                                  Variant: ClassicTextualEdit
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    DataField: ="title"
                                    Default: =ThisItem.Title
                                    DisplayName: =//DataSourceInfo([@Tickets],DataSourceInfo.DisplayName, "field_2")
                                    Height: =If('eDefender Adding/Coding Items TT'.Size =1,100,50)
                                    MaxLength: =//DataSourceInfo([@Tickets], DataSourceInfo.MaxLength, "field_2")
                                    Required: =false
                                    Width: =1366
                                    WidthFit: =true
                                    X: =0
                                    Y: =0
                                  Children:
                                    - eDefenderAdding/CodingTitleLabel:
                                        Control: Label@2.5.1
                                        MetadataKey: FieldName
                                        Properties:
                                          AutoHeight: =true
                                          BorderColor: =RGBA(0, 0, 0, 1)
                                          Color: =If(CreateTicketTitle = "Title" || !IsBlank('eDefenderAdding/CodingTitleInput'.Text), RGBA(0, 18, 107, 1), Color.Red)
                                          Font: =Font.'Open Sans'
                                          Height: =34
                                          Text: ="Case Number"
                                          Visible: =false
                                          Width: =Parent.Width - 60
                                          Wrap: =false
                                          X: =30
                                          Y: =10
                                    - eDefenderAdding/CodingTitleError:
                                        Control: Label@2.5.1
                                        MetadataKey: ErrorMessage
                                        Properties:
                                          AutoHeight: =true
                                          BorderColor: =RGBA(0, 0, 0, 1)
                                          Color: =RGBA(168, 0, 0, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =10
                                          Live: =Live.Assertive
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =14
                                          Text: =Parent.Error
                                          Visible: =false
                                          Width: =Parent.Width - 60
                                          X: =30
                                          Y: ='eDefenderAdding/CodingTitleInput'.Y + 'eDefenderAdding/CodingTitleInput'.Height
                                    - eDefenderAdding/CodingTitleStarVisible:
                                        Control: Label@2.5.1
                                        MetadataKey: FieldRequired
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 0, 0, 1)
                                          Color: ='eDefenderAdding/CodingTitleLabel'.Color
                                          Font: =Font.'Open Sans'
                                          Height: ='eDefenderAdding/CodingTitleLabel'.Height
                                          Text: ="*"
                                          Visible: =false
                                          Width: =30
                                          Wrap: =false
                                          Y: ='eDefenderAdding/CodingTitleLabel'.Y
                                    - eDefenderAdding/CodingTitleInput:
                                        Control: Classic/TextInput@2.3.2
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Default: =""
                                          Font: =Font.'Open Sans'
                                          Height: =30
                                          HintText: ="Add new item to dropdown, Which list and what to add or remove, add a check box"
                                          HoverBorderColor: =RGBA(0, 18, 107, 1)
                                          HoverFill: =RGBA(186, 202, 226, 1)
                                          Visible: =false
                                          Width: =If('eDefender Adding/Coding Items TT'.Size=1,Parent.Width/1.2,Parent.Width/1.1)
                                          X: =30
                                          Y: =44
                                    - eDefenderAdding/CodingDisclaimerLabel:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(221, 79, 14, 1)
                                          BorderThickness: =2
                                          Color: =RGBA(221, 79, 14, 1)
                                          Fill: =RGBA(255, 255, 255, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =If(App.ActiveScreen.Size =1,100,50)
                                          Size: =If('eDefender Adding/Coding Items TT'.Size =1,13,16)
                                          Text: ='eDefender_A/S_Disclaimer_Label'.Text
                                          Width: =Parent.Width
                              - eDefenderAdding/CodingMainCategory_DataCard:
                                  Control: TypedDataCard@1.0.7
                                  Variant: ClassicNumberEdit
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    DataField: ="mainCategory"
                                    Default: =ThisItem.mainCategory
                                    DisplayName: =DataSourceInfo([@Tickets],DataSourceInfo.DisplayName, Name)
                                    Height: =If( 'eDefender Adding/Coding Items TT'.Size = 1, Parent.Height/7, Parent.Height/5)
                                    Required: =true
                                    Visible: =false
                                    Width: =1366
                                    WidthFit: =true
                                    X: =0
                                    Y: =1
                                  Children:
                                    - eDefenderAdding/CodingMainCategoryLabel:
                                        Control: Label@2.5.1
                                        MetadataKey: FieldName
                                        Properties:
                                          AutoHeight: =true
                                          BorderColor: =RGBA(0, 0, 0, 1)
                                          Color: =RGBA(0, 18, 107, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =34
                                          Text: ="Category"
                                          Width: =Parent.Width - 60
                                          Wrap: =false
                                          X: =30
                                          Y: =10
                                    - eDefenderAdding/CodingMainCategoryError:
                                        Control: Label@2.5.1
                                        MetadataKey: ErrorMessage
                                        Properties:
                                          AutoHeight: =true
                                          BorderColor: =RGBA(0, 0, 0, 1)
                                          Color: =RGBA(168, 0, 0, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =10
                                          Live: =Live.Assertive
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =14
                                          Text: =Parent.Error
                                          Visible: =Parent.DisplayMode=DisplayMode.Edit
                                          Width: =Parent.Width - 60
                                          X: =30
                                          Y: ='eDefenderAdding/CodingMainCategoryDropdown'.Y + 'eDefenderAdding/CodingMainCategoryDropdown'.Height
                                    - eDefenderAdding/CodingMainCategoryStarVisible:
                                        Control: Label@2.5.1
                                        MetadataKey: FieldRequired
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 0, 0, 1)
                                          Color: =RGBA(0, 18, 107, 1)
                                          Font: =Font.'Open Sans'
                                          Height: ='eDefenderAdding/CodingMainCategoryLabel'.Height
                                          Text: ="*"
                                          Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                                          Width: =30
                                          Wrap: =false
                                          Y: ='eDefenderAdding/CodingMainCategoryLabel'.Y
                                    - eDefenderAdding/CodingMainCategoryDropdown:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          ChevronBackground: =RGBA(56, 96, 178, 1)
                                          ChevronFill: =RGBA(255, 255, 255, 1)
                                          ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                          ChevronHoverFill: =RGBA(255, 255, 255, 1)
                                          Default: =LookUp(Category, ID = TicketCategoryID, Name)
                                          Font: =Font.'Open Sans'
                                          Height: =Parent.Height/3.5
                                          HoverFill: =RGBA(186, 202, 226, 1)
                                          Items: =(If(is_admin, Filter(Category, parentId = Blank()), Filter(Category, parentId = Blank(),technicianOnly=0)))
                                          Items.Value: =Title
                                          PressedColor: =RGBA(255, 255, 255, 1)
                                          PressedFill: =RGBA(0, 18, 107, 1)
                                          SelectionColor: =RGBA(255, 255, 255, 1)
                                          SelectionFill: =RGBA(56, 96, 178, 1)
                                          Width: =Parent.Width/1.05
                                          X: =30
                                          Y: =44
                              - eDefenderAdding/CodingSubCategory_DataCard:
                                  Control: TypedDataCard@1.0.7
                                  Variant: ClassicNumberEdit
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    DataField: ="category"
                                    Default: =ThisItem.category
                                    DisplayName: =DataSourceInfo([@Tickets],DataSourceInfo.DisplayName,Name)
                                    Height: =If( 'eDefender Adding/Coding Items TT'.Size = 1, Parent.Height/7, Parent.Height/5)
                                    Required: =true
                                    Visible: =false
                                    Width: =1366
                                    WidthFit: =true
                                    X: =0
                                    Y: =2
                                  Children:
                                    - eDefenderAdding/CodingSubCategoryLabel:
                                        Control: Label@2.5.1
                                        MetadataKey: FieldName
                                        Properties:
                                          AutoHeight: =true
                                          BorderColor: =RGBA(0, 0, 0, 1)
                                          Color: =RGBA(0, 18, 107, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =34
                                          Text: ="Sub Category"
                                          Width: =Parent.Width - 60
                                          Wrap: =false
                                          X: =30
                                          Y: =10
                                    - eDefenderAdding/CodingSubcategoryError:
                                        Control: Label@2.5.1
                                        MetadataKey: ErrorMessage
                                        Properties:
                                          AutoHeight: =true
                                          BorderColor: =RGBA(0, 0, 0, 1)
                                          Color: =RGBA(168, 0, 0, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =10
                                          Live: =Live.Assertive
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =14
                                          Text: =Parent.Error
                                          Visible: =Parent.DisplayMode=DisplayMode.Edit
                                          Width: =Parent.Width - 60
                                          X: =30
                                          Y: ='eDefenderAdding/CodingSubCategoryDropdown'.Y + 'eDefenderAdding/CodingSubCategoryDropdown'.Height
                                    - eDefenderAdding/CodingSubcategoryStarVisible:
                                        Control: Label@2.5.1
                                        MetadataKey: FieldRequired
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 0, 0, 1)
                                          Color: =RGBA(0, 18, 107, 1)
                                          Font: =Font.'Open Sans'
                                          Height: ='eDefenderAdding/CodingSubCategoryLabel'.Height
                                          Text: ="*"
                                          Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                                          Width: =30
                                          Wrap: =false
                                          Y: ='eDefenderAdding/CodingSubCategoryLabel'.Y
                                    - eDefenderAdding/CodingSubCategoryDropdown:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          ChevronBackground: =RGBA(56, 96, 178, 1)
                                          ChevronFill: =RGBA(255, 255, 255, 1)
                                          ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                          ChevronHoverFill: =RGBA(255, 255, 255, 1)
                                          Default: =LookUp(Category, ID = TicketSubCategoryID, Name)
                                          Font: =Font.'Open Sans'
                                          Height: =Parent.Height/3.5
                                          HoverFill: =RGBA(186, 202, 226, 1)
                                          Items: =Filter(Category, parentId = 'eDefenderAdding/CodingMainCategoryDropdown'.Selected.ID)
                                          Items.Value: =Title
                                          PressedColor: =RGBA(255, 255, 255, 1)
                                          PressedFill: =RGBA(0, 18, 107, 1)
                                          SelectionColor: =RGBA(255, 255, 255, 1)
                                          SelectionFill: =RGBA(56, 96, 178, 1)
                                          Width: =Parent.Width/1.05
                                          X: =30
                                          Y: =44
                              - eDefenderAdding/CodingFields:
                                  Control: TypedDataCard@1.0.7
                                  Variant: BlankCard
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Height: =600
                                    Width: =Parent.Width
                                    WidthFit: =true
                                    X: =0
                                    Y: =3
                                  Children:
                                    - AddingEntryHeader:
                                        Control: Rectangle@2.3.0
                                        Group: Group2
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          BorderThickness: =2
                                          Fill: =ColorScheme.primary
                                          Height: =50
                                          Width: =If('eDefender Adding/Coding Items TT'.Size=1,Parent.Width/1.2,Parent.Width/1.1)
                                          X: |+
                                            =If('eDefender Adding/Coding Items TT'.Size=1,30,(Parent.Width-Self.Width)/2)
                                          Y: =40
                                    - AddingEntryHeaderTitle:
                                        Control: Label@2.5.1
                                        Group: Group2
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =RGBA(255, 255, 255, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =50
                                          Size: =18
                                          Text: ="Dropdown Entry"
                                          Width: =AddingEntryHeader.Width
                                          X: =AddingEntryHeader.X
                                          Y: =40
                                    - AddingEntryBackground:
                                        Control: Rectangle@2.3.0
                                        Group: Group2
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          BorderThickness: =1
                                          Fill: =RGBA(255, 255, 255, 1)
                                          Width: =AddingEntryHeader.Width
                                          X: =AddingEntryHeader.X
                                          Y: =90
                                    - EnterDropdownLabel:
                                        Control: Label@2.5.1
                                        Group: Group2
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          BorderThickness: =1
                                          Fill: =RGBA(255, 255, 255, 1)
                                          Font: =Font.'Open Sans'
                                          Size: =17
                                          Text: ="Enter a Dropdown"
                                          Width: =(AddingEntryHeader.Width)
                                          X: =AddingEntryHeader.X
                                          Y: =90
                                    - CodeInput:
                                        Control: Classic/TextInput@2.3.2
                                        Group: Group2
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Default: =""
                                          EnableSpellCheck: =true
                                          Font: =Font.'Open Sans'
                                          HintText: ="Enter item"
                                          HoverBorderColor: =RGBA(0, 18, 107, 1)
                                          HoverFill: =RGBA(186, 202, 226, 1)
                                          Width: =AddingEntryHeader.Width-10
                                          X: =AddingEntryBackground.X+5
                                          Y: =EnterDropdownLabel.Y+EnterDropdownLabel.Height+10
                                    - CodeAddButtonBackground:
                                        Control: Classic/Button@2.2.0
                                        Group: Group2
                                        Properties:
                                          BorderColor: =ColorFade(Self.Fill, -15%)
                                          Color: =RGBA(255, 255, 255, 1)
                                          DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                          Fill: =ColorScheme.primary
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                                          HoverColor: =RGBA(255, 255, 255, 1)
                                          HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                          OnSelect: |-
                                            =Patch(listItemsCol,Defaults(listItemsCol),
                                            {
                                                listDropdownName:CodeInput.Text
                                            });
                                            Reset(CodeInput);
                                          PressedBorderColor: =Self.Fill
                                          PressedColor: =Self.Fill
                                          PressedFill: =Self.Color
                                          Text: ="Add "
                                          Width: =If('eDefender Adding/Coding Items TT'.Size=1,Parent.Width/4.25,Parent.Width/6.25)
                                          X: =(Parent.Width-Self.Width)/2
                                          Y: =AddingEntryBackground.Y+AddingEntryBackground.Height+20
                                    - AddItemsToDropdownSelectedHeader:
                                        Control: Rectangle@2.3.0
                                        Group: Group6
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          BorderThickness: =2
                                          Fill: =ColorScheme.primary
                                          Height: =50
                                          Width: =AddingEntryHeader.Width
                                          X: =DropdownListGalleryHeader.X
                                          Y: =If('eDefender Adding/Coding Items TT'.Size=1,'Video/AudioEditingMobileGallery_7'.Y+'Video/AudioEditingMobileGallery_7'.Height+30,DropdownListGallery.Height+DropdownListGallery.Y+100)
                                    - AddItemsToDropdownSelectedHeaderTitle:
                                        Control: Label@2.5.1
                                        Group: Group6
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =RGBA(255, 255, 255, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =50
                                          Size: =18
                                          Text: ="List-"&DropdownListGallery.Selected.listDropdownName
                                          Width: =AddItemsToDropdownSelectedHeader.Width
                                          X: =AddItemsToDropdownSelectedHeader.X
                                          Y: =AddItemsToDropdownSelectedHeader.Y
                                    - AddItemsToDropdownSelectedBackground:
                                        Control: Rectangle@2.3.0
                                        Group: Group6
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          BorderThickness: =1
                                          Fill: =RGBA(255, 255, 255, 1)
                                          Width: =AddingEntryHeader.Width
                                          X: =AddItemsToDropdownSelectedHeader.X
                                          Y: =AddItemsToDropdownSelectedHeader.Y+AddItemsToDropdownSelectedHeader.Height
                                    - ItemToAddLabel:
                                        Control: Label@2.5.1
                                        Group: Group6
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          BorderThickness: =1
                                          Fill: =RGBA(255, 255, 255, 1)
                                          Font: =Font.'Open Sans'
                                          Size: =17
                                          Text: ="Item to Add"
                                          Width: =(4*AddItemsToDropdownSelectedHeader.Width)/6
                                          X: =AddItemsToDropdownSelectedHeader.X
                                          Y: =AddItemsToDropdownSelectedHeader.Y+AddItemsToDropdownSelectedHeader.Height
                                    - ItemInput:
                                        Control: Classic/TextInput@2.3.2
                                        Group: Group6
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Default: =""
                                          EnableSpellCheck: =true
                                          Font: =Font.'Open Sans'
                                          HintText: ="Enter item"
                                          HoverBorderColor: =RGBA(0, 18, 107, 1)
                                          HoverFill: =RGBA(186, 202, 226, 1)
                                          Width: =ItemToAddLabel.Width - 10
                                          X: =AddItemsToDropdownSelectedHeader.X+5
                                          Y: =ItemToAddLabel.Y+ItemToAddLabel.Height+10
                                    - AddItemToGalleryButton:
                                        Control: Classic/Button@2.2.0
                                        Group: Group6
                                        Properties:
                                          BorderColor: =ColorFade(Self.Fill, -15%)
                                          Color: =RGBA(255, 255, 255, 1)
                                          DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                          Fill: =ColorScheme.primary
                                          Font: =Font.'Open Sans'
                                          HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                                          HoverColor: =RGBA(255, 255, 255, 1)
                                          HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                          OnSelect: |-
                                            =Clear(items);
                                            Collect(items,LookUp(listItemsCol,DropdownListGallery.Selected.listDropdownName=listDropdownName).listDropdownAdditions);

                                            Patch(items,Defaults(items),{
                                                itemName:ItemInput.Text
                                                ,toBeRemoved:RemoveCheckBox.Value});
                                            Patch(listItemsCol,LookUp(listItemsCol,DropdownListGallery.Selected.listDropdownName = listDropdownName),
                                            {
                                                listDropdownAdditions:items
                                            });

                                            Reset(ItemInput);
