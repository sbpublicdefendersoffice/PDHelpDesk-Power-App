        UpdateContext({CnSPopUp:false,CnSRecord:Blank(),chargeColCount:1});
        Clear(RTEImages);
        Clear(JointAttachments);
        Clear(attItems);
        UpdateContext({usingCamera:false,altImagePopUp:false});
        UpdateContext({'C&SPopup':false})
