                          =//Home.Size<>1
                          //This is the top most header container that houses the navbar links
                          true
                        Width: =Parent.Width
                      Children:
                        - DocumentGenerationTemplatesHeaderElements:
                            Control: GroupContainer@1.4.0
                            Variant: ManualLayout
