Screens:
  eDefender Document Generation/Templates TT:
    Properties:
      BackgroundImage: =PUBDEF_IT__LOGO_Vector
      Fill: =ColorScheme.screenBackground
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnHidden: |+
        =UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
      OnVisible: |-
        =ResetForm(eDefenderDGTForm);
        UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
        Clear(RTEImages);
        Clear(JointAttachments);
        Clear(attItems);
        UpdateContext({usingCamera:false,altImagePopUp:false});
        UpdateContext({DGTPopup:false});
    Children:
      - eDefenderDGTMainContainer:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: ='eDefender Document Generation/Templates TT'.Height
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: ='eDefender Document Generation/Templates TT'.Width
          Children:
            - eDefenderDGTVerticalLayoutContainer:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
