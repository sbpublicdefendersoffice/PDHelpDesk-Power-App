                                    BackgroundColor: =Color.Transparent
                                    CompScreenSize: ='eDefender Filing Cabinet/Box Integration TT'.Size
                                    EnableFeedback: =Set(varFeedback,true)
                                    FeedbackBool: =varFeedback
                                    Height: |-
                                      =82
                                      //Parent.Height
                                    Width: =App.Width
