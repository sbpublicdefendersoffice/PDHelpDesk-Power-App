                        Width: =Parent.Width
                      Children:
                        - eDefenderFCBIForm:
                            Control: Form@2.4.4
                            Variant: Classic
                            Layout: Vertical
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              BorderColor: =RGBA(0, 18, 107, 1)
