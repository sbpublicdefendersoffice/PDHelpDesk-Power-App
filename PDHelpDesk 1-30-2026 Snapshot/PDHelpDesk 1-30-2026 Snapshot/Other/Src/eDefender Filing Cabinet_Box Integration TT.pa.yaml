                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 0, 0, 1)
                                          Color: =eDefenderFCBITitleLabel.Color
                                          Font: =Font.'Open Sans'
                                          Height: =eDefenderFCBITitleLabel.Height
