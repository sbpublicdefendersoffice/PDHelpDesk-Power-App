                                  Control: TypedDataCard@1.0.7
                                  Variant: ClassicTextualEdit
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    DataField: ="title"
                                    Default: =ThisItem.Title
                                    DisplayName: =//DataSourceInfo([@Tickets],DataSourceInfo.DisplayName, "field_2")
                                    Height: =100
                                    MaxLength: =//DataSourceInfo([@Tickets], DataSourceInfo.MaxLength, "field_2")
                                    Required: =false
                                    Width: =1366
                                    WidthFit: =true
                                    X: =0
                                    Y: =0
                                  Children:
                                    - eDefenderRMTitleLabel:
                                        Control: Label@2.5.1
                                        MetadataKey: FieldName
                                        Properties:
                                          AutoHeight: =true
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          BorderThickness: =2
                                          Color: =RGBA(255, 255, 255, 1)
                                          Fill: =ColorScheme.primary
                                          Font: =Font.'Open Sans'
                                          Height: =34
                                          Text: ="Name for Merge"
                                          Wrap: =false
                                          X: =30
                                          Y: ='eDefenderAdding/CodingDisclaimerLabel_1'.Y+'eDefenderAdding/CodingDisclaimerLabel_1'.Height+25
                                    - eDefenderRMTitleError:
                                        Control: Label@2.5.1
                                        MetadataKey: ErrorMessage
                                        Properties:
                                          AutoHeight: =true
                                          BorderColor: =RGBA(0, 0, 0, 1)
                                          Color: =RGBA(168, 0, 0, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =10
