Screens:
  eDefender Name Record Merges TT:
    Properties:
      BackgroundImage: =PUBDEF_IT__LOGO_Vector
      Fill: =ColorScheme.screenBackground
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnHidden: |+
        =UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
      OnVisible: |-
        =ResetForm(eDefenderRMForm);
        UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
        ClearCollect(nameRecCol,
        {
            recordNumber:123456789
        });

        Clear(nameRecCol);
        Clear(RTEImages);
        Clear(JointAttachments);
        Clear(attItems);
        UpdateContext({usingCamera:false,altImagePopUp:false});
        UpdateContext({RMPopup:false});
    Children:
      - eDefenderRMMainContainer:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: ='eDefender Name Record Merges TT'.Height
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: ='eDefender Name Record Merges TT'.Width
          Children:
            - eDefenderRMVerticalLayoutContainer:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - eDefenderRMHeaderContainer:
                      Control: GroupContainer@1.4.0
                      Variant: AutoLayout
