                                    Height: =If( 'eDefender Name Record Merges TT'.Size = 1, Parent.Height/7, Parent.Height/5)
                                    Required: =true
                                    Visible: =false
                                    Width: =1366
                                    WidthFit: =true
                                    X: =0
                                    Y: =2
                                  Children:
                                    - eDefenderRMSubCategoryLabel:
                                        Control: Label@2.5.1
                                        MetadataKey: FieldName
                                        Properties:
