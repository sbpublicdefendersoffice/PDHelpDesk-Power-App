                                          OnSelect: "=\nIf(!eDefenderReassignmentsTextInputArea.Visible,\nUpdateContext({TicketDescText:Concatenate(\"Current Case: \"&eDefenderReassignmentsTitleInput.Text&Char(13)&Char(13),\"New Case: \"&NewCaseInput.Text&Char(13)&Char(13),\"Notes: \"&TextInput5.Text)}), Notify(\"Description is Blank\"));\n\n//Check if the title or Description are empty, if they are the form will not be submitted\nIf(\n    Len(Trim(eDefenderReassignmentsTitleInput.Text))> 0 And !IsBlank(eDefenderReassignmentsLocationIDDropDown.Selected.Name) And\n    !IsEmpty(eDefenderReassignmentsAttachmentControl.Attachments),\n    UpdateContext({DataCardKey1_1: \"Title\"});\n    UpdateContext({DataCardKey5: \"Description\"});\n    //Set(DataCardKey5: \"Description\");\nSet(\n        //Temporary record\n        rec,\n        //DB operation, from Ticket table, new record, change these columns\n        Patch(\n            Tickets,\n            Defaults(Tickets),\n            {\n                Title: eDefenderReassignmentsTitleInput.Text,\n                description: Trim(eDefenderReassignmentsTextInputArea.Text),\n                creatorId: userData.id,\n                mainCategory: eDefenderReassignmentsMainCategoryDropdown.Selected.ID,\n                category: eDefenderReassignmentsSubCategoryDropdown.Selected.ID,\n                subCategory: eDefenderReassignmentsSpecificIssueDropdown.Selected.ID,\n                locationId: eDefenderReassignmentsLocationIDDropDown.Selected.ID,\n                status: \"open\",\n                metricDate: Concatenate(\n                    Month(Today()),\n                    \"/\",\n                    Year(Today())\n                ),\n                hasAttachment: If(\n                    IsEmpty(eDefenderReassignmentsAttachmentControl.Attachments),\n                    0,\n                    1\n                ),\n                //Automation rules table is used to assign tickets\n                assignedTo: If(\n  