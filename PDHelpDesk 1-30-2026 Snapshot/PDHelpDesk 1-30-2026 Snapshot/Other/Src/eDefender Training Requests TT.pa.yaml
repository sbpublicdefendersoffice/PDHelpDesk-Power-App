                                    Default: =ThisItem.Title
                                    DisplayName: =//DataSourceInfo([@Tickets],DataSourceInfo.DisplayName, "field_2")
                                    Height: =80
                                    MaxLength: =//DataSourceInfo([@Tickets], DataSourceInfo.MaxLength, "field_2")
                                    Required: =false
                                    Width: =1366
                                    WidthFit: =true
                                    X: =0
                                    Y: =0
                                  Children:
                                    - eDefenderTrainingRequestTitleLabel:
                                        Control: Label@2.5.1
                                        MetadataKey: FieldName
                                        Properties:
                                          AutoHeight: =true
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          BorderThickness: =2
                                          Color: =RGBA(255, 255, 255, 1)
                                          Fill: =ColorScheme.primary
                                          Font: =Font.'Open Sans'
                                          Height: =34
                                          Text: ="Type of Training"
                                          Wrap: =false
                                          X: =30
                                          Y: ='eDefenderAdding/CodingDisclaimerLabel_5'.Height+25
                                    - eDefenderTrainingRequestTitleError:
                                        Control: Label@2.5.1
