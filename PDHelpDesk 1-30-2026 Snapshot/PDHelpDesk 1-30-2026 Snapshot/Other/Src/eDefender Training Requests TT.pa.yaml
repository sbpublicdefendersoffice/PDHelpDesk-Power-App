                              - HomeBackgroundGradient_16:
                                  Control: HtmlViewer@2.1.0
                                  Properties:
                                    DisabledBorderColor: =RGBA(56, 56, 56, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =Parent.Height
                                    HtmlText: =Home_Background_Gradient.HtmlText
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    Width: =Parent.Width
