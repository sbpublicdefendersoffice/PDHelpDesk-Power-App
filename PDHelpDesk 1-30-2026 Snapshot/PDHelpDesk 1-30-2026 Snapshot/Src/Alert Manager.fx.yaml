        Visible: =varShowResPopup
        Width: =If('Single Ticket Info'.Size>1,Parent.Width/1.25, Parent.Width/1.05)
        X: =(Parent.Width/2 - Self.Width/2)
        Y: =(Parent.Height/2 - Self.Height/2)
        ZIndex: =6

        Rectangle_Resolution_2 As rectangle:
            BorderThickness: =1
            Fill: =RGBA(241, 244, 249, 1)
            Height: =Parent.Height
            Visible: =varShowResPopup
            Width: =Parent.Width
            X: =Parent.Width/2 - Self.Width/2
            Y: =
            ZIndex: =1

        Title_Resolution_2 As label:
            Align: =Align.Center
            Fill: =RGBA(130, 141, 158, 1)
            Height: =Parent.Height/8
            Text: ="Resolve Alert"
            Visible: =varShowResPopup
            Width: =Parent.Width
            X: =Parent.Width/2 - Self.Width/2
            ZIndex: =2

        Prompt_Resolution_2 As label:
            Align: =Align.Center
            Color: =If(Self.Text = "*Resolution Required" ,Color.Red,RGBA(0, 0, 0, 1))
            FontWeight: =FontWeight.Bold
            Height: =50
            Size: |-
                =//If('Single Ticket Info'.Size<=2,10,13)
                15
            Text: ="Provide these details to end the alert"
            Visible: =varShowResPopup
            Width: =Parent.Width
            X: =Parent.Width/2 - Self.Width/2
            Y: =Title_Resolution_2.Height
            ZIndex: =3

        Cancel_Resolution_Button_1 As button:
            Fill: =RGBA(130, 141, 158, 1)
            OnSelect: |-
                =UpdateContext({varShowResPopup:false});
            Size: =If('Single Ticket Info'.Size<=2,10,15)
            Text: |-
                ="Cancel
                "
            Visible: =varShowResPopup
            Width: =If('Single Ticket Info'.Size<=2,100,160)
            X: =(Parent.Width-Self.Width)/4
            Y: =(Parent.Height/1.15 - Self.Height/1.15)
            ZIndex: =5

        Close_Ticket_Resolution_Button_1 As button:
            Fill: =RGBA(116, 116, 116, 1)
            OnSelect: |-
                =Patch(Alerts,LookUp(Alerts,ID=selectedAlert.ID),
                {
                    dateExpired:DateTimeValue(Now()),
                    lastUpdated:DateTimeValue(Now()),
                    alertStatus: true
                });
                
                SendEmail.Run(
                    //From
                    Concatenate("pdhelpdesk@countyofsb.org"),
                            //Subject
                            TextInput2.Text,
                            //Email Body
                            RichTextEditor3.HtmlText,
                            //BCC
                            //replace with all emails
                            "mperez@countyofsb.org"
                
                );
                
                Refresh(Alerts);
                UpdateContext({varShowResPopup:false});
                Reset(TextInput2);
                Reset(RichTextEditor3);
            Size: =Cancel_Resolution_Button_1.Size
            Text: |-
                ="Resolve Alert
                "
            Visible: =varShowResPopup
            Width: =Cancel_Resolution_Button_1.Width
            X: =(3*(Parent.Width-Self.Width))/4
            Y: =Cancel_Resolution_Button_1.Y
            ZIndex: =6

        RichTextEditor3 As richTextEditor:
            Default: ="Write your email body here"
            Height: =250
            Width: =Parent.Width*.90
            X: =(Parent.Width/2 - Self.Width/2)
            Y: =Parent.Height/2 - Self.Height/3.5
            ZIndex: =7

        TextInput2 As text:
            Default: =""
            HintText: ="Enter Email Subject"
            Width: =RichTextEditor3.Width
            X: =RichTextEditor3.X
            Y: =Prompt_Resolution_2.Y+Prompt_Resolution_2.Height+40
            ZIndex: =8

        Label6 As label:
            Height: =30
            Text: |-
                ="Subject:"
            X: =RichTextEditor3.X
            Y: =TextInput2.Y-Self.Height
            ZIndex: =9

        Label6_1 As label:
            Height: =30
            Text: ="Resolution Message"
            Width: =200
            X: =RichTextEditor3.X
            Y: =RichTextEditor3.Y-Self.Height
