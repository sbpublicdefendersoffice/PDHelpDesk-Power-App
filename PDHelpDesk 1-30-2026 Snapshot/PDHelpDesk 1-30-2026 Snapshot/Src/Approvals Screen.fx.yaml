    TemplateWebMenu_5 As compWebMenu:
        Height: =If(showMenu, Parent.Height, 80)
        Visible: ='Approvals Screen'.Size > 1
        Width: =If(showMenu, Parent.Width, 80)
        ZIndex: =3

    TemplateBackButton_6 As icon.BackArrow:
        Color: =Color.White
        Height: =TemplateLabel_4.Height/1.05
