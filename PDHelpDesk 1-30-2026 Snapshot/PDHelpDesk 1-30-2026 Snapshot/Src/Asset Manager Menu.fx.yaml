"'Asset Manager Menu' As screen.'tabletAutoLayout_HeaderMainFooter_ver1.0'":
    BackgroundImage: =PUBDEF_IT__LOGO_Vector
    Fill: =ColorScheme.screenBackground
    OnHidden: =
    OnVisible: |-
        =UpdateContext({assetManageRefresh:false,amTimer:false});
        Set(amSelection,"")

    "'Asset ManagerContainer' As groupContainer.verticalAutoLayoutContainer":
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Stretch
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGridColumns: =6
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        Width: =Parent.Width
        ZIndex: =1

        "'Asset ManagerHeaderContainer' As groupContainer.horizontalAutoLayoutContainer":
            AlignInContainer: =AlignInContainer.SetByContainer
            FillPortions: =0
            Height: =130
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumns: =6
            LayoutGridRows: =6
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =100
            LayoutMinWidth: =250
            LayoutMode: =LayoutMode.Auto
            Width: =Parent.Width
            ZIndex: =2

            "'Asset ManagerHeaderElements' As groupContainer.manualLayoutContainer":
                LayoutGridColumns: =6
                LayoutGridRows: =6
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =100
                LayoutMinWidth: =250
                ZIndex: =3

                HomeBackgroundGradient_70 As htmlViewer:
                    DisabledBorderColor: =RGBA(56, 56, 56, 1)
                    Height: =Parent.Height
                    HtmlText: =Home_Background_Gradient.HtmlText
                    PaddingBottom: =0
                    PaddingLeft: =0
                    PaddingRight: =0
                    PaddingTop: =0
                    Width: =Parent.Width
                    ZIndex: =1

                AssetManagerLabel As label:
                    Align: =Align.Center
                    Color: =Color.White
                    Fill: =Color.Transparent
                    Height: =Parent.Height-'Asset ManagerWebHeader'.Height
                    Size: =If('Asset Manager Menu'.Size=1, titleText.mobileSize, titleText.desktopSize)
                    Text: =If(IsBlank(amSelection),"Asset Manager",If(amSelection = "Computer Assets", "Computer Asset Manager", "Equipment Asset Manager"))
                    Width: =Parent.Width
                    Y: ='Asset ManagerWebHeader'.Height
                    ZIndex: =2

                "'Asset ManagerWebHeader' As compWebHeader":
                    BackgroundColor: =Color.Transparent
                    CompScreenSize: ='Asset Manager Menu'.Size
                    EnableFeedback: =Set(varFeedback,true)
                    ZIndex: =3

        "'Asset ManagerMainSectionContainer' As groupContainer.verticalAutoLayoutContainer":
            AlignInContainer: =AlignInContainer.SetByContainer
            Fill: =ColorScheme.screenBackgroundSeeThroughMid
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumns: =6
            LayoutGridRows: =6
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =100
            LayoutMinWidth: =250
            LayoutMode: =LayoutMode.Auto
            ZIndex: =6

            "'Asset Manager Selection Gallery' As gallery.galleryVertical":
                '#CopilotOverlayLabel': ="Filtered"
                AlignInContainer: =AlignInContainer.SetByContainer
                Height: =Parent.Height
                Items: |
                    =
                    Table(
                        {
                            MenuText: "Computer Assets",
                            MenuIcon: Icon.Devices
                        },
                        {
                            MenuText: "Equipment Assets",
                            MenuIcon: Icon.Scan
                        }
                    )
                Layout: =Layout.Vertical
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =287
                LayoutMinWidth: =320
                OnSelect: =
                ShowScrollbar: =false
                TemplateSize: =200
                Visible: =IsBlank(amSelection)
                Width: =Parent.Width
                WrapCount: =Switch('Asset Manager Menu'.Size, ScreenSize.Small, 2, ScreenSize.Medium, 2, ScreenSize.Large, 3, 3)
                ZIndex: =1

                HtmlText1_9 As htmlViewer:
                    DisabledBorderColor: =RGBA(56, 56, 56, 1)
                    DisplayMode: =DisplayMode.View
                    Height: =175
                    HtmlText: |-
                        =// you can use inline Css to create effects that can be found in modern webapps
                        //you cannot link style sheets
                        //some elements of html are not supported
                        //you can include variables in the html string by adding "&PowerAppsVar&" 
                        "<div style='box-shadow: 23px 21px 33px 8px rgba(0,0,0,.025);
                        -webkit-box-shadow: 23px 21px 33px 8px rgba(0,0,0,.025);
                        -moz-box-shadow: 23px 21px 33px 8px rgba(0,0,0,.025); height:"&ButtonGalleryBackgroundButton_6.Height-11&"px; width:"&ButtonGalleryBackgroundButton_6.Width-11&"px; border-style:none; border-radius:10px'></div>"
                    OnSelect: =Select(Parent)
                    Size: =11
                    Width: =Parent.TemplateWidth
                    Y: =25
                    ZIndex: =1

                ButtonGalleryBackgroundButton_6 As button:
                    BorderStyle: =BorderStyle.Dashed
                    BorderThickness: =0
                    Color: =ColorScheme.secondary
                    Fill: =ColorScheme.primary
                    Height: |-
                        =//If('Admin Manager'.Size =1 , Parent.Height/2.5, Parent.Height/4)
                        Parent.TemplateHeight-50
                    OnSelect: =Select(Parent)
                    Text: =""
                    Width: =If('Asset Manager Menu'.Size = 1, Parent.Width/2.5, Parent.Width/3.5)
                    X: =(Parent.TemplateWidth - Self.Width)/2
                    Y: =(Parent.TemplateHeight - Self.Height)/2
                    ZIndex: =2

                GalleryButtonColorGradient_9 As htmlViewer:
                    DisabledBorderColor: =RGBA(56, 56, 56, 1)
                    Height: =ButtonGalleryBackgroundButton_6.Height
                    HtmlText: |-
                        =Home_Gallery_Button_Color_Gradient.HtmlText
                        /*"<div style='
                        height:"&Self.Height-1&"px;
                        width:100%;
                        bbackground: rgb(53,89,137);
                        background: linear-gradient(90deg, rgba(180,194,203,1) 0% , rgba(126,149,180,1) 25%, rgba(53,89,137,1) "&100&"%); -webkit-border-radius: 10px;
                        -moz-border-radius: 10px;
                        border-radius: 10px;' ></div>"*/
                    PaddingBottom: =0
                    PaddingLeft: =0
                    PaddingRight: =0
                    PaddingTop: =0
                    Size: =11
                    Width: =ButtonGalleryBackgroundButton_6.Width
                    X: =ButtonGalleryBackgroundButton_6.X
                    Y: =ButtonGalleryBackgroundButton_6.Y
                    ZIndex: =3

                ButtonGalleryNavIcon_6 As icon:
                    Color: =Color.White
                    Height: =Parent.TemplateHeight - 150
                    Icon: =ThisItem.MenuIcon
                    OnSelect: =Select(Parent)
                    Width: =Overlapbtn_7.Width
                    X: =(Parent.TemplateWidth-Self.Width)/2
                    Y: =(ButtonGalleryBackgroundButton_6.Height-Self.Height)/2
                    ZIndex: =4

                ButtonGalleryNavLabel_5 As label:
                    Align: =Align.Center
                    Color: =Color.White
                    FontWeight: =FontWeight.Semibold
                    Height: =50
                    OnSelect: =Select(Parent)
                    Size: =If('Asset Manager Menu'.Size =1,11,15)
                    Text: =ThisItem.MenuText
                    Width: =Overlapbtn_7.Width
                    X: =ButtonGalleryNavIcon_6.X
                    Y: =ButtonGalleryNavIcon_6.Y+ButtonGalleryNavIcon_6.Height
                    ZIndex: =5

                Overlapbtn_7 As button:
                    Fill: =RGBA(255, 255, 255, 0)
                    Height: =ButtonGalleryBackgroundButton_6.Height
                    HoverFill: =ColorFade(RGBA(105,105,105,.35),-10%)
                    OnSelect: =Set(amSelection,ThisItem.MenuText)
                    PressedFill: =ColorFade(RGBA(105,105,105,.7),-50%)
                    Text: =""
                    Width: =ButtonGalleryBackgroundButton_6.Width
                    X: =ButtonGalleryBackgroundButton_6.X
                    Y: =ButtonGalleryBackgroundButton_6.Y
                    ZIndex: =6

            "'Asset ManagerButtonGallery' As gallery.galleryVertical":
                '#CopilotOverlayLabel': ="Filtered"
                AlignInContainer: =AlignInContainer.SetByContainer
                Height: =Parent.Height
                Items: |-
                    =Table(
                        {
                            MenuText: "Add New Asset",
                            MenuIcon: Icon.AddDocument,
                            ScreenToGoTo: NewAsset
                        },
                        {
                            MenuText: "Find Asset",
                            MenuIcon: Icon.Search,
                            ScreenToGoTo: Assets
                        },
                        {
                            MenuText: "Asset Metrics",
                            MenuIcon: Icon.Trending,
                            ScreenToGoTo: AssetMetrics
                        }
                    )
                Layout: =Layout.Vertical
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =287
                LayoutMinWidth: =320
                OnSelect: =//Switch(ThisItem.MenuText, "All Tickets", Navigate('All Tickets'), "Tag Manager", Navigate('Tag Manager'), "Alert Manager", Navigate('Alert Manager'), "Ticket Metrics", Navigate('Ticket Metrics - Admin Tech'), "Assign Role", Navigate('Assign Role - Admin'))
                ShowScrollbar: =false
                TemplateSize: =200
                Visible: =!IsBlank(amSelection)
                Width: =Parent.Width
                WrapCount: =Switch('Asset Manager Menu'.Size, ScreenSize.Small, 2, ScreenSize.Medium, 2, ScreenSize.Large, 3, 3)
                ZIndex: =2

                HtmlText1_8 As htmlViewer:
                    DisabledBorderColor: =RGBA(56, 56, 56, 1)
                    DisplayMode: =DisplayMode.View
                    Height: =175
                    HtmlText: |-
                        =// you can use inline Css to create effects that can be found in modern webapps
                        //you cannot link style sheets
                        //some elements of html are not supported
                        //you can include variables in the html string by adding "&PowerAppsVar&" 
                        "<div style='box-shadow: 23px 21px 33px 8px rgba(0,0,0,.025);
                        -webkit-box-shadow: 23px 21px 33px 8px rgba(0,0,0,.025);
                        -moz-box-shadow: 23px 21px 33px 8px rgba(0,0,0,.025); height:"&ButtonGalleryBackgroundButton_5.Height-11&"px; width:"&ButtonGalleryBackgroundButton_5.Width-11&"px; border-style:none; border-radius:10px'></div>"
                    OnSelect: =Select(Parent)
                    Width: =Parent.TemplateWidth
                    Y: =25
                    ZIndex: =1

                ButtonGalleryBackgroundButton_5 As button:
                    BorderStyle: =BorderStyle.Dashed
                    BorderThickness: =0
                    Color: =ColorScheme.secondary
                    Fill: =ColorScheme.primary
                    Height: |-
                        =//If('Admin Manager'.Size =1 , Parent.Height/2.5, Parent.Height/4)
                        Parent.TemplateHeight-50
                    OnSelect: =Select(Parent)
                    Text: =""
                    Width: =If('Asset Manager Menu'.Size = 1, Parent.Width/2.5, Parent.Width/3.5)
                    X: =(Parent.TemplateWidth - Self.Width)/2
                    Y: =(Parent.TemplateHeight - Self.Height)/2
                    ZIndex: =2

                GalleryButtonColorGradient_8 As htmlViewer:
                    DisabledBorderColor: =RGBA(56, 56, 56, 1)
                    Height: =ButtonGalleryBackgroundButton_5.Height
                    HtmlText: |-
                        =Home_Gallery_Button_Color_Gradient.HtmlText
                        /*"<div style='
                        height:"&Self.Height-1&"px;
                        width:100%;
                        bbackground: rgb(53,89,137);
                        background: linear-gradient(90deg, rgba(180,194,203,1) 0% , rgba(126,149,180,1) 25%, rgba(53,89,137,1) "&100&"%); -webkit-border-radius: 10px;
                        -moz-border-radius: 10px;
                        border-radius: 10px;' ></div>"*/
                    PaddingBottom: =0
                    PaddingLeft: =0
                    PaddingRight: =0
                    PaddingTop: =0
                    Width: =ButtonGalleryBackgroundButton_5.Width
                    X: =ButtonGalleryBackgroundButton_5.X
                    Y: =ButtonGalleryBackgroundButton_5.Y
                    ZIndex: =3

                ButtonGalleryNavIcon_5 As icon.Add:
                    Color: =Color.White
                    Height: =Parent.TemplateHeight - 150
                    Icon: =ThisItem.MenuIcon
                    OnSelect: =Select(Parent)
                    Width: =Overlapbtn_6.Width
                    X: =(Parent.TemplateWidth-Self.Width)/2
                    Y: =(ButtonGalleryBackgroundButton_5.Height-Self.Height)/2
                    ZIndex: =4

                ButtonGalleryNavLabel_4 As label:
                    Align: =Align.Center
                    Color: =Color.White
                    FontWeight: =FontWeight.Semibold
                    Height: =50
                    OnSelect: =Select(Parent)
                    Size: =If('Asset Manager Menu'.Size =1,11,15)
                    Text: =ThisItem.MenuText
                    Width: =Overlapbtn_6.Width
                    X: =ButtonGalleryNavIcon_5.X
                    Y: =ButtonGalleryNavIcon_5.Y+ButtonGalleryNavIcon_5.Height
                    ZIndex: =5

                Overlapbtn_6 As button:
                    Fill: =RGBA(255, 255, 255, 0)
                    Height: =ButtonGalleryBackgroundButton_5.Height
                    HoverFill: =ColorFade(RGBA(105,105,105,.35),-10%)
                    OnSelect: =Navigate(ThisItem.ScreenToGoTo,ScreenTransition.Fade)
                    PressedFill: =ColorFade(RGBA(105,105,105,.7),-50%)
                    Text: =""
                    Width: =ButtonGalleryBackgroundButton_5.Width
                    X: =ButtonGalleryBackgroundButton_5.X
                    Y: =ButtonGalleryBackgroundButton_5.Y
                    ZIndex: =6

        "'Asset ManagerFooter' As groupContainer.verticalAutoLayoutContainer":
            Fill: =RGBA(255,255,255, 1)
            FillPortions: =0
            Height: =60
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumns: =6
            LayoutGridRows: =6
            LayoutJustifyContent: =LayoutJustifyContent.Center
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =100
            LayoutMinWidth: =250
            LayoutMode: =LayoutMode.Auto
            Visible: |
                ='Asset Manager Menu'.Size =1
            Width: =Parent.Width
            ZIndex: =14

            "'Asset ManagerMobileMenu' As compMobileMenu":
                Height: =Parent.Height
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =640
                LayoutMinWidth: =640
                Width: =Parent.Width

    "'Asset ManagerBackButton' As icon.BackArrow":
        Color: =Color.White
        Height: =AssetManagerLabel.Height/1.05
        Icon: =Icon.BackArrow
        OnSelect: =Back(ScreenTransition.Fade)
        Width: =49
        X: =Self.Width/5 
        Y: =('Asset ManagerHeaderContainer'.Height-AssetManagerLabel.Height)/1.05
        ZIndex: =2

    "'Asset ManagerWebMenu' As compWebMenu":
        Height: =If(showMenu, Parent.Height, 80)
        Visible: ='Asset Manager Menu'.Size > 1
        Width: =If(showMenu, Parent.Width, 80)
        ZIndex: =3

    "'FeedbackBugReportAsset Manager' As FeedbackBugReport":
        CloseReport: =Set(varFeedback,false)
        DisablePickMedia: =Set(PickMedia,false)
        EnablePickMedia: =Set(PickMedia,true)
        FeedbackCameraOff: =Set(FeedbackCamera,false);
        FeedbackCameraOn: =Set(FeedbackCamera,true);
        PhotoModeDisable: =Set(FeedbackPhoto,false)
        PhotoModeEnable: =Set(FeedbackPhoto,true)
        Visible: =varFeedback
        ZIndex: =4

    AMTimer As timer:
        AutoPause: =false
        AutoStart: =amTimer
        Duration: =1000
        OnTimerEnd: |-
            =UpdateContext({assetManageRefresh:true,amTimer:false})
        Visible: =false
        X: =40
        Y: =40
        ZIndex: =5

