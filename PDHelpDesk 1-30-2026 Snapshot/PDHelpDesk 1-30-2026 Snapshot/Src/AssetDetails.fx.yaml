"AssetDetails As screen.'tabletAutoLayout_HeaderMainFooter_ver1.0'":
    BackgroundImage: =PUBDEF_IT__LOGO_Vector
    Fill: =ColorScheme.screenBackground
    OnHidden: |-
        =ResetForm(AssetDetailsForm);
        If(!IsEmpty(Gallery20.AllItems),Select(Gallery20,1))
    OnVisible: |+
        =//Clear the collections
        //Figure out which mode we are in
        
        If(IsBlank(computerAsset),Set(jsonCommentString,GetAssetComments.Run(equipmentAsset.ID,"Equipment").commentsjson),Set(jsonCommentString,GetAssetComments.Run(computerAsset.ID,"Computer").commentsjson));
        Clear(RTEImages);
        Clear(JointAttachments);
        Clear(attItems);
        UpdateContext({TemplateErrorPopup:false, assetFormError:false,prepAsset:false,deleteAsset:false});
        UpdateContext({assetEmail:""});
        ClearCollect(AssetComments, 
        If(jsonCommentString <> "",Sort(ForAll(Table(ParseJSON(jsonCommentString)),
        {
            Comment: Text(Value.CommentText),
            CommentDate: DateTimeValue(Value.CommentDate),
            CommentAuthor: Text(Value.CommentAuthor),
            CommentID: Value(Value.CommentID)
        }),CommentDate,SortOrder.Ascending),Table()))
        

    AssetDetailsContainer As groupContainer.verticalAutoLayoutContainer:
        Height: =Parent.Height
