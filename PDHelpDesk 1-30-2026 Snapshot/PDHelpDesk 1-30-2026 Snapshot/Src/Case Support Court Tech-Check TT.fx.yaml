                                =
                                //could use this to enable/disable button behaviour
                                //If(CreateATicketForm_1.Valid, DisplayMode.Edit, DisplayMode.Disabled)
                                
                                DisplayMode.Edit
                            Fill: =ColorScheme.primary
                            Height: =CSCTCCancelButton.Height
                            OnSelect: |
                                =
                                If(!CSCTCDescriptionTextInputArea.Visible,
                                UpdateContext({TicketDescText:Concatenate("Date: "&DateValue(DatePicker2.SelectedDate)&Char(13),"Time: "&Dropdown5.Selected.Value&":"&Dropdown5_1.Selected.Value&" "&Dropdown5_2.Selected.Value&Char(13)&Char(13),"Court: "&ExFieldInput1_46.Text&Char(13),"Court Room: "&ExFieldInput2_45.Text&Char(13)&Char(13), "Tech Check Details:"&Char(13)&TextInput8.Text)}), Notify("Description is Blank"));
                                
