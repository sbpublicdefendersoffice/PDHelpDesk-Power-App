"'Case Support Disc Burning TT' As screen":
    BackgroundImage: =PUBDEF_IT__LOGO_Vector
    Fill: =ColorScheme.screenBackground
    OnHidden: |
        =UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
    OnVisible: |-
        =ResetForm(CSDiscBurningForm);
        UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
        UpdateContext({cdCount:0});
        
        ClearCollect(cdItems,
        {
            fileName:"SpongebobEp1.mp4",
            filePath:"V:/Pubdef/TV/SpongebobSquarepantsSeason1"
        });
        
        ClearCollect(CDsToBurn,
        {
            number:cdCount,
            cdContents: cdItems,
            copies:1
        });
        
        Clear(CDsToBurn);

    CSDiscBurningMainContainer As groupContainer.horizontalAutoLayoutContainer:
        Height: ='Case Support Disc Burning TT'.Height
        LayoutGridColumns: =6
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        Width: ='Case Support Disc Burning TT'.Width
        ZIndex: =1

        CSDiscBurningVerticalLayoutContainer As groupContainer.verticalAutoLayoutContainer:
            AlignInContainer: =AlignInContainer.SetByContainer
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumns: =6
            LayoutGridRows: =6
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =100
            LayoutMinWidth: =250
            LayoutMode: =LayoutMode.Auto
            ZIndex: =2

            CSDiscBurningHeaderContainer As groupContainer.verticalAutoLayoutContainer:
                AlignInContainer: =AlignInContainer.SetByContainer
                Fill: =ColorScheme.primary
                FillPortions: =0
                Height: |-
                    =130
                    //Parent.Height/11
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutDirection: =LayoutDirection.Vertical
                LayoutGridColumns: =6
                LayoutGridRows: =6
                LayoutJustifyContent: =LayoutJustifyContent.Center
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =100
                LayoutMinWidth: =250
                LayoutMode: =LayoutMode.Auto
                Visible: |-
                    =//Home.Size<>1
                    //This is the top most header container that houses the navbar links
                    true
                Width: =Parent.Width
                ZIndex: =1

                DiscBurningHeaderElements As groupContainer.manualLayoutContainer:
                    LayoutGridColumns: =6
                    LayoutGridRows: =6
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =100
                    LayoutMinWidth: =250
                    ZIndex: =4

                    HomeBackgroundGradient_52 As htmlViewer:
                        DisabledBorderColor: =RGBA(56, 56, 56, 1)
                        Height: =Parent.Height
                        HtmlText: =Home_Background_Gradient.HtmlText
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Width: =Parent.Width
                        ZIndex: =1

                    CSDiscBurningHeaderLabel As label:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =Color.Transparent
                        Height: =Parent.Height-CSDiscBurningWebHeader.Height
                        Size: =If('Case Support Disc Burning TT'.Size=1, titleText.mobileSize, titleText.desktopSize)
                        Text: ="Disc Burning Request Form"
                        Width: =Parent.Width
                        Y: =CSDiscBurningWebHeader.Height
                        ZIndex: =2

                    CSDiscBurningWebHeader As compWebHeader:
                        BackgroundColor: =Color.Transparent
                        CompScreenSize: ='Case Support Disc Burning TT'.Size
                        EnableFeedback: =Set(varFeedback,true)
                        ZIndex: =3

            CSDiscBurningMainContentContainer As groupContainer.verticalAutoLayoutContainer:
                AlignInContainer: =AlignInContainer.SetByContainer
                Fill: =ColorScheme.screenBackgroundSeeThroughMid
                Height: =Parent.Height/1.21
                LayoutDirection: =LayoutDirection.Vertical
                LayoutGridColumns: =6
                LayoutGridRows: =6
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =100
                LayoutMinWidth: =250
                LayoutMode: =LayoutMode.Auto
                LayoutOverflowY: =LayoutOverflow.Scroll
                Visible: |-
                    =true
                    //Main Content container this houses certian elements such as the searchbar, and 2 button galleries, one for desktop, and another for mobile
                Width: =Parent.Width
                ZIndex: =3

                CSDiscBurningForm As form:
                    AlignInContainer: =AlignInContainer.SetByContainer
                    DataSource: =Tickets
                    DefaultMode: =FormMode.New
                    Height: =Parent.Height/1.21
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =250
                    LayoutMinWidth: =400
                    NumberOfColumns: =1
                    Width: =Parent.Width
                    Y: =Parent.Height/5.7
                    ZIndex: =1

                    CSDiscBurningTitle_DataCard As typedDataCard.textualEditCard:
                        BorderStyle: =BorderStyle.Solid
                        DataField: ="title"
                        Default: =ThisItem.Title
                        DisplayMode: =Parent.DisplayMode
                        DisplayName: =//DataSourceInfo([@Tickets],DataSourceInfo.DisplayName, "field_2")
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =80
                        MaxLength: =//DataSourceInfo([@Tickets], DataSourceInfo.MaxLength, "field_2")
                        Required: =false
                        Update: =
                        Width: =1366
                        WidthFit: =true
                        X: =0
                        Y: =0
                        ZIndex: =1

                        CSDiscBurningTitleLabel As label:
                            AutoHeight: =true
                            BorderColor: =RGBA(0, 18, 107, 1)
                            BorderThickness: =2
                            Color: =RGBA(255, 255, 255, 1)
                            Fill: =ColorScheme.primary
                            Height: =34
                            Text: ="Case Number"
                            Width: =130
                            Wrap: =false
                            X: =30
                            Y: =10
                            ZIndex: =1

                        CSDiscBurningTitleError As label:
                            AutoHeight: =true
                            Height: =10
                            Live: =Live.Assertive
                            PaddingBottom: =0
                            PaddingLeft: =0
                            PaddingRight: =0
                            PaddingTop: =0
                            Text: =Parent.Error
                            Visible: =Parent.DisplayMode=DisplayMode.Edit
