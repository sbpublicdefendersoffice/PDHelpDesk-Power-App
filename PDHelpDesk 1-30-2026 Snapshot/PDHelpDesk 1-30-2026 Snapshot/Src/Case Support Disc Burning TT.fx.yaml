                            Width: =30
                            Wrap: =false
                            Y: =10
                            ZIndex: =4

                        CSDiscBurningMainCategoryDropdown As dropdown:
                            Default: =LookUp(Category, ID = TicketCategoryID, Name)
                            Height: =Parent.Height/3.5
                            Items: =(If(is_admin, Filter(Category, parentId = Blank()), Filter(Category, parentId = Blank(),technicianOnly=0)))
                            Width: =Parent.Width/1.05
                            X: =30
                            Y: =44
                            ZIndex: =5

                    CSDiscBurningSubCategory_DataCard As typedDataCard.numberEditCard:
                        BorderStyle: =BorderStyle.Solid
                        DataField: ="category"
                        Default: =ThisItem.category
                        DisplayMode: =Parent.DisplayMode
                        DisplayName: =DataSourceInfo([@Tickets],DataSourceInfo.DisplayName,Name)
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =If( 'Case Support Disc Burning TT'.Size = 1, Parent.Height/7, Parent.Height/5)
                        Required: =true
                        Update: =
                        Visible: =false
                        Width: =1366
                        WidthFit: =true
                        X: =0
                        Y: =2
                        ZIndex: =1

                        CSDiscBurningSubCategoryLabel As label:
                            AutoHeight: =true
                            Height: =34
                            Text: ="Sub Category"
                            Width: =Parent.Width - 60
                            Wrap: =false
                            X: =30
                            Y: =10
                            ZIndex: =1

                        CSDiscBurningSubcategoryError As label:
                            AutoHeight: =true
                            Height: =10
                            Live: =Live.Assertive
                            PaddingBottom: =0
                            PaddingLeft: =0
                            PaddingRight: =0
                            PaddingTop: =0
                            Text: =Parent.Error
                            Visible: =Parent.DisplayMode=DisplayMode.Edit
                            Width: =Parent.Width - 60
                            X: =30
                            Y: =73
                            ZIndex: =3

                        CSDiscBurningSubcategoryStarVisible As label:
                            Align: =Align.Center
                            Height: =CSDiscBurningSubCategoryLabel.Height
                            Text: ="*"
                            Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                            Width: =30
                            Wrap: =false
                            Y: =CSDiscBurningSubCategoryLabel.Y
                            ZIndex: =4

                        CSDiscBurningSubCategoryDropdown As dropdown:
                            Default: =LookUp(Category, ID = TicketSubCategoryID, Name)
                            Height: =Parent.Height/3.5
                            Items: =Filter(Category, parentId = CSDiscBurningMainCategoryDropdown.Selected.ID)
                            Width: =Parent.Width/1.05
                            X: =30
                            Y: =44
                            ZIndex: =5

                    CSDiscBurningFields As typedDataCard.blankCard:
                        BorderStyle: =BorderStyle.Solid
                        DisplayMode: =DisplayMode.Edit
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =Container10.Height+Container11.Height
                        Width: =Parent.Width
                        WidthFit: =true
                        X: =0
                        Y: =3
                        ZIndex: =1

                        Container11 As groupContainer.manualLayoutContainer:
                            Height: =Label25.Y+50
                            LayoutGridColumns: =6
                            LayoutGridRows: =6
                            Visible: =!IsBlank(Gallery9.Selected)
                            Width: =Parent.Width
                            Y: =Container10.Height
                            ZIndex: =1

                            Group17 As group:
                                Height: =5
                                Width: =5
                                X: =40
                                Y: =40
                                ZIndex: =18

                                AddItemsToCDHeader As rectangle:
                                    Fill: =ColorScheme.primary
                                    Height: =50
                                    Width: =CSDiscBurningTitleInput.Width
                                    X: =30
                                    Y: =20
                                    ZIndex: =10

                                AddItemsToCDHeaderTitle As label:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    Height: =50
                                    Size: =Label19.Size
                                    Text: |-
                                        ="Enter Items for Request #"&Gallery9.Selected.number
                                    Width: =AddItemsToCDHeader.Width
                                    X: =30
                                    Y: =AddItemsToCDHeader.Y
                                    ZIndex: =11

                                Rectangle6 As rectangle:
                                    BorderThickness: =1
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =If('Case Support Disc Burning TT'.Size=1,150,50)
                                    Width: =CSDiscBurningTitleInput.Width
                                    X: =30
                                    Y: =Label22.Y+Label22.Height
                                    ZIndex: =12

                                Label22 As label:
                                    Align: =Align.Center
                                    BorderThickness: =1
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Text: ="File Name"
                                    Width: =If('Case Support Disc Burning TT'.Size=1,Rectangle6.Width,Rectangle6.Width/2)
                                    X: =30
                                    Y: =AddItemsToCDHeader.Y+AddItemsToCDHeader.Height
                                    ZIndex: =13

                                Label22_1 As label:
                                    Align: =Align.Center
                                    BorderThickness: =1
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Text: ="File Path"
                                    Width: |
                                        =Label22.Width
                                    X: =If('Case Support Disc Burning TT'.Size=1,30,Label22.X+Label22.Width)
                                    Y: =If('Case Support Disc Burning TT'.Size=1,TextInput4.Y+TextInput4.Height+5,AddItemsToCDHeader.Y+AddItemsToCDHeader.Height)
                                    ZIndex: =14

                                TextInput4_1 As text:
                                    Default: =If(IsBlank(Gallery7.Selected),Blank(),Gallery7.Selected.filePath)
                                    Width: =Label22.Width-10
                                    X: =If('Case Support Disc Burning TT'.Size=1,35,TextInput4.X + TextInput4.Width+10)
                                    Y: =Label22_1.Y+Label22_1.Height+5
                                    ZIndex: =16

                                TextInput4 As text:
                                    Default: =If(IsBlank(Gallery7.Selected),Blank(),Gallery7.Selected.fileName)
                                    Width: =Label22.Width-10
                                    X: =35
                                    Y: =If('Case Support Disc Burning TT'.Size=1,Label22.Y+Label22.Height+5,Rectangle6.Y+Rectangle6.Height-Self.Height-5)
                                    ZIndex: =17

                                Button1 As button:
                                    Fill: =ColorScheme.primary
                                    OnSelect: |-
                                        =Clear(cdItems);
                                        
                                        ClearCollect(cdItems,LookUp(CDsToBurn, Gallery9.Selected.number = number).cdContents);
                                        
                                        If(IsBlank(Gallery7.Selected),
                                        
                                        Collect(cdItems, {fileName:TextInput4.Text,filePath:TextInput4_1.Text});,
                                        
                                        Patch(cdItems, LookUp(cdItems, Gallery7.Selected.fileName = fileName && Gallery7.Selected.filePath =filePath),
                                        {
                                            fileName:TextInput4.Text,
                                            filePath:TextInput4_1.Text
                                        
                                        }););
                                        
                                        Patch(CDsToBurn, LookUp(CDsToBurn, Gallery9.Selected.number = number), 
                                        {
                                            cdContents:cdItems
                                        });
                                        
                                        
                                        Clear(cdItems);
                                        Reset(Gallery7);
                                        Reset(TextInput4);
                                        Reset(TextInput4_1);
                                    Text: =If(IsBlank(Gallery7.Selected),"Add to Disc", "Update item")
                                    X: =If('Case Support Disc Burning TT'.Size=1,(Parent.Width-Self.Width)/2,(Parent.Width-Self.Width)/2 -Rectangle6.X)
                                    Y: =Rectangle6.Y+Rectangle6.Height+30
                                    ZIndex: =18

                            Group16 As group:
                                Height: =5
                                Width: =5
                                X: =40
                                Y: =40
                                ZIndex: =21

                                ItemListHeader As rectangle:
                                    Fill: =ColorScheme.primary
                                    Height: =50
                                    OnSelect: =
                                    Visible: =!IsEmpty(Gallery9.Selected.cdContents)
                                    Width: =CSDiscBurningTitleInput.Width
                                    X: =30
                                    Y: =Button1.Y+Button1.Height+20
                                    ZIndex: =1

                                ItemListHeaderTitle As label:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    Height: =50
                                    OnSelect: ='Case Support Disc Burning TT'.Size>1 && !IsEmpty(Gallery9.Selected.cdContents)
                                    Size: =Label19.Size
                                    Text: |-
                                        ="Items to burn for Request #"&Gallery9.Selected.number
                                    Visible: =!IsEmpty(Gallery9.Selected.cdContents)
                                    Width: =ItemListHeader.Width
                                    X: =30
                                    Y: =ItemListHeader.Y
                                    ZIndex: =2

                                Label22_2 As label:
                                    Align: =Align.Center
                                    BorderThickness: =1
                                    Fill: =RGBA(255, 255, 255, 1)
                                    OnSelect: ='Case Support Disc Burning TT'.Size>1 && !IsEmpty(Gallery9.Selected.cdContents)
                                    Text: ="File Name"
                                    Visible: ='Case Support Disc Burning TT'.Size>1 && !IsEmpty(Gallery9.Selected.cdContents)
                                    Width: |
                                        =Rectangle6.Width/2
                                    X: =30
                                    Y: =ItemListHeader.Y+ItemListHeader.Height
                                    ZIndex: =3

                                Gallery7 As gallery.variableTemplateHeightGallery:
                                    '#CopilotOverlayLabel': ="Filtered"
                                    BorderThickness: =1
                                    Default: ={}
                                    DelayItemLoading: =true
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =200
                                    Items: =Gallery9.Selected.cdContents
                                    Layout: =Layout.Vertical
                                    LoadingSpinner: =LoadingSpinner.Data
                                    TemplatePadding: =0
                                    TemplateSize: =50
                                    Visible: ='Case Support Disc Burning TT'.Size>1 && !IsEmpty(Gallery9.Selected.cdContents)
                                    Width: =AddItemsToCDHeader.Width
                                    X: =30
                                    Y: |
                                        =Label22_2.Y+Label22_2.Height
                                    ZIndex: =4

                                    Label24 As label:
                                        Align: =Align.Center
                                        BorderThickness: =1
                                        Height: =50
                                        OnSelect: =Select(Parent)
                                        Text: =ThisItem.fileName
                                        Width: =Parent.TemplateWidth/2
                                        ZIndex: =1

                                    Label24_1 As label:
                                        Align: =Align.Center
                                        BorderThickness: =1
                                        Height: =50
                                        OnSelect: =Select(Parent)
                                        Text: =ThisItem.filePath
                                        Width: =Parent.TemplateWidth/2
                                        X: =Label24.X+Label24.Width
                                        ZIndex: =2

                                    Button15 As button:
                                        Color: =RGBA(0, 0, 0, 0)
                                        Fill: =RGBA(0, 0, 0, 0)
                                        Height: =50
                                        HoverFill: =RGBA(99, 139, 44, .35)
                                        OnSelect: =Select(Parent)
                                        PressedFill: =RGBA(99, 139, 44, .50)
                                        Text: ="Edit Entry"
                                        Width: =Parent.TemplateWidth/2
                                        ZIndex: =3

                                    Button15_1 As button:
                                        Color: =RGBA(0, 0, 0, 0)
                                        Fill: =RGBA(0, 0, 0, 0)
                                        Height: =50
                                        HoverFill: =RGBA(151, 0, 0, .35)
                                        OnSelect: |-
                                            =Clear(cdItems);
                                            Collect(cdItems,LookUp(CDsToBurn,Gallery9.Selected.number = number).cdContents);
                                            
                                            Remove(cdItems,ThisItem);
                                            
                                            Patch(CDsToBurn,LookUp(CDsToBurn,Gallery9.Selected.number=number),
                                            {
                                                cdContents:cdItems
                                            });
                                            Clear(cdItems);
                                        PressedFill: =RGBA(151, 0, 0, .50)
                                        Text: ="Delete Entry"
                                        Width: =Parent.TemplateWidth/2
                                        X: =Button15.X+Button15.Width
                                        ZIndex: =4

                                Label22_3 As label:
                                    Align: =Align.Center
                                    BorderThickness: =1
                                    Fill: =RGBA(255, 255, 255, 1)
                                    OnSelect: ='Case Support Disc Burning TT'.Size>1 && !IsEmpty(Gallery9.Selected.cdContents)
                                    Text: ="File Path"
                                    Visible: ='Case Support Disc Burning TT'.Size>1 && !IsEmpty(Gallery9.Selected.cdContents)
                                    Width: |
                                        =Rectangle6.Width/2
                                    X: =Label22_2.X+Label22_2.Width
                                    Y: =ItemListHeader.Y+ItemListHeader.Height
                                    ZIndex: =5

                                Label25 As label:
                                    OnSelect: ='Case Support Disc Burning TT'.Size>1 && !IsEmpty(Gallery9.Selected.cdContents)
                                    Text: |-
                                        ="Copies:"
                                    Visible: =!IsEmpty(Gallery9.Selected.cdContents)
                                    Width: =72
                                    X: =(Parent.Width-Self.Width)/2-Self.Width
                                    Y: =If('Case Support Disc Burning TT'.Size=1,'Video/AudioEditingMobileGallery_4'.Y+'Video/AudioEditingMobileGallery_4'.Height+10,Gallery7.Y+Gallery7.Height+10)
                                    ZIndex: =6

                                Label26 As label:
                                    Align: =Align.Center
                                    BorderThickness: =1
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =20
                                    OnSelect: ='Case Support Disc Burning TT'.Size>1 && !IsEmpty(Gallery9.Selected.cdContents)
                                    Text: =Gallery9.Selected.copies
                                    Visible: =!IsEmpty(Gallery9.Selected.cdContents)
                                    Width: =40
                                    X: =Icon6.X+Icon6.Width+10
                                    Y: =Label25.Y+(Label25.Height)/4
                                    ZIndex: =7

                                "'Video/AudioEditingMobileGallery_4' As gallery.galleryVertical":
                                    '#CopilotOverlayLabel': ="Filtered"
                                    BorderThickness: =1
                                    Default: |-
                                        =//First(MyTicketsGallery.AllItems)
                                        {}
                                    DelayItemLoading: |-
                                        =//false
                                        true
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =300
                                    Items: =Gallery9.Selected.cdContents
                                    Layout: =Layout.Vertical
                                    LoadingSpinner: |-
                                        =//LoadingSpinner.None
                                        LoadingSpinner.Controls
                                    TemplatePadding: =10
                                    TemplateSize: |-
                                        =//If(Self.Layout = Layout.Horizontal, Min(250, Self.Width - 60), Min(250, Self.Height - 60))
                                        //If(Self.Layout = Layout.Horizontal, Min(280, Self.Width - 60), Min(260, Self.Height - 60))
                                        
                                        If(MyTickets.Size > 1, 250, 240)
                                    Transition: =Transition.Push
                                    Visible: ='Case Support Disc Burning TT'.Size=1 && !IsEmpty(Gallery9.Selected.cdContents)
                                    Width: =ItemListHeader.Width
                                    WrapCount: =RoundDown((Parent.Width / 320), 0)
                                    X: =Rectangle10_1.X
                                    Y: =ItemListHeader.Y+ItemListHeader.Height
                                    ZIndex: =8

                                    Rectangle6_9 As rectangle:
                                        BorderColor: =RGBA(0, 0, 0, 0)
                                        BorderThickness: =25
                                        Fill: =RGBA(255, 255, 255, 1)
                                        Height: =Image6_9.Height
                                        OnSelect: =Select(Parent)
                                        Width: =Image6_9.Width
                                        ZIndex: =1

                                    Image6_9 As image:
                                        Height: |-
                                            =//250
                                            Parent.TemplateHeight
                                        Image: |-
                                            ="data:image/svg+xml," & EncodeUrl(
                                                "<?xml version='1.0' encoding='UTF-8' standalone='no'?>
                                            <!DOCTYPE svg PUBLIC '-//W3C//DTD SVG 1.1//EN' 'http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd'>
                                            <svg version='1.1'
                                                xmlns='http://www.w3.org/2000/svg'
                                                xmlns:xlink='http://www.w3.org/1999/xlink' preserveAspectRatio='xMidYMid meet' viewBox='0 0 " & Self.Width & " " & Self.Height & "' width='" & Self.Width & "' height='" & Self.Height & "'>
                                                <defs>" &
                                                // ----- Box for fill
                                             "<path d='" &
                                             // Upper left
                                             "M" & Max(5 * 3 - 0, 0) & " " & Max(5 * 3 - 0,0) &
                                                // Upper right
                                             "L" & Self.Width - Max(5 * 3 + 0, 0) & " " & Max(5 * 3 - 0, 0) &
                                                // Lower right
                                             "L" & Self.Width - Max(5 * 3 + 0, 0) & " " & Self.Height - Max(5 * 3 + 0, 0) &
                                                // Lower left
                                             "L" & Max(5 * 3 - 0, 0) & " " & Self.Height - Max(5 * 3 + 0, 0) & 
                                             "Z' id='box' stroke='" & "#ff0000" & "' stroke-width='" & 0 & "'></path>
                                                </defs>
                                                <g>
                                                    <g>
                                                        <filter id='shadow' x='-20%' y='-20%' width='200%' height='200%' filterUnits='userSpaceOnUse' primitiveUnits='userSpaceOnUse'>
                                                            <feFlood></feFlood>
                                                            <feComposite in2='SourceAlpha' operator='in'></feComposite>
                                                            <feGaussianBlur stdDeviation='" & 5 & "'></feGaussianBlur>
                                                            <feOffset dx='" & 0 & "' dy='" & 0 & "' result='afterOffset'></feOffset>
                                                            <feFlood flood-color='" & "#000000" & "' flood-opacity='" & Substitute(Text(0.5), ",", ".") & "'></feFlood>
                                                            <feComposite in2='afterOffset' operator='in'></feComposite>
                                                            <feMorphology operator='dilate' radius='1'></feMorphology>
                                                            <feComposite in2='SourceAlpha' operator='out'></feComposite>
                                                        </filter>" &
                                                        // ----- Box for shadow
