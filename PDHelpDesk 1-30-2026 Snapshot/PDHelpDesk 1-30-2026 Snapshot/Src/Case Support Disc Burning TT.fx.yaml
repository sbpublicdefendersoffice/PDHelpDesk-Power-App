                            Color: =CSDiscBurningTitleLabel.Color
                            Height: =CSDiscBurningTitleLabel.Height
                            Text: ="*"
                            Width: =30
                            Wrap: =false
                            Y: =CSDiscBurningTitleLabel.Y
                            ZIndex: =4

                        CSDiscBurningTitleInput As text:
                            Default: =""
                            Height: =35
                            HintText: ="Please Enter Case Number"
                            Width: =If('Case Support Disc Burning TT'.Size=1,Parent.Width/1.2,Parent.Width/1.1)
                            X: =30
                            Y: =44
                            ZIndex: =5

                    CSDiscBurningMainCategory_DataCard As typedDataCard.numberEditCard:
                        BorderStyle: =BorderStyle.Solid
                        DataField: ="mainCategory"
                        Default: =ThisItem.mainCategory
                        DisplayMode: =Parent.DisplayMode
                        DisplayName: =DataSourceInfo([@Tickets],DataSourceInfo.DisplayName, Name)
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =If( 'Case Support Disc Burning TT'.Size = 1, Parent.Height/7, Parent.Height/5)
                        Required: =true
                        Update: =
                        Visible: =false
                        Width: =1366
                        WidthFit: =true
                        X: =0
                        Y: =1
                        ZIndex: =1

                        CSDiscBurningMainCategoryLabel As label:
                            AutoHeight: =true
                            Height: =34
                            Text: ="Category"
                            Width: =Parent.Width - 60
                            Wrap: =false
                            X: =30
                            Y: =10
                            ZIndex: =1

                        CSDiscBurningMainCategoryError As label:
                            AutoHeight: =true
                            Height: =10
                            Live: =Live.Assertive
                            PaddingBottom: =0
                            PaddingLeft: =0
                            PaddingRight: =0
                            PaddingTop: =0
                            Text: =Parent.Error
                            Visible: =Parent.DisplayMode=DisplayMode.Edit
                            Width: =Parent.Width - 60
                            X: =30
