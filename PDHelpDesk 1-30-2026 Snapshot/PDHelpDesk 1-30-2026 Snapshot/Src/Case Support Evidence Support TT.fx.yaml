                        Text: ="Evidence Aquisition Form"
                        Width: =Parent.Width
                        Y: =CSEvidenceSupportWebHeader.Height
                        ZIndex: =2

                    CSEvidenceSupportWebHeader As compWebHeader:
                        BackgroundColor: =Color.Transparent
                        CompScreenSize: ='Case Support Evidence Support TT'.Size
                        EnableFeedback: =Set(varFeedback,true)
                        ZIndex: =3

