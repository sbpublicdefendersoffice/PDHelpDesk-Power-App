        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        Width: ='Case Support Evidence Support TT'.Width
        ZIndex: =1

        CSEvidenceSupportVerticalLayoutContainer As groupContainer.verticalAutoLayoutContainer:
