                        Dropdown6_1 As dropdown:
                            AllowEmptySelection: =true
                            ChevronBackground: =ColorScheme.primary
                            Default: =""
                            Height: =35
                            Items: =ForAll(Sequence(60), Text(Value-1,"[$-en-US]00"))
                            Width: =DatePicker3.Width
