                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Width: =Parent.Width
                        ZIndex: =1

                    CSEvidenceSupportHeaderLabel As label:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =Color.Transparent
                        Height: =Parent.Height-CSEvidenceSupportWebHeader.Height
