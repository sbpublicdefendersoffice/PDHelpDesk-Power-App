                        DatePicker3 As datepicker:
                            BorderColor: =If(IsBlank(Self.SelectedDate),RGBA(0, 18, 107, 1), If(Self.SelectedDate<=DateAdd(Today(),-1, TimeUnit.Days),Color.Red,Color.Green))
                            DefaultDate: =Blank()
                            Height: =35
                            IconBackground: =ColorScheme.primary
                            InputTextPlaceholder: ="Select Date"
                            OnSelect: =If(Self.SelectedDate<=DateAdd(Today(),-1,TimeUnit.Days),Notify("Selected Date is Today's Date or in the past, please select a valid date.",NotificationType.Error))
