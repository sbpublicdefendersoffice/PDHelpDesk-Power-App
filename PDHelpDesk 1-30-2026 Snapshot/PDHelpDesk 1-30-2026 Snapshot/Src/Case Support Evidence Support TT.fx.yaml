                            X: =30
                            Y: =CSEvidenceSupportDateTimeLabel.Y+CSEvidenceSupportDateTimeLabel.Height
                            ZIndex: =7

                        Dropdown6 As dropdown:
                            AllowEmptySelection: =true
                            ChevronBackground: =ColorScheme.primary
                            Default: =""
                            Height: =35
                            Items: =Sequence(12,1)
                            Width: =DatePicker3.Width
                            X: =If('Case Support Evidence Support TT'.Size=1,DatePicker3.X,DatePicker3.X+DatePicker3.Width+10)
                            Y: =CSEvidenceSupportDateTimeLabel_1.Y+CSEvidenceSupportDateTimeLabel_1.Height
