                        CSTranscriptRequestsSubmitButton As button:
                            DisplayMode: |-
                                =
                                //could use this to enable/disable button behaviour
                                //If(CreateATicketForm_1.Valid, DisplayMode.Edit, DisplayMode.Disabled)
                                
                                DisplayMode.Edit
                            Fill: =ColorScheme.primary
                            Height: =CSTranscriptRequestsCancelButton.Height
                            OnSelect: |
                                =
                                If(!CSTranscriptRequestsDescriptionTextInputArea.Visible,
                                UpdateContext({TicketDescText:Concatenate("Case Number: "&CSTranscriptRequestsTitleInput.Text&Char(13)&Char(13)&"Needed by: "&DateValue(DatePicker4.SelectedDate)&Char(13)&Char(13),"File Name: "&CSTranscriptRequestsFileNameInput.Text&Char(13)&"File Path: "&CSTranscriptRequestsFilePathInput.Text)}), Notify("Description is Blank"));
                                
                                //Check if the title or Description are empty, if they are the form will not be submitted
                                If(
                                    !IsBlank(CSTranscriptRequestsLocationIDDropdown.Selected.Name) And Len(Trim(CSTranscriptRequestsTitleInput.Text))>0 And !IsBlank(DatePicker4.SelectedDate) And
                                    Len(Trim(CSTranscriptRequestsFileNameInput.Text))>0 And Len(Trim(CSTranscriptRequestsFilePathInput.Text))>0,
                                    UpdateContext({DataCardKey1_1: "Title"});
                                    UpdateContext({DataCardKey5: "Description"});
                                    //Set(DataCardKey5: "Description");
                                Set(
                                        //Temporary record
                                        rec,
                                        //DB operation, from Ticket table, new record, change these columns
                                        Patch(
                                            Tickets,
                                            Defaults(Tickets),
                                            {
                                                Title: CSTranscriptRequestsTitleInput.Text,
                                                description: Trim(CSTranscriptRequestsDescriptionTextInputArea.Text),
                                                creatorId: userData.id,
                                                mainCategory: CSTranscriptRequestsMainCategoryDropdown.Selected.ID,
                                                category: CSTranscriptRequestsSubCategoryDropdown.Selected.ID,
                                                subCategory: CSTranscriptRequestsSpecificIssueDropdown.Selected.ID,
                                                locationId: CSTranscriptRequestsLocationIDDropdown.Selected.ID,
                                                status: "open",
                                                metricDate: Concatenate(
                                                    Month(Today()),
                                                    "/",
                                                    Year(Today())
                                                ),
                                                hasAttachment: If(
                                                    IsEmpty(CSTranscriptRequestsAttachmentControl.Attachments),
                                                    0,
                                                    1
                                                ),
                                                //Automation rules table is used to assign tickets
                                                assignedTo: LookUp(Users,fullName = "Deepak Budwani",ID)
                                            }
                                        )
                                    );
                                
                                Patch(
                                    Tickets, 
                                    LookUp(Tickets,ID = rec.ID),
                                    {
                                        Title: "#"&rec.ID&" Transcript Request"
                                    });
                                // for the attachments, run power automate flow for each attached file
                                    ForAll(
                                        CSTranscriptRequestsAttachmentControl.Attachments As Attachment,
                                               /*AttachFiles.Run(
                                            rec.ID,
                                            {
                                                file: {
                                                    contentBytes: Value,
                                                    name: Name
                                                }
                                            }
                                        )*/
                                        If(Left(Attachment.Value,6) = "appres", 
                                        AttachFiles.Run(
                                            rec.ID,
                                            {
                                                file:{
                                                    contentBytes: Attachment.Value,
                                                    name: Attachment.Name
                                                }
                                            }
                                        ) ;,
                                
                                
                                With({varHTMLTable: Split(Attachment.Name , "<img")}, If(CountRows(varHTMLTable)>1, With({varB64Start:Find("<img",Attachment.Name)+32},With({varB64End:Find("""",Mid(Attachment.Name,varB64Start))-1},CopyPasteTest.Run(Mid(Attachment.Name,varB64Start,varB64End),Attachment.Value & Text(Now(),DateTimeFormat.UTC) &".png", rec.ID)
                                ))))
