"'Case Support Video/Audio Editing TT' As screen":
    BackgroundImage: =PUBDEF_IT__LOGO_Vector
    Fill: =ColorScheme.screenBackground
    OnHidden: |
        =UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
    OnVisible: |-
        =ResetForm('CSVideo/AudioForm');
        UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
        Clear(RTEImages);
        ClearCollect(AVTimes,
        {
            startTime:"", 
            endTime:""
        });
        ClearCollect(AVEditCol,
        {
            fileName:"",
            filePath:"",
            times:AVTimes
        });
        
        Clear(AVEditCol);
        UpdateContext({videoRecord:Blank()})

