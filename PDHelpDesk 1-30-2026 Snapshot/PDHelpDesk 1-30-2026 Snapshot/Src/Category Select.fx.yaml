"'Category Select' As screen":
    BackgroundImage: =PUBDEF_IT__LOGO_Vector
    Fill: =ColorScheme.screenBackground
    OnVisible: |-
        =//Refresh the list on page entry
        Refresh(Category);
        //Feedback Bug Report Clear Collections
        Clear(RTEImages);
        Clear(JointAttachments);
        Clear(attItems);

    Category_Select_Main_Container As groupContainer.verticalAutoLayoutContainer:
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Stretch
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGridColumns: =6
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        Width: =Parent.Width
        ZIndex: =1

        Category_Vertical_Layout_Container As groupContainer.verticalAutoLayoutContainer:
            AlignInContainer: =AlignInContainer.SetByContainer
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumns: =6
            LayoutGridRows: =6
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =100
            LayoutMinWidth: =250
            LayoutMode: =LayoutMode.Auto
            LayoutOverflowX: =LayoutOverflow.Scroll
            LayoutOverflowY: =LayoutOverflow.Scroll
            ZIndex: =3

            Category_Select_Header_Container As groupContainer.horizontalAutoLayoutContainer:
                FillPortions: =0
                Height: |-
                    =130
                    //Parent.Height/9.5
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutDirection: =LayoutDirection.Vertical
                LayoutGridColumns: =6
                LayoutGridRows: =6
                LayoutJustifyContent: =LayoutJustifyContent.Center
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =100
                LayoutMinWidth: =250
                LayoutMode: =LayoutMode.Auto
                Width: =250
                ZIndex: =1

                Category_Select_Header_Elements As groupContainer.manualLayoutContainer:
                    LayoutGridColumns: =6
                    LayoutGridRows: =6
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =100
                    LayoutMinWidth: =250
                    ZIndex: =6

                    Category_Select_Background_Gradient As htmlViewer:
                        DisabledBorderColor: =RGBA(56, 56, 56, 1)
                        Height: =Parent.Height
                        HtmlText: =Home_Background_Gradient.HtmlText
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Width: =Parent.Width
                        ZIndex: =1

                    Category_Select_Header_Label As label:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =Color.Transparent
                        Height: =Parent.Height- Category_Select_Web_Header.Height
                        Size: =If('Category Select'.Size=1, titleText.mobileSize, titleText.desktopSize)
                        Text: ="Select a Category"
                        Width: =App.Width
                        Y: =Category_Select_Web_Header.Height
                        ZIndex: =2

                    Category_Select_Web_Header As compWebHeader:
                        BackgroundColor: =Color.Transparent
                        CompScreenSize: ='Category Select'.Size
                        EnableFeedback: =Set(varFeedback,true)
                        Height: |-
                            =82
                            //Parent.Height
                        ZIndex: =3

            Category_Select_Main_Content_Container As groupContainer.verticalAutoLayoutContainer:
                Fill: =ColorScheme.screenBackgroundSeeThroughMid
                FillPortions: =10
                Height: =Parent.Height
                LayoutDirection: =LayoutDirection.Vertical
                LayoutGridColumns: =6
                LayoutGridRows: =6
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =100
                LayoutMinWidth: =250
                LayoutMode: =LayoutMode.Auto
                Visible: |-
                    =true
                    //Main Content container this houses certian elements such as the searchbar, and 2 button galleries, one for desktop, and another for mobile
                Width: =Parent.Width
                ZIndex: =6

                Category_Select_Buttons_Container As groupContainer.verticalAutoLayoutContainer:
                    AlignInContainer: =AlignInContainer.SetByContainer
                    FillPortions: =8
                    Height: =Parent.Height
                    LayoutDirection: =LayoutDirection.Vertical
                    LayoutGridColumns: =6
                    LayoutGridRows: =6
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =100
                    LayoutMinWidth: =250
                    LayoutMode: =LayoutMode.Auto
                    LayoutWrap: =true
                    Width: =Parent.Width
                    ZIndex: =3

                    Category_Select_Gallery As gallery.galleryVertical:
                        '#CopilotOverlayLabel': ="Filtered"
                        AlignInContainer: =AlignInContainer.SetByContainer
                        FillPortions: =0
                        Height: =Parent.Height
                        Items: |-
                            =//Filter categories based on userRole, admin gets to see 2 more categories
                            
                            If(is_admin,Sort(Filter(Category, parentId = Blank()),Name), Sort(Filter(Category, parentId = Blank(),technicianOnly=0),Name)) 
                            
                            //SortByColumns(If(is_admin,Filter(Category, parentId = Blank()), Filter(Category, parentId = Blank(),technicianOnly=0)),"categoryHits",SortOrder.Descending)
                        Layout: =Layout.Vertical
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =287
                        LayoutMinWidth: =320
                        OnSelect: |
                            =//Galleries can specify onselect method, but its better for buttons to define their own in the gallery
                        ShowScrollbar: =false
                        TemplateSize: |-
                            =//Parent.Height/3
                            200
                        Width: =Parent.Width
                        WrapCount: =Switch('Category Select'.Size, ScreenSize.Small, 2, ScreenSize.Medium, 3, ScreenSize.Large, 3, If(userData.role ="staff", 3, 4))
                        Y: =215
                        ZIndex: =2

                        Category_Select_Button_Frame As button:
                            Color: =ColorScheme.secondary
                            DisabledFill: =RGBA(0, 0, 0, 0)
                            Fill: =ColorScheme.primary
                            Height: |-
                                =//If('Category Select'.Size = 1, Parent.TemplateHeight/2,Parent.TemplateHeight-50)
                                Parent.TemplateHeight-50
                            HoverColor: =RGBA(0, 0, 0,0)
                            OnSelect: |-
                                =Navigate('Create A Ticket', ScreenTransition.Fade, {FirstCategory: ThisItem.ID})
                            PressedColor: =RGBA(0, 0, 0,0)
                            PressedFill: =
                            Text: =""
                            Visible: =false
                            Width: =If('Category Select'.Size = 1, Parent.Width/2.5, Parent.Width/5)
                            X: =(Parent.TemplateWidth - Self.Width)/2
                            Y: =(Parent.TemplateHeight - Self.Height)/2
                            ZIndex: =1

                        Category_Select_Gallery_Button_Gradient As htmlViewer:
                            DisabledBorderColor: =RGBA(56, 56, 56, 1)
                            Height: =Category_Select_Button_Frame.Height
                            HtmlText: =Home_Gallery_Button_Color_Gradient.HtmlText
                            PaddingBottom: =0
                            PaddingLeft: =0
                            PaddingRight: =0
                            PaddingTop: =0
                            Width: =Category_Select_Button_Frame.Width
                            X: =Category_Select_Button_Frame.X
                            Y: =Category_Select_Button_Frame.Y
                            ZIndex: =2

                        Category_Select_Button_Label As label:
                            Align: =Align.Center
                            Color: =Color.White
                            FontWeight: =FontWeight.Semibold
                            Height: =Category_Select_Button_Frame.Height
                            HoverColor: =
                            OnSelect: |-
                                =Navigate('Create A Ticket', ScreenTransition.Fade, {FirstCategory: ThisItem.ID})
                            Size: =If('Category Select'.Size =1,11,15)
                            Text: |-
                                =//ThisItem.name
                                
                                // If Screen is in mobile view and string contains / and cannot fit on one line, then move the second half to another line
                                If('Category Select'.Size > 2, ThisItem.Name, If(Len(ThisItem.Name) > 15 && "/" in ThisItem.Name , Left(ThisItem.Name, Find("/", ThisItem.Name)) & Char(10) & Right(ThisItem.Name, Len(ThisItem.Name) - Find("/", ThisItem.Name)), ThisItem.Name))
                            Width: =Category_Select_Button_Frame.Width
                            X: =Category_Select_Button_Frame.X
                            Y: =Category_Select_Button_Frame.Y
                            ZIndex: =3

                        Category_Select_Html_Shadow As htmlViewer:
                            DisabledBorderColor: =RGBA(56, 56, 56, 1)
                            DisplayMode: =DisplayMode.View
                            Height: =Parent.TemplateHeight
                            HtmlText: |-
                                =// you can use inline Css to create effects that can be found in modern webapps
                                //you cannot link style sheets
                                //some elements of html are not supported
                                //you can include variables in the html string by adding "&PowerAppsVar&" 
                                "<div style='box-shadow: 23px 21px 33px 8px rgba(0,0,0,.025);
                                -webkit-box-shadow: 23px 21px 33px 8px rgba(0,0,0,.025);
                                -moz-box-shadow: 23px 21px 33px 8px rgba(0,0,0,.025); height:"&Category_Select_Button_Frame.Height-11&"px; width:"&Category_Select_Button_Frame.Width-11&"px; border-style:none; border-radius:10px'></div>"
                            OnSelect: =Select(Parent)
                            Width: =Parent.TemplateWidth
                            X: =Category_Select_Button_Frame.X
                            Y: =Category_Select_Button_Frame.Y
                            ZIndex: =4

                        Category_Select_Overlap_Button As button:
                            BorderColor: =RGBA(0,0,0,0)
                            Color: =RGBA(0, 0, 0,0)
                            DisabledFill: =RGBA(0, 0, 0, 0)
                            Fill: =RGBA(0, 0, 0,0)
                            Height: =Category_Select_Button_Frame.Height
                            HoverColor: =RGBA(0, 0, 0,0)
                            HoverFill: =ColorFade(RGBA(105,105,105,.35),-10%)
                            OnSelect: |-
                                =//Set the ticket category upon selecting the gallery item
                                Set(TicketCategoryID,ThisItem.ID);
                                //Navigate('Sub Category Select', ScreenTransition.Fade, {FirstCategory: ThisItem.ID});
                                //Go to the  sub select screen
                                If(IsBlank(LookUp(Category,parentId = ThisItem.ID)),Set(TicketSpecificIssue,0);Set(TicketSubCategoryID,0);If(ThisItem.Name = "General",Navigate('Create A Ticket',ScreenTransition.Cover),Navigate(LookUp(ticketTemplateScreens,NavID=ThisItem.ID).ScreenTemplate,ScreenTransition.Cover)),Navigate('Sub Category Select', ScreenTransition.Cover));
                                IncrementCatHits.Run("",ThisItem.ID);
                            PressedColor: =RGBA(0, 0, 0,0)
                            PressedFill: =ColorFade(RGBA(255,255,255,.7),50%)
                            Text: =""
                            Width: =Category_Select_Button_Frame.Width
                            X: =Category_Select_Button_Frame.X
                            Y: =Category_Select_Button_Frame.Y
                            ZIndex: =5

            Category_Select_Footer As groupContainer.verticalAutoLayoutContainer:
                Fill: =RGBA(255,255,255, 1)
                FillPortions: =0
                Height: =60
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutDirection: =LayoutDirection.Vertical
                LayoutGridColumns: =6
                LayoutGridRows: =6
                LayoutJustifyContent: =LayoutJustifyContent.Center
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =100
                LayoutMinWidth: =250
                LayoutMode: =LayoutMode.Auto
                Visible: |
                    ='Category Select'.Size =1
                Width: =Parent.Width
                ZIndex: =7

                Category_Select_MobileMenu As compMobileMenu:
                    Height: =Parent.Height
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =640
                    LayoutMinWidth: =640
                    Width: =Parent.Width

    Category_Select_Back_Button As icon.BackArrow:
        Color: =Color.White
        Height: =Category_Select_Header_Label.Height/1.05
        Icon: =Icon.BackArrow
        OnSelect: =Back(ScreenTransition.UnCoverRight)
        Width: =49
        X: =Self.Width/5 
        Y: =(Category_Select_Header_Container.Height-Category_Select_Header_Label.Height)/1.05
        ZIndex: =2

    Category_Select_WebMenu As compWebMenu:
        Visible: ='Category Select'.Size > 1
        ZIndex: =3

    Category_Select_Feedback_Bug_Report As FeedbackBugReport:
        CloseReport: =Set(varFeedback,false)
        DisablePickMedia: =Set(PickMedia,false)
        EnablePickMedia: =Set(PickMedia,true)
        FBSize: ='Category Select'.Size
        FeedbackCameraOff: =Set(FeedbackCamera,false);
        FeedbackCameraOn: =Set(FeedbackCamera,true);
        PhotoModeDisable: =Set(FeedbackPhoto,false)
        PhotoModeEnable: =Set(FeedbackPhoto,true)
        Visible: =varFeedback
        ZIndex: =4

