        Height: =Self.Width
        Icon: =Icon.AddDocument
        OnSelect: |-
            =FeedbackBugReport.PhotoModeEnable();
            FeedbackBugReport.EnablePickMedia();
        Visible: =!PickMedia And !FeedbackPhoto
        Width: =If(FeedbackBugReport.FBSize = 1, 32, 48)
        X: =Rectangle35.X+Rectangle35.Width -Self.Width-10
        Y: =Rectangle35.Y+10
        ZIndex: =15

    Button25_177 As button:
        Fill: =RGBA(0, 0, 0, 0)
