            X: =(Rectangle36.Width-Self.Width)/2 +Rectangle36.X
            Y: =AlternativeAddImageHeaderLabel_46.Y+AlternativeAddImageHeaderLabel_46.Height
            ZIndex: =20

            Label69_2 As label:
                Height: =Parent.TemplateHeight
                OnSelect: =Select(Parent)
                Text: =ThisItem.Name
                Width: =Parent.TemplateWidth*.8
                X: =Icon26_1.Width+Icon26_1.X
                ZIndex: =1

            Icon26_1 As icon.Document:
                Height: =Self.Width
                Icon: =Icon.Document
                OnSelect: =Select(Parent)
                Width: =If(FeedbackBugReport.FBSize = 1, 32,48)
                Y: =5
                ZIndex: =4

            Icon27_1 As icon.Cancel:
                Color: =RGBA(255, 255, 255, 1)
                Fill: =RGBA(39, 113, 194, 1)
                Height: =Self.Width
                Icon: =Icon.Cancel
                OnSelect: |-
                    =Set(workerVar,{copyName:ThisItem.Name,base64Image:ThisItem.Value});
                    If(workerVar in RTEImages,Remove(RTEImages,LookUp(RTEImages, ThisItem.Value = base64Image)));
                    Remove(attItems,LookUp(attItems,ThisItem.Value = Value));
                    Remove(JointAttachments,ThisItem)
                Width: =If(FeedbackBugReport.FBSize = 1, 32,48)
                X: =Parent.TemplateWidth-Self.Width
                Y: =5
                ZIndex: =5

            HtmlText9 As htmlViewer:
                HtmlText: =ThisItem.Value
                OnSelect: =Select(Parent)
                Visible: =false
                X: =892
                Y: =24
                ZIndex: =6

            Label69 As label:
                Height: =64
                OnSelect: =Select(Parent)
                Overflow: =Overflow.Scroll
                Text: =ThisItem.Value
                Visible: =false
                Width: =423
                X: =395
                ZIndex: =7

    FeedbackDebug As gallery.galleryVertical:
        DelayItemLoading: =true
        Height: =185
        Items: =FeedbackImages
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        TemplateSize: =180
        Visible: =false
        Width: =1244
        X: =59
        Y: =422
        ZIndex: =12

        Label67 As label:
            OnSelect: =Select(Parent)
            Text: =ThisItem.copyName
            X: =40
            Y: =40
            ZIndex: =1

        HtmlText8_1 As htmlViewer:
            HtmlText: =ThisItem.base64Image
            X: =250
            Y: =25
            ZIndex: =2

    Label68 As label:
        Height: =50
        Text: =If(CountRows(FeedbackImages)>0,CountRows(FeedbackImages)&" Screenshot(s) or Photos Added","No Media Attached")
        Visible: =!PickMedia And !FeedbackPhoto
        Width: =200
        X: =If(FeedbackBugReport.FBSize>1,Checkbox6.X+Checkbox6.Width+12,Checkbox6.X)
        Y: =If(FeedbackBugReport.FBSize>1,Checkbox6.Y+10,Checkbox6.Y+Checkbox6.Height)
        ZIndex: =13

    Button25_176 As button:
        Fill: =ColorScheme.primary
        Height: =Self.Width
        Text: =
        Visible: =!PickMedia And !FeedbackPhoto
        Width: =Icon11_47.Width+16
        X: =Icon11_47.X-8
        Y: =Icon11_47.Y-8
        ZIndex: =14

    Icon11_47 As icon.Camera:
