"'Create A Ticket' As screen":
    BackgroundImage: =PUBDEF_IT__LOGO_Vector
    Fill: =ColorScheme.screenBackground
    OnHidden: |-
        =//update screen variables on leaving the page
        UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
    OnVisible: |-
        =//Empty the form for a new entry, and initialize page variables
        ResetForm(Create_A_Ticket_Form);
        UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
        Clear(RTEImages);
        Clear(JointAttachments);
        Clear(attItems);

    Create_A_Ticket_Main_Container As groupContainer.horizontalAutoLayoutContainer:
        Height: ='Create A Ticket'.Height
        LayoutGridColumns: =6
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        Width: ='Create A Ticket'.Width
        ZIndex: =2

        Create_A_Ticket_Vertical_Layout_Container As groupContainer.verticalAutoLayoutContainer:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumns: =6
            LayoutGridRows: =6
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =100
            LayoutMinWidth: =250
            LayoutMode: =LayoutMode.Auto
            ZIndex: =2

            Create_A_Ticket_Header_Container As groupContainer.verticalAutoLayoutContainer:
                Fill: =ColorScheme.primary
                FillPortions: =0
                Height: |-
                    =130
                    //Parent.Height/11
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutDirection: =LayoutDirection.Vertical
                LayoutGridColumns: =6
                LayoutGridRows: =6
                LayoutJustifyContent: =LayoutJustifyContent.Center
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =100
                LayoutMinWidth: =250
                LayoutMode: =LayoutMode.Auto
                Visible: |-
                    =//Home.Size<>1
                    //This is the top most header container that houses the navbar links
                    true
                Width: =Parent.Width
                ZIndex: =1

                Create_A_Ticket_Header_Elements As groupContainer.manualLayoutContainer:
                    LayoutGridColumns: =6
                    LayoutGridRows: =6
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =100
                    LayoutMinWidth: =250
                    ZIndex: =11

                    Create_A_Ticket_Background_Gradient As htmlViewer:
                        DisabledBorderColor: =RGBA(56, 56, 56, 1)
                        Height: =Parent.Height
                        HtmlText: =Home_Background_Gradient.HtmlText
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Width: =Parent.Width
                        ZIndex: =1

                    Create_A_Ticket_Desktop_Header_Label As label:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =Color.Transparent
                        Height: =Parent.Height-Create_A_Ticket_WebHeader.Height
                        Size: =If('Create A Ticket'.Size=1, titleText.mobileSize, titleText.desktopSize)
                        Text: ="Create A Ticket - " & LookUp(Category, ID = TicketCategoryID, Name)
                        Width: =Parent.Width
                        Y: =Create_A_Ticket_WebHeader.Height
                        ZIndex: =2

                    Create_A_Ticket_WebHeader As compWebHeader:
                        BackgroundColor: =Color.Transparent
                        CompScreenSize: ='Create A Ticket'.Size
                        EnableFeedback: =Set(varFeedback,true)
                        Height: |-
                            =82
                            //Parent.Height
                        ZIndex: =3

            Create_A_Ticket_Main_Content_Container As groupContainer.verticalAutoLayoutContainer:
                AlignInContainer: =AlignInContainer.SetByContainer
                Height: =Parent.Height/1.21
                LayoutDirection: =LayoutDirection.Vertical
                LayoutGridColumns: =6
                LayoutGridRows: =6
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =100
                LayoutMinWidth: =250
                LayoutMode: =LayoutMode.Auto
                LayoutOverflowY: =LayoutOverflow.Scroll
                Visible: |-
                    =true
                    //Main Content container this houses certian elements such as the searchbar, and 2 button galleries, one for desktop, and another for mobile
                Width: =Parent.Width
                ZIndex: =3

                Create_A_Ticket_Form As form:
                    AlignInContainer: =AlignInContainer.SetByContainer
                    DataSource: =Tickets
                    DefaultMode: =FormMode.New
                    Fill: =ColorScheme.screenBackgroundSeeThroughMid
                    Height: =Parent.Height/1.21
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =250
                    LayoutMinWidth: =400
                    NumberOfColumns: =1
                    Width: =Parent.Width
                    Y: =Parent.Height/5.7
                    ZIndex: =1

                    Create_A_Ticket_Title_DataCard As typedDataCard.textualEditCard:
                        BorderStyle: =BorderStyle.Solid
                        DataField: ="title"
                        Default: =ThisItem.Title
                        DisplayMode: =Parent.DisplayMode
                        DisplayName: =//DataSourceInfo([@Tickets],DataSourceInfo.DisplayName, "field_2")
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =120
                        MaxLength: =//DataSourceInfo([@Tickets], DataSourceInfo.MaxLength, "field_2")
                        Required: =false
                        Update: =
