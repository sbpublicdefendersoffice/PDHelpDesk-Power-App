                        ZIndex: =2

                    HourValue14_1 As dropdown:
                        BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                        ChevronBackground: =ColorScheme.primary
                        Default: =If(Editing, Text(Hour(Parent.Default),"00"), Blank())
                        DisplayMode: =Parent.DisplayMode
                        Height: =DateValue14_1.Height
                        Items: =ForAll(Sequence(26), If(Value > 13, Text(Value-14,"[$-en-US]00"), Text(Value-1,"[$-en-US]00")))
                        PaddingBottom: =0
                        PaddingLeft: =5
                        PaddingRight: =0
                        PaddingTop: =0
                        Tooltip: =Parent.DisplayName
