                    DateValue14_1 As datepicker:
                        BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                        DefaultDate: |-
                            =// check if we are trying to update a record, if so then the default date would be the date it would expire.
                            // if not then there should be no date
                            
                            If(Editing, ThisItem.dateExpired, Today())
                        DisplayMode: =Parent.DisplayMode
                        EndYear: =Year(Today())+100
                        IconBackground: =ColorScheme.primary
                        InputTextPlaceholder: =If(IsBlank(Self.SelectedDate), Text(Date(Year(Now()),01,01), Self.Format, Self.Language))
                        IsEditable: =true
                        PaddingBottom: =0
