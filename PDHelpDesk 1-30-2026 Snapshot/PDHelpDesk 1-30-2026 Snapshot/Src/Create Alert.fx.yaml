                    UpdateAlertBtn As button:
                        FontWeight: =FontWeight.Bold
                        Height: =CreateAlertBtn.Height
                        OnSelect: |
                            =//update the record with the new edited fields
                            
                            Patch (
                                Alerts,
                                AlertsGallery.Selected,
                                {
                                    Title: CreateAlertTitleValue.Text,
                                    messageText: CreateAlertDescriptionTextAreaInput.Text,
                                    dateExpired: DateTimeValue(DateValue14_1.SelectedDate & " " & HourValue14_1.SelectedText.Value & ":" & MinuteValue14_1.SelectedText.Value)
                                }
                            );
                            ResetForm(CreateAlertForm);
                            Set(
                                Editing,
                                false
                            );
                            Navigate('Alert Manager');
                        Text: ="Update Alert"
                        Visible: =If(Editing, true, false)
                        Width: =CreateAlertBtn.Width
                        X: =CreateAlertBtn.X
                        Y: =CreateAlertBtn.Y
                        ZIndex: =1

                    CancelBtn As button:
                        Fill: =RGBA(184,0,0,1)
                        Height: =CreateAlertBtn.Height
                        HoverFill: =ColorFade(RGBA(184,0,0,1), -20%)
                        OnSelect: |-
                            =ResetForm(CreateAlertForm);
                            Set(Editing, false);
                            Navigate('Alert Manager',ScreenTransition.None);
                            UpdateContext({TitleReq:"Title"});
                        Text: ="Cancel"
                        Visible: =!(CreateAlertForm.Mode = FormMode.View)
                        Width: =CreateAlertBtn.Width
                        X: =3*(Parent.Width-Self.Width)/4 +20
                        Y: =CreateAlertBtn.Y
                        ZIndex: =2

                    CreateAlertBtn As button:
                        Fill: =ColorScheme.primary
                        Height: =60
                        OnSelect: |-
                            =
                            If(!templateMode && !newTemplate,//Check if the title is blank if it is then update screen variable to state that a required field is empty
                            If(!IsBlank(Trim(CreateAlertTitleValue.Text)),
                            //otherwise make a new alert variable
                            Set(
                                newAlert,
                                Patch(
                                    Alerts,
                                    Defaults(Alerts),
                                    {
                                        Title: CreateAlertTitleValue.Text,
                                        messageText: CreateAlertDescriptionTextAreaInput.Text,
                                        dateCreated: Now(),
                                        dateExpired: If(
                                            !IsBlank(DateValue14_1.SelectedDate),
                                            DateTimeValue(DateValue14_1.SelectedDate & " " & HourValue14_1.SelectedText.Value & ":" & MinuteValue14_1.SelectedText.Value),
                                            Blank()
                                        ),
                                        creatorId: userData.id
                                    }
                                ));
                                Set(
                                    galleryVisible,
                                    true
                                );
                                Notify(
                                    "Alert Successfully created!",
                                    NotificationType.Success
                                );
                            
                                //send a mass email to all users stat that the created alert is down.
                                SendEmail.Run(
                                    Concatenate(
                                        "pdhelpdesk@countyofsb.org" 
                                    ),
                                        TextInput1.Text,
                                        RichTextEditor1.HtmlText,
                                        //allEmails 
                                        "mperez@countyofsb.org"
                                );
                            /*SMTP.SendEmailV3(
                                {
                                    From: "sbpdhelpdesk@outlook.com",
                                    To: "<Do Not Reply> sbpdhelpdesk@outlook.com",
                                    Bcc: allEmails,
                                    Subject: "Service Outage",
                                    Body: "<div>Please be advised, " & DataCardValue23_1.Text & " is down. IT is responding and will notify all users when full functionality is restored. Thank you for your patience.</div> <br> <div> Do NOT email or respond to this automated message. This is an automated message created by our notification system. </div>"
                                }
                            );*/
                            //go to alert manager
                                Navigate('Alert Manager');
                                ResetForm(CreateAlertForm);
                            , 
                            UpdateContext({TitleReq:"Title Required"})),
                            If(!IsBlank(Trim(TextInput1.Text)) &&!IsBlank(Trim(CreateAlertTitleValue.Text))&&!IsBlank(Trim(RichTextEditor1.HtmlText)),Patch(tempTemplates,Defaults(tempTemplates),
                            {
                                alertName:CreateAlertTitleValue.Text,
                                alertSubject:TextInput1.Text,
                                alertHTMLText:RichTextEditor1.HtmlText
                            });
                            Patch(ATemplates,Defaults(ATemplates),
                            {
                                Title:CreateAlertTitleValue.Text,
                                alertSubject:TextInput1.Text,
                                alertHTMLText:RichTextEditor1.HtmlText
                            });
                            UpdateContext({newTemplate:!newTemplate});,Notify("Subject, Title,or Email message is missing!"))
                            
                            )
                        Text: =If(!templateMode && !newTemplate ,"Create Alert", "Create Template")
