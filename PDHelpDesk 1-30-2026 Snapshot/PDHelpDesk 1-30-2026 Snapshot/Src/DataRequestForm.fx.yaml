                    DRFSubmitButton As button:
                        DisplayMode: |-
                            =
                            //could use this to enable/disable button behaviour
                            //If(CreateATicketForm_1.Valid, DisplayMode.Edit, DisplayMode.Disabled)
                            
                            DisplayMode.Edit
                        Fill: =ColorScheme.primary
                        Height: =DRFCancelButton.Height
                        OnSelect: |
                            =//
                            If(DRFDescriptionTextInputArea.Visible,
                            UpdateContext({TicketDescText:Concatenate("Requesting Department: ",DRFTitleInput.Text,Char(13),Char(13)," Request Type: ",Dropdown10.Selected.Type,Char(13),Char(13),If(Dropdown10.Selected.Type = "Edits/additions to exisiting Power BI report",Concatenate("Power BI Report: ",TextInput7.Text,Char(13),Char(13))),"Additional Details:",Char(13),DRFDescriptionTextInputArea.Text)}), Notify("Description is Blank"));
                            
                            //Check if the title or Description are empty, if they are the form will not be submitted
                            If(
                                Len(Trim(DRFTitleInput.Text)) > 0 And !IsBlank(DRFLocationIDDropDown.Selected.Name) And !IsBlank(Dropdown10.Selected.Type) And If(TextInput7.Visible,If(Len(Trim(TextInput7.Text))>0, true, false), true),
                                UpdateContext({DataCardKey1_1: "Title"});
                                UpdateContext({DataCardKey5: "Description"});
                                //Set(DataCardKey5: "Description");
                            Set(
                                    //Temporary record
                                    rec,
                                    //DB operation, from Ticket table, new record, change these columns
                                    Patch(
                                        Tickets,
                                        Defaults(Tickets),
                                        {
                                            Title: DRFTitleInput.Text,
                                            description: Trim(TicketDescText),
                                            creatorId: userData.id,
                                            mainCategory: DRFMainCategoryDropdown.Selected.ID,
                                            category: eDefenderBFPSubCategoryDropdown_1.Selected.ID,
                                            subCategory: DRFSpecificIssueDropdown.Selected.ID,
                                            locationId: DRFLocationIDDropDown.Selected.ID,
                                            status: "pending",
                                            metricDate: Concatenate(
                                                Month(Today()),
                                                "/",
                                                Year(Today())
                                            ),
                                            hasAttachment: If(
                                                IsEmpty(attItems),
                                                0,
                                                1
                                            ),
                                            //Automation rules table is used to assign tickets
                                            assignedTo: If(
                                                IsEmpty(
                                                    Filter(
                                                        'Ticket Automation Rules',
                                                        categoryId = DRFMainCategoryDropdown.Selected.ID && locationId = DRFLocationIDDropDown.Selected.ID
                                                    )
                                                ),
                                                0,
                                                LookUp(
                                                    'Ticket Automation Rules',
                                                    categoryId = DRFMainCategoryDropdown.Selected.ID && locationId = DRFLocationIDDropDown.Selected.ID,
                                                    userID
                                                )
                                            )
                                        }
                                    )
                                );
                            
                            Patch(
                                Tickets, 
                                LookUp(Tickets,ID = rec.ID),
                                {
                                    Title: "#"&rec.ID&" Data Request "&Dropdown10.Selected.Type
                                });
                            // for the attachments, run power automate flow for each attached file
                            ForAll(
                                attItems As Attachment,
                                        AttachFiles.Run(
                                        rec.ID,
                                        {
                                            file:{
                                                contentBytes: Attachment.Value,
                                                name: Attachment.Name
                                            }
                                        }
                                    ) 
                            );
                            //Now do it for the camera and screenshots
                            ForAll(
                                RTEImages As RTEI,
                                With({varHTMLTable: Split(RTEI.base64Image , "<img")}, If(CountRows(varHTMLTable)>1, With({varB64Start:Find("<img",RTEI.base64Image)+32},With({varB64End:Find("""",Mid(RTEI.base64Image,varB64Start))-1},CopyPasteTest.Run(Mid(RTEI.base64Image,varB64Start,varB64End),RTEI.copyName & Text(Now(),DateTimeFormat.UTC) &".png", rec.ID)
                            ))))
                                    );
                                
                                /*SMTP.SendEmailV3(
                                    {
                                        From: "sbpdhelpdesk@outlook.com",
                                        To: userData.email,
                                        Subject: "Help Desk Ticket Received",
                                        Body: "<div>Hello, this is an automated response. An IT Help Desk ticket # " & rec.ID & " was created on your behalf. A technician will contact you soon to begin troubleshooting.</div><br> <div> To view the status of the ticket or add comments, please visit <a href="https://apps.powerapps.com/play/e/default-ce8a2002-448f-4f58-82b1-d86f73e3afdd/a/a370d8a4-8906-4ac3-bff0-0a588e959ea7?tenantId=ce8a2002-448f-4f58-82b1-d86f73e3afdd&TickID=" & rec.ID & "'>here</a>.</div>"
                                    }
                                );*/
                                /*If(
                                    rec.assignedTo > 0,
                                    SMTP.SendEmailV3(
                                        {
                                            From: "sbpdhelpdesk@outlook.com",
                                            To: LookUp(
                                                Users,
                                                ID = rec.assignedTo,
                                                email
                                            ),
                                            Subject: "Help Desk Ticket Assigned",
                                            Body: "<div>Hello, this is an automated response. An IT Help Desk ticket # " & rec.ID & " was assigned to you. Please click <a href='https://apps.powerapps.com/play/e/default-ce8a2002-448f-4f58-82b1-d86f73e3afdd/a/a370d8a4-8906-4ac3-bff0-0a588e959ea7?tenantId=ce8a2002-448f-4f58-82b1-d86f73e3afdd&TickID=" & rec.ID & "'>here</a> to view more details for the ticket.</div>"
                                        }
                                    );
                                );*/
                            //Power automate flow, sends email to ticket creator 
                            SendEmail.Run(
                                    Concatenate(
                                        "'",
                                        userData.email,
                                        "'"
                                    ),
                                    "Help Desk Ticket Recieved",
                                    //Email Message body
                                    TicketCreatorMessageRTE_1.HtmlText,
                                    Text(Blank())
                                );
                                // If the ticket it assigned to someone, send them an email
                                If(
                                    rec.assignedTo > 0,
                                    SendEmail.Run(
                                        Concatenate(
                                            "'",
                                            LookUp(
                                                Users,
                                                ID = rec.assignedTo,
                                                email
                                            ),
                                            "'"
                                        ),
                                        "Help Desk Ticket Assigned",
                                        //Email message body
                                        TechAssignMessageRTE_1.HtmlText,
                                        Text(Blank())
                                    );
                            TicketCreatedBoth.Run(userData.email,LookUp(Users,rec.assignedTo=ID,email),rec.ID,"Ticket #"&rec.ID&" has been created. Touch this notification for more information."),    TicketCreatedUser.Run(userData.email,rec.ID,"Ticket #"&rec.ID&" has been created on your behalf. Touch this notification for more information.")
                                );
                                //Reset the form upon completion
                                ResetForm(DRFForm);
                                Navigate(Success);
                            
                            );
                            // variables that control color elements
                                UpdateContext({CreateTicketTitle: "Title is Required"});
                                UpdateContext({CreateTicketDescription: "Description is Required"});
                                UpdateContext({BFPPopup:true})
