                            //If(CreateATicketForm_1.Valid, DisplayMode.Edit, DisplayMode.Disabled)
                            
                            DisplayMode.Edit
                        Fill: =ColorScheme.primary
                        Height: ='S/ADynamicFormCancelButton'.Height
                        OnSelect: |
                            =//Check if the title or Description are empty, if they are the form will not be submitted
                            If(
                                !IsBlank('S/ADynamicFormLocationIDDropdown'.Selected.Name) And Len(Trim('S/ADynamicFormDescription'.Text))>0 And Switch('S/ADynamicFormSubCategoryDropdown'.Selected.ID,60,If(!IsBlank('S/ADynamicFormMSRadio'.Selected),true,false),62,If(Len('S/ADynamicFormPDInput'.Text)>0,true,false),87,If(!IsBlank('S/ADynamicFormPowerAppDropdown'.Selected.App),true,false),true),
                                UpdateContext({DataCardKey1_1: "Title"});
                                UpdateContext({DataCardKey5: "Description"});
                                //Set(DataCardKey5: "Description");
                            Set(
                                    //Temporary record
                                    rec,
                                    //DB operation, from Ticket table, new record, change these columns
                                    Patch(
                                        Tickets,
                                        Defaults(Tickets),
                                        {
                                            Title: 'S/ADynamicFormPDInput'.Text,
                                            description: Switch('S/ADynamicFormSubCategoryDropdown'.Selected.ID,60,"MSProduct: "&'S/ADynamicFormMSRadio'.Selected.Option&Char(13)&Char(13),62,"PDNumber: "&'S/ADynamicFormPDInput'.Text&Char(13)&Char(13),87,"Power App: "&'S/ADynamicFormPowerAppDropdown'.Selected.App&Char(13)&Char(13),"")&"Details: "&Trim('S/ADynamicFormDescription'.Text),
                                            creatorId: userData.id,
                                            mainCategory: 'S/AVLCMainCategoryDropdown_1'.Selected.ID,
                                            category: 'S/ADynamicFormSubCategoryDropdown'.Selected.ID,
                                            subCategory: 'S/ADynamicFormSpecificIssueDropdown'.Selected.ID,
                                            locationId: 'S/ADynamicFormLocationIDDropdown'.Selected.ID,
                                            status: "open",
                                            metricDate: Concatenate(
                                                Month(Today()),
                                                "/",
                                                Year(Today())
                                            ),
                                            hasAttachment: If(
                                                IsEmpty('S/ADynamicFormAttachmentControl'.Attachments),
                                                0,
                                                1
                                            ),
                                            //Automation rules table is used to assign tickets
                                            assignedTo: If(
                                                IsEmpty(
                                                    Filter(
                                                        'Ticket Automation Rules',
                                                        categoryId = 'S/AVLCMainCategoryDropdown_1'.Selected.ID && locationId = 'S/ADynamicFormLocationIDDropdown'.Selected.ID
                                                    )
                                                ),
                                                0,
                                                LookUp(
                                                    'Ticket Automation Rules',
                                                    categoryId = 'S/AVLCMainCategoryDropdown_1'.Selected.ID && locationId = 'S/ADynamicFormLocationIDDropdown'.Selected.ID,
                                                    userID
                                                )
                                            )
                                        }
                                    )
                                );
                            
                            Patch(
