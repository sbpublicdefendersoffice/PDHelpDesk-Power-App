                                {
                                    Title: "#"&rec.ID&" "&'S/ADynamicFormSubCategoryDropdown'.Selected.Name&" Support Request"
                                });
                            Set(rec,Patch(rec,{Title: "#"&rec.ID&" "&'S/ADynamicFormSubCategoryDropdown'.Selected.Name&" Support Request"}));
                            // for the attachments, run power automate flow for each attached file
                                ForAll(
                                    'S/ADynamicFormAttachmentControl'.Attachments As Attachment,
                                           /*AttachFiles.Run(
                                        rec.ID,
                                        {
                                            file: {
                                                contentBytes: Value,
                                                name: Name
                                            }
                                        }
                                    )*/
                                    If(Left(Attachment.Value,6) = "appres", 
