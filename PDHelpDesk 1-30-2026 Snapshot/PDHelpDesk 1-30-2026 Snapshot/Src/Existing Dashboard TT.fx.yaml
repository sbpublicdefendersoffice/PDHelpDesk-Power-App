                    DRFSubmitButton_3 As button:
                        Fill: =ColorScheme.primary
                        Height: =DRFCancelButton_3.Height
                        OnSelect: |
                            =//
                            If(DRFDescriptionTextInputArea_3.Visible,
                            UpdateContext({TicketDescText:Concatenate("Dashboard Name: "&DRFTitleInput_3.Text&Char(13)&Char(13),
                            "Page Name: "&TextInput7_3.Text&Char(13)&Char(13),
                            "Edit Type: "&Concat(editTypeSelected,EditType," , ")&Char(13)&Char(13),
                            "Edits/Updates: "&DRFDescriptionTextInputArea_3.Text&Char(13)&Char(13),
                            "Priority Level: "&Dropdown14_2.Selected.Priority&Char(13)&Char(13),
                            "Desired Date: "&DatePicker6_3.SelectedDate&Char(13)&Char(13))}), Notify("Description is Blank"));
                            
                            //Check if the title or Description are empty, if they are the form will not be submitted
                            If( //add logic here for required fields
                                true,
                                UpdateContext({DataCardKey1_1: "Title"});
                                UpdateContext({DataCardKey5: "Description"});
                                //Set(DataCardKey5: "Description");
                            Set(
                                    //Temporary record
                                    rec,
                                    //DB operation, from Ticket table, new record, change these columns
                                    Patch(
                                        Tickets,
                                        Defaults(Tickets),
                                        {
                                            Title: "Existing Dashboard",
                                            description: Trim(TicketDescText),
                                            creatorId: userData.id,
                                            mainCategory: DRFMainCategoryDropdown_3.Selected.ID,
                                            category: eDefenderBFPSubCategoryDropdown_4.Selected.ID,
                                            subCategory: DRFSpecificIssueDropdown_3.Selected.ID,
                                            locationId: DRFLocationIDDropDown_3.Selected.ID,
                                            status: "pending",
                                            metricDate: Concatenate(
                                                Month(Today()),
                                                "/",
                                                Year(Today())
                                            ),
                                            hasAttachment: If(
                                                IsEmpty(attItems),
                                                0,
                                                1
                                            ),
                                            //Automation rules table is used to assign tickets
                                            assignedTo: If(
                                                IsEmpty(
                                                    Filter(
                                                        'Ticket Automation Rules',
                                                        categoryId = DRFMainCategoryDropdown_3.Selected.ID && locationId = DRFLocationIDDropDown_3.Selected.ID
                                                    )
                                                ),
                                                0,
                                                LookUp(
                                                    'Ticket Automation Rules',
                                                    categoryId = DRFMainCategoryDropdown_3.Selected.ID && locationId = DRFLocationIDDropDown_3.Selected.ID,
                                                    userID
                                                )
                                            )
                                        }
                                    )
                                );
                            
                            Patch(
                                Tickets, 
                                LookUp(Tickets,ID = rec.ID),
                                {
                                    Title: "#"&rec.ID&" Existing Dashboard Request"
                                });
                            // for the attachments, run power automate flow for each attached file
                            ForAll(
                                attItems As Attachment,
                                        AttachFiles.Run(
