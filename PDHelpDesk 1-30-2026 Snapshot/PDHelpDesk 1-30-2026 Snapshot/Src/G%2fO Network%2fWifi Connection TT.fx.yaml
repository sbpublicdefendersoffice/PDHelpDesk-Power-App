                        "'G/ONetwork/WifiConnectionSubmitButton' As button":
                            DisplayMode: |-
                                =
                                //could use this to enable/disable button behaviour
                                //If(CreateATicketForm_1.Valid, DisplayMode.Edit, DisplayMode.Disabled)
                                
                                DisplayMode.Edit
                            Fill: =ColorScheme.primary
                            Height: ='G/ONetwork/WifiConnectionCancelButton'.Height
                            OnSelect: |
                                =
                                If(!'G/ONetwork/WifiConnectionTextInputArea'.Visible,
                                UpdateContext({TicketDescText:Concatenate("Additional Network/Wifi Connection Details:"&Char(13),'Network/WifiInput'.Text)}), Notify("Description is Blank"));
                                
                                //Check if the title or Description are empty, if they are the form will not be submitted
                                If(
                                    !IsBlank('G/ONetwork/WifiConnectionLocationIDDropdown'.Selected.Name) And Len(Trim('G/ONetwork/WifiConnectionTitleInput'.Text)) >0,
                                    UpdateContext({DataCardKey1_1: "Title"});
                                    UpdateContext({DataCardKey5: "Description"});
                                    //Set(DataCardKey5: "Description");
                                Set(
                                        //Temporary record
                                        rec,
                                        //DB operation, from Ticket table, new record, change these columns
                                        Patch(
                                            Tickets,
                                            Defaults(Tickets),
                                            {
                                                Title: 'G/ONetwork/WifiConnectionTitleInput'.Text,
                                                description: Trim('G/ONetwork/WifiConnectionTextInputArea'.Text),
                                                creatorId: userData.id,
                                                mainCategory: 'G/ONetwork/WifiConnectionMainCategoryDropdown'.Selected.ID,
                                                category: 'G/ONetwork/WifiConnectionSubCategoryDropdown'.Selected.ID,
                                                subCategory: 'G/ONetwork/WifiConnectionSpecificIssueDropdown'.Selected.ID,
                                                locationId: 'G/ONetwork/WifiConnectionLocationIDDropdown'.Selected.ID,
                                                status: "open",
                                                metricDate: Concatenate(
                                                    Month(Today()),
                                                    "/",
                                                    Year(Today())
                                                ),
                                                hasAttachment: If(
                                                    IsEmpty(JointAttachments),
                                                    0,
                                                    1
                                                ),
                                                //Automation rules table is used to assign tickets
                                                assignedTo: If(
                                                    IsEmpty(
                                                        Filter(
                                                            'Ticket Automation Rules',
                                                            categoryId = 'G/ONetwork/WifiConnectionMainCategoryDropdown'.Selected.ID && locationId = 'G/ONetwork/WifiConnectionLocationIDDropdown'.Selected.ID
                                                        )
                                                    ),
                                                    0,
                                                    LookUp(
                                                        'Ticket Automation Rules',
                                                        categoryId = 'G/ONetwork/WifiConnectionMainCategoryDropdown'.Selected.ID && locationId = 'G/ONetwork/WifiConnectionLocationIDDropdown'.Selected.ID,
                                                        userID
                                                    )
                                                )
                                            }
                                        )
                                    );
                                
                                Patch(
                                    Tickets, 
                                    LookUp(Tickets,ID = rec.ID),
                                    {
                                        Title: "# "&rec.ID&" Network/Wifi Connection -"&'G/ONetwork/WifiConnectionTitleInput'.Text
                                    });
                                // for the attachments, run power automate flow for each attached file
                                ForAll(
                                    attItems As Attachment,
                                            AttachFiles.Run(
                                            rec.ID,
                                            {
                                                file:{
                                                    contentBytes: Attachment.Value,
                                                    name: Attachment.Name
                                                }
                                            }
                                        ) 
                                );
                                ForAll(
                                    RTEImages As RTEI,
                                    With({varHTMLTable: Split(RTEI.base64Image , "<img")}, If(CountRows(varHTMLTable)>1, With({varB64Start:Find("<img",RTEI.base64Image)+32},With({varB64End:Find("""",Mid(RTEI.base64Image,varB64Start))-1},CopyPasteTest.Run(Mid(RTEI.base64Image,varB64Start,varB64End),RTEI.copyName & Text(Now(),DateTimeFormat.UTC) &".png", rec.ID)
                                ))))
                                        );
                                    
