                    "'G/ONetwork/WifiConnectionButtons_DataCard' As typedDataCard.blankCard":
                        BorderStyle: =BorderStyle.Solid
                        DisplayMode: =DisplayMode.Edit
                        Fill: =RGBA(0, 0, 0, 0)
