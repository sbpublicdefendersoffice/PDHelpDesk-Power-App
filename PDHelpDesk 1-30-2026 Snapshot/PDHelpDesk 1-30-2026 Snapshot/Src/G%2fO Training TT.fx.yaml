                    "'G/OTrainingButtons_DataCard' As typedDataCard.blankCard":
                        BorderStyle: =BorderStyle.Solid
                        DisplayMode: =DisplayMode.Edit
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =If( 'G/O Training TT'.Size = 1, Parent.Height/3, Parent.Height/5)
                        Width: =1366
                        WidthFit: =true
                        X: =0
                        Y: =8
                        ZIndex: =1

                        "'G/OTrainingSubmitButton' As button":
                            DisplayMode: |-
                                =
                                //could use this to enable/disable button behaviour
                                //If(CreateATicketForm_1.Valid, DisplayMode.Edit, DisplayMode.Disabled)
                                
                                DisplayMode.Edit
                            Fill: =ColorScheme.primary
                            Height: ='G/OTrainingCancelButton'.Height
                            OnSelect: |
                                =
                                If(!'G/OTrainingDescriptionTextInputArea'.Visible,
                                UpdateContext({TicketDescText:Concatenate("Trainee: "&GeneralTrainingTraineeInput.Text&Char(13),Char(13)&"Start Date: "&DateValue('G/OStartDatePicker'.SelectedDate)&"     Date End: "&DateValue('G/OEndDatePicker'.SelectedDate)&Char(13)&Char(13),"Additional Training Information:"&Char(13),GeneralTrainingInfoInput.Text)}), Notify("Description is Blank"));
                                
                                //Check if the title or Description are empty, if they are the form will not be submitted
                                If(
                                    Len(Trim('G/OTrainingTitleInput'.Text))>0 And Len(Trim(GeneralTrainingTraineeInput.Text))>0 And (!IsBlank('G/OStartDatePicker'.SelectedDate) 
                                    And !IsBlank('G/OEndDatePicker'.SelectedDate)) And Len(Trim(GeneralTrainingInfoInput.Text))>0 And
                                !IsBlank('G/OTrainingLocationIDDropDown'.Selected.Name),
                                    UpdateContext({DataCardKey1_1: "Title"});
                                    UpdateContext({DataCardKey5: "Description"});
                                    //Set(DataCardKey5: "Description");
                                Set(
                                        //Temporary record
                                        rec,
                                        //DB operation, from Ticket table, new record, change these columns
                                        Patch(
                                            Tickets,
                                            Defaults(Tickets),
                                            {
                                                Title: 'G/OTrainingTitleInput'.Text,
                                                description: Trim('G/OTrainingDescriptionTextInputArea'.Text),
                                                creatorId: userData.id,
                                                mainCategory: 'G/OTrainingMainCategoryDropdown'.Selected.ID,
                                                category: 'G/OTrainingSubCategoryDropdown'.Selected.ID,
                                                subCategory: 'G/OTrainingSpecificIssueDropdown'.Selected.ID,
                                                locationId: 'G/OTrainingLocationIDDropDown'.Selected.ID,
                                                status: "open",
                                                metricDate: Concatenate(
                                                    Month(Today()),
                                                    "/",
                                                    Year(Today())
                                                ),
                                                hasAttachment: If(
                                                    IsEmpty(JointAttachments),
                                                    0,
