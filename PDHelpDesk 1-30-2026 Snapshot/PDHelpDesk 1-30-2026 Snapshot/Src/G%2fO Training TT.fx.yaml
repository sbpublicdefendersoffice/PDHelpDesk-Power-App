                        Text: ="General/Other Training Form"
                        Width: =Parent.Width
                        Y: ='G/OTrainingWebHeader'.Height
                        ZIndex: =2

                    "'G/OTrainingWebHeader' As compWebHeader":
                        BackgroundColor: =Color.Transparent
                        CompScreenSize: ='G/O Training TT'.Size
                        EnableFeedback: =Set(varFeedback,true)
                        Height: |-
                            =82
                            //Parent.Height
                        ZIndex: =3

