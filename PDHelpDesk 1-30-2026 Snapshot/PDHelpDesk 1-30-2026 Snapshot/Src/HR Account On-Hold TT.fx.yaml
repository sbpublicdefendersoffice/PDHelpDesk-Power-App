                        ZIndex: =1

                        HRAccountOnHoldSubmitButton As button:
                            DisplayMode: |-
                                =
                                //could use this to enable/disable button behaviour
                                //If(CreateATicketForm_1.Valid, DisplayMode.Edit, DisplayMode.Disabled)
                                
                                DisplayMode.Edit
                            Fill: =ColorScheme.primary
                            Height: =HRAccountOnHoldCancelButton.Height
                            OnSelect: |
                                =
                                If(!HRAccountOnHoldDescriptionTextInputArea.Visible,
                                UpdateContext({TicketDescText:Concatenate("")}));
                                
                                //Check if the title or Description are empty, if they are the form will not be submitted
                                If(
                                    Len(Trim(HRAccountOnHoldTitleInput.Text)) > 0 And !IsBlank(HRAccountOnHoldSupervisorDropdown.Selected.SName) And (AHStartDatePicker.SelectedDate>= Today() And AHEndDatePicker.SelectedDate>= Today()) And
                                    !IsBlank(HRAccountOnHoldLocationIDDropdown.Selected.Name),
                                    UpdateContext({DataCardKey1_1: "Title"});
                                    UpdateContext({DataCardKey5: "Description"});
                                    //Set(DataCardKey5: "Description");
                                Set(
                                        //Temporary record
                                        rec,
                                        //DB operation, from Ticket table, new record, change these columns
                                        Patch(
                                            Tickets,
                                            Defaults(Tickets),
                                            {
                                                Title: HRAccountOnHoldTitleInput.Text,
                                                description: "Name: "&HRAccountOnHoldTitleInput.Text&Char(13)&"Approved by: "&HRAccountOnHoldSupervisorDropdown.Selected.SName&Char(13)&"Hold Starts: "&AHStartDatePicker.SelectedDate&Char(13)&"Hold Ends: "&AHEndDatePicker.SelectedDate,
                                                creatorId: userData.id,
                                                mainCategory: HRAccountOnHoldMainCategoryDropdown.Selected.ID,
                                                category: HRAccountOnHoldSubCategoryDropdown.Selected.ID,
                                                subCategory: HRAccountOnHoldSpecificIssueDropdown.Selected.ID,
                                                locationId: HRAccountOnHoldLocationIDDropdown.Selected.ID,
                                                status: "open",
                                                metricDate: Concatenate(
