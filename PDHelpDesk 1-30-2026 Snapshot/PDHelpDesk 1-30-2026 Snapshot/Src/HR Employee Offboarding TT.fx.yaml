                                =
                                //could use this to enable/disable button behaviour
                                //If(CreateATicketForm_1.Valid, DisplayMode.Edit, DisplayMode.Disabled)
                                
                                DisplayMode.Edit
                            Fill: =ColorScheme.primary
                            Height: =HREOffCancelButton.Height
                            OnSelect: |
                                =
                                If(!HREOffDescriptionTextInputArea.Visible,
                                UpdateContext({TicketDescText:Concatenate("Onboarding Ticket Information",Char(13)&Char(13),"Employee Name: "&HREOffFirstNameInput.Text&" "&HREOffLastNameInput.Text&Char(13)&Char(13),"Email: "&HREOffEmailAddressInput.Text&Char(13)&Char(13),"Staff Group: "&HREOffStaffGroupDropdown.Selected.Role&Char(13)&Char(13),"Operation Location: "&HREOffOperationLocationDropdown.Selected.Location&Char(13)&Char(13),"End Date: "&DateValue(HREOffEndDatePicker.SelectedDate))}), Notify("Description is Blank"));
                                
