                                =
                                //could use this to enable/disable button behaviour
                                //If(CreateATicketForm_1.Valid, DisplayMode.Edit, DisplayMode.Disabled)
                                
                                DisplayMode.Edit
                            Fill: =ColorScheme.primary
                            Height: =HREOnCancelButton.Height
                            OnSelect: |
                                =
                                If(!HREOnDescriptionTextInputArea.Visible,
                                UpdateContext({TicketDescText:Concatenate("Onboarding Information",Char(13)&Char(13)&"First Name: "&HREFirstNameInput.Text,Char(13)&"Last Name: "&HRELastNameInput.Text,Char(13)&"Staff Group: "&Dropdown8.Selected.type,Char(13)&"Operation Location: "&Dropdown8_1.Selected.type,Char(13)&"Start Date:"&DateValue(DatePicker1.SelectedDate),Char(13)&"Email: ")}), Notify("Description is Blank"));
                                
