                            DisplayMode: |-
                                =
                                //could use this to enable/disable button behaviour
                                //If(CreateATicketForm_1.Valid, DisplayMode.Edit, DisplayMode.Disabled)
                                
                                DisplayMode.Edit
                            Fill: =ColorScheme.primary
                            Height: =HardwareALCancelButton.Height
                            OnSelect: |
                                =
                                If(!HardwareALDescriptionTextInputArea.Visible,
                                UpdateContext({TicketDescText:Concatenate("Request: "&Radio1.Selected.Question)}), Notify("Description is Blank"));
                                
                                //Check if the title or Description are empty, if they are the form will not be submitted
                                If(
                                    !IsBlank(Radio1.Selected.Option) And !IsBlank(HardwareALLocationIDDropdown.Selected.Name) And
                                If(Radio1.Selected.Question="Other", If(Len(Trim(HardwareALDescriptionTextInputArea.Text))=0,false,true),true),
                                    UpdateContext({DataCardKey1_1: "Title"});
                                    UpdateContext({DataCardKey5: "Description"});
                                    //Set(DataCardKey5: "Description");
                                Set(
                                        //Temporary record
                                        rec,
                                        //DB operation, from Ticket table, new record, change these columns
                                        Patch(
                                            Tickets,
                                            Defaults(Tickets),
                                            {
                                                Title: HardwareALTitleInput.Text,
                                                description: If(Radio1.Selected.Question = "Other","Account Issue: Other"&Char(13)&Char(13),"")&Trim(HardwareALDescriptionTextInputArea.Text),
                                                creatorId: userData.id,
                                                mainCategory: HardwareALMainCategoryDropdown.Selected.ID,
                                                category: HardwareALSubCategoryDropdown.Selected.ID,
                                                subCategory: HardwareALSpecificIssueDropdown.Selected.ID,
                                                locationId: HardwareALLocationIDDropdown.Selected.ID,
                                                status: "open",
                                                metricDate: Concatenate(
                                                    Month(Today()),
                                                    "/",
                                                    Year(Today())
                                                ),
                                                hasAttachment: If(
                                                    IsEmpty(JointAttachments),
                                                    0,
                                                    1
                                                ),
                                                //Automation rules table is used to assign tickets
                                                assignedTo: If(
                                                    IsEmpty(
                                                        Filter(
                                                            'Ticket Automation Rules',
                                                            categoryId = HardwareALMainCategoryDropdown.Selected.ID && locationId = HardwareALLocationIDDropdown.Selected.ID
                                                        )
                                                    ),
                                                    0,
                                                    LookUp(
                                                        'Ticket Automation Rules',
                                                        categoryId = HardwareALMainCategoryDropdown.Selected.ID && locationId = HardwareALLocationIDDropdown.Selected.ID,
                                                        userID
                                                    )
                                                )
                                            }
                                        )
                                    );
                                
                                Patch(
                                    Tickets, 
                                    LookUp(Tickets,ID = rec.ID),
                                    {
                                        Title: "# "&rec.ID&" Hardware Account Lockout Request"
                                    });
                                // for the attachments, run power automate flow for each attached file
                                ForAll(
                                    attItems As Attachment,
                                            AttachFiles.Run(
                                            rec.ID,
                                            {
                                                file:{
                                                    contentBytes: Attachment.Value,
                                                    name: Attachment.Name
                                                }
                                            }
                                        ) 
                                );
                                ForAll(
                                    RTEImages As RTEI,
                                    With({varHTMLTable: Split(RTEI.base64Image , "<img")}, If(CountRows(varHTMLTable)>1, With({varB64Start:Find("<img",RTEI.base64Image)+32},With({varB64End:Find("""",Mid(RTEI.base64Image,varB64Start))-1},CopyPasteTest.Run(Mid(RTEI.base64Image,varB64Start,varB64End),RTEI.copyName & Text(Now(),DateTimeFormat.UTC) &".png", rec.ID)
                                ))))
                                        );
                                
                                    
                                    /*SMTP.SendEmailV3(
                                        {
