                    HardwareBLLButtons_DataCard As typedDataCard.blankCard:
                        BorderStyle: =BorderStyle.Solid
                        DisplayMode: =DisplayMode.Edit
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =If( 'Hardware BitLocker Lockout TT'.Size = 1, Parent.Height/3, Parent.Height/5)
                        Width: =1366
                        WidthFit: =true
                        X: =0
                        Y: =8
                        ZIndex: =1

                        HardwareBLLSubmitButton As button:
                            DisplayMode: |-
                                =
                                //could use this to enable/disable button behaviour
                                //If(CreateATicketForm_1.Valid, DisplayMode.Edit, DisplayMode.Disabled)
                                
                                DisplayMode.Edit
                            Fill: =ColorScheme.primary
                            Height: =HardwareBLLCancelButton.Height
                            OnSelect: |
                                =
                                If(!HardwareBLLDescriptionTextInputArea.Visible,
                                UpdateContext({TicketDescText:Concatenate("Digits Provided: "&HardwareBLLTitleInput.Text&Char(13)&Char(13),"Contact information: "&ContactInfoInput.Text&Char(13)&Char(13),If(IsFrozenCheckBox.Value,"Screen is frozen.","Screen is responsive."))}), Notify("Description is Blank"));
                                
                                //Check if the title or Description are empty, if they are the form will not be submitted
                                If(
                                    (Len(Trim(HardwareBLLTitleInput.Text)) > 0 || !IsEmpty(JointAttachments)) And !IsBlank(HardwareBLLLocationIDDropdown.Selected.Name),
                                    UpdateContext({DataCardKey1_1: "Title"});
                                    UpdateContext({DataCardKey5: "Description"});
                                    //Set(DataCardKey5: "Description");
                                Set(
                                        //Temporary record
                                        rec,
                                        //DB operation, from Ticket table, new record, change these columns
                                        Patch(
                                            Tickets,
                                            Defaults(Tickets),
                                            {
                                                Title: HardwareBLLTitleInput.Text,
                                                description: Trim(HardwareBLLDescriptionTextInputArea.Text),
                                                creatorId: userData.id,
                                                mainCategory: HardwareBLLMainCategoryDropdown.Selected.ID,
                                                category: HardwareBLLSubCategoryDropdown.Selected.ID,
                                                subCategory: HardwareBLLSpecificIssueDropdown.Selected.ID,
                                                locationId: HardwareBLLLocationIDDropdown.Selected.ID,
                                                status: "open",
                                                metricDate: Concatenate(
                                                    Month(Today()),
                                                    "/",
                                                    Year(Today())
                                                ),
                                                hasAttachment: If(
                                                    IsEmpty(JointAttachments),
                                                    0,
                                                    1
                                                ),
                                                //Automation rules table is used to assign tickets
                                                assignedTo: If(
                                                    IsEmpty(
                                                        Filter(
                                                            'Ticket Automation Rules',
                                                            categoryId = HardwareBLLMainCategoryDropdown.Selected.ID && locationId = HardwareBLLLocationIDDropdown.Selected.ID
                                                        )
                                                    ),
                                                    0,
                                                    LookUp(
                                                        'Ticket Automation Rules',
                                                        categoryId = HardwareBLLMainCategoryDropdown.Selected.ID && locationId = HardwareBLLLocationIDDropdown.Selected.ID,
                                                        userID
                                                    )
                                                )
                                            }
                                        )
                                    );
                                
                                Patch(
                                    Tickets, 
                                    LookUp(Tickets,ID = rec.ID),
                                    {
                                        Title: "# "&rec.ID&" BitLocker Lockout Request"
                                    });
                                // for the attachments, run power automate flow for each attached file
                                ForAll(
                                    attItems As Attachment,
                                            AttachFiles.Run(
                                            rec.ID,
                                            {
                                                file:{
                                                    contentBytes: Attachment.Value,
                                                    name: Attachment.Name
                                                }
                                            }
                                        ) 
                                );
                                ForAll(
                                    RTEImages As RTEI,
