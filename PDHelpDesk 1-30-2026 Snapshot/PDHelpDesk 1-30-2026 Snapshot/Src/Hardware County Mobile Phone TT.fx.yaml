                    HardwareCMPButtons_DataCard As typedDataCard.blankCard:
                        BorderStyle: =BorderStyle.Solid
                        DisplayMode: =DisplayMode.Edit
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =If( 'Hardware County Mobile Phone TT'.Size = 1, Parent.Height/3, Parent.Height/5)
                        Width: =1366
                        WidthFit: =true
                        X: =0
                        Y: =10
                        ZIndex: =1

                        HardwareCMPSubmitButton As button:
                            DisplayMode: |-
                                =
                                //could use this to enable/disable button behaviour
                                //If(CreateATicketForm_1.Valid, DisplayMode.Edit, DisplayMode.Disabled)
                                
                                DisplayMode.Edit
                            Fill: =ColorScheme.primary
                            Height: =HardwareCMPCancelButton.Height
                            OnSelect: |
                                =
                                If(!HardwareCMPDescriptionTextInputArea.Visible,
                                UpdateContext({TicketDescText:Concatenate("Work Phone"&Char(13)&Char(13),"Request Type: "&Radio5.Selected.Choice&Char(13)&Char(13),If(Radio5.Selected.Choice="Other","Additional Information: "&Char(13)&ExFieldInput3_22.Text,""))}), Notify("Description is Blank"));
                                
                                //Check if the title or Description are empty, if they are the form will not be submitted
                                If(
                                    Len(Trim(HardwareCMPTitleInput.Text)) > 0 And !IsBlank(Radio4.Selected.Option) And !IsBlank(Radio5.Selected.Choice) And !IsBlank(HardwareCMPLocationIDDropdown.Selected.Name) And If(Radio5.Selected.Choice = "Other", Len(Trim(ExFieldInput3_22.Text))>0,true),
                                    UpdateContext({DataCardKey1_1: "Title"});
                                    UpdateContext({DataCardKey5: "Description"});
                                    //Set(DataCardKey5: "Description");
                                Set(
                                        //Temporary record
                                        rec,
                                        //DB operation, from Ticket table, new record, change these columns
                                        Patch(
                                            Tickets,
                                            Defaults(Tickets),
                                            {
                                                Title: HardwareCMPTitleInput.Text,
                                                description: Trim(HardwareCMPDescriptionTextInputArea.Text),
                                                creatorId: userData.id,
                                                mainCategory: HardwareCMPMainCategoryDropdown.Selected.ID,
                                                category: HardwareCMPSubCategoryDropdown.Selected.ID,
                                                subCategory: HardwareCMPSpecificIssueDropdown.Selected.ID,
                                                locationId: HardwareCMPLocationIDDropdown.Selected.ID,
                                                status: "open",
                                                metricDate: Concatenate(
                                                    Month(Today()),
                                                    "/",
                                                    Year(Today())
                                                ),
                                                hasAttachment: If(
                                                    IsEmpty(JointAttachments),
                                                    0,
                                                    1
                                                ),
