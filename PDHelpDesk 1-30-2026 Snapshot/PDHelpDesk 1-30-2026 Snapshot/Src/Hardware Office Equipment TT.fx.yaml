"'Hardware Office Equipment TT' As screen":
    BackgroundImage: =PUBDEF_IT__LOGO_Vector
    Fill: =ColorScheme.screenBackground
    OnHidden: |
        =UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
    OnVisible: |-
        =ResetForm(HardwareOfficeEquipmentForm);
        UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
        Clear(RTEImages);
        Clear(JointAttachments);
        Clear(attItems);
        UpdateContext({altImagePopUp:false,usingCamera:false});
        ClearCollect(equipCol,
        {
            equipmentID:1,
            equipmentName:"CD/DVD Burner",
            equipmentSelected:false
        },
        {
            equipmentID:2,
            equipmentName:"Charger",
            equipmentSelected:false
        }
        ,
        {
            equipmentID:3,
            equipmentName:"Dock",
            equipmentSelected:false
        }
        ,
        {
            equipmentID:5,
            equipmentName:"Flash Drive",
            equipmentSelected:false
        }
        ,
        {
            equipmentID:6,
            equipmentName:"HDMI Cable",
            equipmentSelected:false
        }
        ,
        {
            equipmentID:7,
            equipmentName:"Keyboard",
            equipmentSelected:false
        }
        ,
        {
            equipmentID:8,
            equipmentName:"Monitor",
            equipmentSelected:false
        }
        ,
        {
            equipmentID:9,
            equipmentName:"Mouse",
            equipmentSelected:false
        }
        ,
        {
            equipmentID:10,
            equipmentName:"Printer",
            equipmentSelected:false
        }
        ,
        {
            equipmentID:11,
            equipmentName:"Scanner",
            equipmentSelected:false
        }
        ,
        {
            equipmentID:12,
            equipmentName:"Toner",
            equipmentSelected:false
        }
        ,
        {
            equipmentID:13,
            equipmentName:"Web Cam",
            equipmentSelected:false
        },
        {
            equipmentID:14,
            equipmentName:"Headset",
            equipmentSelected:false
        }
        );
        ClearCollect(equipColHelper,{recID:1, trueCount:0});
        
        UpdateContext({OEPopup:false});

