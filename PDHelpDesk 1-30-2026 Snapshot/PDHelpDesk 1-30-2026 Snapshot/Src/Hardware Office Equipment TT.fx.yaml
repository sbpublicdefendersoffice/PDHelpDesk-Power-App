                                    {
                                        equipmentSelected: Self.Value
                                    });
                                    
                                    ForAll(equipCol As Equip, If(Equip.equipmentSelected = true,
                                    Patch(equipColHelper, LookUp(equipColHelper,recID=1),{trueCount:LookUp(equipColHelper,recID=1).trueCount+1})));
                                OnSelect: =
                                OnUncheck: |-
                                    =Patch(equipCol,LookUp(equipCol,ThisItem.equipmentID = equipmentID),
                                    {
                                        equipmentSelected: Self.Value
                                    });
                                    ForAll(equipCol As Equip, If(Equip.equipmentSelected = false,
                                    Patch(equipColHelper, LookUp(equipColHelper,recID=1),{trueCount:LookUp(equipColHelper,recID=1).trueCount-1})));
