"'Hardware Printers/Copiers TT' As screen":
    BackgroundImage: =PUBDEF_IT__LOGO_Vector
    Fill: =ColorScheme.screenBackground
    OnHidden: |
        =UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
    OnVisible: |
        =ResetForm('HardwarePrinters/CopiersForm');
        UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
        Clear(RTEImages);
        Clear(JointAttachments);
        Clear(attItems);
        UpdateContext({altImagePopUp:false,usingCamera:false});
        ClearCollect(printerMacroLocationCol,
        {
            Location:"North County"
        }
        ,
        {
            Location:"South County"
        }
        );
        ClearCollect(printerLocationCol,
        {
            Location:"Santa Maria"
        },
        {
            Location:"Juvenile"
        },
        {
            Location:"Lompoc"
        },
        {
            Location:"Santa Barbara"
        },
        {
            Location:"Non Kyocera"
        }
        );
        ClearCollect(printerConsolidatedLocationCol,
        {
            Location:"Santa Maria Front",
            tag:"SM"
        },
        {
        
            Location:"Santa Maria Back",tag:"SM"
        },
        {
            Location:"Santa Barbara - 1st Floor",tag:"SB"
        },
        {
            Location:"Santa Barbara - 2nd Floor",tag:"SB"
        }
        ,
        {
            Location:"Santa Barbara - 3rd Floor",tag:"SB"
        },
        {
            Location:"Santa Barbara - 4th Floor",tag:"SB"
        }
        );
        UpdateContext({PrinterPopup:false, copierChild:{hasChildren:false, tag:""}});

