                    IITServerOutageButtons_DataCard As typedDataCard.blankCard:
                        BorderStyle: =BorderStyle.Solid
                        DisplayMode: =DisplayMode.Edit
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =If( 'Internal IT Server Outage TT'.Size = 1, Parent.Height/3, Parent.Height/5)
                        Width: =1366
                        WidthFit: =true
                        X: =0
                        Y: =600
                        ZIndex: =1

                        IITServerOutageSubmitButton As button:
                            DisplayMode: |-
                                =
                                //could use this to enable/disable button behaviour
                                //If(CreateATicketForm_1.Valid, DisplayMode.Edit, DisplayMode.Disabled)
                                
                                DisplayMode.Edit
                            Fill: =ColorScheme.primary
                            Height: =IITServerOutageCancelButton.Height
                            OnSelect: |
                                =
                                If(!IITServerOutageDescriptionTextInputArea.Visible,
                                UpdateContext({TicketDescText:Concatenate("Location(s) affected: "&Char(13)&IITServerOutageTitleInput.Text&Char(13)&Char(13),"Additional Details: "&Char(13)&IITServerOutageDescriptionTextInputArea.Text)}), Notify("Description is Blank"));
                                
                                //Check if the title or Description are empty, if they are the form will not be submitted
                                If(
                                    Len(Trim(IITServerOutageTitleInput.Text)) > 0 And !IsBlank(IITServerOutageLocationIDDropdown.Selected.Name),
                                    UpdateContext({DataCardKey1_1: "Title"});
                                    UpdateContext({DataCardKey5: "Description"});
                                    //Set(DataCardKey5: "Description");
                                Set(
                                        //Temporary record
                                        rec,
                                        //DB operation, from Ticket table, new record, change these columns
                                        Patch(
                                            Tickets,
                                            Defaults(Tickets),
                                            {
                                                Title: IITServerOutageTitleInput.Text,
                                                description: Trim(IITServerOutageDescriptionTextInputArea.Text),
                                                creatorId: userData.id,
                                                mainCategory: IITServerOutageMainCategoryDropdown.Selected.ID,
                                                category: IITServerOutageSubCategoryDropdown.Selected.ID,
                                                subCategory: IITServerOutageSpecificIssueDropdown.Selected.ID,
                                                locationId: IITServerOutageLocationIDDropdown.Selected.ID,
                                                status: "open",
                                                metricDate: Concatenate(
                                                    Month(Today()),
                                                    "/",
                                                    Year(Today())
                                                ),
                                                hasAttachment: If(
                                                    IsEmpty(JointAttachments),
                                                    0,
                                                    1
                                                ),
                                                //Automation rules table is used to assign tickets
                                                assignedTo: If(
                                                    IsEmpty(
                                                        Filter(
                                                            'Ticket Automation Rules',
                                                            categoryId = IITServerOutageMainCategoryDropdown.Selected.ID && locationId = IITServerOutageLocationIDDropdown.Selected.ID
                                                        )
                                                    ),
                                                    0,
                                                    LookUp(
                                                        'Ticket Automation Rules',
                                                        categoryId = IITServerOutageMainCategoryDropdown.Selected.ID && locationId = IITServerOutageLocationIDDropdown.Selected.ID,
                                                        userID
                                                    )
                                                )
                                            }
                                        )
                                    );
                                
                                Patch(
                                    Tickets, 
                                    LookUp(Tickets,ID = rec.ID),
                                    {
                                        Title: "# "&rec.ID&" Server Outage ("&IITServerOutageSpecificIssueDropdown.Selected.Name&")"    });
                                // for the attachments, run power automate flow for each attached file
                                ForAll(
                                    attItems As Attachment,
                                            AttachFiles.Run(
                                            rec.ID,
                                            {
                                                file:{
                                                    contentBytes: Attachment.Value,
                                                    name: Attachment.Name
                                                }
                                            }
                                        ) 
                                );
                                ForAll(
                                    RTEImages As RTEI,
                                    With({varHTMLTable: Split(RTEI.base64Image , "<img")}, If(CountRows(varHTMLTable)>1, With({varB64Start:Find("<img",RTEI.base64Image)+32},With({varB64End:Find("""",Mid(RTEI.base64Image,varB64Start))-1},CopyPasteTest.Run(Mid(RTEI.base64Image,varB64Start,varB64End),RTEI.copyName & Text(Now(),DateTimeFormat.UTC) &".png", rec.ID)
                                ))))
                                        );
                                    
                                    /*SMTP.SendEmailV3(
                                        {
                                            From: "sbpdhelpdesk@outlook.com",
