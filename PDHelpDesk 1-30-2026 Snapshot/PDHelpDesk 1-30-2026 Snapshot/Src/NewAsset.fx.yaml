            Width: =TemplateErrorWindow_6.Width
            X: =PopupRectangle_5.X
            Y: =TemplateField1Label_6.Y+TemplateField1Label_6.Height+15
            ZIndex: =38

        TemplateField1Label_8 As label:
            Align: =Align.Center
            Color: =If(assetLocation, Color.Red, Color.Green)
            Height: =60
            Size: =20
            Text: =If(assetLocation,"Location Blank or not selected", "Asset Location OK")
            Visible: =amSelection = "Computer Assets"
            Width: =TemplateErrorWindow_6.Width
            X: =PopupRectangle_5.X
            Y: =TemplateField1Label_7.Y+TemplateField1Label_7.Height+15
            ZIndex: =39

        TemplateField1Label_9 As label:
            Align: =Align.Center
            Color: =If(assetStatus, Color.Red, Color.Green)
            Height: =60
            Size: =20
            Text: =If(assetStatus,"Asset Status not selected", "Asset Status OK")
            Visible: =amSelection = "Computer Assets"
            Width: =TemplateErrorWindow_6.Width
            X: =PopupRectangle_5.X
            Y: =TemplateField1Label_8.Y+TemplateField1Label_8.Height+15
            ZIndex: =40

        TemplateField1Label_10 As label:
            Align: =Align.Center
            Color: =If(assignedUser, Color.Red, Color.Green)
            Height: =60
            Size: =20
            Text: =If(assignedUser,"User not Selected", "User OK")
            Width: =TemplateErrorWindow_6.Width
            X: =PopupRectangle_5.X
            Y: =If(amSelection = "Equipment Assets",TemplateField1Label_6.Y+TemplateField1Label_6.Height+15,TemplateField1Label_9.Y+TemplateField1Label_9.Height+15)
