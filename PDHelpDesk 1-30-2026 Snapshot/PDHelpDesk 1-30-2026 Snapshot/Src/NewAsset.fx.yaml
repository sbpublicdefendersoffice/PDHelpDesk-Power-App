        TemplateField1Label_16 As label:
            Align: =Align.Center
            Color: =If(assignedUser, Color.Red, Color.Green)
            Height: =60
            Size: =20
            Text: =If(IsBlank(LookUp('PubDef Computer Inventory_ Asset List_Computers',Value(AssetIDInput.Text) = AssetID)),"Duplicate SKU")
            Width: =TemplateErrorWindow_6.Width
            X: =PopupRectangle_5.X
            Y: =TemplateField1Label_10.Y+TemplateField1Label_10.Height+15
            ZIndex: =42

    SubmittingAssetContainer As groupContainer.manualLayoutContainer:
        Fill: =ColorScheme.screenBackgroundSeeThroughMid
        Height: =Parent.Height
        LayoutGridColumns: =6
        LayoutGridRows: =6
        Visible: =assetPopup
        Width: =Parent.Width
        ZIndex: =6

        Rectangle48 As rectangle:
            BorderThickness: =1
            Fill: =RGBA(241, 244, 249, 1)
            Height: =Parent.Height/1.1
            Width: =Parent.Width/1.1
            X: =(Parent.Width-Self.Width)/2
            Y: =(Parent.Height-Self.Height)/2
            ZIndex: =1

        WindowBar As rectangle:
            BorderThickness: =2
            Fill: =RGBA(39, 113, 194, 1)
            Height: =70
            Width: =Rectangle48.Width
            X: =Rectangle48.X
            Y: =Rectangle48.Y
            ZIndex: =2

        Label88 As label:
            Align: =Align.Center
            Height: =80
            Text: |-
                ="Creating your new asset please wait...
                
                You will be redirected shortly."
            Width: =Rectangle48.Width
            X: =Rectangle48.X+(Rectangle48.Width-Self.Width)/2
            Y: =Rectangle48.Y+(Rectangle48.Height-Self.Height)/2
            ZIndex: =3

    AssetPopupTimer As timer:
        AutoPause: =false
        AutoStart: =assetPopup
        Duration: =2000
        OnTimerEnd: |-
            =UpdateContext({assetPopup:false});
            Navigate('Asset Manager Menu',ScreenTransition.UnCoverRight);
        Visible: =false
        ZIndex: =7

