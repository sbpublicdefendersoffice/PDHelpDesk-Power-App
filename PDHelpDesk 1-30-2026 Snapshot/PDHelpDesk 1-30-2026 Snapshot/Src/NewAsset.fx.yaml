            LayoutJustifyContent: =LayoutJustifyContent.Center
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =100
            LayoutMinWidth: =250
            LayoutMode: =LayoutMode.Auto
            Visible: |
                =NewAsset.Size=1
            Width: =Parent.Width
            ZIndex: =3

            AssetDetailsWebMobileMenu_1 As compMobileMenu:
                Height: =Parent.Height
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =640
                LayoutMinWidth: =640
                Width: =Parent.Width

    NewAssetBackButton As icon.BackArrow:
        Color: =Color.White
        Height: =NewAssetLabel.Height/1.05
        Icon: =Icon.BackArrow
        OnSelect: =Back(ScreenTransition.Fade)
        Width: =49
        X: =Self.Width/5 
        Y: =(NewAssetHeaderContainer.Height-NewAssetLabel.Height)/1.05
        ZIndex: =2

    NewAssetWebMenu As compWebMenu:
        Height: =If(showMenu, Parent.Height, 80)
        Visible: =NewAsset.Size > 1
        Width: =If(showMenu, Parent.Width, 80)
        ZIndex: =3

    NewAssetFeedbackBugReport As FeedbackBugReport:
        CloseReport: =Set(varFeedback,false)
        DisablePickMedia: =Set(PickMedia,false)
        EnablePickMedia: =Set(PickMedia,true)
        FeedbackCameraOff: =Set(FeedbackCamera,false);
        FeedbackCameraOn: =Set(FeedbackCamera,true);
        PhotoModeDisable: =Set(FeedbackPhoto,false)
        PhotoModeEnable: =Set(FeedbackPhoto,true)
        Visible: =varFeedback
        ZIndex: =4

    TemplateErrorPopup_6 As groupContainer.manualLayoutContainer:
        Height: =Parent.Height
        LayoutGridColumns: =6
        LayoutGridRows: =6
        Visible: =assetFormError
        Width: =Parent.Width
        ZIndex: =5

        TemplateErrorBackground_6 As rectangle:
            Fill: =RGBA(56, 96, 178, .25)
            Height: =Parent.Height
            Width: =Parent.Width
            ZIndex: =1

        TemplateErrorWindow_6 As rectangle:
            BorderThickness: =2
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height/1.125
            Width: =Parent.Width/1.125
            X: =(Parent.Width-Self.Width)/2
            Y: =(Parent.Height-Self.Height)/2
            ZIndex: =2

        TemplateErrorHeaderRectangle_6 As rectangle:
            BorderThickness: =2
            Width: =TemplateErrorWindow_6.Width
            X: =TemplateErrorWindow_6.X
