                    Fill: =Color.Transparent
                    Height: =48
                    Size: =If(NewAsset.Size=1, titleText.mobileSize, titleText.desktopSize)
                    Text: =If(amSelection = "Computer Assets","New Computer Asset","New Equipment Asset")
