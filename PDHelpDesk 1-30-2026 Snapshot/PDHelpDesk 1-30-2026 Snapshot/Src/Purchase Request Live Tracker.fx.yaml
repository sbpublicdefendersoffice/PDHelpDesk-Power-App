    Button36 As button:
        OnSelect: |-
            =Refresh('Purchase Requests');
            Refresh('Purchase Request Items');
            UpdateContext({ActivePR:LookUp('Purchase Requests',ID=PurchaseID)});
            
            //Check tracker state
            If(ActivePR.Viewed = false And CountRows(Filter('Purchase Request Items',PRId = ActivePR.ID And Viewed = false))>0 , Set(CurrentState,LookUp(LiveTrackerStates,StateNo=1)));
            If(ActivePR.Viewed = true And CountRows(Filter('Purchase Request Items',PRId = ActivePR.ID And Viewed = false))>0 , Set(CurrentState,LookUp(LiveTrackerStates,StateNo=2)));
            If(ActivePR.Viewed = true And CountRows(Filter('Purchase Request Items',PRId = ActivePR.ID And Viewed = true))>0 , Set(CurrentState,LookUp(LiveTrackerStates,StateNo=3)));
            If(ActivePR.Viewed = true And IsEmpty(Filter('Purchase Request Items',PRId = ActivePR.ID And Viewed = false)) And IsEmpty(ActivePR.Attachments) , Set(CurrentState,LookUp(LiveTrackerStates,StateNo=4)));
            If(ActivePR.Viewed = true And IsEmpty(Filter('Purchase Request Items',PRId = ActivePR.ID And Viewed = false)) And !IsEmpty(ActivePR.Attachments) , Set(CurrentState,LookUp(LiveTrackerStates,StateNo=5))); 
        Text: ="Refresh"
        X: =96
        Y: =80
        ZIndex: =5

