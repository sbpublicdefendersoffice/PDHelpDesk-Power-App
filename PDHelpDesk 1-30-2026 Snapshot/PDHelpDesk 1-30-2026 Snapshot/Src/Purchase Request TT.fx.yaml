                    Button33 As button:
                        OnSelect: |-
                            =//First create the main Purchase Request
                            Set(tempPR,Patch('Purchase Requests',Defaults('Purchase Requests'),
                            {
                                Title: "Purchase Request "& Text(Today(),"mm/dd/yyyy"),
                                LastUpdated: Now(),
                                Status:{Value:"Not Started"}
                            }
                            ););
                            ForAll(PRItems As Items, Patch('Purchase Request Items',Defaults('Purchase Request Items'),
                            {
                                PRId:tempPR.ID,
                                Title: Items.ItemName,
                                ItemLink:"<a href='"&Items.ItemLink&"'>"&Items.ItemName&"</a>",
                                Quantity:Items.Quantity,
                                DeploymentSite:Items.DeploymentSite,
                                Requestors:Items.Requestor,
                                DeliveryInformation:Items.DeliveryInformation,
                                MetricDate:Month(Now())&"/"&Year(Now()),
                                Price: Value(Items.Price),
                                Recipient: Items.Recipient
                            } ));
                            SendEmail.Run("mperez@countyofsb.org","Incoming Purchase Request",HtmlText13.HtmlText,"bmodell@countyofsb.org,"&User().Email);
                            Navigate('Purchase Request List');
                        Text: ="Submit"
                        X: =(Parent.Width- Self.Width)/2
                        Y: =84
                        ZIndex: =1

