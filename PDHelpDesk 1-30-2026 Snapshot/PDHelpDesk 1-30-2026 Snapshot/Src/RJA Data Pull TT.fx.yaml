                    DRFSubmitButton_6 As button:
                        Fill: =ColorScheme.primary
                        Height: =DRFCancelButton_6.Height
                        OnSelect: |
                            =//
                            If(DRFDescriptionTextInputArea_6.Visible,
                            UpdateContext({TicketDescText:Concatenate("Reason for Data Request: "&TextInput7_20.Text&Char(13)&Char(13),
                            "Intended Use: "&TextInput7_21.Text&Char(13)&Char(13),
                            "Time Period: "&TextInput7_25.Text&Char(13)&Char(13),
                            "Data Fields: "&TextInput7_22.Text&Char(13)&Char(13),
                            "Priority Level: "&Dropdown14_5.Selected.Priority&Char(13)&Char(13),
                            "Desired Date: "&DatePicker6_7.SelectedDate&Char(13)&Char(13),
                            "Additional Details: "&DRFDescriptionTextInputArea_6.Text)}), Notify("Description is Blank"));
                            
                            //Check if the title or Description are empty, if they are the form will not be submitted
                            If(
                                true,
                                UpdateContext({DataCardKey1_1: "Title"});
                                UpdateContext({DataCardKey5: "Description"});
                                //Set(DataCardKey5: "Description");
                            Set(
                                    //Temporary record
                                    rec,
                                    //DB operation, from Ticket table, new record, change these columns
                                    Patch(
                                        Tickets,
                                        Defaults(Tickets),
                                        {
                                            Title: "RJA Data Pull Request",
                                            description: Trim(TicketDescText),
                                            creatorId: userData.id,
                                            mainCategory: DRFMainCategoryDropdown_5.Selected.ID,
                                            category: eDefenderBFPSubCategoryDropdown_6.Selected.ID,
                                            subCategory: DRFSpecificIssueDropdown_5.Selected.ID,
                                            locationId: DRFLocationIDDropDown_5.Selected.ID,
                                            status: "pending",
                                            metricDate: Concatenate(
                                                Month(Today()),
                                                "/",
                                                Year(Today())
                                            ),
                                            hasAttachment: If(
                                                IsEmpty(attItems),
                                                0,
                                                1
                                            ),
                                            //Automation rules table is used to assign tickets
                                            assignedTo: If(
                                                IsEmpty(
                                                    Filter(
                                                        'Ticket Automation Rules',
                                                        categoryId = DRFMainCategoryDropdown_5.Selected.ID && locationId = DRFLocationIDDropDown_5.Selected.ID
                                                    )
                                                ),
                                                0,
                                                LookUp(
                                                    'Ticket Automation Rules',
                                                    categoryId = DRFMainCategoryDropdown_5.Selected.ID && locationId = DRFLocationIDDropDown_5.Selected.ID,
                                                    userID
                                                )
                                            )
                                        }
                                    )
                                );
                            
                            Patch(
                                Tickets, 
                                LookUp(Tickets,ID = rec.ID),
                                {
                                    Title: "#"&rec.ID&" RJA Data Pull Request"
                                });
                            // for the attachments, run power automate flow for each attached file
                            ForAll(
                                attItems As Attachment,
                                        AttachFiles.Run(
                                        rec.ID,
                                        {
                                            file:{
                                                contentBytes: Attachment.Value,
                                                name: Attachment.Name
                                            }
                                        }
                                    ) 
                            );
                            //Now do it for the camera and screenshots
                            ForAll(
                                RTEImages As RTEI,
                                With({varHTMLTable: Split(RTEI.base64Image , "<img")}, If(CountRows(varHTMLTable)>1, With({varB64Start:Find("<img",RTEI.base64Image)+32},With({varB64End:Find("""",Mid(RTEI.base64Image,varB64Start))-1},CopyPasteTest.Run(Mid(RTEI.base64Image,varB64Start,varB64End),RTEI.copyName & Text(Now(),DateTimeFormat.UTC) &".png", rec.ID)
                            ))))
                                    );
                                
                                /*SMTP.SendEmailV3(
                                    {
                                        From: "sbpdhelpdesk@outlook.com",
