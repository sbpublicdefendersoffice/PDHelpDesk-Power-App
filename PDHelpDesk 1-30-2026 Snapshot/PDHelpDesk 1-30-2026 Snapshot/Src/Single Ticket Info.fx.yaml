                            If(sendEmailTempRec.creatorId <> ticketInfo.creatorId,SendEmail.Run(ReporterAssignComboBox.Selected.email, "Help Desk Ticket Recieved",ReporterAssignRTE.HtmlText,""););
                            //Send to Main tech
                            If(sendEmailTempRec.assignedTo <> ticketInfo.assignedTo,SendEmail.Run(Assignee_ComboBox.Selected.email, "Help Desk Ticket Reassigned",MainAssigneeRTE.HtmlText,""););
                            //Send to Observers)
                            If(sendEmailTempRec.addAssignees <> ticketInfo.addAssignees,
                            //Collect observer emails 
                            Set(addEmails,Split(ticketInfo.addAssignees,",")); 
                            //Send Email and CC observers 
                            SendEmail.Run(LookUp(Users,ID = ticketInfo.assignedTo).email,"Observers Added",ObserversRTE.HtmlText,If(!IsEmpty(addEmails),Concat(addEmails,LookUp(Users,Value=fullName,email),","),"")););
