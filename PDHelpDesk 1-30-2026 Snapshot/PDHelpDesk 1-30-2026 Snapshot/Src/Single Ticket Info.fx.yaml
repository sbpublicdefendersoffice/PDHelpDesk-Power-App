                    Save_Button_1 As button:
                        Fill: =ColorScheme.primary
                        Height: =30
                        OnSelect: |-
                            =// update the current ticket fields first
                            Refresh(Tickets);
                            Patch(
                                Tickets,
                                LookUp(
                                    Tickets,
                                    ID = ticketInfo.ID
                                ),
                                {tags: Tags_ComboBox_Value_1.Text},
                                {creatorId:ReporterAssignComboBox_1.Selected.ID},
                                {
                                    assignedTo: If(
                                        IsBlank(AssigneeId_1.Text),
                                        Blank(),
                                        Value(AssigneeId_1.Text)
                                    )
                                },
                                {status: StatusComboBox_1.Selected.status},
                                {addAssignees: Additional_Assign_Value_Label_1.Text},
                                {locationId:LocationComboBox_1.Selected.ID},
                                {mainCategory:CategoryComboBox_1.Selected.ID}
                            );
                            
                            //Check if we selected any children tickets
                            If(IsBlank(ChildrenTicketsComboBoxItemsLabel_1.Text),
                            // if there were children tickets, unselecting them will now nullify this ticket as its parent
                            ForAll( ChildTickets As item1, 
                                Patch(
                                    Tickets, 
                                    LookUp( Tickets, ID= item1.ID),
                                        {
                                            parentId: Blank()
                                        }
                            ));
                            // remove tickets from collection as they are no longer linked
                            Clear(ChildTickets);,
                            // we should check for changes, ChildTickets contains the current link of tickets
                            ClearCollect(Erasables, Filter(ChildTickets, !(ID in SelectChildrenComboBox_1.SelectedItems.ID)));
                            ForAll(Erasables As E, 
                            Patch(Tickets, LookUp(Tickets, ID = E.ID),
                            {
                                parentId: Blank()
                            });
                            If(IsEmpty(ChildTickets), Notify("Child Tickets Empty"), Remove(ChildTickets, LookUp(ChildTickets, ID = E.ID)));
                            );
                            //If we selected tickets to link, set the parent as this ticket
                            ForAll(SelectChildrenComboBox_1.SelectedItems As item2, 
                                Patch(
                                    Tickets, 
                                    LookUp( Tickets, ID= item2.ID),
                                        {
                                            parentId: ticketInfo.ID
                                        }
                            );
                            //add ticket to the collection
                            // If a ticket does not exist in the collection add it, otherwise dont
                            If(IsBlank(LookUp(ChildTickets, item2.ID = ID)), Collect(ChildTickets, item2) )));
                            //Collect(ChildTickets,item2)));
                            //If(IsEmpty(ChildTickets) && CountRows(ComboBox2.SelectedItems)>0, Collect(ChildTickets,ComboBox2.SelectedItems)));
                            Refresh(Tickets);
                            UpdateContext({SaveText:"Save"});
                            UpdateContext({ticketInfo:LookUp(Tickets,tempID = ID,ThisRecord)});
                            Notify("Changes Saved!");
                            Reset(SelectChildrenComboBox);
                            Reset(SelectChildrenComboBox_1);
                            Reset(Additional_Assign_ComboBox);
                            Reset(Additional_Assign_ComboBox_1);
                            UpdateContext({emailDelay:true});
                        Size: =Reporter_Label.Size
                        Text: =SaveText
                        Visible: |-
                            =//If(userData.role = "staff", false,true)
                            If(userData.role = "staff",false,showComboBox)
                        Width: =120
                        X: =(Parent.Width-Self.Width)/2
