                    Save_Button As button:
                        Fill: =ColorScheme.primary
                        Height: =30
                        OnSelect: |-
                            =// sharepoint
                            UpdateContext({SaveText:"..."});
                            /*If(
                                true
                                /*Assignee_Value_Label.Text <> User().FullName && Assignee_Value_Label.Text <> LookUp(
                                    Users,
                                    ID = ticketInfo.AssignedTo,
                                    fullName
                                ),
                                SendEmail.Run(
                                    Concatenate(
                                        "'",
                                        LookUp(
                                            Users,
                                            fullName = Assignee_Value_Label.Text,
                                            email
                                        ),
                                        "'"
                                    ),
                                    "Help Desk Ticket Assigned",
                                    RichTextEditor1_6.HtmlText,
                                    Text(Blank())
                                )
                                /*SMTP.SendEmailV3(
                                    {
                                        From: "sbpdhelpdesk@outlook.com",
                                        To: LookUp(
                                            Users,
                                            fullName = Assignee_Value_Label.Text,
                                            email
                                        ),
                                        Subject: "Help Desk Ticket Assigned",
                                        Body: "<div>Hello, this is an automated response. An IT Help Desk ticket # " & ticketInfo.ID & " was assigned to you. Please click <a href='https://apps.powerapps.com/play/e/default-ce8a2002-448f-4f58-82b1-d86f73e3afdd/a/a370d8a4-8906-4ac3-bff0-0a588e959ea7?tenantId=ce8a2002-448f-4f58-82b1-d86f73e3afdd&TickID=" & ticketInfo.ID & "'>here</a> to view more details for the ticket.</div>"
                                    }
                                );
                            );*/
                            Set(sendEmailTempRec,ticketInfo);
                            // update the current ticket fields first
                            Refresh(Tickets);
                            Patch(
                                Tickets,
                                LookUp(
                                    Tickets,
                                    ID = ticketInfo.ID
                                ),
                                {tags: Tags_ComboBox_Value.Text},
                                {creatorId:ReporterAssignComboBox.Selected.ID},
                                {
                                    assignedTo: If(
                                        IsBlank(AssigneeId.Text),
                                        Blank(),
                                        Value(AssigneeId.Text)
                                    )
                                },
                                {status: StatusComboBox.Selected.status},
                                {addAssignees: Additional_Assign_Value_Label.Text},
                                {mainCategory:CategoryComboBox.Selected.ID},
                                {locationId: LocationComboBox.Selected.ID}
                            );
                            
                            //Check if we selected any children tickets
                            If(IsBlank(ChildrenTicketsComboBoxItemsLabel.Text),
                            // if there were children tickets, unselecting them will now nullify this ticket as its parent
                            ForAll( ChildTickets As item1, 
                                Patch(
                                    Tickets, 
                                    LookUp( Tickets, ID= item1.ID),
                                        {
                                            parentId: Blank()
                                        }
                            ));
                            // remove tickets from collection as they are no longer linked
                            Clear(ChildTickets);,
                            // we should check for changes, ChildTickets contains the current link of tickets
                            ClearCollect(Erasables, Filter(ChildTickets, !(ID in SelectChildrenComboBox.SelectedItems.ID)));
                            ForAll(Erasables As E, 
                            Patch(Tickets, LookUp(Tickets, ID = E.ID),
                            {
                                parentId: Blank()
                            });
                            If(IsEmpty(ChildTickets), Notify("Child Tickets Empty"), Remove(ChildTickets, LookUp(ChildTickets, ID = E.ID)));
                            );
                            //If we selected tickets to link, set the parent as this ticket
                            ForAll(SelectChildrenComboBox.SelectedItems As item2, 
                                Patch(
                                    Tickets, 
                                    LookUp( Tickets, ID= item2.ID),
                                        {
                                            parentId: ticketInfo.ID
                                        }
                            );
                            //add ticket to the collection
                            // If a ticket does not exist in the collection add it, otherwise dont
                            If(IsBlank(LookUp(ChildTickets, item2.ID = ID)), Collect(ChildTickets, item2) )));
                            //Collect(ChildTickets,item2)));
                            //If(IsEmpty(ChildTickets) && CountRows(ComboBox2.SelectedItems)>0, Collect(ChildTickets,ComboBox2.SelectedItems)));
                            Refresh(Tickets);
                            UpdateContext({SaveText:"Save"});
                            UpdateContext({ticketInfo:LookUp(Tickets,tempID=ID,ThisRecord)});
                            Notify("Changes Saved!");
                            Reset(SelectChildrenComboBox);
                            Reset(SelectChildrenComboBox_1);
                            Reset(Additional_Assign_ComboBox);
                            Reset(Additional_Assign_ComboBox_1);
                            UpdateContext({emailDelay:true});
                        Size: =Reporter_Label.Size
