                    "'S/AMicrosoftButtons_DataCard' As typedDataCard.blankCard":
                        BorderStyle: =BorderStyle.Solid
                        DisplayMode: =DisplayMode.Edit
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =If( 'Software/Applications Microsoft TT'.Size = 1, Parent.Height/3, Parent.Height/5)
                        Width: =1366
                        WidthFit: =true
                        X: =0
                        Y: =8
                        ZIndex: =1

                        "'S/AMicrosoftSubmitButton' As button":
                            DisplayMode: |-
                                =
                                //could use this to enable/disable button behaviour
                                //If(CreateATicketForm_1.Valid, DisplayMode.Edit, DisplayMode.Disabled)
                                
                                DisplayMode.Edit
                            Fill: =ColorScheme.primary
                            Height: ='S/AMicrosoftCancelButton'.Height
                            OnSelect: |
                                =
                                If(!'S/AMicrosoftDescriptionTextInputArea'.Visible,
                                UpdateContext({TicketDescText:Concatenate("Microsoft Product Chosen: "&Radio8.Selected.Option&Char(13)&Char(13),"Problem Details: "&Char(13)&ExFieldInput1_36.Text)}), Notify("Description is Blank"));
                                
                                //Check if the title or Description are empty, if they are the form will not be submitted
                                If(
                                    !IsBlank('S/AMicrosoftLocationIDDropdown'.Selected.Name) And !IsBlank(Radio8.Selected.Option) And 
                                    Len(Trim(ExFieldInput1_36.Text))> 0,
                                    UpdateContext({DataCardKey1_1: "Title"});
                                    UpdateContext({DataCardKey5: "Description"});
                                    //Set(DataCardKey5: "Description");
                                Set(
                                        //Temporary record
                                        rec,
                                        //DB operation, from Ticket table, new record, change these columns
                                        Patch(
                                            Tickets,
                                            Defaults(Tickets),
                                            {
                                                Title: 'S/AMicrosoftTitleInput'.Text,
                                                description: Trim('S/AMicrosoftDescriptionTextInputArea'.Text),
                                                creatorId: userData.id,
                                                mainCategory: 'S/AMicrosoftMainCategoryDropdown'.Selected.ID,
                                                category: 'S/AMicrosoftSubCategoryDropdown'.Selected.ID,
                                                subCategory: 'S/AMicrosoftSpecificIssueDropdown'.Selected.ID,
                                                locationId: 'S/AMicrosoftLocationIDDropdown'.Selected.ID,
                                                status: "open",
                                                metricDate: Concatenate(
                                                    Month(Today()),
                                                    "/",
                                                    Year(Today())
                                                ),
                                                hasAttachment: If(
                                                    IsEmpty(JointAttachments),
                                                    0,
                                                    1
                                                ),
                                                //Automation rules table is used to assign tickets
                                                assignedTo: If(
                                                    IsEmpty(
                                                        Filter(
                                                            'Ticket Automation Rules',
                                                            categoryId = 'S/AMicrosoftMainCategoryDropdown'.Selected.ID && locationId = 'S/AMicrosoftLocationIDDropdown'.Selected.ID
                                                        )
                                                    ),
                                                    0,
                                                    LookUp(
                                                        'Ticket Automation Rules',
                                                        categoryId = 'S/AMicrosoftMainCategoryDropdown'.Selected.ID && locationId = 'S/AMicrosoftLocationIDDropdown'.Selected.ID,
                                                        userID
                                                    )
                                                )
                                            }
                                        )
                                    );
                                
                                Patch(
                                    Tickets, 
                                    LookUp(Tickets,ID = rec.ID),
                                    {
                                        Title: "# "&rec.ID&" Microsoft "&Radio8.Selected.Option&" Request"
                                    });
                                // for the attachments, run power automate flow for each attached file
                                ForAll(
                                    attItems As Attachment,
                                            AttachFiles.Run(
                                            rec.ID,
                                            {
                                                file:{
                                                    contentBytes: Attachment.Value,
                                                    name: Attachment.Name
                                                }
                                            }
                                        ) 
                                );
                                ForAll(
                                    RTEImages As RTEI,
                                    With({varHTMLTable: Split(RTEI.base64Image , "<img")}, If(CountRows(varHTMLTable)>1, With({varB64Start:Find("<img",RTEI.base64Image)+32},With({varB64End:Find("""",Mid(RTEI.base64Image,varB64Start))-1},CopyPasteTest.Run(Mid(RTEI.base64Image,varB64Start,varB64End),RTEI.copyName & Text(Now(),DateTimeFormat.UTC) &".png", rec.ID)
                                ))))
                                        );
                                
                                    
                                    /*SMTP.SendEmailV3(
                                        {
                                            From: "sbpdhelpdesk@outlook.com",
