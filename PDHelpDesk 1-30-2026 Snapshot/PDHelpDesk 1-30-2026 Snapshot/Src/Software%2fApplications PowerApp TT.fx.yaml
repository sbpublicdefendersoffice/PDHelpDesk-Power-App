                    "'S/AZoomSubmitButton_1' As button":
                        DisplayMode: |-
                            =
                            //could use this to enable/disable button behaviour
                            //If(CreateATicketForm_1.Valid, DisplayMode.Edit, DisplayMode.Disabled)
                            
                            DisplayMode.Edit
                        Fill: =ColorScheme.primary
                        Height: ='S/AZoomCancelButton_1'.Height
                        OnSelect: |
                            =
                            If(!'S/APowerAppDescriptionTextInputArea'.Visible,
                            UpdateContext({TicketDescText:Concatenate("")}); Notify("Description is Blank"));
                            
                            //Check if the title or Description are empty, if they are the form will not be submitted
                            If(
                                !IsBlank('S/APowerAppLocationIDDropdown'.Selected.Name) And !IsBlank('S/APowerAppDropdown'.Selected.App) And Len(Trim('S/APowerAppDescriptionTextInputArea'.Text))>0,
                                UpdateContext({DataCardKey1_1: "Title"});
                                UpdateContext({DataCardKey5: "Description"});
                                //Set(DataCardKey5: "Description");
                            Set(
                                    //Temporary record
                                    rec,
                                    //DB operation, from Ticket table, new record, change these columns
                                    Patch(
                                        Tickets,
                                        Defaults(Tickets),
                                        {
                                            Title: 'S/AZoomTitleInput_1'.Text,
                                            description: "Application: "&'S/APowerAppDropdown'.Selected.App&Char(13)&"Details: "&'S/APowerAppDescriptionTextInputArea'.Text,
                                            creatorId: userData.id,
                                            mainCategory: 'S/AZoomMainCategoryDropdown_1'.Selected.ID,
                                            category: 'S/AZoomSubCategoryDropdown_1'.Selected.ID,
                                            subCategory: 'S/AZoomSpecificIssueDropdown_1'.Selected.ID,
                                            locationId: 'S/APowerAppLocationIDDropdown'.Selected.ID,
                                            status: "open",
                                            metricDate: Concatenate(
                                                Month(Today()),
                                                "/",
                                                Year(Today())
                                            ),
                                            hasAttachment: If(
                                                IsEmpty(attItems),
                                                0,
                                                1
                                            ),
                                            //Automation rules table is used to assign tickets
                                            assignedTo: If(
                                                IsEmpty(
                                                    Filter(
                                                        'Ticket Automation Rules',
                                                        categoryId = 'S/AZoomMainCategoryDropdown_1'.Selected.ID && locationId = 'S/APowerAppLocationIDDropdown'.Selected.ID
                                                    )
                                                ),
                                                0,
                                                LookUp(
                                                    'Ticket Automation Rules',
                                                    categoryId = 'S/AZoomMainCategoryDropdown_1'.Selected.ID && locationId = 'S/APowerAppLocationIDDropdown'.Selected.ID,
                                                    userID
                                                )
                                            )
                                        }
                                    )
                                );
                            
                            Patch(
                                Tickets, 
                                LookUp(Tickets,ID = rec.ID),
                                {
                                    Title: "# "&rec.ID&" Power Apps Request"
                                });
                            // for the attachments, run power automate flow for each attached file in the regular attachment flow
                            ForAll(
                                attItems As Attachment,
                                        AttachFiles.Run(
                                        rec.ID,
                                        {
                                            file:{
                                                contentBytes: Attachment.Value,
                                                name: Attachment.Name
                                            }
                                        }
                                    ) 
                            );
                            //Now do it for the camera and screenshots
                            ForAll(
                                RTEImages As RTEI,
                                With({varHTMLTable: Split(RTEI.base64Image , "<img")}, If(CountRows(varHTMLTable)>1, With({varB64Start:Find("<img",RTEI.base64Image)+32},With({varB64End:Find("""",Mid(RTEI.base64Image,varB64Start))-1},CopyPasteTest.Run(Mid(RTEI.base64Image,varB64Start,varB64End),RTEI.copyName & Text(Now(),DateTimeFormat.UTC) &".png", rec.ID)
                            ))))
                                    );
                                
                                /*SMTP.SendEmailV3(
                                    {
                                        From: "sbpdhelpdesk@outlook.com",
                                        To: userData.email,
                                        Subject: "Help Desk Ticket Received",
                                        Body: "<div>Hello, this is an automated response. An IT Help Desk ticket # " & rec.ID & " was created on your behalf. A technician will contact you soon to begin troubleshooting.</div><br> <div> To view the status of the ticket or add comments, please visit <a href="https://apps.powerapps.com/play/e/default-ce8a2002-448f-4f58-82b1-d86f73e3afdd/a/a370d8a4-8906-4ac3-bff0-0a588e959ea7?tenantId=ce8a2002-448f-4f58-82b1-d86f73e3afdd&TickID=" & rec.ID & "'>here</a>.</div>"
