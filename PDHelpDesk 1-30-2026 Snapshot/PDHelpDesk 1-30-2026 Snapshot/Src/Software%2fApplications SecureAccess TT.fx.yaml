                        Width: =Parent.Width
                        Y: ='S/ANetMotionWebHeader'.Height
                        ZIndex: =2

                    "'S/ANetMotionWebHeader' As compWebHeader":
                        BackgroundColor: =Color.Transparent
                        CompScreenSize: ='Software/Applications SecureAccess TT'.Size
                        EnableFeedback: =Set(varFeedback,true)
