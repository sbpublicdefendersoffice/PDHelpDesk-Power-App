"'Software/Applications SecureAccess TT' As screen":
    BackgroundImage: =PUBDEF_IT__LOGO_Vector
    Fill: =ColorScheme.screenBackground
    OnHidden: |
        =UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
    OnVisible: |-
        =ResetForm('S/ANetMotionForm');
        UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
        Clear(RTEImages);
        Clear(JointAttachments);
        Clear(attItems);
        UpdateContext({altImagePopUp:false,usingCamera:false});

    "'S/ANetMotionMainContainer' As groupContainer.horizontalAutoLayoutContainer":
        Height: ='Software/Applications SecureAccess TT'.Height
        LayoutGridColumns: =6
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        Width: ='Software/Applications SecureAccess TT'.Width
        ZIndex: =1

        "'S/ANetMotionVerticalLayoutContainer' As groupContainer.verticalAutoLayoutContainer":
            AlignInContainer: =AlignInContainer.SetByContainer
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumns: =6
            LayoutGridRows: =6
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =100
            LayoutMinWidth: =250
            LayoutMode: =LayoutMode.Auto
            ZIndex: =2

            "'S/ANetMotionHeaderContainer' As groupContainer.verticalAutoLayoutContainer":
                AlignInContainer: =AlignInContainer.SetByContainer
                Fill: =ColorScheme.primary
                FillPortions: =0
                Height: |-
                    =130
                    //Parent.Height/11
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutDirection: =LayoutDirection.Vertical
                LayoutGridColumns: =6
                LayoutGridRows: =6
                LayoutJustifyContent: =LayoutJustifyContent.Center
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =100
                LayoutMinWidth: =250
                LayoutMode: =LayoutMode.Auto
                Visible: |-
                    =//Home.Size<>1
                    //This is the top most header container that houses the navbar links
                    true
                Width: =Parent.Width
                ZIndex: =1

                "'NetMotionHeaderElements''' As groupContainer.manualLayoutContainer":
                    LayoutGridColumns: =6
                    LayoutGridRows: =6
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =100
                    LayoutMinWidth: =250
