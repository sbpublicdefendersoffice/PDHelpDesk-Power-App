                        "'S/ANetMotionSubmitButton' As button":
                            DisplayMode: |-
                                =
                                //could use this to enable/disable button behaviour
                                //If(CreateATicketForm_1.Valid, DisplayMode.Edit, DisplayMode.Disabled)
                                
                                DisplayMode.Edit
                            Fill: =ColorScheme.primary
                            Height: ='S/ANetMotionCancelButton'.Height
                            OnSelect: |
                                =
                                If(!'S/ANetMotionDescriptionTextInputArea'.Visible,
                                UpdateContext({TicketDescText:Concatenate("")}));
                                
                                //Check if the title or Description are empty, if they are the form will not be submitted
                                If(
                                    !IsBlank('S/ANetMotionLocationIDDropdown'.Selected.Name) And Len(Trim('S/ANetMotionDescriptionTextInputArea'.Text))>0,
                                    UpdateContext({DataCardKey1_1: "Title"});
                                    UpdateContext({DataCardKey5: "Description"});
                                    //Set(DataCardKey5: "Description");
                                Set(
                                        //Temporary record
                                        rec,
                                        //DB operation, from Ticket table, new record, change these columns
                                        Patch(
                                            Tickets,
                                            Defaults(Tickets),
                                            {
                                                Title: 'S/ANetMotionTitleInput'.Text,
                                                description: Trim('S/ANetMotionDescriptionTextInputArea'.Text),
                                                creatorId: userData.id,
                                                mainCategory: 'S/ANetMotionMainCategoryDropdown'.Selected.ID,
                                                category: 'S/ANetMotionSubCategoryDropdown'.Selected.ID,
                                                subCategory: 'S/ANetMotionSpecificIssueDropdown'.Selected.ID,
                                                locationId: 'S/ANetMotionLocationIDDropdown'.Selected.ID,
                                                status: "open",
                                                metricDate: Concatenate(
                                                    Month(Today()),
                                                    "/",
                                                    Year(Today())
                                                ),
                                                hasAttachment: If(
                                                    IsEmpty(JointAttachments),
                                                    0,
                                                    1
                                                ),
                                                //Automation rules table is used to assign tickets 
                                                assignedTo: If(
                                                    IsEmpty(
                                                        Filter(
                                                            'Ticket Automation Rules',
                                                            categoryId = 'S/ANetMotionMainCategoryDropdown'.Selected.ID && locationId = 'S/ANetMotionLocationIDDropdown'.Selected.ID
                                                        )
                                                    ),
                                                    0,
                                                    LookUp(
                                                        'Ticket Automation Rules',
                                                        categoryId = 'S/ANetMotionMainCategoryDropdown'.Selected.ID && locationId = 'S/ANetMotionLocationIDDropdown'.Selected.ID,
                                                        userID
                                                    )
                                                )
                                            }
                                        )
                                    );
                                
                                Patch(
                                    Tickets, 
                                    LookUp(Tickets,ID = rec.ID),
                                    {
                                        Title: "# "&rec.ID&" NetMotion Support Request"
                                    });
                                // for the attachments, run power automate flow for each attached file
                                Clear(RTEImages);
                                Clear(JointAttachments);
                                Clear(attItems);
                                    
