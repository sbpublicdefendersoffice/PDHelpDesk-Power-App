"'Splash Screen' As screen":
    BackgroundImage: =
    Fill: =RGBA(53,89,137, 1)
    ImagePosition: =ImagePosition.Center
    OnVisible: |-
        =//UpdateContext will update a variable on this screen, contextLoading status is the text at the bottom
        UpdateContext({contextLoadingStatus: "Processing Records..."});
        
        //Check if the user loggin on is an admin
        If(
            LookUp(
                Users,       
                email = User().Email,
                userRole
            ) = "admin" || LookUp(
                Users,       
                email = User().Email,
                userRole
            ) = "tech",
        
            //if so set global admin variable to true otherwise false
            Set(
                is_admin,
                true
            ),
            Set(
                is_admin,
                false
            )
        );
        
        //create current user data profile
        Set(
            userData,
            {
                fullName: LookUp(
                    Users,
                    email = User().Email,
                    fullName
                ),
                email: User().Email,
                role: LookUp(
                    Users,
                    email = User().Email,
                    userRole
                ),
                id: LookUp(
                    Users,
                    email = User().Email,
                    ID
                )
            }
        );
        //Enable for non timer based navigation for Splash Screen
        //Set(splashNavigate,true)
        
        //Create a collection called colstatus with 2 records with a field called Result
        ClearCollect(
            colStatus,
            {Result: "open"},
            {Result: "pending"},
            {Result: "void"},
            {Result: "closed"}
        );
        //split admin tech later
        // Create the home screen navigation collection
        ClearCollect(
            navCol,
            {
                ID: 2,
                NavName: "Create Ticket",
                NavIcon: Icon.AddDocument,
                ScreenToGoTo: 'Category Select',
                AdminTech: true,
                Staff: true
            },
            {
                ID: 3,
                NavName: "My Tickets",
                NavIcon: Icon.Folder,
                ScreenToGoTo: MyTickets,
                AdminTech: true,
                Staff: true
            },
            {
                ID: 5,
                NavName: "Admin Tools",
                NavIcon: Icon.ComputerDesktop,
                ScreenToGoTo: 'Admin Manager',
                AdminTech: true,
                Staff: false
            },
            {
                ID: 6,
                NavName: "Services",
                NavIcon: Icon.Signal,
                ScreenToGoTo: 'Services Status',
                AdminTech: false,
                Staff: true
            }
            ,
