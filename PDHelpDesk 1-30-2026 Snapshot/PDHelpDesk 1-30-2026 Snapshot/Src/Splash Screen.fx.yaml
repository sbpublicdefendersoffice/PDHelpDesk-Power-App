    Splash_Main_Container As groupContainer.horizontalAutoLayoutContainer:
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Center
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGridColumns: =6
        LayoutGridRows: =6
        LayoutJustifyContent: =LayoutJustifyContent.Center
        LayoutMode: =LayoutMode.Auto
        LayoutOverflowX: =LayoutOverflow.Scroll
        LayoutOverflowY: =LayoutOverflow.Scroll
        Width: =Parent.Width
        ZIndex: =6

        Splash_Main_Content As groupContainer.manualLayoutContainer:
            LayoutGridColumns: =6
            LayoutGridRows: =6
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =100
            LayoutMinWidth: =250
            ZIndex: =5

            Splash_Gradient_Background As htmlViewer:
                DisabledBorderColor: =RGBA(56, 56, 56, 1)
                Height: =Parent.Height
                HtmlText: |-
                    ="<div style='
                    height:"&Self.Height-1&"px;
                    width:100%;
                    bbackground: rgb(53,89,137);
                    background: linear-gradient(90deg, rgb("&gradientLeft.red&","&gradientLeft.blue&","&gradientLeft.green&") 0%, rgb("&gradientRight.red&","&gradientRight.blue&","&gradientRight.green&") 100%);' ></div>"
                PaddingBottom: =0
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                Width: =Parent.Width
                ZIndex: =1

            Splash_Spinner As image:
                Image: |-
                    ="data:image/svg+xml;utf8, "&EncodeUrl("
                    <svg
                      width='200'
                      height='200'
                      viewBox='0 0 200 200'
                      color='#000000'
                      fill='none'
                      xmlns='http://www.w3.org/2000/svg'
                    >
                      <defs>
                        <linearGradient id='spinner-secondHalf'>
                          <stop offset='0%' stop-opacity='0' stop-color='currentColor' />
                          <stop offset='100%' stop-opacity='0.5' stop-color='currentColor' />
                        </linearGradient>
                        <linearGradient id='spinner-firstHalf'>
                          <stop offset='0%' stop-opacity='1' stop-color='currentColor' />
                          <stop offset='100%' stop-opacity='0.5' stop-color='currentColor' />
                        </linearGradient>
                      </defs>
                    
                      <g stroke-width='8'>
                        <path stroke='url(#spinner-secondHalf)' d='M 4 100 A 96 96 0 0 1 196 100' />
                        <path stroke='url(#spinner-firstHalf)' d='M 196 100 A 96 96 0 0 1 4 100' />
                    
                        <!-- 1deg extra path to have the round end cap -->
                        <path
                          stroke='currentColor'
                          stroke-linecap='round'
                          d='M 4 100 A 96 96 0 0 1 4 98'
                        />
                      </g>
                    
                      <animateTransform
                        from='0 0 0'
                        to='360 0 0'
                        attributeName='transform'
                        type='rotate'
                        repeatCount='indefinite'
                        dur='600ms'
                      />
                    </svg>
                    ")
                X: =(Parent.Width-Self.Width)/2
                Y: =Splash_Logo.Height+Splash_Logo.Y
                ZIndex: =2

            Splash_Screen_Label As label:
                Align: =Align.Center
                AutoHeight: =true
                FontWeight: =FontWeight.Semibold
                Italic: =true
                PaddingTop: =10
                Size: =20
                Text: =contextLoadingStatus
                X: =(Parent.Width-Self.Width)/2
                Y: =Splash_Spinner.Height+Splash_Spinner.Y
                ZIndex: =4

            Splash_Navigate As button:
                OnSelect: |
                    =//If(InvalidUser,Navigate('User Not Valid',ScreenTransition.Fade),Navigate(Home,ScreenTransition.Fade));
                    
                    //Get the parameter for TickID and create a variable if there is none then it is blank or zero
                    Set(
                        varTickID,
                        Value(Param("TickID"))
                    );
                    
                    //First check if the user is valid
                    If(
                        // if not take them to the error and no permission screen
                        InvalidUser,
                        Navigate(
                            'User Not Valid',
                            ScreenTransition.Fade
                        ),
                        //check if we took in a parameter when opening the app
                        UpdateContext({contextLoadingStatus:"Checking ticket data..."});
                        If(
                            //we have an id parameter and it is valid
                            varTickID <> 0 && !IsBlank(varTickID),
                            Set(
                                ticketRec,
                                LookUp(
                                    AllTickets,
                                    ID = varTickID
                                )
                            );
                            //we have an id parameter, but its blank, send them to the home page otherwise send them to the ticket info screen
                            If (IsBlank(ticketRec),
                                Navigate(WelcomeUserScreen,ScreenTransition.Fade),
                                Navigate('Single Ticket Info', ScreenTransition.CoverRight, {ticketInfo: ticketRec})
                    
                                )
                            ),Navigate('Single Ticket Info', ScreenTransition.CoverRight, {ticketInfo: ticketRec}),
                            Navigate(WelcomeUserScreen,ScreenTransition.Fade)
                        );
                        
                Text: ="Button"
                Visible: =false
                X: =80
                ZIndex: =5

            Splash_Logo As image:
                Height: =Parent.Height/2
                Image: =unnamed
                Width: =300
                X: =(Parent.Width-Self.Width)/2
                Y: =(Parent.Height-Self.Height)/4
                ZIndex: =6

