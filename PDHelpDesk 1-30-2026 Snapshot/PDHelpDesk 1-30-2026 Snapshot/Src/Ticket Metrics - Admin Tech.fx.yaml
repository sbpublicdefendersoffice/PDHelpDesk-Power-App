"'Ticket Metrics - Admin Tech' As screen":
    BackgroundImage: =PUBDEF_IT__LOGO_Vector
    Fill: =ColorScheme.screenBackground
    OnHidden: |-
        =Set(ticketMonth,""&Month(Now())&"/2023");
        Reset(Dropdown9);
    OnVisible: |
        =//Set(ticketMonth,Concatenate(Month(Today()),"/",Year(Today())));
        UpdateContext({ticketMonth:""&Month(Today())&"/"&Year(Today())});
        UpdateContext({cycle:0,editMonth:false});
        ClearCollect(metricCol,
        {recID:1,
        TicketComplete:0,
        TicketLate:0,
        Tickets:0});
        ClearCollect(ticketMetrics, 
        Table(
            {
                ID:1,
                metricTitle: "Monthly Tickets Recieved",
                metricNumber: CountRows(Filter(Tickets, metricDate = ticketMonth))
            },
            {
                ID:2,
                metricTitle: "Monthly Tickets Resolved",
                metricNumber: CountRows(Filter(Tickets, metricDate = ticketMonth && status = "closed"))
            },
            {
                ID:3,
                metricTitle: "Monthly Tickets Open",
                metricNumber: CountRows(Filter(Tickets, metricDate = ticketMonth && status = "open"))
            },
            {
                ID:4,
                metricTitle: "Tickets Assigned to Me",
                metricNumber: CountRows(Filter(Tickets, assignedTo = userData.id && metricDate= ticketMonth))
            }
            )
        );
        
        Set(MontlyTotal, CountRows(Filter(Tickets,metricDate=ticketMonth)));
        ForAll(Filter(Tickets,assignedTo=userData.id && metricDate=Month(Now())&""&"/"&Year(Now())) As TicketData,
        If(DateDiff(TicketData.dateCreated,TicketData.dateClosed,TimeUnit.Days)>=2,Patch(metricCol,LookUp(metricCol,recID=1),{TicketLate:LookUp(metricCol,recID=1).TicketLate+1}),Patch(metricCol,LookUp(metricCol,recID=1),{TicketComplete:LookUp(metricCol,recID=1).TicketComplete+1})); );
        
        
        //Ticket response rate get the date created then the date closed
        // We should make it out of 5 business days
        //Month Cat1
        Set(monthlyCat1,CountRows(Filter(Tickets,metricDate=ticketMonth && mainCategory=1)));
        Set(monthlyCat2,CountRows(Filter(Tickets,metricDate=ticketMonth && mainCategory=2)));
        Set(monthlyCat3,CountRows(Filter(Tickets,metricDate=ticketMonth && mainCategory=3)));
        Set(monthlyCat4,CountRows(Filter(Tickets,metricDate=ticketMonth && mainCategory=4)));
        Set(monthlyCat5,CountRows(Filter(Tickets,metricDate=ticketMonth && mainCategory=5)));
        Set(monthlyCat6,CountRows(Filter(Tickets,metricDate=ticketMonth && mainCategory=6)));
        Set(monthlyCat7,CountRows(Filter(Tickets,metricDate=ticketMonth && mainCategory=7)));
        Set(monthlyCat8,CountRows(Filter(Tickets,metricDate=ticketMonth && mainCategory=8)));
        
        ClearCollect(monthlyTicketDistribution,
        {
            Category:LookUp(Category,ID=1,Name),
            Value:monthlyCat1
        },
        {
            Category:LookUp(Category,ID=2,Name),
            Value:monthlyCat2
        },
        {
            Category:LookUp(Category,ID=3,Name),
            Value:monthlyCat3
        },
        {
            Category:LookUp(Category,ID=4,Name),
            Value:monthlyCat4
        },
        {
            Category:LookUp(Category,ID=5,Name),
            Value:monthlyCat5
        },
        {
            Category:LookUp(Category,ID=6,Name),
            Value:monthlyCat6
        },
        {
            Category:LookUp(Category,ID=7,Name),
            Value:monthlyCat7
        },
        {
            Category:LookUp(Category,ID=8,Name),
            Value:monthlyCat8
        }
        );

