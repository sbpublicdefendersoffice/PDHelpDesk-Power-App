"'eDefender Access/Security Request TT' As screen":
    BackgroundImage: =PUBDEF_IT__LOGO_Vector
    Fill: =ColorScheme.screenBackground
    OnHidden: |
        =UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
    OnVisible: |-
        =ResetForm('eDefender_A/S_Form');
        UpdateContext({CreateTicketTitle: "Nature of Request", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:"",ASPopup:false});
        UpdateContext({usingCamera:false,altImagePopUp:false});
        Clear(RTEImages);
        Clear(JointAttachments);
        Clear(attItems);
        App.ActiveScreen.Size

    "'eDefender_A/S_Main_Container' As groupContainer.horizontalAutoLayoutContainer":
        Height: ='eDefender Access/Security Request TT'.Height
        LayoutGridColumns: =6
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        Width: ='eDefender Access/Security Request TT'.Width
        ZIndex: =2

        "'eDefender_A/S_Vertical_Layout_Container' As groupContainer.verticalAutoLayoutContainer":
            AlignInContainer: =AlignInContainer.SetByContainer
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumns: =6
            LayoutGridRows: =6
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =100
            LayoutMinWidth: =250
            LayoutMode: =LayoutMode.Auto
            ZIndex: =2

            "'eDefender_A/S_Header_Container' As groupContainer.verticalAutoLayoutContainer":
                AlignInContainer: =AlignInContainer.SetByContainer
                Fill: =ColorScheme.primary
                FillPortions: =0
                Height: =130
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutDirection: =LayoutDirection.Vertical
                LayoutGridColumns: =6
                LayoutGridRows: =6
                LayoutJustifyContent: =LayoutJustifyContent.Center
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =100
                LayoutMinWidth: =250
                LayoutMode: =LayoutMode.Auto
                Visible: |-
                    =//Home.Size<>1
                    //This is the top most header container that houses the navbar links
                    true
                Width: =Parent.Width
                ZIndex: =1

                "'eDefender_A/S_Header_Elements' As groupContainer.manualLayoutContainer":
                    FillPortions: =0
                    Height: =130
                    LayoutGridColumns: =6
                    LayoutGridRows: =6
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =130
                    LayoutMinWidth: =250
                    ZIndex: =10

                    "'eDefender_A/S_Background_Gradient' As htmlViewer":
                        DisabledBorderColor: =RGBA(56, 56, 56, 1)
                        Height: =Parent.Height
                        HtmlText: =Home_Background_Gradient.HtmlText
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Width: =Parent.Width
                        ZIndex: =1

                    "'eDefender_A/S_Header_Label' As label":
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =Color.Transparent
                        Height: =Parent.Height - 'eDefender_A/S_WebHeader'.Height
                        Size: =If('eDefender Access/Security Request TT'.Size=1, titleText.mobileSize, titleText.desktopSize)
                        Text: ="Access/Security Request Form"
                        Width: =Parent.Width
                        Y: ='eDefender_A/S_WebHeader'.Height
                        ZIndex: =2

                    "'eDefender_A/S_WebHeader' As compWebHeader":
                        BackgroundColor: =Color.Transparent
                        CompScreenSize: ='eDefender Access/Security Request TT'.Size
                        EnableFeedback: =Set(varFeedback,true)
                        Height: |-
                            =82
                            //Parent.Height
                        ZIndex: =3

            "'eDefender_A/S_Main_Content_Container' As groupContainer.verticalAutoLayoutContainer":
                AlignInContainer: =AlignInContainer.Center
                DropShadow: =DropShadow.Light
                Height: =Parent.Height-200
                LayoutDirection: =LayoutDirection.Vertical
                LayoutGridColumns: =6
                LayoutGridRows: =6
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =100
                LayoutMinWidth: =250
                LayoutMode: =LayoutMode.Auto
                LayoutOverflowY: =LayoutOverflow.Scroll
                Visible: |-
                    =true
                    //Main Content container this houses certian elements such as the searchbar, and 2 button galleries, one for desktop, and another for mobile
                Width: =Parent.Width
                ZIndex: =3

                "'eDefender_A/S_Form_Container' As groupContainer.manualLayoutContainer":
                    LayoutGridColumns: =6
                    LayoutGridRows: =6
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =100
                    LayoutMinWidth: =250
                    ZIndex: =3

                    "'eDefender_A/S_Form' As form":
                        DataSource: =Tickets
                        DefaultMode: =FormMode.New
                        Fill: =RGBA(227,234,243,.6)
                        Height: =Parent.Height
                        NumberOfColumns: =1
                        Width: =Parent.Width
                        ZIndex: =1

                        "'eDefender_A/S_Title_DataCard' As typedDataCard.textualEditCard":
                            BorderStyle: =BorderStyle.Solid
                            DataField: ="title"
                            Default: =ThisItem.Title
                            DisplayMode: =Parent.DisplayMode
                            DisplayName: =//DataSourceInfo([@Tickets],DataSourceInfo.DisplayName, "field_2")
                            Fill: =RGBA(0, 0, 0, 0)
                            Height: =If(App.ActiveScreen.Size =1,80,40)
                            MaxLength: =//DataSourceInfo([@Tickets], DataSourceInfo.MaxLength, "field_2")
                            Required: =false
                            Update: =
                            Visible: =true
                            Width: =1366
                            WidthFit: =true
                            X: =0
                            Y: =0
                            ZIndex: =1

                            "'eDefender_A/S_Disclaimer_Label' As label":
                                Align: =Align.Center
                                BorderColor: =RGBA(221, 79, 14, 1)
                                BorderThickness: =2
                                Color: =RGBA(221, 79, 14, 1)
                                Fill: =RGBA(255, 255, 255, 1)
                                FontWeight: =FontWeight.Semibold
                                Height: =If(App.ActiveScreen.Size =1,100,50)
                                Size: =If('eDefender Access/Security Request TT'.Size =1,12,15)
                                Text: ="When Submitting media, DO NOT SUBMIT DOCUMENTS CONTAINING SENSITIVE/RESTRICTED DATA. All case-related files should be uploaded to the Box File."
                                Width: =Parent.Width
                                ZIndex: =1

                            "'eDefender_A/S_Title_Error' As label":
                                AutoHeight: =true
                                Height: =10
                                Live: =Live.Assertive
                                PaddingBottom: =0
                                PaddingLeft: =0
                                PaddingRight: =0
                                PaddingTop: =0
                                Text: =Parent.Error
                                Visible: =false
                                Width: =Parent.Width - 60
                                X: =30
                                Y: ='eDefender_A/S_Title_Input'.Y + 'eDefender_A/S_Title_Input'.Height
                                ZIndex: =3

                            "'eDefender_A/S_Title_Star_Visible' As label":
                                Align: =Align.Center
                                Color: ='eDefender_A/S_Disclaimer_Label'.Color
                                Height: ='eDefender_A/S_Disclaimer_Label'.Height
                                Text: ="*"
                                Visible: =false
                                Width: =30
                                Wrap: =false
                                Y: ='eDefender_A/S_Disclaimer_Label'.Y
                                ZIndex: =4

                            "'eDefender_A/S_Title_Input' As text":
                                Default: =
                                Height: =30
                                HintText: =Switch('eDefender_A/S_Specific_Issue_Dropdown'.Selected.Name, "Locked Account","Describe your issue","Case Access","What is the nature of the request", "Lock/Seal Case","What is the nature of the request?")
                                Mode: =TextMode.MultiLine
                                Visible: =false
                                Width: ='eDefender_A/S_Specific_Issue_Dropdown'.Width
                                X: =30
                                Y: =44
                                ZIndex: =5

                        "'eDefender_A/S_Main_Category_DataCard' As typedDataCard.numberEditCard":
                            BorderStyle: =BorderStyle.Solid
                            DataField: ="mainCategory"
                            Default: =ThisItem.mainCategory
                            DisplayMode: =Parent.DisplayMode
                            DisplayName: =DataSourceInfo([@Tickets],DataSourceInfo.DisplayName, Name)
                            Fill: =RGBA(0, 0, 0, 0)
                            Height: =If( 'eDefender Access/Security Request TT'.Size = 1, Parent.Height/7, Parent.Height/5)
                            Required: =true
                            Update: =
                            Visible: =false
                            Width: =1366
                            WidthFit: =true
                            X: =0
                            Y: =1
                            ZIndex: =1

                            "'eDefender_A/S_Main_Category_Label' As label":
                                AutoHeight: =true
                                Height: =34
                                Text: ="Category"
                                Width: =Parent.Width - 60
                                Wrap: =false
                                X: =30
                                Y: =10
                                ZIndex: =1

                            "'eDefender_A/S_Main_Category_Error' As label":
                                AutoHeight: =true
                                Height: =10
                                Live: =Live.Assertive
                                PaddingBottom: =0
                                PaddingLeft: =0
                                PaddingRight: =0
                                PaddingTop: =0
                                Text: =Parent.Error
                                Visible: =Parent.DisplayMode=DisplayMode.Edit
                                Width: =Parent.Width - 60
                                X: =30
                                Y: ='eDefender_A/S_Main_Category_Dropdown'.Y + 'eDefender_A/S_Main_Category_Dropdown'.Height
                                ZIndex: =3

                            "'eDefender_A/S_Main_Category_Star_Visible' As label":
                                Align: =Align.Center
                                Height: ='eDefender_A/S_Main_Category_Label'.Height
                                Text: ="*"
                                Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                                Width: =30
                                Wrap: =false
                                Y: ='eDefender_A/S_Main_Category_Label'.Y
                                ZIndex: =4

                            "'eDefender_A/S_Main_Category_Dropdown' As dropdown":
                                Default: =LookUp(Category, ID = TicketCategoryID, Name) 
                                Height: =Parent.Height/3.5
                                Items: =(If(is_admin, Filter(Category, parentId = Blank()), Filter(Category, parentId = Blank(),technicianOnly=0)))
                                Width: =Parent.Width/1.05
                                X: =30
                                Y: =44
                                ZIndex: =5

                        "'eDefender_A/S_Specific_Issue_DataCard' As typedDataCard.numberEditCard":
                            BorderStyle: =BorderStyle.Solid
                            DataField: ="subCategory"
                            Default: =ThisItem.subCategory
                            DisplayMode: =Parent.DisplayMode
                            DisplayName: =DataSourceInfo([@Tickets],DataSourceInfo.DisplayName,Name)
                            Fill: =RGBA(0, 0, 0, 0)
                            Height: =80
                            Required: =false
                            Update: =
                            Visible: |
                                =If(IsBlank('eDefender_A/S_Specific_Issue_Dropdown'.Selected.Name), false, true)
                            Width: =Parent.Width
                            WidthFit: =true
                            X: =0
                            Y: =2
                            ZIndex: =1

                            "'eDefender_A/S_Specific_Issue_Dropdown' As dropdown":
                                BorderThickness: =1
                                Default: =LookUp(Category, ID = TicketSpecificIssue).Name
                                DisplayMode: =DisplayMode.View
                                Height: =35
                                Items: =Filter(Category, parentId = 'eDefender_A/S_SubCategory_Dropdown'.Selected.ID)
                                Width: =If('eDefender Access/Security Request TT'.Size = 1, Parent.Width/1.2, Parent.Width/1.1)
                                X: =(Parent.Width-Self.Width)/2
                                Y: ='eDefender_A/S_Specific_Issue_Label'.Y+'eDefender_A/S_Specific_Issue_Label'.Height
                                ZIndex: =1

                            "'eDefender_A/S_Specific_Issue_Label' As label":
                                AutoHeight: =true
                                BorderColor: =RGBA(0, 18, 107, 1)
                                BorderThickness: =2
                                Color: =RGBA(255, 255, 255, 1)
                                Fill: =ColorScheme.primary
                                Height: =30
                                Text: ="Specific Issue"
                                Width: =125
                                Wrap: =false
                                X: ='eDefender_A/S_Specific_Issue_Dropdown'.X
                                Y: =10
                                ZIndex: =3

                            "'eDefender_A/S_Specific_Issue_Error' As label":
                                AutoHeight: =true
                                Height: =10
                                Live: =Live.Assertive
                                PaddingBottom: =0
                                PaddingLeft: =0
                                PaddingRight: =0
                                PaddingTop: =0
                                Text: =Parent.Error
                                Visible: =Parent.DisplayMode=DisplayMode.Edit
                                Width: =Parent.Width - 60
                                X: =30
                                Y: ='eDefender_A/S_Specific_Issue_Dropdown'.Y + 'eDefender_A/S_Specific_Issue_Dropdown'.Height
                                ZIndex: =4

                            "'eDefender_A/S_Specific_Issue_Star_Visible' As label":
                                Align: =Align.Center
                                Height: ='eDefender_A/S_Specific_Issue_Label'.Height
                                Text: ="*"
                                Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                                Width: =30
                                Wrap: =false
                                Y: ='eDefender_A/S_Specific_Issue_Label'.Y
                                ZIndex: =5

                        "'eDefender_A/S_SubCategory_DataCard' As typedDataCard.numberEditCard":
                            BorderStyle: =BorderStyle.Solid
                            DataField: ="category"
                            Default: =ThisItem.category
                            DisplayMode: =Parent.DisplayMode
                            DisplayName: =DataSourceInfo([@Tickets],DataSourceInfo.DisplayName,Name)
                            Fill: =RGBA(0, 0, 0, 0)
                            Height: =If( 'eDefender Access/Security Request TT'.Size = 1, Parent.Height/7, Parent.Height/5)
                            Required: =true
                            Update: =
                            Visible: =false
                            Width: =1366
                            WidthFit: =true
                            X: =0
                            Y: =3
                            ZIndex: =1

                            "'eDefender_A/S_SubCategory_Label' As label":
                                AutoHeight: =true
                                Height: =34
                                Text: ="Sub Category"
                                Width: =Parent.Width - 60
                                Wrap: =false
                                X: =30
                                Y: =10
                                ZIndex: =1

                            "'eDefender_A/S_SubCategory_Error' As label":
                                AutoHeight: =true
                                Height: =10
                                Live: =Live.Assertive
                                PaddingBottom: =0
                                PaddingLeft: =0
                                PaddingRight: =0
                                PaddingTop: =0
                                Text: =Parent.Error
                                Visible: =Parent.DisplayMode=DisplayMode.Edit
                                Width: =Parent.Width - 60
                                X: =30
                                Y: ='eDefender_A/S_SubCategory_Dropdown'.Y + 'eDefender_A/S_SubCategory_Dropdown'.Height
                                ZIndex: =3

                            "'eDefender_A/S_SubCategory_Star_Visible' As label":
                                Align: =Align.Center
                                Height: ='eDefender_A/S_SubCategory_Label'.Height
                                Text: ="*"
                                Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                                Width: =30
                                Wrap: =false
                                Y: ='eDefender_A/S_SubCategory_Label'.Y
                                ZIndex: =4

                            "'eDefender_A/S_SubCategory_Dropdown' As dropdown":
                                Default: =LookUp(Category, ID = TicketSubCategoryID, Name)
                                Height: =Parent.Height/3.5
                                Items: =Filter(Category, parentId = 'eDefender_A/S_Main_Category_Dropdown'.Selected.ID)
                                Width: =Parent.Width/1.05
                                X: =30
                                Y: =44
                                ZIndex: =5

                        "'eDefender_A/S_Fields_DataCard' As typedDataCard.blankCard":
                            BorderStyle: =BorderStyle.Solid
                            DisplayMode: =DisplayMode.Edit
                            Fill: =RGBA(0, 0, 0, 0)
                            Height: =250
                            Visible: =!('eDefender_A/S_Specific_Issue_Dropdown'.Selected.Name="Locked Account")
                            Width: =Parent.Width
                            WidthFit: =true
                            X: =0
                            Y: =4
                            ZIndex: =1

                            Rectangle23 As rectangle:
                                BorderThickness: =1
                                Fill: =RGBA(0, 0, 0, 0)
                                Height: ='eDefender_A/S_Supervisor_Label'.Height+'eDefender_A/S_Supervisor_Input'.Height+30
                                Visible: =false
                                Width: ='eDefender_A/S_Supervisor_Input'.Width+10
                                X: ='eDefender_A/S_Supervisor_Label'.X
                                Y: ='eDefender_A/S_Supervisor_Label'.Y
                                ZIndex: =1

                            Rectangle23_1 As rectangle:
                                BorderThickness: =1
                                Fill: =RGBA(0, 0, 0, 0)
                                Height: ='eDefender_A/S_Supervisor_Label'.Height+'eDefender_A/S_Supervisor_Input'.Height+30
                                Visible: =false
                                Width: ='eDefender_A/S_Recipient_Input'.Width+10
                                X: ='eDefender_A/S_Recipient_Label'.X
                                Y: ='eDefender_A/S_Recipient_Label'.Y
                                ZIndex: =2

                            "'eDefender_A/S_Moblie_Rectangle1' As rectangle":
                                BorderThickness: =1
                                Fill: =RGBA(0, 0, 0, 0)
                                Height: ='eDefender_A/S_Request_Cases_Label'.Height+'eDefender_A/S_Request_Cases_Input'.Height+20
                                Visible: =false
                                Width: ='eDefender_A/S_Request_Cases_Input'.Width+10
                                X: ='eDefender_A/S_Request_Cases_Label'.X
                                Y: ='eDefender_A/S_Request_Cases_Label'.Y
                                ZIndex: =3

                            "'eDefender_A/S_Supervisor_Label' As label":
                                BorderThickness: =2
                                Color: =RGBA(255, 255, 255, 1)
                                Fill: =ColorScheme.primary
                                Height: =30
                                Text: ="Supervisor authorizing access"
                                Width: =300
                                X: ='eDefender_A/S_Supervisor_Input'.X
                                Y: =10
                                ZIndex: =4

                            "'eDefender_A/S_Supervisor_Input' As text":
                                Default: =
                                EnableSpellCheck: =true
                                Height: =If('eDefender Access/Security Request TT'.Size=4,inputSize.desktop,inputSize.mobile)
                                HintText: ="Enter Supervisor"
                                Mode: =If('eDefender Access/Security Request TT'.Size=1,inputSize.mobileMulti,inputSize.deskSingle)
                                Width: =If('eDefender Access/Security Request TT'.Size=1,'eDefender_A/S_Specific_Issue_Dropdown'.Width,'eDefender_A/S_Specific_Issue_Dropdown'.Width/2-5)
                                X: ='eDefender_A/S_Request_Cases_Input'.X
                                Y: ='eDefender_A/S_Supervisor_Label'.Y + 'eDefender_A/S_Supervisor_Label'.Height
                                ZIndex: =5

                            "'eDefender_A/S_Recipient_Label' As label":
                                BorderThickness: =2
                                Color: =RGBA(255, 255, 255, 1)
                                Fill: =ColorScheme.primary
                                Height: =30
                                Text: =Switch('eDefender_A/S_Specific_Issue_Dropdown'.Selected.Name, "Case Access","Grant Access to","Lock/Seal Case","Lock/Seal access to", "Locked Account","")
                                Width: =170
                                X: ='eDefender_A/S_Recipient_Input'.X
                                Y: ='eDefender_A/S_Recipient_Input'.Y-Self.Height
                                ZIndex: =6

                            "'eDefender_A/S_Recipient_Input' As text":
                                Default: =""
                                EnableSpellCheck: =true
                                Height: =If('eDefender Access/Security Request TT'.Size=4,inputSize.desktop,inputSize.mobile)
                                HintText: ="Full Name or type N/A if not applicable"
                                Mode: =If('eDefender Access/Security Request TT'.Size=1,inputSize.mobileMulti,inputSize.deskSingle)
                                Width: ='eDefender_A/S_Supervisor_Input'.Width
                                X: =If('eDefender Access/Security Request TT'.Size=1,30,'eDefender_A/S_Supervisor_Input'.Width+'eDefender_A/S_Supervisor_Input'.X+10)
                                Y: =If('eDefender Access/Security Request TT'.Size=1,Rectangle23.Y+Rectangle23.Height+25,'eDefender_A/S_Supervisor_Input'.Y)
                                ZIndex: =7

                            "'eDefender_A/S_Request_Cases_Label' As label":
                                BorderThickness: =2
                                Color: =RGBA(255, 255, 255, 1)
                                Fill: =ColorScheme.primary
                                Height: =30
                                Text: ="Cases"
                                Width: =60
                                X: ='eDefender_A/S_Request_Cases_Input'.X
                                Y: ='eDefender_A/S_Request_Cases_Input'.Y-Self.Height
                                ZIndex: =8

                            "'eDefender_A/S_Request_Cases_Input' As text":
                                Default: =""
                                EnableSpellCheck: =true
                                Height: =100
                                HintText: ="Enter the case PD Numbers separated by commas"
                                Mode: =TextMode.MultiLine
                                Width: ='eDefender_A/S_Specific_Issue_Dropdown'.Width
                                X: =(Parent.Width-Self.Width)/2
                                Y: =If('eDefender Access/Security Request TT'.Size=1,'eDefender_A/S_Recipient_Input'.Y+'eDefender_A/S_Recipient_Input'.Height+50,'eDefender_A/S_Supervisor_Input'.Y+'eDefender_A/S_Supervisor_Input'.Height+50)
                                ZIndex: =9

                        "'eDefenderA/SDescription_DataCard' As typedDataCard.textualEditCard":
                            BorderStyle: =BorderStyle.Solid
                            DataField: ="description"
                            Default: =ThisItem.description
                            DisplayMode: =Parent.DisplayMode
                            DisplayName: =DataSourceInfo([@Tickets],DataSourceInfo.DisplayName, Name)
                            Fill: =RGBA(0, 0, 0, 0)
                            Height: =If( 'eDefender Access/Security Request TT'.Size = 1, Parent.Height/7, Parent.Height/5)
                            MaxLength: =DataSourceInfo([@Tickets], DataSourceInfo.MaxLength, Name)
                            Required: =false
                            Update: =
                            Visible: ='eDefender_A/S_Specific_Issue_Dropdown'.Selected.Name="Locked Account"
                            Width: =Parent.Width
                            WidthFit: =true
                            X: =0
                            Y: =5
                            ZIndex: =1

                            Rectangle26 As rectangle:
                                BorderThickness: =1
                                Fill: =RGBA(0, 0, 0, 0)
                                Height: ='eDefenderA/SDescriptionLabel'.Height+'eDefenderA/SDescriptionTextInputArea'.Height+10
                                Visible: =false
                                Width: ='eDefenderA/SDescriptionTextInputArea'.Width+10
                                X: ='eDefenderA/SDescriptionLabel'.X
