"'eDefender Adding/Coding Items TT' As screen":
    BackgroundImage: =PUBDEF_IT__LOGO_Vector
    Fill: =ColorScheme.screenBackground
    OnHidden: |
        =UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
    OnVisible: |-
        =ResetForm('eDefenderAdding/CodingItemsForm');
        UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
        ClearCollect(items,
        {
            itemName:"",
            toBeRemoved:false
        }
        
        );
        
        ClearCollect(listItemsCol,{
        
        listDropdownName:"",
        listDropdownAdditions:items
        
        });
        
        Clear(RTEImages);
        Clear(JointAttachments);
        Clear(attItems);
        Clear(items);
        Clear(listItemsCol);
        UpdateContext({usingCamera:false,altImagePopUp:false});
        UpdateContext({ACPopup:false});

    "'eDefenderAdding/CodingMainContainer' As groupContainer.horizontalAutoLayoutContainer":
        Height: ='eDefender Adding/Coding Items TT'.Height
        LayoutGridColumns: =6
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        Width: ='eDefender Adding/Coding Items TT'.Width
        ZIndex: =2

        "'eDefenderAdding/CodingVerticalLayoutContainer' As groupContainer.verticalAutoLayoutContainer":
            AlignInContainer: =AlignInContainer.SetByContainer
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumns: =6
            LayoutGridRows: =6
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =100
            LayoutMinWidth: =250
            LayoutMode: =LayoutMode.Auto
            ZIndex: =2

            "'eDefenderAdding/CodingHeaderContainer' As groupContainer.verticalAutoLayoutContainer":
                AlignInContainer: =AlignInContainer.SetByContainer
                Fill: =ColorScheme.primary
                FillPortions: =0
                Height: |-
                    =130
                    //Parent.Height/11
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutDirection: =LayoutDirection.Vertical
                LayoutGridColumns: =6
                LayoutGridRows: =6
                LayoutJustifyContent: =LayoutJustifyContent.Center
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =100
                LayoutMinWidth: =250
                LayoutMode: =LayoutMode.Auto
                Visible: |-
                    =//Home.Size<>1
                    //This is the top most header container that houses the navbar links
                    true
                Width: =Parent.Width
                ZIndex: =1

                AddingCodingItemsHeaderElements As groupContainer.manualLayoutContainer:
                    LayoutGridColumns: =6
                    LayoutGridRows: =6
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =100
                    LayoutMinWidth: =250
                    ZIndex: =11

                    HomeBackgroundGradient_6 As htmlViewer:
                        DisabledBorderColor: =RGBA(56, 56, 56, 1)
                        Height: =Parent.Height
                        HtmlText: =Home_Background_Gradient.HtmlText
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Width: =Parent.Width
                        ZIndex: =1

                    "'eDefenderAdding/CodingItemsLabel' As label":
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =Color.Transparent
                        Height: =Parent.Height-'eDefenderAdding/CodingWebHeader'.Height
                        Size: =If('eDefender Adding/Coding Items TT'.Size=1, titleText.mobileSize, titleText.desktopSize)
                        Text: ="Adding/Coding Items Form"
                        Width: =Parent.Width
                        Y: ='eDefenderAdding/CodingWebHeader'.Height
                        ZIndex: =2

                    "'eDefenderAdding/CodingWebHeader' As compWebHeader":
                        BackgroundColor: =Color.Transparent
                        CompScreenSize: ='eDefender Adding/Coding Items TT'.Size
                        EnableFeedback: =Set(varFeedback,true)
                        Height: |-
                            =82
                            //Parent.Height
                        ZIndex: =3

            "'eDefenderAdding/CodingMainContentContainer' As groupContainer.verticalAutoLayoutContainer":
                AlignInContainer: =AlignInContainer.SetByContainer
                Fill: =ColorScheme.screenBackgroundSeeThroughMid
                Height: =Parent.Height/1.21
                LayoutDirection: =LayoutDirection.Vertical
                LayoutGridColumns: =6
                LayoutGridRows: =6
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =100
                LayoutMinWidth: =250
                LayoutMode: =LayoutMode.Auto
                LayoutOverflowY: =LayoutOverflow.Scroll
                Visible: |-
                    =true
                    //Main Content container this houses certian elements such as the searchbar, and 2 button galleries, one for desktop, and another for mobile
                Width: =Parent.Width
                ZIndex: =3

                "'eDefenderAdding/CodingItemsForm' As form":
                    AlignInContainer: =AlignInContainer.SetByContainer
                    DataSource: =Tickets
                    DefaultMode: =FormMode.New
                    Height: =Parent.Height/1.21
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =250
                    LayoutMinWidth: =400
                    NumberOfColumns: =1
                    Width: =Parent.Width
                    Y: =Parent.Height/5.7
                    ZIndex: =1

                    "'eDefenderAdding/CodingTitle_DataCard' As typedDataCard.textualEditCard":
                        BorderStyle: =BorderStyle.Solid
                        DataField: ="title"
                        Default: =ThisItem.Title
                        DisplayMode: =Parent.DisplayMode
                        DisplayName: =//DataSourceInfo([@Tickets],DataSourceInfo.DisplayName, "field_2")
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =If('eDefender Adding/Coding Items TT'.Size =1,100,50)
                        MaxLength: =//DataSourceInfo([@Tickets], DataSourceInfo.MaxLength, "field_2")
                        Required: =false
                        Update: =
                        Visible: =true
                        Width: =1366
                        WidthFit: =true
                        X: =0
                        Y: =0
                        ZIndex: =1

                        "'eDefenderAdding/CodingTitleLabel' As label":
                            AutoHeight: =true
                            Color: =If(CreateTicketTitle = "Title" || !IsBlank('eDefenderAdding/CodingTitleInput'.Text), RGBA(0, 18, 107, 1), Color.Red)
                            Height: =34
                            Text: ="Case Number"
                            Visible: =false
                            Width: =Parent.Width - 60
                            Wrap: =false
                            X: =30
                            Y: =10
                            ZIndex: =1

                        "'eDefenderAdding/CodingTitleError' As label":
                            AutoHeight: =true
                            Height: =10
                            Live: =Live.Assertive
                            PaddingBottom: =0
                            PaddingLeft: =0
                            PaddingRight: =0
                            PaddingTop: =0
                            Text: =Parent.Error
                            Visible: =false
                            Width: =Parent.Width - 60
                            X: =30
                            Y: ='eDefenderAdding/CodingTitleInput'.Y + 'eDefenderAdding/CodingTitleInput'.Height
                            ZIndex: =3

                        "'eDefenderAdding/CodingTitleStarVisible' As label":
                            Align: =Align.Center
                            Color: ='eDefenderAdding/CodingTitleLabel'.Color
                            Height: ='eDefenderAdding/CodingTitleLabel'.Height
                            Text: ="*"
                            Visible: =false
                            Width: =30
                            Wrap: =false
                            Y: ='eDefenderAdding/CodingTitleLabel'.Y
                            ZIndex: =4

                        "'eDefenderAdding/CodingTitleInput' As text":
                            Default: =""
                            Height: =30
                            HintText: ="Add new item to dropdown, Which list and what to add or remove, add a check box"
                            Visible: =false
                            Width: =If('eDefender Adding/Coding Items TT'.Size=1,Parent.Width/1.2,Parent.Width/1.1)
                            X: =30
                            Y: =44
                            ZIndex: =5

                        "'eDefenderAdding/CodingDisclaimerLabel' As label":
                            Align: =Align.Center
                            BorderColor: =RGBA(221, 79, 14, 1)
                            BorderThickness: =2
                            Color: =RGBA(221, 79, 14, 1)
                            Fill: =RGBA(255, 255, 255, 1)
                            FontWeight: =FontWeight.Semibold
                            Height: =If(App.ActiveScreen.Size =1,100,50)
                            Size: =If('eDefender Adding/Coding Items TT'.Size =1,13,16)
                            Text: ='eDefender_A/S_Disclaimer_Label'.Text
                            Width: =Parent.Width
                            ZIndex: =6

                    "'eDefenderAdding/CodingMainCategory_DataCard' As typedDataCard.numberEditCard":
                        BorderStyle: =BorderStyle.Solid
                        DataField: ="mainCategory"
                        Default: =ThisItem.mainCategory
                        DisplayMode: =Parent.DisplayMode
                        DisplayName: =DataSourceInfo([@Tickets],DataSourceInfo.DisplayName, Name)
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =If( 'eDefender Adding/Coding Items TT'.Size = 1, Parent.Height/7, Parent.Height/5)
                        Required: =true
                        Update: =
                        Visible: =false
                        Width: =1366
                        WidthFit: =true
                        X: =0
                        Y: =1
                        ZIndex: =1

                        "'eDefenderAdding/CodingMainCategoryLabel' As label":
                            AutoHeight: =true
                            Height: =34
                            Text: ="Category"
                            Width: =Parent.Width - 60
                            Wrap: =false
                            X: =30
                            Y: =10
                            ZIndex: =1

                        "'eDefenderAdding/CodingMainCategoryError' As label":
                            AutoHeight: =true
                            Height: =10
                            Live: =Live.Assertive
                            PaddingBottom: =0
                            PaddingLeft: =0
                            PaddingRight: =0
                            PaddingTop: =0
                            Text: =Parent.Error
                            Visible: =Parent.DisplayMode=DisplayMode.Edit
                            Width: =Parent.Width - 60
                            X: =30
                            Y: ='eDefenderAdding/CodingMainCategoryDropdown'.Y + 'eDefenderAdding/CodingMainCategoryDropdown'.Height
                            ZIndex: =3

                        "'eDefenderAdding/CodingMainCategoryStarVisible' As label":
                            Align: =Align.Center
                            Height: ='eDefenderAdding/CodingMainCategoryLabel'.Height
                            Text: ="*"
                            Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                            Width: =30
                            Wrap: =false
                            Y: ='eDefenderAdding/CodingMainCategoryLabel'.Y
                            ZIndex: =4

                        "'eDefenderAdding/CodingMainCategoryDropdown' As dropdown":
                            Default: =LookUp(Category, ID = TicketCategoryID, Name)
                            Height: =Parent.Height/3.5
                            Items: =(If(is_admin, Filter(Category, parentId = Blank()), Filter(Category, parentId = Blank(),technicianOnly=0)))
                            Width: =Parent.Width/1.05
                            X: =30
                            Y: =44
                            ZIndex: =5

                    "'eDefenderAdding/CodingSubCategory_DataCard' As typedDataCard.numberEditCard":
                        BorderStyle: =BorderStyle.Solid
                        DataField: ="category"
                        Default: =ThisItem.category
                        DisplayMode: =Parent.DisplayMode
                        DisplayName: =DataSourceInfo([@Tickets],DataSourceInfo.DisplayName,Name)
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =If( 'eDefender Adding/Coding Items TT'.Size = 1, Parent.Height/7, Parent.Height/5)
                        Required: =true
                        Update: =
                        Visible: =false
                        Width: =1366
                        WidthFit: =true
                        X: =0
                        Y: =2
                        ZIndex: =1

                        "'eDefenderAdding/CodingSubCategoryLabel' As label":
                            AutoHeight: =true
                            Height: =34
                            Text: ="Sub Category"
                            Width: =Parent.Width - 60
                            Wrap: =false
                            X: =30
                            Y: =10
                            ZIndex: =1

                        "'eDefenderAdding/CodingSubcategoryError' As label":
                            AutoHeight: =true
                            Height: =10
                            Live: =Live.Assertive
                            PaddingBottom: =0
                            PaddingLeft: =0
                            PaddingRight: =0
                            PaddingTop: =0
                            Text: =Parent.Error
                            Visible: =Parent.DisplayMode=DisplayMode.Edit
                            Width: =Parent.Width - 60
                            X: =30
                            Y: ='eDefenderAdding/CodingSubCategoryDropdown'.Y + 'eDefenderAdding/CodingSubCategoryDropdown'.Height
                            ZIndex: =3

                        "'eDefenderAdding/CodingSubcategoryStarVisible' As label":
                            Align: =Align.Center
                            Height: ='eDefenderAdding/CodingSubCategoryLabel'.Height
                            Text: ="*"
                            Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                            Width: =30
                            Wrap: =false
                            Y: ='eDefenderAdding/CodingSubCategoryLabel'.Y
                            ZIndex: =4

                        "'eDefenderAdding/CodingSubCategoryDropdown' As dropdown":
                            Default: =LookUp(Category, ID = TicketSubCategoryID, Name)
                            Height: =Parent.Height/3.5
                            Items: =Filter(Category, parentId = 'eDefenderAdding/CodingMainCategoryDropdown'.Selected.ID)
                            Width: =Parent.Width/1.05
                            X: =30
                            Y: =44
                            ZIndex: =5

                    "'eDefenderAdding/CodingFields' As typedDataCard.blankCard":
                        BorderStyle: =BorderStyle.Solid
                        DisplayMode: =DisplayMode.Edit
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =600
                        Visible: =true
                        Width: =Parent.Width
                        WidthFit: =true
                        X: =0
                        Y: =3
                        ZIndex: =1

                        Group2 As group:
                            Height: =5
                            Width: =5
                            X: =60
                            Y: =60
                            ZIndex: =13

                            AddingEntryHeader As rectangle:
                                BorderThickness: =2
                                Fill: =ColorScheme.primary
                                Height: =50
                                Width: =If('eDefender Adding/Coding Items TT'.Size=1,Parent.Width/1.2,Parent.Width/1.1)
                                X: |
                                    =If('eDefender Adding/Coding Items TT'.Size=1,30,(Parent.Width-Self.Width)/2)
                                Y: =40
                                ZIndex: =1

                            AddingEntryHeaderTitle As label:
                                Align: =Align.Center
                                Color: =RGBA(255, 255, 255, 1)
                                Height: =50
                                Size: =18
                                Text: ="Dropdown Entry"
                                Width: =AddingEntryHeader.Width
                                X: =AddingEntryHeader.X
                                Y: =40
                                ZIndex: =2

                            AddingEntryBackground As rectangle:
                                BorderThickness: =1
                                Fill: =RGBA(255, 255, 255, 1)
                                Width: =AddingEntryHeader.Width
                                X: =AddingEntryHeader.X
                                Y: =90
                                ZIndex: =3

                            EnterDropdownLabel As label:
                                Align: =Align.Center
                                BorderThickness: =1
                                Fill: =RGBA(255, 255, 255, 1)
                                Size: =17
                                Text: ="Enter a Dropdown"
                                Width: =(AddingEntryHeader.Width)
                                X: =AddingEntryHeader.X
                                Y: =90
                                ZIndex: =4

                            CodeInput As text:
                                Default: =""
                                EnableSpellCheck: =true
                                HintText: ="Enter item"
                                Width: =AddingEntryHeader.Width-10
                                X: =AddingEntryBackground.X+5
                                Y: =EnterDropdownLabel.Y+EnterDropdownLabel.Height+10
                                ZIndex: =5

                            CodeAddButtonBackground As button:
                                Fill: =ColorScheme.primary
                                FontWeight: =FontWeight.Bold
                                OnSelect: |-
                                    =Patch(listItemsCol,Defaults(listItemsCol),
                                    {
                                        listDropdownName:CodeInput.Text
                                    });
                                    Reset(CodeInput);
                                Text: ="Add "
                                Width: =If('eDefender Adding/Coding Items TT'.Size=1,Parent.Width/4.25,Parent.Width/6.25)
                                X: =(Parent.Width-Self.Width)/2
                                Y: =AddingEntryBackground.Y+AddingEntryBackground.Height+20
                                ZIndex: =6

                        Group6 As group:
                            Height: =5
                            Width: =5
                            X: =60
                            Y: =60
                            ZIndex: =25

                            AddItemsToDropdownSelectedHeader As rectangle:
                                BorderThickness: =2
                                Fill: =ColorScheme.primary
                                Height: =50
                                Width: =AddingEntryHeader.Width
                                X: =DropdownListGalleryHeader.X
                                Y: =If('eDefender Adding/Coding Items TT'.Size=1,'Video/AudioEditingMobileGallery_7'.Y+'Video/AudioEditingMobileGallery_7'.Height+30,DropdownListGallery.Height+DropdownListGallery.Y+100)
                                ZIndex: =8

                            AddItemsToDropdownSelectedHeaderTitle As label:
                                Align: =Align.Center
                                Color: =RGBA(255, 255, 255, 1)
                                Height: =50
                                Size: =18
                                Text: ="List-"&DropdownListGallery.Selected.listDropdownName
                                Width: =AddItemsToDropdownSelectedHeader.Width
                                X: =AddItemsToDropdownSelectedHeader.X
                                Y: =AddItemsToDropdownSelectedHeader.Y
                                ZIndex: =9

                            AddItemsToDropdownSelectedBackground As rectangle:
                                BorderThickness: =1
                                Fill: =RGBA(255, 255, 255, 1)
                                Width: =AddingEntryHeader.Width
                                X: =AddItemsToDropdownSelectedHeader.X
                                Y: =AddItemsToDropdownSelectedHeader.Y+AddItemsToDropdownSelectedHeader.Height
                                ZIndex: =10

                            ItemToAddLabel As label:
                                Align: =Align.Center
                                BorderThickness: =1
                                Fill: =RGBA(255, 255, 255, 1)
                                Size: =17
                                Text: ="Item to Add"
                                Width: =(4*AddItemsToDropdownSelectedHeader.Width)/6
                                X: =AddItemsToDropdownSelectedHeader.X
                                Y: =AddItemsToDropdownSelectedHeader.Y+AddItemsToDropdownSelectedHeader.Height
                                ZIndex: =11

                            ItemInput As text:
                                Default: =""
                                EnableSpellCheck: =true
                                HintText: ="Enter item"
                                Width: =ItemToAddLabel.Width - 10
                                X: =AddItemsToDropdownSelectedHeader.X+5
                                Y: =ItemToAddLabel.Y+ItemToAddLabel.Height+10
                                ZIndex: =12

                            AddItemToGalleryButton As button:
                                Fill: =ColorScheme.primary
                                OnSelect: |-
                                    =Clear(items);
                                    Collect(items,LookUp(listItemsCol,DropdownListGallery.Selected.listDropdownName=listDropdownName).listDropdownAdditions);
                                    
                                    Patch(items,Defaults(items),{
                                        itemName:ItemInput.Text
                                        ,toBeRemoved:RemoveCheckBox.Value});
                                    Patch(listItemsCol,LookUp(listItemsCol,DropdownListGallery.Selected.listDropdownName = listDropdownName),
                                    {
                                        listDropdownAdditions:items
                                    });
                                    
                                    Reset(ItemInput);
                                    Reset(RemoveCheckBox);
                                Text: ="Add"
                                Width: =CodeAddButtonBackground.Width
                                X: =AddItemsToDropdownSelectedHeader.X+(AddItemsToDropdownSelectedHeader.Width-Self.Width)/2
                                Y: =AddItemsToDropdownSelectedBackground.Y+AddItemsToDropdownSelectedBackground.Height+25
                                ZIndex: =13

                            RemoveCheckBoxLabel As label:
                                Align: =Align.Center
                                BorderThickness: =1
                                Size: =If('eDefender Adding/Coding Items TT'.Size=1, 11,17)
                                Text: ="Remove"
                                Width: =(2*AddingEntryHeader.Width)/6
                                X: =ItemToAddLabel.X+ItemToAddLabel.Width
                                Y: =ItemToAddLabel.Y
                                ZIndex: =23

                            RemoveCheckBox As checkbox:
                                Height: =60
                                Text: =""
                                Width: =40
                                X: =ItemInput.Width+ItemInput.X+10+(RemoveCheckBoxLabel.Width-Self.Width)/2
                                Y: =RemoveCheckBoxLabel.Y+RemoveCheckBoxLabel.Height
                                ZIndex: =24

                        Group1 As group:
                            Height: =5
                            Width: =5
                            X: =60
                            Y: =60
                            ZIndex: =28

                            DropdownListGalleryHeader As rectangle:
                                BorderThickness: =2
                                Fill: =ColorScheme.primary
                                Height: =50
                                Visible: =!IsEmpty(listItemsCol)
                                Width: =AddingEntryHeader.Width
                                X: =AddingEntryHeader.X
                                Y: =CodeAddButtonBackground.Y+CodeAddButtonBackground.Height+20
                                ZIndex: =20

                            DropdownListGalleryHeaderLabel As label:
                                Align: =Align.Center
                                Color: =RGBA(255, 255, 255, 1)
                                Height: =50
                                Size: =18
                                Text: ="Dropdown List"
                                Visible: =!IsEmpty(listItemsCol)
                                Width: =DropdownListGalleryHeader.Width
                                X: =DropdownListGalleryHeader.X
                                Y: =DropdownListGalleryHeader.Y
                                ZIndex: =21

                            DropdownListGallery As gallery.variableTemplateHeightGallery:
                                '#CopilotOverlayLabel': ="Filtered"
                                BorderThickness: =1
                                DelayItemLoading: =true
                                Fill: =RGBA(255, 255, 255, 1)
                                Height: =CountRows(listItemsCol)*50
                                Items: =listItemsCol
                                Layout: =Layout.Vertical
                                LoadingSpinner: =LoadingSpinner.Data
                                ShowScrollbar: =false
                                TemplatePadding: =0
                                TemplateSize: =50
                                Visible: ='eDefender Adding/Coding Items TT'.Size>1
                                Width: =DropdownListGalleryHeader.Width
                                X: =DropdownListGalleryHeader.X
                                Y: =DropdownListGalleryHeader.Y+DropdownListGalleryHeader.Height
                                ZIndex: =22

                                DropdownName As label:
                                    Align: =Align.Center
                                    BorderThickness: =1
                                    Color: =If(ThisItem.IsSelected,RGBA(255,255,255,1),RGBA(0,0,0,1))
                                    Fill: =If(ThisItem.IsSelected,RGBA(56, 96, 178, .75),RGBA(255,255,255,1))
                                    Height: =50
                                    OnSelect: =Select(Parent)
                                    Size: =18
                                    Text: =ThisItem.listDropdownName
                                    Width: =Parent.TemplateWidth
                                    ZIndex: =1

                                DeleteDropdownButton As button:
                                    Color: =RGBA(0, 0, 0, 0)
                                    Fill: =RGBA(0, 0, 0, 0)
                                    Height: =50
                                    HoverFill: =RGBA(255,0,0,.35)
                                    OnSelect: =Remove(listItemsCol,ThisItem)
                                    PressedFill: =RGBA(255,0,0,.80)
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Text: ="Delete Entry"
                                    Visible: =If('eDefender Adding/Coding Items TT'.Size=1,false,true)
                                    Width: =Parent.TemplateWidth/2
                                    X: =SelectDropdownButton.Width
                                    ZIndex: =2

                                SelectDropdownButton As button:
                                    Color: =RGBA(0, 0, 0, 0)
                                    Fill: =RGBA(0, 0, 0, 0)
                                    Height: =50
                                    HoverFill: =RGBA(50,50,255,.35)
                                    OnSelect: =Select(Parent)
                                    PressedFill: =RGBA(50,50,255,.80)
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Text: ="Select"
                                    Visible: =If('eDefender Adding/Coding Items TT'.Size=1,false,true)
                                    Width: =Parent.TemplateWidth/2
                                    ZIndex: =3

                                Icon10 As icon.Trash:
                                    Color: =RGBA(0, 0, 0, 1)
                                    Height: =16
                                    Icon: =Icon.CancelBadge
                                    OnSelect: =Remove(listItemsCol,ThisItem)
                                    Visible: =If('eDefender Adding/Coding Items TT'.Size=1,true,false)
                                    Width: =16
                                    X: =Parent.TemplateWidth-Self.Width
                                    ZIndex: =4

                            "'Video/AudioEditingMobileGallery_7' As gallery.galleryVertical":
                                '#CopilotOverlayLabel': ="Filtered"
                                BorderThickness: =1
                                Default: |-
                                    =//First(MyTicketsGallery.AllItems)
                                    {}
                                DelayItemLoading: |-
                                    =//false
                                    true
                                Fill: =RGBA(255, 255, 255, 1)
                                Height: =300
                                Items: =listItemsCol
                                Layout: =Layout.Vertical
                                LoadingSpinner: |-
                                    =//LoadingSpinner.None
                                    LoadingSpinner.Controls
                                TemplatePadding: =10
                                TemplateSize: |-
                                    =//If(Self.Layout = Layout.Horizontal, Min(250, Self.Width - 60), Min(250, Self.Height - 60))
                                    //If(Self.Layout = Layout.Horizontal, Min(280, Self.Width - 60), Min(260, Self.Height - 60))
                                    
                                    If(MyTickets.Size > 1, 250, 240)
                                Transition: =Transition.Push
                                Visible: ='eDefender Adding/Coding Items TT'.Size=1 && !IsEmpty(listItemsCol)
                                Width: =DropdownListGalleryHeader.Width
                                WrapCount: =RoundDown((Parent.Width / 320), 0)
                                X: =DropdownListGalleryHeader.X
                                Y: =DropdownListGalleryHeader.Y+DropdownListGalleryHeader.Height
                                ZIndex: =27

                                Rectangle6_12 As rectangle:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderThickness: =25
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =Image6_12.Height
                                    OnSelect: =Select(Parent)
                                    Width: =Image6_12.Width
                                    ZIndex: =1

                                Image6_12 As image:
                                    Height: |-
                                        =//250
                                        Parent.TemplateHeight
                                    Image: |-
                                        ="data:image/svg+xml," & EncodeUrl(
                                            "<?xml version='1.0' encoding='UTF-8' standalone='no'?>
                                        <!DOCTYPE svg PUBLIC '-//W3C//DTD SVG 1.1//EN' 'http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd'>
                                        <svg version='1.1'
                                            xmlns='http://www.w3.org/2000/svg'
                                            xmlns:xlink='http://www.w3.org/1999/xlink' preserveAspectRatio='xMidYMid meet' viewBox='0 0 " & Self.Width & " " & Self.Height & "' width='" & Self.Width & "' height='" & Self.Height & "'>
                                            <defs>" &
                                            // ----- Box for fill
                                         "<path d='" &
                                         // Upper left
                                         "M" & Max(5 * 3 - 0, 0) & " " & Max(5 * 3 - 0,0) &
                                            // Upper right
