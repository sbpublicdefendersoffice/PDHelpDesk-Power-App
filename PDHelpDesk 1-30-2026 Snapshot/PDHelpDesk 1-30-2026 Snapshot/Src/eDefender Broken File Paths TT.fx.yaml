                    eDefenderBFPButtons_DataCard As typedDataCard.blankCard:
                        BorderStyle: =BorderStyle.Solid
                        DisplayMode: =DisplayMode.Edit
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: |-
                            =//If( 'eDefender Broken File Paths TT'.Size = 1, Parent.Height/3, Parent.Height/5)
                            125
                        Width: =1366
                        WidthFit: =true
                        X: =0
                        Y: =8
                        ZIndex: =1

                        eDefenderBFPSubmitButton As button:
                            DisplayMode: |-
                                =
                                //could use this to enable/disable button behaviour
                                //If(CreateATicketForm_1.Valid, DisplayMode.Edit, DisplayMode.Disabled)
                                
                                DisplayMode.Edit
                            Fill: =ColorScheme.primary
                            Height: =eDefenderBFPCancelButton.Height
                            OnSelect: |
                                =
                                If(!eDefenderBFPDescriptionTextInputArea.Visible,
                                UpdateContext({TicketDescText:Concatenate("File Path Link:",Char(13),FilePathinput.Text,Char(13),Char(13),"Last Known Access Date:",Char(13),LastKnownDatepicker.SelectedDate,Char(13),Char(13), "Date of Attempted Access:",Char(13),DateAccessedDatepicker.SelectedDate)}), Notify("Description is Blank"));
                                
                                //Check if the title or Description are empty, if they are the form will not be submitted
                                If(
                                    Len(Trim(eDefenderBFPTitleInput.Text)) > 0 And !IsBlank(eDefenderBFPLocationIDDropDown.Selected.Name) And Len(Trim(FilePathinput.Text))>0,
                                    UpdateContext({DataCardKey1_1: "Title"});
                                    UpdateContext({DataCardKey5: "Description"});
                                    //Set(DataCardKey5: "Description");
                                Set(
                                        //Temporary record
                                        rec,
                                        //DB operation, from Ticket table, new record, change these columns
                                        Patch(
                                            Tickets,
                                            Defaults(Tickets),
                                            {
                                                Title: eDefenderBFPTitleInput.Text,
                                                description:Substitute(eDefenderBFPDescriptionTextInputArea.Text,"\","\\"),
                                                creatorId: userData.id,
                                                mainCategory: eDefenderBFPMainCategoryDropdown.Selected.ID,
                                                category: eDefenderBFPSubCategoryDropdown.Selected.ID,
                                                subCategory: eDefenderBFPSpecificIssueDropdown.Selected.ID,
                                                locationId: eDefenderBFPLocationIDDropDown.Selected.ID,
                                                status: "open",
                                                metricDate: Concatenate(
                                                    Month(Today()),
                                                    "/",
                                                    Year(Today())
                                                ),
                                                hasAttachment: If(
                                                    IsEmpty(JointAttachments),
                                                    0,
                                                    1
                                                ),
                                                //Automation rules table is used to assign tickets
                                                assignedTo: If(
                                                    IsEmpty(
                                                        Filter(
                                                            'Ticket Automation Rules',
                                                            categoryId = eDefenderBFPMainCategoryDropdown.Selected.ID && locationId = eDefenderBFPLocationIDDropDown.Selected.ID
                                                        )
                                                    ),
                                                    0,
                                                    LookUp(
                                                        'Ticket Automation Rules',
                                                        categoryId = eDefenderBFPMainCategoryDropdown.Selected.ID && locationId = eDefenderBFPLocationIDDropDown.Selected.ID,
                                                        userID
                                                    )
                                                )
                                            }
                                        )
                                    );
                                
                                Patch(
                                    Tickets, 
                                    LookUp(Tickets,ID = rec.ID),
                                    {
                                        Title: "# "&rec.ID&" Broken File Path for PD"&eDefenderBFPTitleInput.Text
                                    });
                                // for the attachments, run power automate flow for each attached file
                                ForAll(
                                    attItems As Attachment,
                                            AttachFiles.Run(
                                            rec.ID,
                                            {
                                                file:{
                                                    contentBytes: Attachment.Value,
                                                    name: Attachment.Name
                                                }
                                            }
                                        ) 
                                );
                                ForAll(
                                    RTEImages As RTEI,
