"'eDefender Charges and Statutes TT' As screen":
    BackgroundImage: =PUBDEF_IT__LOGO_Vector
    Fill: =ColorScheme.screenBackground
    OnHidden: |
        =UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
    OnVisible: |-
        =ResetForm('eDefenderC&SForm');
        UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:"",chargeColCount:0});
        
        ClearCollect(chargesColletion,
        {
            recNum:chargeColCount,
            statuteCode:123456789,
            statute: "hi",
            class: "there",
            description:"asdfasfasf"
        });
        Clear(chargesColletion);
        UpdateContext({CnSPopUp:false,CnSRecord:Blank(),chargeColCount:1});
        Clear(RTEImages);
        Clear(JointAttachments);
        Clear(attItems);
        UpdateContext({usingCamera:false,altImagePopUp:false});
        UpdateContext({'C&SPopup':false})

