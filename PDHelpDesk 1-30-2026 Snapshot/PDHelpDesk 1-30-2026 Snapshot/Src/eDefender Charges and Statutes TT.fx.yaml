                            Height: =Button6.Height+Button6.Y+ 25
                            Width: =Parent.Width/1.05
                            X: =15
                            Y: =1
                            ZIndex: =1

                        Button6 As button:
                            Fill: =ColorScheme.primary
                            FontWeight: =FontWeight.Bold
                            Height: =35
                            OnSelect: |+
                                =If(!IsBlank('eDefenderC&STitleInput'.Text) && !IsBlank(StatuteDescriptionInput.Text) && !IsBlank(SourceInput.Text) && !IsBlank(ClassDropdown.Selected.statuteClass), 
                                UpdateContext({chargeColCount:chargeColCount+1});
                                Patch(chargesColletion, Defaults(chargesColletion),
                                {
                                    recNum:chargeColCount,
                                    statuteCode:If(IsError(Value('eDefenderC&STitleInput'.Text)),0,Value('eDefenderC&STitleInput'.Text)),
                                    statute: SourceInput.Text,
                                    class: ClassDropdown.Selected.statuteClass,
                                    description:StatuteDescriptionInput.Text
                                }
                                );
                                Reset('eDefenderC&STitleInput');
                                Reset(SourceInput);
                                Reset(ClassDropdown);
                                Reset(StatuteDescriptionInput);,
                                
                                
                                If(IsBlank(StatuteDescriptionInput.Text),Notify("Statute Description is Empty",NotificationType.Error));
                                If(IsBlank(ClassDropdown.Selected.statuteClass),Notify("No Category Selected", NotificationType.Error));
                                If(IsBlank(SourceInput.Text),Notify("No Source Provided",NotificationType.Error));
                                If(IsBlank('eDefenderC&STitleInput'.Text),Notify("No Status Code provided",NotificationType.Error));
                                );
                                
                            Size: =13
                            Text: ="Add"
                            X: =(Parent.Width-Self.Width)/2
                            Y: =StatuteDescriptionInput.Y+StatuteDescriptionInput.Height+20
                            ZIndex: =5

