                                =
                                If(!eDefenderDeleteItemsDescriptionTextInputArea.Visible,
                                UpdateContext({TicketDescText:Concatenate("PD Number: ",eDefenderDeleteItemsTitleInput.Text,Char(13),Char(13),"Reason:",Char(13),DeleteReasonInput.Text)}), Notify("Description is Blank"));
                                
                                //Check if the title or Description are empty, if they are the form will not be submitted
                                If(
                                    Len(Trim(eDefenderDeleteItemsTitleInput.Text)) > 0 && !IsBlank(eDefenderDeleteItemsLocationIDDropdown.Selected.Name) && Len(Trim(DeleteReasonInput.Text))>0,
                                    UpdateContext({DataCardKey1_1: "Title"});
                                    UpdateContext({DataCardKey5: "Description"});
                                    //Set(DataCardKey5: "Description");
