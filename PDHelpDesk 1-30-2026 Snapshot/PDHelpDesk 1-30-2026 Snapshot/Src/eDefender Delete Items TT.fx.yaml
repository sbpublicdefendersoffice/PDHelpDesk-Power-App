                                        //Temporary record
                                        rec,
                                        //DB operation, from Ticket table, new record, change these columns
                                        Patch(
                                            Tickets,
                                            Defaults(Tickets),
                                            {
                                                Title: "Delete Item/Case Request",
                                                description: Trim(eDefenderDeleteItemsDescriptionTextInputArea.Text),
                                                creatorId: userData.id,
                                                mainCategory: eDefenderDeleteItemsMainCategoryDropdown.Selected.ID,
                                                category: eDefenderDeleteItemsSubCategoryDropdown.Selected.ID,
                                                subCategory: eDefenderDeleteItemsSpecificIssueDropdown.Selected.ID,
                                                locationId: eDefenderDeleteItemsLocationIDDropdown.Selected.ID,
                                                status: "open",
                                                metricDate: Concatenate(
                                                    Month(Today()),
                                                    "/",
                                                    Year(Today())
                                                ),
                                                hasAttachment: If(
                                                    IsEmpty(eDefenderDeleteItemsAttachmentControl.Attachments),
                                                    0,
                                                    1
                                                ),
                                                //Automation rules table is used to assign tickets
                                                assignedTo: If(
                                                    IsEmpty(
                                                        Filter(
                                                            'Ticket Automation Rules',
                                                            categoryId = eDefenderDeleteItemsMainCategoryDropdown.Selected.ID && locationId = eDefenderDeleteItemsLocationIDDropdown.Selected.ID
                                                        )
                                                    ),
                                                    0,
                                                    LookUp(
                                                        'Ticket Automation Rules',
                                                        categoryId = eDefenderDeleteItemsMainCategoryDropdown.Selected.ID && locationId = eDefenderDeleteItemsLocationIDDropdown.Selected.ID,
                                                        userID
                                                    )
                                                )
                                            }
                                        )
                                    );
                                
                                Patch(
                                    Tickets, 
                                    LookUp(Tickets,ID = rec.ID),
                                    {
                                        Title: "# "&rec.ID&" Delete Item/Case Request"
                                    });
                                // for the attachments, run power automate flow for each attached file
                                    ForAll(
                                        eDefenderDeleteItemsAttachmentControl.Attachments As Attachment,
                                               /*AttachFiles.Run(
                                            rec.ID,
                                            {
                                                file: {
                                                    contentBytes: Value,
                                                    name: Name
                                                }
                                            }
                                        )*/
                                If(Left(Attachment.Value,6) = "appres", 
                                        AttachFiles.Run(
                                            rec.ID,
                                            {
                                                file:{
                                                    contentBytes: Attachment.Value,
                                                    name: Attachment.Name
                                                }
                                            }
                                        ) ;,
                                
                                
