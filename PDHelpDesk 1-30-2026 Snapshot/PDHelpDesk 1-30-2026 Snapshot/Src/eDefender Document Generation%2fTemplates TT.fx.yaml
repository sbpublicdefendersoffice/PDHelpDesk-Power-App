                    =130
                    //Parent.Height/11
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutDirection: =LayoutDirection.Vertical
                LayoutGridColumns: =6
                LayoutGridRows: =6
                LayoutJustifyContent: =LayoutJustifyContent.Center
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =100
                LayoutMinWidth: =250
                LayoutMode: =LayoutMode.Auto
                Visible: |-
                    =//Home.Size<>1
                    //This is the top most header container that houses the navbar links
                    true
                Width: =Parent.Width
                ZIndex: =1

                DocumentGenerationTemplatesHeaderElements As groupContainer.manualLayoutContainer:
