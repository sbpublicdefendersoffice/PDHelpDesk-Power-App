                        eDefenderErrorsSubmitButton As button:
                            DisplayMode: |-
                                =
                                //could use this to enable/disable button behaviour
                                //If(CreateATicketForm_1.Valid, DisplayMode.Edit, DisplayMode.Disabled)
                                
                                DisplayMode.Edit
                            Fill: =ColorScheme.primary
                            Height: =eDefenderErrorsCancelButton.Height
                            OnSelect: |
                                =
                                If(!eDefenderErrorsDescriptionTextInputArea.Visible,
                                UpdateContext({TicketDescText:Concatenate("Red Banner Error: ",eDefenderErrorsTitleInput.Text,Char(13),Char(13),"Additional Error Information: ",Char(13),ExplainProblemInput.Text)}), Notify("Description is Blank"));
                                
                                //Check if the title or Description are empty, if they are the form will not be submitted
                                If(
                                    !IsEmpty(JointAttachments) && !IsBlank(eDefenderErrorsLocationIDDropDown.Selected.Name) And Len(Trim(eDefenderErrorsTitleInput.Text))>0 And Len(Trim(ExplainProblemInput.Text))>0,
                                    UpdateContext({DataCardKey1_1: "Title"});
                                    UpdateContext({DataCardKey5: "Description"});
                                    //Set(DataCardKey5: "Description");
                                Set(
                                        //Temporary record
                                        rec,
                                        //DB operation, from Ticket table, new record, change these columns
                                        Patch(
                                            Tickets,
                                            Defaults(Tickets),
                                            {
                                                Title: "eDefender Error Report",
                                                description: Trim(eDefenderErrorsDescriptionTextInputArea.Text),
                                                creatorId: userData.id,
                                                mainCategory: eDefenderErrorsMainCategoryDropdown.Selected.ID,
                                                category: eDefenderErrorsSubCategoryDropdown.Selected.ID,
                                                subCategory: eDefenderErrorsSpecificIssueDropdown.Selected.ID,
                                                locationId: eDefenderErrorsLocationIDDropDown.Selected.ID,
                                                status: "open",
                                                metricDate: Concatenate(
                                                    Month(Today()),
                                                    "/",
                                                    Year(Today())
                                                ),
                                                hasAttachment: If(
                                                    IsEmpty(JointAttachments),
                                                    0,
                                                    1
                                                ),
                                                //Automation rules table is used to assign tickets
                                                assignedTo: If(
                                                    IsEmpty(
                                                        Filter(
                                                            'Ticket Automation Rules',
                                                            categoryId = eDefenderErrorsMainCategoryDropdown.Selected.ID && locationId = eDefenderErrorsLocationIDDropDown.Selected.ID
                                                        )
                                                    ),
                                                    0,
                                                    LookUp(
                                                        'Ticket Automation Rules',
                                                        categoryId = eDefenderErrorsMainCategoryDropdown.Selected.ID && locationId = eDefenderErrorsLocationIDDropDown.Selected.ID,
                                                        userID
                                                    )
                                                )
                                            }
                                        )
                                    );
                                
                                Patch(
                                    Tickets, 
                                    LookUp(Tickets,ID = rec.ID),
                                    {
                                        Title: "# "&rec.ID&" eDefender Error Report"
                                    });
                                // for the attachments, run power automate flow for each attached file
                                ForAll(
                                    attItems As Attachment,
                                            AttachFiles.Run(
                                            rec.ID,
                                            {
                                                file:{
                                                    contentBytes: Attachment.Value,
                                                    name: Attachment.Name
                                                }
                                            }
                                        ) 
                                );
                                ForAll(
                                    RTEImages As RTEI,
                                    With({varHTMLTable: Split(RTEI.base64Image , "<img")}, If(CountRows(varHTMLTable)>1, With({varB64Start:Find("<img",RTEI.base64Image)+32},With({varB64End:Find("""",Mid(RTEI.base64Image,varB64Start))-1},CopyPasteTest.Run(Mid(RTEI.base64Image,varB64Start,varB64End),RTEI.copyName & Text(Now(),DateTimeFormat.UTC) &".png", rec.ID)
                                ))))
                                        );
                                    
                                    /*SMTP.SendEmailV3(
                                        {
                                            From: "sbpdhelpdesk@outlook.com",
