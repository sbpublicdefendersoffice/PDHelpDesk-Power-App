                    eDefenderErrorsButtons_DataCard As typedDataCard.blankCard:
                        BorderStyle: =BorderStyle.Solid
                        DisplayMode: =DisplayMode.Edit
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =If( 'eDefender Errors TT'.Size = 1, Parent.Height/3, Parent.Height/5)
                        Visible: =true
                        Width: =1366
                        WidthFit: =true
                        X: =0
