                    eDefenderReassignmentsButtons_DataCard As typedDataCard.blankCard:
                        BorderStyle: =BorderStyle.Solid
                        DisplayMode: =DisplayMode.Edit
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =If( 'eDefender Reassignments TT'.Size = 1, Parent.Height/3, Parent.Height/5)
                        Width: =1366
                        WidthFit: =true
                        X: =0
                        Y: =8
                        ZIndex: =1

                        eDefenderReassignmentsSubmitButton As button:
                            DisplayMode: |-
                                =
                                //could use this to enable/disable button behaviour
                                //If(CreateATicketForm_1.Valid, DisplayMode.Edit, DisplayMode.Disabled)
                                
                                DisplayMode.Edit
                            Fill: =ColorScheme.primary
                            Height: =eDefenderReassignmentsCancelButton.Height
                            OnSelect: |
                                =
                                If(!eDefenderReassignmentsTextInputArea.Visible,
                                UpdateContext({TicketDescText:Concatenate("Current Case: "&eDefenderReassignmentsTitleInput.Text&Char(13)&Char(13),"New Case: "&NewCaseInput.Text&Char(13)&Char(13),"Notes: "&TextInput5.Text)}), Notify("Description is Blank"));
                                
                                //Check if the title or Description are empty, if they are the form will not be submitted
                                If(
                                    Len(Trim(eDefenderReassignmentsTitleInput.Text))> 0 And !IsBlank(eDefenderReassignmentsLocationIDDropDown.Selected.Name) And
                                    !IsEmpty(eDefenderReassignmentsAttachmentControl.Attachments),
                                    UpdateContext({DataCardKey1_1: "Title"});
                                    UpdateContext({DataCardKey5: "Description"});
                                    //Set(DataCardKey5: "Description");
                                Set(
                                        //Temporary record
                                        rec,
                                        //DB operation, from Ticket table, new record, change these columns
                                        Patch(
                                            Tickets,
                                            Defaults(Tickets),
                                            {
                                                Title: eDefenderReassignmentsTitleInput.Text,
                                                description: Trim(eDefenderReassignmentsTextInputArea.Text),
                                                creatorId: userData.id,
                                                mainCategory: eDefenderReassignmentsMainCategoryDropdown.Selected.ID,
                                                category: eDefenderReassignmentsSubCategoryDropdown.Selected.ID,
                                                subCategory: eDefenderReassignmentsSpecificIssueDropdown.Selected.ID,
                                                locationId: eDefenderReassignmentsLocationIDDropDown.Selected.ID,
                                                status: "open",
                                                metricDate: Concatenate(
                                                    Month(Today()),
                                                    "/",
                                                    Year(Today())
                                                ),
                                                hasAttachment: If(
                                                    IsEmpty(eDefenderReassignmentsAttachmentControl.Attachments),
                                                    0,
                                                    1
                                                ),
                                                //Automation rules table is used to assign tickets
                                                assignedTo: If(
                                                    IsEmpty(
                                                        Filter(
                                                            'Ticket Automation Rules',
                                                            categoryId = eDefenderReassignmentsMainCategoryDropdown.Selected.ID && locationId = eDefenderReassignmentsLocationIDDropDown.Selected.ID
                                                        )
                                                    ),
                                                    0,
                                                    LookUp(
                                                        'Ticket Automation Rules',
                                                        categoryId = eDefenderReassignmentsMainCategoryDropdown.Selected.ID && locationId = eDefenderReassignmentsLocationIDDropDown.Selected.ID,
                                                        userID
                                                    )
                                                )
                                            }
                                        )
                                    );
                                
                                Patch(
                                    Tickets, 
                                    LookUp(Tickets,ID = rec.ID),
                                    {
                                        Title: "# "&rec.ID&" Reassignment Request"
                                    });
                                // for the attachments, run power automate flow for each attached file
                                    ForAll(
                                        eDefenderReassignmentsAttachmentControl.Attachments As Attachment,
                                               /*AttachFiles.Run(
                                            rec.ID,
                                            {
                                                file: {
                                                    contentBytes: Value,
                                                    name: Name
                                                }
                                            }
                                        )*/
                                 If(Left(Attachment.Value,6) = "appres", 
                                        AttachFiles.Run(
                                            rec.ID,
                                            {
                                                file:{
