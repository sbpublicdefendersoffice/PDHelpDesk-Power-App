                    eDefenderTrainingRequestButtons_DataCard As typedDataCard.blankCard:
                        BorderStyle: =BorderStyle.Solid
                        DisplayMode: =DisplayMode.Edit
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =If( 'eDefender Training Requests TT'.Size = 1, Parent.Height/3, Parent.Height/5)
                        Width: =1366
                        WidthFit: =true
                        X: =0
                        Y: =8
                        ZIndex: =1

                        eDefenderTrainingRequestSubmitButton As button:
                            DisplayMode: |-
                                =
                                //could use this to enable/disable button behaviour
                                //If(CreateATicketForm_1.Valid, DisplayMode.Edit, DisplayMode.Disabled)
                                
                                DisplayMode.Edit
                            Fill: =ColorScheme.primary
                            Height: =eDefenderTrainingRequestCancelButton.Height
                            OnSelect: |
                                =
                                If(!eDefenderTrainingRequestDescriptionTextInputArea.Visible,
                                UpdateContext({TicketDescText:Concatenate("Trainee Name: "&eDefenderTraineeInput.Text&Char(13)&Char(13),"Availability :"&Char(13),eDefenderTraineeInput_1.Text)}), Notify("Description is Blank"));
                                
                                //Check if the title or Description are empty, if they are the form will not be submitted
                                If(
                                    Len(Trim(eDefenderTrainingRequestTitleInput.Text)) > 0 And Len(Trim(eDefenderTraineeInput_1.Text))> 0 And !IsBlank(eDefenderTrainingRequestLocationIDDropDown.Selected.Name),
                                    UpdateContext({DataCardKey1_1: "Title"});
                                    UpdateContext({DataCardKey5: "Description"});
                                    //Set(DataCardKey5: "Description");
                                Set(
                                        //Temporary record
                                        rec,
                                        //DB operation, from Ticket table, new record, change these columns
                                        Patch(
                                            Tickets,
                                            Defaults(Tickets),
                                            {
                                                Title: eDefenderTrainingRequestTitleInput.Text,
                                                description: Trim(eDefenderTrainingRequestDescriptionTextInputArea.Text),
                                                creatorId: userData.id,
                                                mainCategory: eDefenderTrainingRequestMainCategoryDropdown.Selected.ID,
                                                category: eDefenderTrainingRequestSubCategoryDropdown.Selected.ID,
                                                subCategory: eDefenderTrainingRequestSpecificIssueDropdown.Selected.ID,
                                                locationId: eDefenderTrainingRequestLocationIDDropDown.Selected.ID,
                                                status: "open",
                                                metricDate: Concatenate(
                                                    Month(Today()),
                                                    "/",
                                                    Year(Today())
                                                ),
                                                hasAttachment: If(
                                                    IsEmpty(JointAttachments),
                                                    0,
                                                    1
                                                ),
                                                //Automation rules table is used to assign tickets
                                                assignedTo: If(
                                                    IsEmpty(
                                                        Filter(
                                                            'Ticket Automation Rules',
                                                            categoryId = eDefenderTrainingRequestMainCategoryDropdown.Selected.ID && locationId = eDefenderTrainingRequestLocationIDDropDown.Selected.ID
                                                        )
                                                    ),
                                                    0,
                                                    LookUp(
                                                        'Ticket Automation Rules',
                                                        categoryId = eDefenderTrainingRequestMainCategoryDropdown.Selected.ID && locationId = eDefenderTrainingRequestLocationIDDropDown.Selected.ID,
                                                        userID
                                                    )
                                                )
                                            }
                                        )
                                    );
                                
                                Patch(
                                    Tickets, 
                                    LookUp(Tickets,ID = rec.ID),
                                    {
                                        Title: "# "&rec.ID&" eDefender Training Request ("&eDefenderTrainingRequestTitleInput.Text&")"
                                    });
                                // for the attachments, run power automate flow for each attached file
                                ForAll(
                                    attItems As Attachment,
                                            AttachFiles.Run(
                                            rec.ID,
                                            {
                                                file:{
                                                    contentBytes: Attachment.Value,
                                                    name: Attachment.Name
                                                }
                                            }
                                        ) 
                                );
                                ForAll(
                                    RTEImages As RTEI,
                                    With({varHTMLTable: Split(RTEI.base64Image , "<img")}, If(CountRows(varHTMLTable)>1, With({varB64Start:Find("<img",RTEI.base64Image)+32},With({varB64End:Find("""",Mid(RTEI.base64Image,varB64Start))-1},CopyPasteTest.Run(Mid(RTEI.base64Image,varB64Start,varB64End),RTEI.copyName & Text(Now(),DateTimeFormat.UTC) &".png", rec.ID)
                                ))))
                                        );
                                    
                                    /*SMTP.SendEmailV3(
                                        {
                                            From: "sbpdhelpdesk@outlook.com",
                                            To: userData.email,
