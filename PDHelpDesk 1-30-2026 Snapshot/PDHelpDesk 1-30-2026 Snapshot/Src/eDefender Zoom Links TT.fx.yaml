                        "'eDefenderAdding/CodingAttachmentControl_12' As attachments":
                            BorderColor: =Color.Black
                            Height: =If( 'eDefender Zoom Links TT'.Size = 1, Parent.Height/1.5, Parent.Height/1.5)
                            IsInDataCard: =true
                            Items: =
                            MaxAttachments: =10
                            PaddingBottom: =5
                            PaddingLeft: =If(Self.DisplayMode = DisplayMode.Edit, 5, 0)
                            PaddingRight: =5
                            PaddingTop: =5
                            Width: =If('eDefender Zoom Links TT'.Size = 1, Parent.Width/1.24,Parent.Width/1.5)
                            X: =(Parent.Width-Self.Width)/2
                            Y: =36
                            ZIndex: =1

                    eDefenderZoomLinksButtons_DataCard As typedDataCard.blankCard:
                        BorderStyle: =BorderStyle.Solid
                        DisplayMode: =DisplayMode.Edit
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =If( 'eDefender Zoom Links TT'.Size = 1, Parent.Height/3, Parent.Height/5)
                        Width: =1366
                        WidthFit: =true
                        X: =0
                        Y: =8
                        ZIndex: =1

                        eDefenderZoomLinksSubmitButton As button:
                            DisplayMode: |-
                                =
                                //could use this to enable/disable button behaviour
                                //If(CreateATicketForm_1.Valid, DisplayMode.Edit, DisplayMode.Disabled)
                                
                                DisplayMode.Edit
                            Height: =eDefenderZoomLinksCancelButton.Height
                            OnSelect: |
                                =
                                If(!eDefenderZoomLinksDescriptionTextInputArea.Visible,
                                UpdateContext({TicketDescText:Concatenate("Adding Coding Items Template",Char(13),Char(13),ExFieldInput1_13.Text,Char(13),ExFieldInput2_13.Text,Char(13),ExFieldInput3_13.Text)}), Notify("Description is Blank"));
                                
                                //Check if the title or Description are empty, if they are the form will not be submitted
                                If(
                                    Len(eDefenderZoomLinksTitleInput.Text) > 0 And Len(eDefenderZoomLinksDescriptionTextInputArea.Text)> 0,
                                    UpdateContext({DataCardKey1_1: "Title"});
                                    UpdateContext({DataCardKey5: "Description"});
                                    //Set(DataCardKey5: "Description");
                                Set(
                                        //Temporary record
                                        rec,
                                        //DB operation, from Ticket table, new record, change these columns
                                        Patch(
                                            Tickets,
                                            Defaults(Tickets),
                                            {
                                                Title: eDefenderZoomLinksTitleInput.Text,
                                                description: Trim(eDefenderZoomLinksDescriptionTextInputArea.Text),
                                                creatorId: userData.id,
                                                mainCategory: eDefenderZoomLinksMainCategoryDropdown.Selected.ID,
                                                category: eDefenderZoomLinksSubCategoryDropdown.Selected.ID,
                                                subCategory: eDefenderZoomLinksSpecificIssueDropdown.Selected.ID,
                                                locationId: eDefenderZoomLinksLocationIDDropDown.Selected.ID,
                                                status: "open",
                                                metricDate: Concatenate(
                                                    Month(Today()),
                                                    "/",
                                                    Year(Today())
                                                ),
                                                hasAttachment: If(
                                                    IsEmpty('eDefenderAdding/CodingAttachmentControl_12'.Attachments),
                                                    0,
                                                    1
                                                ),
                                                //Automation rules table is used to assign tickets
                                                assignedTo: If(
                                                    IsEmpty(
                                                        Filter(
                                                            'Ticket Automation Rules',
                                                            categoryId = eDefenderZoomLinksMainCategoryDropdown.Selected.ID && locationId = eDefenderZoomLinksLocationIDDropDown.Selected.ID
                                                        )
                                                    ),
                                                    0,
                                                    LookUp(
                                                        'Ticket Automation Rules',
                                                        categoryId = eDefenderZoomLinksMainCategoryDropdown.Selected.ID && locationId = eDefenderZoomLinksLocationIDDropDown.Selected.ID,
                                                        userID
                                                    )
                                                )
                                            }
                                        )
                                    );
                                
                                Patch(
                                    Tickets, 
                                    LookUp(Tickets,ID = rec.ID),
                                    {
                                        Title: "#"&rec.ID&" "&eDefenderZoomLinksTitleInput.Text&" (Coding/Items Request)"
                                    });
                                // for the attachments, run power automate flow for each attached file
                                    ForAll(
                                        'eDefenderAdding/CodingAttachmentControl_12'.Attachments,
                                               /*AttachFiles.Run(
                                            rec.ID,
                                            {
                                                file: {
                                                    contentBytes: Value,
                                                    name: Name
                                                }
                                            }
                                        )*/
                                        AttachFiles.Run(
                                            rec.ID,
                                            {
                                                file:{
                                                    contentBytes: Value,
                                                    name: Name
                                                }
                                            }
                                        ) 
                                    );
                                    
                                    /*SMTP.SendEmailV3(
                                        {
                                            From: "sbpdhelpdesk@outlook.com",
                                            To: userData.email,
                                            Subject: "Help Desk Ticket Received",
                                            Body: "<div>Hello, this is an automated response. An IT Help Desk ticket # " & rec.ID & " was created on your behalf. A technician will contact you soon to begin troubleshooting.</div><br> <div> To view the status of the ticket or add comments, please visit <a href="https://apps.powerapps.com/play/e/default-ce8a2002-448f-4f58-82b1-d86f73e3afdd/a/a370d8a4-8906-4ac3-bff0-0a588e959ea7?tenantId=ce8a2002-448f-4f58-82b1-d86f73e3afdd&TickID=" & rec.ID & "'>here</a>.</div>"
                                        }
                                    );*/
                                    /*If(
                                        rec.assignedTo > 0,
                                        SMTP.SendEmailV3(
                                            {
                                                From: "sbpdhelpdesk@outlook.com",
                                                To: LookUp(
                                                    Users,
                                                    ID = rec.assignedTo,
                                                    email
                                                ),
                                                Subject: "Help Desk Ticket Assigned",
                                                Body: "<div>Hello, this is an automated response. An IT Help Desk ticket # " & rec.ID & " was assigned to you. Please click <a href='https://apps.powerapps.com/play/e/default-ce8a2002-448f-4f58-82b1-d86f73e3afdd/a/a370d8a4-8906-4ac3-bff0-0a588e959ea7?tenantId=ce8a2002-448f-4f58-82b1-d86f73e3afdd&TickID=" & rec.ID & "'>here</a> to view more details for the ticket.</div>"
                                            }
                                        );
                                    );*/
                                //Power automate flow, sends email to ticket creator 
                                SendEmail.Run(
                                        Concatenate(
                                            "'",
                                            userData.email,
                                            "'"
                                        ),
                                        "Help Desk Ticket Recieved",
                                        //Email Message body
                                        TicketCreatorMessageRTE_15.HtmlText,
                                        Text(Blank())
                                    );
                                    // If the ticket it assigned to someone, send them an email
                                    If(
                                        rec.assignedTo > 0,
                                        SendEmail.Run(
                                            Concatenate(
                                                "'",
                                                LookUp(
                                                    Users,
                                                    ID = rec.assignedTo,
                                                    email
                                                ),
                                                "'"
                                            ),
                                            "Help Desk Ticket Assigned",
                                            //Email message body
                                            TechAssignMessageRTE_15.HtmlText,
                                            Text(Blank())
                                        )
                                    );
                                    //Reset the form upon completion
                                    ResetForm(eDefenderZoomLinksForm);
                                    Navigate(Success);
                                
                                );
                                // variables that control color elements
                                    UpdateContext({CreateTicketTitle: "Title is Required"});
                                    UpdateContext({CreateTicketDescription: "Description is Required"});
