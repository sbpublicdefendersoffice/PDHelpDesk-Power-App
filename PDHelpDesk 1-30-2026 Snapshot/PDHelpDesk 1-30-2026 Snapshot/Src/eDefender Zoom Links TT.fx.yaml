"'eDefender Zoom Links TT' As screen":
    Fill: =ColorScheme.screenBackground
    OnHidden: |-
        =UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});
    OnVisible: |-
        =ResetForm(eDefenderZoomLinksForm);
        UpdateContext({CreateTicketTitle: "Title", CreateTicketDescription: "Description"});
        UpdateContext({TicketDescText:""});

    eDefenderZoomLinksMainContainer As groupContainer.horizontalAutoLayoutContainer:
        Height: ='eDefender Zoom Links TT'.Height
        LayoutGridColumns: =6
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        Width: ='eDefender Zoom Links TT'.Width
        ZIndex: =2

        eDefenderZoomLinksVerticalLayoutContainer As groupContainer.verticalAutoLayoutContainer:
            AlignInContainer: =AlignInContainer.SetByContainer
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumns: =6
            LayoutGridRows: =6
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =100
            LayoutMinWidth: =250
            LayoutMode: =LayoutMode.Auto
            ZIndex: =2

            eDefenderZoomLinksHeaderContainer As groupContainer.verticalAutoLayoutContainer:
                AlignInContainer: =AlignInContainer.SetByContainer
                Fill: =ColorScheme.primary
                FillPortions: =0
                Height: |-
                    =130
                    //Parent.Height/11
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutDirection: =LayoutDirection.Vertical
                LayoutGridColumns: =6
                LayoutGridRows: =6
                LayoutJustifyContent: =LayoutJustifyContent.Center
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =100
                LayoutMinWidth: =250
                LayoutMode: =LayoutMode.Auto
                Visible: |-
                    =//Home.Size<>1
                    //This is the top most header container that houses the navbar links
                    true
                Width: =Parent.Width
                ZIndex: =1

                eDefenderZoomLinksWebHeader As compWebHeader:
                    CompScreenSize: ='eDefender Zoom Links TT'.Size
                    EnableFeedback: =Set(varFeedback,true)
                    Height: |-
                        =82
                        //Parent.Height
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =640
                    LayoutMinWidth: =640
                    ZIndex: =8

                eDefenderZoomLinksHeaderLabel As label:
                    Align: =Align.Center
                    Color: =RGBA(255, 255, 255, 1)
                    Fill: =ColorScheme.primary
                    FillPortions: =1
                    Height: =Parent.Height
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    Size: =If('eDefender Zoom Links TT'.Size=1, titleText.mobileSize, titleText.desktopSize)
                    Text: ="Zoom Links Form"
                    Width: =Parent.Width
                    ZIndex: =9

            eDefenderZoomLinksMainContentContainer As groupContainer.verticalAutoLayoutContainer:
                AlignInContainer: =AlignInContainer.SetByContainer
                Height: =Parent.Height/1.21
                LayoutDirection: =LayoutDirection.Vertical
                LayoutGridColumns: =6
                LayoutGridRows: =6
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =100
                LayoutMinWidth: =250
                LayoutMode: =LayoutMode.Auto
                LayoutOverflowY: =LayoutOverflow.Scroll
                Visible: |-
                    =true
                    //Main Content container this houses certian elements such as the searchbar, and 2 button galleries, one for desktop, and another for mobile
                Width: =Parent.Width
                ZIndex: =3

                eDefenderZoomLinksForm As form:
                    AlignInContainer: =AlignInContainer.SetByContainer
                    DataSource: =Tickets
                    DefaultMode: =FormMode.New
                    Height: =Parent.Height/1.21
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =250
                    LayoutMinWidth: =400
                    NumberOfColumns: =1
                    Width: =Parent.Width
                    Y: =Parent.Height/5.7
                    ZIndex: =1

