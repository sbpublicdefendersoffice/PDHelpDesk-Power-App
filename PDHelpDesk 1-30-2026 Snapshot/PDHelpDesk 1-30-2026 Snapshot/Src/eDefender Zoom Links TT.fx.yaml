                    eDefenderZoomLinksAttatchments_DataCard As typedDataCard.blankCard:
                        BorderStyle: =BorderStyle.Solid
                        DisplayMode: =DisplayMode.Edit
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =If( 'eDefender Zoom Links TT'.Size = 1, Parent.Height/2, Parent.Height/3.5)
                        Width: =1366
                        WidthFit: =true
                        X: =0
                        Y: =7
